<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Current setup background -->
  <rect x="10" y="10" width="410" height="400" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="215" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">Current setup</text>
  <text x="215" y="62" text-anchor="middle" font-size="12" fill="#64748B">You are on the EU Console, which connects</text>
  <text x="215" y="77" text-anchor="middle" font-size="12" fill="#64748B">to a single EU data plane.</text>

  <!-- Current: EU Console box -->
  <rect x="85" y="100" width="260" height="56" rx="8" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="215" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#14532D">console.eu.choreo.dev</text>
  <text x="215" y="144" text-anchor="middle" font-size="11" fill="#166534">EU Console + Control Plane</text>

  <!-- Arrow down -->
  <line x1="215" y1="156" x2="215" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Current: EU Data Plane box (decommissioned styling) -->
  <rect x="85" y="220" width="260" height="56" rx="8" fill="#FEF9C3" stroke="#D97706" stroke-width="2" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="215" y="245" text-anchor="middle" font-size="14" font-weight="600" fill="#92400E">EU Data Plane</text>
  <text x="215" y="264" text-anchor="middle" font-size="11" fill="#92400E">Your workloads run here</text>

  <!-- Decommission label (points at EU Data Plane only) -->
  <rect x="130" y="300" width="170" height="36" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="215" y="323" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">Being decommissioned</text>
  <line x1="215" y1="300" x2="215" y2="276" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <!-- "You are here" callout -->
  <rect x="130" y="355" width="170" height="36" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="215" y="378" text-anchor="middle" font-size="13" font-weight="600" fill="#DC2626">You are here</text>

  <!-- Target setup background -->
  <rect x="480" y="10" width="410" height="400" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="685" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">Target setup</text>
  <text x="685" y="62" text-anchor="middle" font-size="12" fill="#64748B">Use the US Console to access both the</text>
  <text x="685" y="77" text-anchor="middle" font-size="12" fill="#64748B">EU and US data planes.</text>

  <!-- Target: US Console box -->
  <rect x="555" y="100" width="260" height="56" rx="8" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="685" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#14532D">console.choreo.dev</text>
  <text x="685" y="144" text-anchor="middle" font-size="11" fill="#166534">US Console + Control Plane</text>

  <!-- Arrow down-left to EU DP -->
  <line x1="635" y1="156" x2="600" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Arrow down-right to US DP -->
  <line x1="735" y1="156" x2="770" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Target: EU Data Plane box -->
  <rect x="495" y="220" width="210" height="56" rx="8" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="245" text-anchor="middle" font-size="14" font-weight="600" fill="#14532D">EU Data Plane</text>
  <text x="600" y="264" text-anchor="middle" font-size="11" fill="#166534">Your workloads run here</text>

  <!-- Target: US Data Plane box -->
  <rect x="725" y="220" width="150" height="56" rx="8" fill="#D1FAE5" stroke="#16A34A" stroke-width="1" filter="url(#shadow)"/>
  <text x="800" y="245" text-anchor="middle" font-size="14" font-weight="600" fill="#14532D">US Data Plane</text>
  <text x="800" y="264" text-anchor="middle" font-size="11" fill="#6B7280">(not applicable)</text>

  <!-- "Go here" callout -->
  <rect x="515" y="300" width="170" height="36" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="600" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#DC2626">Go here</text>
  <line x1="600" y1="300" x2="600" y2="276" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EF4444"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D97706"/>
    </marker>
  </defs>
</svg>

apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  annotations:
    autoscaling.alpha.kubernetes.io/metrics: '[{"type":"Resource","resource":{"name":"memory","targetAverageUtilization":75}}]'
  labels:
    app.kubernetes.io/instance: "${INGRESS_CONTROLLER_INSTANCE}"
    app.kubernetes.io/name: "${INGRESS_CONTROLLER_DEPLOYMENT}"
  name: "${INGRESS_CONTROLLER_DEPLOYMENT}"
  namespace: "${INGRESS_CONTROLLER_NAMESPACE}"
spec:
  maxReplicas: 4
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: "${INGRESS_CONTROLLER_DEPLOYMENT}"
  targetCPUUtilizationPercentage: 75

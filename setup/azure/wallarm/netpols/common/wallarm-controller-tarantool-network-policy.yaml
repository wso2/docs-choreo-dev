---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wallarm-controller-tarantool-network-policy
  namespace: wallarm-ingress
spec:
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: wallarm-ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
              app.kubernetes.io/instance: wallarm-ingress
              app.kubernetes.io/name: wallarm-ingress
      ports:
        - port: 3313
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: controller-wallarm-tarantool
      app.kubernetes.io/instance: wallarm-ingress
      app.kubernetes.io/name: wallarm-ingress
  policyTypes:
    - Ingress
    - Egress

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wallarm-controller-network-policy
  namespace: wallarm-ingress
spec:
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
  ingress:
    - ports:
        - port: 8443
          protocol: TCP
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: wallarm-ingress
      app.kubernetes.io/name: wallarm-ingress
  policyTypes:
    - Ingress
    - Egress

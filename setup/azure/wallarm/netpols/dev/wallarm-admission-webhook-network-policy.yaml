apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wallarm-admission-webhook-network-policy
  namespace: wallarm-ingress
spec:
  egress:
    - to:
        - ipBlock:
            cidr: 172.18.0.0/16
  podSelector:
    matchLabels:
      app.kubernetes.io/component: admission-webhook
      app.kubernetes.io/instance: wallarm-ingress
      app.kubernetes.io/name: wallarm-ingress
  policyTypes:
    - Egress

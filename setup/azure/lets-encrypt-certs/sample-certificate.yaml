apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    reflector.v1.k8s.emberstack.com/secret-reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/secret-reflection-auto-enabled: "true"
  name: prod-choreo-system-wildcard-cert
  namespace: cert-manager
spec:
  dnsNames:
  - choreo.dev
  - '*.choreo.dev'
  issuerRef:
    kind: Issuer
    name: choreo-letsencrypt-prod
  secretName: prod-choreo-system-wildcard-tls

apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: "choreo-letsencrypt-prod"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: techops@wso2.com
    privateKeySecretRef:
      name: "choreo-letsencrypt-prod"
    solvers:
      - dns01:
          azureDNS:
            clientID: <Azure AD App client ID>
            clientSecretSecretRef:
              name: choreo-secret-azuredns-config
              key: client-secret
            subscriptionID: <Azure subscription ID>
            tenantID: <Azure tenant ID>
            resourceGroupName: <Azure resource group in which DNS zone is>
            hostedZoneName: <hosted domain name>
            environment: AzurePublicCloud

apiVersion: policy/v1beta1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/instance: "${WORKSPACE_INGRESS_NAMESPACE}"
    app.kubernetes.io/name: "${WORKSPACE_INGRESS_NAMESPACE}-nginx-ingress"
  name: "${WORKSPACE_INGRESS_NAMESPACE}-nginx-ingress"
  namespace: "${WORKSPACE_INGRESS_NAMESPACE}-nginx-plus-ingress"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: "${WORKSPACE_INGRESS_NAMESPACE}-nginx-ingress"

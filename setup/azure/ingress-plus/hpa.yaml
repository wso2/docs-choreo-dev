apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  annotations:
    autoscaling.alpha.kubernetes.io/metrics: '[{"type":"Resource","resource":{"name":"memory","targetAverageUtilization":75}}]'
  labels:
    app.kubernetes.io/instance: "${WORKSPACE_INGRESS_NAMESPACE}"
    app.kubernetes.io/name: "${WORKSPACE_INGRESS_NAMESPACE}-nginx-ingress"
  name: "${WORKSPACE_INGRESS_NAMESPACE}-nginx-ingress"
  namespace: "${WORKSPACE_INGRESS_NAMESPACE}-nginx-plus-ingress"
spec:
  maxReplicas: 4
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: "${WORKSPACE_INGRESS_NAMESPACE}-nginx-ingress"
  targetCPUUtilizationPercentage: 75

apiVersion: certmanager.k8s.io/v1alpha1
kind: ClusterIssuer
metadata:
  name: "${NAMESPACE}-letsencrypt-prod"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: techops@wso2.com
    privateKeySecretRef:
      name: "${NAMESPACE}-letsencrypt-prod"
    # Use dns-01 challenges in order to support wildcard domain names
    dns01:
      providers:
      - name: azure-dns
        azuredns:
          email: techops@wso2.com
          # Service principal client id
          clientID: $SERVICE_PRINCIPLE_CLIENT_ID
          # Secret with the password
          clientSecretSecretRef:
            key: client-secret
            name: ${NAMESPACE}-secret-azuredns-config
          # Name of the DNS Zone
          hostedZoneName: $HOSTED_ZONE_NAME
          # Resource group where the DNS Zone is located
          resourceGroupName: $RESOURCE_GROUP_NAME
          subscriptionID: $SUBSCRIPTION_ID
          tenantID: $TENANT_ID

apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-{{.Values.env}}-prometheus-storage
spec:
  capacity:
    storage: {{.Values.persistentVolume.storage}}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: {{.Values.persistentVolume.persistentVolumeReclaimPolicy}}
  storageClassName: {{.Values.persistentVolume.storageClassName}}
  volumeMode: Filesystem
  azureFile:
    secretName: {{.Values.persistentVolume.azureSecretName}}
    secretNamespace: {{.Values.persistentVolume.azureSecretNamespace}}
    shareName: {{.Values.persistentVolume.shareName}}
    readOnly: false
  mountOptions:
    - dir_mode=0766
    - file_mode=0766
    - uid={{.Values.persistentVolume.groupID}}
    - gid={{.Values.persistentVolume.userID}}
    - mfsymlinks
    - nobrl

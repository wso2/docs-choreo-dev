runAsUser: 10500

image:
  repository: choreocontrolplane.azurecr.io/apache/superset-extended
  tag: master-1a8d5458445d7f7387d4fd01343f0b2bc7beb9fa
  pullPolicy: Always

ingress:
  enabled: true
  ingressClassName: dev-choreo-system-nginx
  hosts:
  - superset.dv.choreo.dev
  tls:
  - secretName: dev-choreo-system-wildcard-tls
    hosts:
    - superset.dv.choreo.dev
supersetNode:
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  connections:
    db_host: postgresql-choreo-dev-eastus2-001.postgres.database.azure.com
    db_port: "5432"
    db_user: superset_admin
    db_name: superset
  initContainers:
    - name: wait-for-postgres
      image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
      imagePullPolicy: "{{ .Values.initImage.pullPolicy }}"
      envFrom:
        - secretRef:
            name: '{{ tpl .Values.envFromSecret . }}'
      command: ["/bin/sh", "-c", "until nc -zv $DB_HOST $DB_PORT -w1; do echo 'waiting for db'; sleep 1; done"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE

supersetWorker:
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: wait-for-postgres
      image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
      imagePullPolicy: "{{ .Values.initImage.pullPolicy }}"
      envFrom:
        - secretRef:
            name: '{{ tpl .Values.envFromSecret . }}'
      command: ["/bin/sh", "-c", "until nc -zv $DB_HOST $DB_PORT -w1; do echo 'waiting for db'; sleep 1; done"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

init:
  adminUser:
    username: admin
    firstname: Superset
    lastname: Admin
    email: integration-choreo-group@wso2.com
  initContainers:
    - name: wait-for-postgres
      image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
      imagePullPolicy: "{{ .Values.initImage.pullPolicy }}"
      envFrom:
        - secretRef:
            name: '{{ tpl .Values.envFromSecret . }}'
      command: ["/bin/sh", "-c", "until nc -zv $DB_HOST $DB_PORT -w1; do echo 'waiting for db'; sleep 1; done"]
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

postgresql:
  enabled: false

redis:
  image:
    registry: choreocontrolplane.azurecr.io
    repository: bitnami/redis
    tag: 7.0.4-debian-11-r7
    pullPolicy: Always
  master:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      runAsUser: 1001
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

---

# [1] Default deny all 
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
 name: default-deny-all
 namespace: kubecost
spec:
 podSelector: {}
 policyTypes:
 - Egress
 - Ingress
 
---

# [2] Allow all pods DNS comm
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
 name: allow-dns-resolution
 namespace: kubecost
spec:
 egress:
 - ports:
   - port: 53
     protocol: TCP
   - port: 53
     protocol: UDP
   to:
   - namespaceSelector:
       matchLabels:
         kubernetes.io/metadata.name: kube-system
     podSelector:
       matchLabels:
         k8s-app: kube-dns
 podSelector: {}
 policyTypes:
 - Egress
 
---

# [3] Allow all pods with in namespace comm
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
 name: allow-within-kubecost
 namespace: kubecost
spec:
 egress:
 - to:
   - namespaceSelector:
       matchLabels:
         kubernetes.io/metadata.name: kubecost

 ingress:
 - from:
   - namespaceSelector:
       matchLabels:
         kubernetes.io/metadata.name: kubecost
 podSelector: {}
 policyTypes:
 - Egress
 - Ingress
 
---

# [4] Allow grafana pod all egress except metadata
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
 name: allow-external-traffic-of-grafana
 namespace: kubecost
spec:
 egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
 podSelector:
    matchLabels:
      app: grafana
 policyTypes:
  - Egress
 
---

# [5] Allow cost analyzer pod metadata access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
 name: allow-metadata-access-of-cost-analyzer
 namespace: kubecost
spec:
 egress:
  - to:
    - ipBlock:
        cidr: 169.254.169.254/32
 podSelector:
  matchLabels:
    app: cost-analyzer
 policyTypes:
  - Egress

---

#  [6] Allow all pods k8s api-server access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
 name: allow-all-pods-k8s-api-server-access
 namespace: kubecost
spec:
 egress:   
  - to:     
    - ipBlock:
        cidr: 10.0.0.0/8
    ports:     
    - protocol: TCP       
      port: 443
 podSelector: {}
 policyTypes:
  - Egress

---        
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cost-collector
  namespace: kubecost
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dev-choreodp-system
      podSelector:
        matchLabels:
          choreo.component: infrastructure-cost-collector
  podSelector: {}
  policyTypes:
  - Ingress

apiVersion: cert-manager.io/v1alpha2
kind: ClusterIssuer
metadata:
  name: "choreo-letsencrypt-prod"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: techops@wso2.com
    privateKeySecretRef:
      name: "choreo-letsencrypt-prod"
    # Use dns-01 challenges in order to support wildcard domain names
    solvers:
    - dns01:
        azuredns:
          # Service principal client id
          clientID: <Azure AD App client ID>
          # Secret with the password
          clientSecretSecretRef:
            key: client-secret
            name: choreo-secret-azuredns-config
          # Name of the DNS Zone
          hostedZoneName: <hosted domain name>
          # Resource group where the DNS Zone is located
          resourceGroupName: <Azure resource group in which DNS zone is>
          subscriptionID: <Azure subscription ID>
          tenantID: <Azure tenant ID>


apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
 name: gh-runner
 namespace: actions-runner-system
 annotations:
   kubernetes.io/ingress.class: ${INGRESS-CLASS-NAME}
spec:
 tls:
 - hosts:
   - '${HOST-NAME}'
   secretName: ${SECRET-NAME}
 rules:
 - host: '${HOST-NAME}'
   http:
     paths:
     - backend:
         serviceName: actions-runner-controller-github-webhook-server
         servicePort: 80
       path: /

---
apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: runners
  namespace: actions-runner-system
spec:
 replicas: 0
 template:
   spec:
     organization: ${ORG-NAME}
     image: choreocontrolplane.azurecr.io/choreoipaas/gh-runner:latest
     resources:
       limits:
         cpu: '1.5'
         memory: 1Gi
       requests:
         cpu: '1.0'
         memory: 1Gi
     tolerations:
      - effect: NoSchedule
        key: ghrunner
        operator: Exists
     nodeSelector:
        execution-mode: ghrunner
     workDir: /home/runner/workspace
     env: []
     labels:
       - choreo-custom-runner

---
apiVersion: actions.summerwind.dev/v1alpha1
kind: HorizontalRunnerAutoscaler
metadata:
 name: runner-deployment-autoscaler
 namespace: actions-runner-system
spec:
 minReplicas: ${MIN-REPLICAS}
 maxReplicas: ${MAX-REPLICAS}
 scaleTargetRef:
   name: runners
 scaleUpTriggers:
 - githubEvent:
     checkRun:
       types: ["created"]
       status: "queued"
   amount: 1
   duration: "2m"

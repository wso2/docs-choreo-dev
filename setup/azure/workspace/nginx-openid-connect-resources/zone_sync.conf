## This file need to be copied to /etc/nginx/stream-conf.d directory
resolver kube-dns.kube-system.svc.cluster.local valid=5s;
    server {
        listen 0.0.0.0:10113;
        zone_sync;
        zone_sync_server nginx-ingress-headless.dev-choreo-workspace-nginx-plus.svc.cluster.local:10113 resolve;
        zone_sync_interval 500ms;
    }

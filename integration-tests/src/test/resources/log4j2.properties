#
# The logging properties used
# Extra logging related to initialization of Log4j
# Set to debug or trace if log4j initialization is failing
status = warn
# Name of the configuration
name = Log4j2PropertiesConfig

# Root logger level
rootLogger.level = DEBUG
rootLogger.appenderRefs = stdout
rootLogger.appenderRef.console.ref = STDOUT

logger.app.name = com.wso2.choreo.integration
logger.app.level = DEBUG
logger.app.additivity = false
logger.app.appenderRef.console.ref = STDOUT
logger.app.appenderRef.file.ref = LogToFile

logger.citrus.name = com.consol.citrus
logger.citrus.level = DEBUG
logger.citrus.appenderRef.file.ref = LogToFile

logger.http-wire.name = org.apache.http.wire
logger.http-wire.level = DEBUG
logger.http-wire.appenderRef.file.ref = LogToFile

loggers = citrus, http-wire, app

# Console appender configuration
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n

# Console appender configuration
appender.file.type = File
appender.file.name = LogToFile
appender.file.filename = target/logs/integration-test.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n

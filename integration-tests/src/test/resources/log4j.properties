log4j.rootLogger=ERROR, out, LOGGING

log4j.logger.com.consol.citrus=DEBUG
log4j.logger.org.apache.http.wire=DEBUG
log4j.logger.com.wso2.choreo.integration=DEBUG

# CONSOLE appender not used by default
log4j.appender.out=org.apache.log4j.ConsoleAppender
log4j.appender.out.layout=org.apache.log4j.PatternLayout
log4j.appender.out.layout.ConversionPattern=%d{HH:mm:ss,SSS} %-5.5p %20.20c{2}| %m%n

log4j.appender.LOGGING=org.apache.log4j.FileAppender
log4j.appender.LOGGING.File=target/logs/integration-test.log
log4j.appender.LOGGING.layout=org.apache.log4j.PatternLayout
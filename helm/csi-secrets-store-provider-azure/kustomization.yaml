helmCharts:
  - name: csi-secrets-store-provider-azure
    includeCRDs: true
    valuesInline:
      linux:
        image:
          repository: choreocontrolplane.azurecr.io/oss/azure/secrets-store/provider-azure
          tag: v1.5.0
        tolerations:
          - operator: Exists
          - key: ghrunner
            operator: Equal
            value: "true"
            effect: NoSchedule
          - key: choreo-deployments
            operator: Equal
            value: "userapps"
            effect: NoSchedule
          - key: kubernetes.azure.com/scalesetpriority
            operator: Equal
            value: "spot"
            effect: NoSchedule
        priorityClassName: "secrets-store-csi-driver"
      secrets-store-csi-driver:
        syncSecret:
          enabled: true
        linux:
          livenessProbeImage:
            repository: choreocontrolplane.azurecr.io/oss/kubernetes-csi/livenessprobe
            tag: v2.10.0
          registrarImage:
            repository: choreocontrolplane.azurecr.io/oss/kubernetes-csi/csi-node-driver-registrar
            tag: v2.8.0
          image:
            repository: choreocontrolplane.azurecr.io/oss/kubernetes-csi/secrets-store/driver
            tag: v1.4.0
          crds:
            image:
              repository: choreocontrolplane.azurecr.io/oss/kubernetes-csi/secrets-store/driver-crds
              tag: v1.4.0
          tolerations:
            - key: ghrunner
              operator: Equal
              value: "true"
              effect: NoSchedule
          priorityClassName: "secrets-store-csi-driver"
    releaseName: csi-secrets-store-provider-azure
    namespace: csi-secret-store-driver
    version: 1.5.0
    repo: oci://choreocontrolplane.azurecr.io/helm

commonAnnotations:
  kapp.k14s.io/disable-default-label-scoping-rules: ""
  checkov.io/skip1: CKV_K8S_AZURE_WSO2_2=Managed by csi-secret-store-provider-azure

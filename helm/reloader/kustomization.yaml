helmCharts:
  - name: reloader
    valuesInline:
      fullnameOverride: reloader
      reloader:
        deployment:
          replicas: 1
          annotations:
            checkov.io/skip1: CKV_K8S_AZURE_WSO2_2=Managed by reloader
            checkov.io/skip2: CKV_K8S_38=Managed by reloader
          image:
            name: choreocontrolplane.azurecr.io/stakater/reloader
            tag: v1.0.34
            pullPolicy: Always
          containerSecurityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          resources:
            limits:
              cpu: "100m"
              memory: "1Gi"
            requests:
              cpu: "10m"
              memory: "128Mi"
          securityContext:
            seccompProfile:
              type: RuntimeDefault
    releaseName: reloader
    namespace: reloader
    version: 1.0.34
    repo: oci://choreocontrolplane.azurecr.io/helm

commonAnnotations:
  kapp.k14s.io/disable-default-label-scoping-rules: ""

resources:
  - namespace.yaml

helmCharts:
  - name: reloader
    includeCRDs: true
    valuesInline:
      fullnameOverride: reloader
      reloader:
        enableHA: true
        deployment:
          replicas: 2
        readOnlyRootFileSystem: true
        image:
          name: choreocontrolplane.azurecr.io/stakater/reloader
          tag: v1.0.33
          pullPolicy: Always
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
    releaseName: reloader
    namespace: reloader
    version: 1.0.33
    repo: oci://choreocontrolplane.azurecr.io/helm

commonAnnotations:
  kapp.k14s.io/disable-default-label-scoping-rules: ""

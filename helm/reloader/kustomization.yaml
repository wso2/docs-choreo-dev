helmCharts:
  - name: reloader
    includeCRDs: true
    valuesInline:
      fullnameOverride: reloader
      reloader:
        deployment:
          annotations:
            checkov.io/skip1: CKV_K8S_AZURE_WSO2_2=Managed by reloader
            checkov.io/skip2: CKV_K8S_38=Managed by reloader
          replicas: 1
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          image:
            name: choreocontrolplane.azurecr.io/stakater/reloader
            tag: v0.0.58
            pullPolicy: Always
          containerSecurityContext:
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            limits:
              cpu: "100m"
              memory: "512Mi"
            requests:
              cpu: "10m"
              memory: "128Mi"
        readOnlyRootFileSystem: true
    releaseName: reloader
    namespace: reloader
    version: v0.0.58
    repo: oci://choreocontrolplane.azurecr.io/helm

commonAnnotations:
  kapp.k14s.io/disable-default-label-scoping-rules: ""

helmCharts:
  - name: cilium
    includeCRDs: true
    valuesInline:
      aksbyocni:
        enabled: true
      encryption:
        enabled: true
        ipsec:
          interface: cilium_vxlan
        type: ipsec
      hubble:
        enabled: true
        relay:
          enabled: true
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 150m
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 100Mi
          image:
            repository: choreocontrolplane.azurecr.io/cilium/hubble-relay
            useDigest: false
            pullPolicy: "Always"
      nodeinit:
        enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: 150m
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 100Mi
        image:
          repository: choreocontrolplane.azurecr.io/cilium/startup-script
          pullPolicy: "Always"
      operator:
        securityContext:
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 128Mi
        image:
          repository: choreocontrolplane.azurecr.io/cilium/operator
          useDigest: false
          pullPolicy: "Always"
      resources:
        limits:
          cpu: 4000m
          memory: 4Gi
        requests:
          cpu: 100m
          memory: 512Mi
      livenessProbe:
        failureThreshold: 10
        periodSeconds: 30
      image:
        repository: choreocontrolplane.azurecr.io/cilium/cilium
        useDigest: false
        pullPolicy: "Always"
    releaseName: cilium
    namespace: kube-system
    version: 1.13.0
    repo: oci://choreocontrolplane.azurecr.io/helm

commonAnnotations:
  kapp.k14s.io/disable-original: ""
  kapp.k14s.io/disable-default-label-scoping-rules: ""

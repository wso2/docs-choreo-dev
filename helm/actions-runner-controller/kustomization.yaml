helmCharts:
  - name: actions-runner-controller
    includeCRDs: true
    valuesInline:
      additionalVolumes:
        - name: controller-manager-secret
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: controller-manager-secret
            nodePublishSecretRef:
              name: csi-secret-store-azure
      additionalVolumeMounts:
        - name: controller-manager-secret
          mountPath: /mnt/csi/secrets/controller-manager-secret
      authSecret:
        name: controller-manager
        create: false
      logLevel: info
      githubWebhookServer:
        logLevel: info
        enabled: true
        nodeSelector:
          execution-mode: ghrunner
        podDisruptionBudget:
          enabled: true
          minAvailable: 50%
        ports:
          - nodePort: 33080
        replicaCount: 2
        tolerations:
          - effect: NoSchedule
            key: ghrunner
            operator: Exists
        resources:
          limits:
            cpu: 3000m
            memory: 2G
          requests:
            cpu: 1000m
            memory: 500M
      image:
        actionsRunnerRepositoryAndTag: choreocontrolplane.azurecr.io/summerwind/actions-runner:v2.305.0-ubuntu-20.04-462d044-20230713-1631
        dindSidecarRepositoryAndTag: choreocontrolplane.azurecr.io/docker:25.0.3-dind
        repository: choreocontrolplane.azurecr.io/summerwind/actions-runner-controller
        tag: v0.27.4-20230713-1631
      resources:
        limits:
          cpu: 3000m
          memory: 2G
        requests:
          cpu: 1000m
          memory: 500M
      metrics:
        proxy:
          image:
            repository: choreocontrolplane.azurecr.io/brancz/kube-rbac-proxy
            tag: v0.13.1-20230713-1631
      nodeSelector:
        execution-mode: ghrunner
      podDisruptionBudget:
        enabled: true
        minAvailable: 50%
      replicaCount: 2
      tolerations:
        - effect: NoSchedule
          key: ghrunner
          operator: Exists
    releaseName: actions-runner-controller
    namespace: actions-runner-system
    version: 0.23.3
    repo: oci://choreocontrolplane.azurecr.io/helm

commonAnnotations:
  checkov.io/skip1: CKV_K8S_AZURE_WSO2_2=Managed by ARC
  checkov.io/skip2: CKV_K8S_5=Managed by ARC
  checkov.io/skip3: CKV_K8S_6=Managed by ARC
  checkov.io/skip4: CKV_K8S_8=Managed by ARC
  checkov.io/skip5: CKV_K8S_9=Managed by ARC
  checkov.io/skip6: CKV_K8S_11=Managed by ARC
  checkov.io/skip7: CKV_K8S_13=Managed by ARC
  checkov.io/skip8: CKV_K8S_20=Managed by ARC
  checkov.io/skip9: CKV_K8S_22=Managed by ARC
  checkov.io/skip10: CKV_K8S_23=Managed by ARC
  checkov.io/skip11: CKV_K8S_28=Managed by ARC
  checkov.io/skip12: CKV_K8S_31=Managed by ARC
  checkov.io/skip13: CKV_K8S_37=Managed by ARC
  checkov.io/skip14: CKV_K8S_38=Managed by ARC
  checkov.io/skip15: CKV_K8S_40=Managed by ARC
  checkov.io/skip16: CKV_K8S_155=Managed by ARC
  checkov.io/skip17: CKV2_K8S_5=Managed by ARC
  checkov.io/skip18: CKV2_K8S_6=Managed by ARC
  kapp.k14s.io/disable-original: ""
  kapp.k14s.io/disable-default-label-scoping-rules: ""

patchesStrategicMerge:

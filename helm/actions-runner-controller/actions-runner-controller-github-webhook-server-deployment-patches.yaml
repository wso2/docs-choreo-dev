apiVersion: apps/v1
kind: Deployment
metadata:
  name: actions-runner-controller-github-webhook-server
  namespace: actions-runner-system
spec:
  template:
    spec:
      containers:
        - name: kube-rbac-proxy
          resources:
            limits:
              cpu: 500m
              memory: 256M
            requests:
              cpu: 200m
              memory: 128M

helmCharts:
  - name: cilium
    includeCRDs: true
    valuesInline:
      aksbyocni:
        enabled: true
      encryption:
        enabled: true
        type: wireguard
      envoyConfig:
        enabled: true
      envoy:
        enabled: true
      cluster:
        name: choreo-dev-wu2-dataplane-aks-cluster
      priorityClassName: system-node-critical
      hubble:
        enabled: true
        metrics:
          enabled:
            - httpV2:destinationContext=pod;sourceContext=pod;http_requests_total=status;http_request_duration_seconds=status
          serviceMonitor:
            enabled: true
        relay:
          enabled: false
      operator:
        rollOutPods: true
        unmanagedPodWatcher:
          restart: true
        securityContext:
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 512Mi
        image:
          repository: choreocontrolplane.azurecr.io/cilium/operator
          useDigest: false
          pullPolicy: "Always"
        podDisruptionBudget:
          enabled: true
          minAvailable: "50%"
          maxUnavailable: ""
        priorityClassName: system-cluster-critical
      resources:
        limits:
          cpu: 4000m
          memory: 6Gi
        requests:
          cpu: 100m
          memory: 1Gi
      startupProbe:
        failureThreshold: 600
      image:
        repository: choreocontrolplane.azurecr.io/cilium/cilium
        useDigest: false
        pullPolicy: "Always"
      policyEnforcementMode: default
      routingMode: tunnel
      kubeProxyReplacement: true
      k8sServiceHost: '' # TODO: Patch this from cp-overlay 
      rollOutCiliumPods: true
      prometheus:
        enabled: false
    releaseName: cilium
    namespace: cilium
    version: 1.14.7
    repo: oci://choreocontrolplane.azurecr.io/helm

resources:
  - cilium-operator-hpa.yaml
  - cluster-wide-network-policy.yaml

commonAnnotations:
  kapp.k14s.io/disable-original: ""
  kapp.k14s.io/disable-default-label-scoping-rules: ""
  checkov.io/skip1: CKV_K8S_8=https://github.com/cilium/cilium/issues/28553
  checkov.io/skip2: CKV_K8S_9=https://github.com/cilium/cilium/issues/28553
  checkov.io/skip3: CKV_K8S_16=Risk accepted for cilium DaemonSet as not a considerable threat
  checkov.io/skip4: CKV_K8S_17=Risk accepted for cilium-node-init DaemonSet as it cannot be fixed
  checkov.io/skip5: CKV_K8S_19=Risk accepted for multiple Cilium workloads as it cannot be fixed
  checkov.io/skip6: CKV_K8S_20=Risk accepted for cilium DaemonSet as not a considerable threat
  checkov.io/skip7: CKV_K8S_22=Risk accepted for multiple Cilium workloads as it cannot be fixed
  checkov.io/skip8: CKV_K8S_23=Risk accepted for multiple Cilium workloads as it cannot be fully fixed
  checkov.io/skip9: CKV_K8S_25=Risk accepted for multiple Cilium workloads as it cannot be fixed
  checkov.io/skip10: CKV_K8S_37=Risk accepted for cilium DaemonSet as it cannot be fixed
  checkov.io/skip11: CKV_K8S_38=Risk accepted for multiple Cilium workloads as it is not an issue
  checkov.io/skip12: CKV_K8S_39=Risk accepted for multiple Cilium workloads as it cannot be fixed
  checkov.io/skip13: CKV_K8S_40=Risk accepted for multiple Cilium workloads as it cannot be fixed
  checkov.io/skip14: CKV_K8S_AZURE_WSO2_2=LinkerD is not needed for cilium

patchesStrategicMerge:
  - cilium-security-patches.yaml

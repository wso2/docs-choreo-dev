helmCharts:
- name: fluent-bit
  releaseName: fluent-bit
  namespace: choreo-observability
  version: 0.35.0
  repo: oci://choreocontrolplane.azurecr.io/helm
  valuesInline:
    ## Please refer https://github.com/fluent/helm-charts/blob/main/charts/fluent-bit/values.yaml for details about these
    ## values
    
    config:
      filters: |
        [FILTER]
            Name kubernetes
            Buffer_Size 8MB
            K8S-Logging.Parser On
            K8S-Logging.Exclude On
            Keep_Log Off
            Match kube.*
            Merge_Log On
            tls.verify Off
            Use_Kubelet true
    
      outputs: |
        [OUTPUT]
            Name opensearch
            Host opensearch-cluster-master.choreo-observability.svc.cluster.local
            HTTP_Passwd ${OPENSEARCH_HTTP_PASSWD}
            HTTP_User admin
            Logstash_Format On
            Logstash_DateFormat %Y-%m-%dt%H
            Logstash_Prefix choreologs
            Match *
            Port 9200
            Replace_Dots On
            Suppress_Type_Name On
            tls On
            tls.verify Off
            Trace_Error On
    
    dnsPolicy: ClusterFirstWithHostNet
    
    env:
    - name: OPENSEARCH_HTTP_PASSWD
      valueFrom:
        secretKeyRef:
          name: opensearch-http-passwd
          key: opensearch-http-passwd
    
    extraVolumes:
    - name: opensearch-http-passwd
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: opensearch-http-passwd
        nodePublishSecretRef:
          name: csi-secret-store-azure
    
    extraVolumeMounts:
    - name: opensearch-http-passwd
      mountPath: "/mnt/csi/opensearch-http-passwd"
      readOnly: true
    
    hostNetwork: true
    
    image:
      digest: sha256:8cf31e1e08b61f8f74cf3275aa1b64ff6ec5333c14ddc1ca6383e61f821a95c4
      repository: choreocontrolplane.azurecr.io/fluent/fluent-bit
    
    imagePullSecrets:
    - name: choreo-image-pull-secret
    
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    
    rbac:
      nodeAccess: true
    
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
    
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
         drop:
         - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 10000
    
    testFramework:
      enabled: false

commonAnnotations:
  checkov.io/skip1: CKV_K8S_19=Use case requires to share the host network namespace (To communicate with Kubelet)
  checkov.io/skip2: CKV_K8S_38=Helm chart doesn't provide a way to fix this

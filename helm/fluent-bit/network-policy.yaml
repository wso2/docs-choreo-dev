apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rules-fluent-bit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit

  policyTypes:
  - Egress
  egress:
  # Allow egress to the K8s Kubelet on port 10250 to get Kubernetes metadata
  # ref - https://docs.fluentbit.io/manual/pipeline/filters/kubernetes#optional-feature-using-kubelet-to-get-metadata
  # 
  # Specify the nodepool subnet as the cidr.
  # Nodepool subnet value is set by a Kustomize patch
  - to:
    - ipBlock:
        cidr: "X.X.X.X/X"
    ports:
    - port: 10250
      protocol: TCP

  # Allow egress to OpenSearch on port 9200. FluentBit will output logs to OpenSearch through this
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: choreo-observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: opensearch
    ports:
    - port: 9200
      protocol: TCP

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rules-opensearch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  policyTypes:
  - Egress
  - Ingress
  egress:
  # Allow egress for leader election between OpenSearch nodes
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: choreo-observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: opensearch
    ports:
    - port: 9300
      protocol: TCP

  # Allow K8s DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP

  ingress:
  # Allow ingress for leader election between OpenSearch nodes
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: choreo-observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: opensearch
    ports:
    - port: 9300
      protocol: TCP

  - from:
    # Allow ingress from the choreo-logging component. It queries logs from openSearch and send responds to the console
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: choreo-observability
      podSelector:
        matchLabels:
          choreo.component: loggingapi

    # Allow ingress from fluent-bit to receive logs
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: choreo-observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: fluent-bit

    # Allow ingress from fluent-bit nodes to receive logs. Having only the above namespaceSelector and podSelector
    # rule doesn't work because requests originate from the node. Hence this ipBlock rule is required.
    # 
    # Specify the nodepool subnet as the cidr.
    # Nodepool subnet value is set by a Kustomize patch
    - ipBlock:
        cidr: "X.X.X.X/X"
    ports:
    - port: 9200
      protocol: TCP

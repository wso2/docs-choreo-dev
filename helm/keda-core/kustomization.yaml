helmCharts:
  - name: keda
    valuesInline:
      image:
        keda:
          # -- Image name of KEDA operator
          repository: choreocontrolplane.azurecr.io/kedacore/keda
          # -- Image tag of KEDA operator. Optional, given app version of Helm chart is used by default
          tag: "2.9.3"
        metricsApiServer:
          # -- Image name of KEDA Metrics API Server
          repository: choreocontrolplane.azurecr.io/kedacore/keda-metrics-apiserver
          # -- Image tag of KEDA Metrics API Server. Optional, given app version of Helm chart is used by default
          tag: "2.9.3"
    includeCRDs: true
    releaseName: keda
    namespace: keda
    version: 2.9.4
    repo: oci://choreocontrolplane.azurecr.io/helm

commonAnnotations:
  kapp.k14s.io/disable-default-label-scoping-rules: ""
patchesStrategicMerge:
  - keda-core-operator-patch.yaml
  - keda-core-metrics-server-patch.yaml
  - keda-core-operator-cluster-role-patch.yaml
  - keda-core-operator-hpa-controller-external-metrics-cluster-role-patch.yaml
resources:
  - namespace.yaml
  - keda-core-operator-role.yaml
  - keda-core-operator-role-binding.yaml

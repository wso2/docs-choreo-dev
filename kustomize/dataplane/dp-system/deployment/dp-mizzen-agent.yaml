apiVersion: apps/v1
kind: Deployment
metadata:
  name: dp-mizzen-agent
  labels:
    choreo.component: dp-mizzen-agent
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_43=Risk accepted
    checkov.io/skip2: CKV_K8S_25=Temporarily suppressing till fixing
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: dp-mizzen-agent
  template:
    metadata:
      labels:
        choreo.component: dp-mizzen-agent
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: choreocontrolplane.azurecr.io/choreoipaas/dp-mizzen-agent:latest
          imagePullPolicy: Always
          name: dp-mizzen-agent
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 512Mi
              cpu: 5000m
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          envFrom:
            - configMapRef:
                name: env-dp-mizzen-agent
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: secret-dp-mizzen-agent
                  key: TOKEN
          volumeMounts:
            - name: secret-dp-mizzen-agent
              mountPath: /mnt/csi/secret-dp-mizzen-agent
              readonly: true
      volumes:
        - name: secret-dp-mizzen-agent
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-dp-mizzen-agent
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: choreo-dp-system-admin

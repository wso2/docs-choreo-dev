apiVersion: apps/v1
kind: Deployment
metadata:
  name: dp-mizzen-agent
  labels:
    choreo.component: dp-mizzen-agent
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_43=Risk accepted
    checkov.io/skip2: CKV_K8S_25=Temporarily suppressing till fixing
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: dp-mizzen-agent
  template:
    metadata:
      labels:
        choreo.component: dp-mizzen-agent
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: gcr.io/platformer-public/platformer-agent:v0.0.36
          imagePullPolicy: IfNotPresent
          name: platformer-agent
          resources:
            requests:
              memory: 150Mi
              cpu: 100m
            limits:
              memory: 750Mi
              cpu: 1000m
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          envFrom:
            - configMapRef:
                name: env-dp-mizzen-agent
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secret-dp-mizzen-agent
                  key: AUTH_TOKEN
            # - name: NODE_ENV
            #   value: production
            # - name: HEALTH_CHECK_PORT
            #   value: "8081"
            # - name: SENTRY_DSN
            #   value: >-
            #     https://5bc6ca6a627941518c1323e51d7a1985@o350818.ingest.sentry.io/5597771
          volumeMounts:
            - name: secret-dp-mizzen-agent
              mountPath: /mnt/csi/secret-dp-mizzen-agent
              readonly: true
      volumes:
        - name: secret-dp-mizzen-agent
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-dp-mizzen-agent
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: choreo-dp-system-admin

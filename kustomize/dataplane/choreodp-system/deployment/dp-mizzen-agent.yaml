apiVersion: apps/v1
kind: Deployment
metadata:
  name: dp-mizzen-agent
  labels:
    choreo.component: dp-mizzen-agent
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_25=Temporarily suppressing as there is no defined fix for this by the Bridgecrew
    checkov.io/skip2: CKV_K8S_8=Does not utilize a livenessProbe by design
    checkov.io/skip3: CKV_K8S_9=Does not utilize a readinessProbe by design
    checkov.io/skip4: CKV_K8S_38=Required to access the kube-apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: dp-mizzen-agent
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        choreo.component: dp-mizzen-agent
        antiaffinity: dp-mizzen-agent
    spec:
      automountServiceAccountToken: true
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: choreocontrolplane.azurecr.io/choreoipaas/dp-mizzen-agent:latest
          imagePullPolicy: Always
          name: dp-mizzen-agent
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 512Mi
              cpu: 500m
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          envFrom:
            - configMapRef:
                name: env-dp-mizzen-agent
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: secret-dp-mizzen-agent
                  key: TOKEN
          volumeMounts:
            - name: secret-dp-mizzen-agent
              mountPath: /mnt/csi/secret-dp-mizzen-agent
              readonly: true
      volumes:
        - name: secret-dp-mizzen-agent
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-dp-mizzen-agent
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: dp-mizzen-agent-sa
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: antiaffinity
                  operator: In
                  values:
                  - dp-mizzen-agent
              topologyKey: kubernetes.io/hostname

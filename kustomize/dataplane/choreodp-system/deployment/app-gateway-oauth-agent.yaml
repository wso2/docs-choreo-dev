apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_AZURE_WSO2_2=LinkerD is not enabled
  name: app-gateway-oauth-agent
  labels:
    choreo.component: app-gateway-oauth-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: app-gateway-oauth-agent
  template:
    metadata:
      labels:
        choreo.component: app-gateway-oauth-agent
        userapp-ingress-allowed: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: choreocontrolplane.azurecr.io/choreoipaas/app-gateway-oauth-agent:latest
          imagePullPolicy: Always
          name: app-gateway-oauth-agent
          ports:
            - containerPort: 8080
              name: agoa-port
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: agoa-port
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: agoa-port
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - mountPath: /etc/secrets
              name: secret-app-gateway-oauth-agent
              readOnly: true
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 512Mi
              cpu: 500m
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          envFrom:
            - configMapRef:
                name: env-app-gateway-oauth-agent
      restartPolicy: Always
      volumes:
        - name: secret-app-gateway-oauth-agent
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-app-gateway-oauth-agent
            nodePublishSecretRef:
              name: csi-secret-store-azure

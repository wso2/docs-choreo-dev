apiVersion: apps/v1
kind: Deployment
metadata:
  name: dp-kv-resolver
  labels:
    choreo.component: dp-kv-resolver
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_38=Need this to read kubeconfig
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: dp-kv-resolver
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        choreo.component: dp-kv-resolver
    spec:
      automountServiceAccountToken: true
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-rbac-proxy
          image: gcr.io/kubebuilder/kube-rbac-proxy:v0.8.0
          args:
            - --secure-listen-address=0.0.0.0:8443
            - --upstream=http://127.0.0.1:8080/
            - --logtostderr=true
            - --v=10
          ports:
            - containerPort: 8443
              name: https
          livenessProbe:
            tcpSocket:
              port: 8443
          readinessProbe:
            tcpSocket:
              port: 8443
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
        - name: manager
          image: choreocontrolplane.azurecr.io/choreoipaas/dp-kv-resolver:latest
          args:
            - --health-probe-bind-address=:8081
            - --leader-elect
          command:
            - /manager
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 1Gi
              cpu: 1.5
            limits:
              memory: 1.5Gi
              cpu: 3
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          envFrom:
            - configMapRef:
                name: env-dp-kv-resolver
          env:
          - name: AZURE_KEYVAULT_CLIENT_ID
            valueFrom:
              secretKeyRef: 
                name: secret-dp-kv-resolver
                key: AZURE_KEYVAULT_CLIENT_ID
                optional: true
          - name: AZURE_KEYVAULT_CLIENT_SECRET
            valueFrom:
              secretKeyRef: 
                name: secret-dp-kv-resolver
                key: AZURE_KEYVAULT_CLIENT_SECRET
                optional: true
          - name: AZURE_KEYVAULT_TENANT_ID
            valueFrom:
              secretKeyRef: 
                name: secret-dp-kv-resolver
                key: AZURE_KEYVAULT_TENANT_ID
                optional: true
          volumeMounts:
            - name: secret-dp-kv-resolver
              mountPath: /mnt/csi/secret-dp-kv-resolver
              readonly: true     
      volumes:
        - name: secret-dp-kv-resolver
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-dp-kv-resolver
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: dp-kv-resolver-controller-manager
      terminationGracePeriodSeconds: 10

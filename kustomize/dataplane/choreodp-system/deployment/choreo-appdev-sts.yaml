apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: choreo-appdev-sts
  name: choreo-appdev-sts
spec:
  replicas: 2
  selector:
    matchLabels:
      choreo.component: choreo-appdev-sts
  template:
    metadata:
      labels:
        choreo.component: choreo-appdev-sts
        antiaffinity: choreo-appdev-sts
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: choreo-appdev-sts
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-appdev-sts:latest
          ports:
            - containerPort: 9000
              name: service-port
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 60
            periodSeconds: 60
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: service-port
              path: /health
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: service-port
              path: /health
          resources:
            limits:
              cpu: 750m
              memory: 3Gi
            requests:
              cpu: 350m
              memory: 2Gi
          securityContext:
            runAsUser: 10500
            runAsGroup: 10500
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          volumeMounts:
            - name: choreo-appdev-sts-tmp-files
              mountPath: /tmp
            - name: choreo-appdev-sts-config
              mountPath: /home/wso2/config
            - name: choreo-appdev-sts-secrets
              mountPath: "/mnt/csi/choreo-appdev-sts-secrets/client-secret-encryption-key.txt"
              subPath: "DP_STS_CLIENT_SECRET_ENCRYPTION_KEY"
              readOnly: true
            - name: choreo-appdev-sts-secrets
              mountPath: "/mnt/csi/choreo-appdev-sts-secrets/redis-password.txt"
              subPath: "CHOREO_STS_REDIS_PASSWORD"
              readOnly: true
            - name: choreo-appdev-sts-secrets
              mountPath: "/mnt/csi/secret-choreo-sts/cp-consumer-secret.txt"
              subPath: "APP_DEV_STS_APP_CLIENT_SECRET"
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: choreo-appdev-sts-tmp-files
          emptyDir: {}
        - name: choreo-appdev-sts-config
          configMap:
            name: cm-files-choreo-appdev-sts
        - name: choreo-appdev-sts-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: choreo-appdev-sts-secrets
            nodePublishSecretRef:
              name: csi-secret-store-azure
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - choreo-appdev-sts
              topologyKey: kubernetes.io/hostname

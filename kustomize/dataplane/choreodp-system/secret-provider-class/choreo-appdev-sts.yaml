apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: choreo-appdev-sts-secrets
spec:
  secretObjects:
    - secretName: choreo-appdev-sts-secrets
      type: Opaque
      data:
        - objectName: DP_STS_CLIENT_SECRET_ENCRYPTION_KEY
          key: DP_STS_CLIENT_SECRET_ENCRYPTION_KEY
        - objectName: CHOREO_STS_REDIS_PASSWORD
          key: CHOREO_STS_REDIS_PASSWORD
        - objectName: APP_DEV_STS_APP_CLIENT_SECRET
          key: APP_DEV_STS_APP_CLIENT_SECRET
  parameters:
    objects: |
      array:
        - |
          objectName: dp-sts-client-secret-encryption-key
          objectType: secret
          objectAlias: DP_STS_CLIENT_SECRET_ENCRYPTION_KEY
          objectVersion: "{{.DP_STS_CLIENT_SECRET_ENCRYPTION_KEY_VERSION}}"
        - |
          objectName: {{.CHOREO_STS_REDIS_PASSWORD_OBJ_NAME | default "redis-sts-password"}}
          objectType: secret
          objectAlias: CHOREO_STS_REDIS_PASSWORD
          objectVersion: "{{.CHOREO_STS_REDIS_PASSWORD_VERSION}}"
        - |
          objectName: app-dev-sts-app-client-secret
          objectType: secret
          objectAlias: APP_DEV_STS_APP_CLIENT_SECRET
          objectVersion: "{{.APP_DEV_STS_APP_CLIENT_SECRET_VERSION}}"

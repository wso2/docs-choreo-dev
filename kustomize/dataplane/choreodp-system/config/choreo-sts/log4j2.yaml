Configuration:
  Appenders:
    Console:
      name: Console
      target: SYSTEM_OUT
      JsonLayout:
        complete: true
        compact: true
        eventEol: true
        properties: true
        stacktraceAsString: true
        includeNullDelimiter: true
        includeTimeMillis: true
  Loggers:
    Root:
      level: info
      AppenderRef:
        - ref: Console

# Spring Server Configs
server.port=9000
# Logging Configs
logging.level.org.springframework.security={{.LOG_LEVEL}}
io.lettuce.core={{.LETTUCE_LOG_LEVEL}}
# Temporary debug configurations for perf testing
logging.level.com.wso2.choreo.sts={{.LOG_LEVEL}}
logging.level.com.wso2.choreo.sts.client.dao.impl=debug
logging.level.com.wso2.choreo.sts.keyvaultstore.cache.dao=debug
logging.level.com.wso2.choreo.sts.keyvaultstore.service=debug
logging.level.com.wso2.choreo.sts.runtime.store.service=debug
# Application specific configurations.
server.secrets.directory=/mnt/csi/secret-choreo-sts
server.configurations.directory=/home/wso2/config
resources:
  - ../base
  - config
  - secret
  - persistence
  - certificate
  - namespace.yaml

namespace: dev-choreo-system

patches:
  - path: http-ingress-patch.yaml
    target:
      kind: Ingress
      name: ingress-http
  - path: grpc-ingress-patch.yaml
    target:
      kind: Ingress
      name: ingress-grpc
  - path: build-id-annotation-patch.yaml
    target:
      kind: Deployment

patchesStrategicMerge:
  - hpa-strategy.yaml
  - linkerd.yaml

commonLabels:
  app: dev-choreo-control-plane

images:
  - name: choreoipaas/console-app
    newName: choreoctrlplane.azurecr.io/choreoipaas/choreo-console
    newTag: latest
  - name: choreoipaas/app-service
    newName: choreoctrlplane.azurecr.io/choreoipaas/app-service
    newTag: latest
  - name: choreoipaas/choreo-logging
    newName: choreoctrlplane.azurecr.io/choreoipaas/choreo-logging
    newTag: latest
  - name: choreoipaas/choreo-negotiator
    newName: choreoctrlplane.azurecr.io/choreoipaas/choreo-negotiator
    newTag: latest
  - name: choreoipaas/observability-api
    newName: choreoctrlplane.azurecr.io/choreoipaas/observability-api
    newTag: latest
  - name: choreoipaas/perfanalyzer
    newName: choreoctrlplane.azurecr.io/choreoipaas/perfanalyzer
    newTag: latest
  - name: choreoipaas/programanalyzer
    newName: choreoctrlplane.azurecr.io/choreoipaas/programanalyzer
    newTag: latest
  - name: choreoipaas/choreo-telemetry
    newName: choreoctrlplane.azurecr.io/choreoipaas/choreo-telemetry
    newTag: latest
  - name: choreoipaas/workspace-cleanup
    newName: choreoctrlplane.azurecr.io/choreoipaas/workspace-cleanup
    newTag: latest

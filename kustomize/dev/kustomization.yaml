resources:
  - ../base
  - namespace.yaml
  - secret/app-db.yaml
  - secret/appservice.yaml
  - secret/loggingapi.yaml
  - secret/obsapi.yaml
  - secret/perf-db.yaml
  - secret/program-db.yaml
  - secret/telemetry.yaml
  - secret/trace-db.yaml
  - secret/sealed-ingress-cert.yaml
  - persistence/pv-choreo-db.yaml
  - persistence/pv-userappstorage.yaml
  - persistence/pvc-choreo-db.yaml
  - persistence/pvc-userappstorage.yaml
  - deployment/choreo-db.yaml
  - service/choreo-db.yaml

namespace: dev-choreo-system

configMapGenerator:
  - name: cm-frontend
    behavior: merge
    literals:
      - OBSERVE_API=https://dev.choreo.local/graphql
  - name: cm-choreo-app-db
    behavior: merge
    literals:
      - CHOREO_DB_HOST=choreo-db
      - CHOREO_DB_NAME=choreo_db
  - name: cm-choreo-perf-db
    behavior: merge
    literals:
      - CHOREO_DB_HOST=choreo-db
      - CHOREO_DB_NAME=choreo_db
  - name: cm-choreo-program-db
    behavior: merge
    literals:
      - CHOREO_DB_HOST=choreo-db
      - CHOREO_DB_NAME=choreo_db
  - name: cm-choreo-trace-db
    behavior: merge
    literals:
      - CHOREO_DB_HOST=choreo-db
      - CHOREO_DB_NAME=choreo_db
  - name: cm-negotiator
    behavior: create
    literals:
      - CHOREO_APP_URL=http://dev.choreo.local/observe/app/

patches:
  - path: ingress-patch.json
    target:
      group: networking.k8s.io
      version: v1beta1
      kind: Ingress
      name: ingress-http
  - path: ingress-patch.json
    target:
      group: networking.k8s.io
      version: v1beta1
      kind: Ingress
      name: ingress-grpc
  - path: ingress-patch.json
    target:
      group: networking.k8s.io
      version: v1beta1
      kind: Ingress
      name: ingress-appservice

patchesStrategicMerge:
  - hpa-strategy.yaml

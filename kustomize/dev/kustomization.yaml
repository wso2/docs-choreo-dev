resources:
  - ../base
  - namespace.yaml
  - sealed-secret.yaml
  - sealed-ingress-cert.yaml
  - persistence/pv-choreo-app-db.yaml
  - persistence/pv-choreo-perf-db.yaml
  - persistence/pv-choreo-program-db.yaml
  - persistence/pv-choreo-trace-db.yaml
  - persistence/pvc-choreo-app-db.yaml
  - persistence/pvc-choreo-perf-db.yaml
  - persistence/pvc-choreo-program-db.yaml
  - persistence/pvc-choreo-trace-db.yaml
  - deployment/choreo-app-db.yaml
  - deployment/choreo-perf-db.yaml
  - deployment/choreo-program-db.yaml
  - deployment/choreo-trace-db.yaml
  - service/choreo-app-db.yaml
  - service/choreo-perf-db.yaml
  - service/choreo-program-db.yaml
  - service/choreo-trace-db.yaml

namespace: dev-choreo-system

configMapGenerator:
  - name: cm-frontend
    behavior: merge
    literals:
      - OBSERVE_API=https://dev.choreo.local/graphql
  - name: cm-negotiator
    behavior: create
    literals:
      - CHOREO_APP_URL=http://dev.choreo.local/observe/app/

patches:
  - path: ingress-patch.json
    target:
      group: networking.k8s.io
      version: v1beta1
      kind: Ingress
      name: ingress-http
  - path: ingress-patch.json
    target:
      group: networking.k8s.io
      version: v1beta1
      kind: Ingress
      name: ingress-grpc

patchesStrategicMerge:
  - hpa-strategy.yaml
resources:
  - ../base
  - secret
  - persistence
  - namespace.yaml
  - deployment/choreo-db.yaml
  - service/choreo-db.yaml

namespace: dev-choreo-system

configMapGenerator:
  - name: cm-perfanalyzer
    behavior: replace
    files:
      - config/perfanalyzer/application.properties
  - name: cm-frontend
    behavior: merge
    literals:
      - APP_API=https://app.dev.choreo.local
      - AUTH_FLOW=B2C_1_Signup
      - IDP_CLIENT_ID=cb4bcbd9-d807-492d-ba42-2ecb12eaa45f
      - LOGS_API=wss://app.dev.choreo.local
      - OBSERVE_API=https://dev.choreo.local/graphql
      - REDIRECT_URL=https://dev.choreo.local/
      - TENANT=choreodevb2c
      - ANALYZE_API=https://programanalyzer.dev.choreo.local
  - name: cm-negotiator
    behavior: create
    literals:
      - CHOREO_APP_URL=http://dev.choreo.local/observe/app/
  - name: cm-choreo-app-db
    behavior: merge
    literals:
      - CHOREO_DB_HOST=choreo-db
      - CHOREO_DB_NAME=choreo_db
  - name: cm-choreo-perf-db
    behavior: merge
    literals:
      - CHOREO_DB_HOST=choreo-db
      - CHOREO_DB_NAME=choreo_db
  - name: cm-choreo-program-db
    behavior: merge
    literals:
      - CHOREO_DB_HOST=choreo-db
      - CHOREO_DB_NAME=choreo_db
  - name: cm-choreo-trace-db
    behavior: merge
    literals:
      - CHOREO_DB_HOST=choreo-db
      - CHOREO_DB_NAME=choreo_db
  - name: cm-eventhub
    behavior: merge
    literals:
      - EVENTHUB_NAMESPACE=choreo-dev-eventhub.servicebus.windows.net/
      - EVENTHUB_SHARED_ACCESS_POLICY_NAME=choreo-dev-observability-telemetry
      - METRICS_EVENTHUB_NAME=choreo-dev-observability
  - name: cm-obsapi
    behavior: merge
    literals:
      - AZURE_TIMESERIESINSIGHTS_CLIENT_ID=d863975b-032a-4ff0-9648-0e8b84c51755
      - AZURE_TIMESERIESINSIGHTS_TENANT_ID=ba8b4bdf-edb4-4d39-bd50-4663ee28f275
      - AZURE_TIMESERIESINSIGHTS_ENVIRONMENT_FQDN=8ae91d53-d0b0-4189-a564-2a36a78543c9.env.timeseries.azure.com
  - name: cm-appservice
    behavior: merge
    literals:
      - REDIS_ADDRESS=choreo-dev-redis.redis.cache.windows.net:6380
      - IDP_REDIRECT_URL=https://dev.choreo.local/
      - IDP_CLIENT_ID=cb4bcbd9-d807-492d-ba42-2ecb12eaa45f
      - DEPLOY_APP_NAMESPACE=pxe-dev-platformer-1587613454573-2vhrr
      - DEPLOY_INGRESS_HOST_SUFFIX=choreoapps.dev
      - DEPLOY_INGRESS_SECRET=choreoapps-wildcard-tls
      - EXECUTOR_IMAGE=choreoctrlplane.azurecr.io/choreoipaas/bexecuter:v0.1.0
      - EXECUTOR_INGRESS_HOST_SUFFIX=test.choreoapps.dev
      - LANG_SERVER_IMAGE=choreoipaas/lang-server
      - PLATFORMER_CLUSTER_NAME=wso2-prod-chor
      - PLATFORMER_GOOGLE_ID=platformer-1587613454573-2vhrr
      - PLATFORMER_ORG_ID=-M-4Q539L2y9RtB02Ttp
      - PLATFORMER_PROJECT_ID=-M5_7cJGF3MiCdjgvqSv
      - WORKSPACE_INGRESS_TLS_SECRET=choreoapps-wildcard-tls
      - WORKSPACE_NAMESPACE=prod-choreo-system
  - name: cm-activedirectory
    behavior: merge
    literals:
      - AZURE_ACTIVEDIRECTORY_TENANT_ID=ba8b4bdf-edb4-4d39-bd50-4663ee28f275
      - AZURE_ACTIVEDIRECTORY_CLIENT_ID=2291c890-bdc2-4765-941c-76c1630fd955
  - name: cm-workspace-cleanup
    behavior: merge
    literals:
      - WORKSPACE_NAMESPACE=dev-choreo-system

patches:
  - path: http-ingress-patch.yaml
    target:
      kind: Ingress
      name: ingress-http
  - path: grpc-ingress-patch.yaml
    target:
      kind: Ingress
      name: ingress-grpc

patchesStrategicMerge:
  - hpa-strategy.yaml

commonLabels:
  app: dev-choreo-control-plane

images:
  - name: choreoipaas/console-app
    newName: choreoctrlplane.azurecr.io/choreoipaas/choreo-console
    newTag: v0.1.0
  - name: choreoipaas/app-service
    newName: choreoctrlplane.azurecr.io/choreoipaas/app-service
    newTag: v0.1.1
  - name: choreoipaas/choreo-logging
    newName: choreoctrlplane.azurecr.io/choreoipaas/choreo-logging
    newTag: v0.1.1
  - name: choreoipaas/choreo-negotiator
    newName: choreoctrlplane.azurecr.io/choreoipaas/choreo-negotiator
    newTag: v0.1.1
  - name: choreoipaas/observability-api
    newName: choreoctrlplane.azurecr.io/choreoipaas/observability-api
    newTag: v0.1.1
  - name: choreoipaas/perfanalyzer
    newName: choreoctrlplane.azurecr.io/choreoipaas/perfanalyzer
    newTag: v0.1.1
  - name: choreoipaas/programanalyzer
    newName: choreoctrlplane.azurecr.io/choreoipaas/programanalyzer
    newTag: v0.1.0
  - name: choreoipaas/choreo-telemetry
    newName: choreoctrlplane.azurecr.io/choreoipaas/choreo-telemetry
    newTag: v0.1.1
  - name: choreoipaas/workspace-cleanup
    newName: choreoctrlplane.azurecr.io/choreoipaas/workspace-cleanup
    newTag: v0.1.1

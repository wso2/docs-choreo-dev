apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    choreo.component: choreo-app-db
  name: choreo-app-db
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: choreo-app-db
  strategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        choreo.component: choreo-app-db
    spec:
      containers:
      - env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
           secretKeyRef:
            name: choreo-secret
            key: choreo_app_db_password
        image: choreoipaas/choreo_app_db:latest
        name: choreo-app-db
        ports:
        - containerPort: 3306
        volumeMounts:
        - mountPath: /var/lib/mysql
          name: choreo-app-db-claim
      volumes:
      - name: choreo-app-db-claim
        persistentVolumeClaim:
          claimName: pvc-choreo-app-db

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    choreo.component: choreo_perf_db
  name: choreo_perf_db
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: choreo_perf_db
  strategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        choreo.component: choreo_perf_db
    spec:
      containers:
      - env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
           secretKeyRef:
            name: choreo-secret
            key: db_password
        image: choreoipaas/choreo_perf_db:latest
        name: choreo_perf_db
        imagePullPolicy: Always
        ports:
        - containerPort: 3306
        resources: {}
        volumeMounts:
        - mountPath: /var/lib/mysql
          name: choreo_perf_db-claim
      restartPolicy: Always
      volumes:
      - name: choreo_perf_db-claim
        persistentVolumeClaim:
          claimName: choreo_perf_db-claim

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: choreo-db
  name: choreo-db
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: choreo-db
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        choreo.component: choreo-db
    spec:
      containers:
      - env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
           secretKeyRef:
            name: secret-app-db
            key: CHOREO_DB_PASSWORD
        image: choreoipaas/choreo_db:0.1.0
        name: choreo-db
        ports:
        - containerPort: 3306
        volumeMounts:
        - mountPath: /var/lib/mysql
          name: choreo-db-claim
      volumes:
      - name: choreo-db-claim
        persistentVolumeClaim:
          claimName: pvc-choreo-db

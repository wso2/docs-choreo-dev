apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    choreo.component: choreo_trace_db
  name: choreo_trace_db
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: choreo_trace_db
  strategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        choreo.component: choreo_trace_db
    spec:
      containers:
      - env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
           secretKeyRef:
            name: choreo-secret
            key: choreo_trace_db_password
        image: choreoipaas/choreo_trace_db:latest
        name: choreo_trace_db
        ports:
        - containerPort: 3306
        volumeMounts:
        - mountPath: /var/lib/mysql
          name: choreo_trace_db-claim
      volumes:
      - name: choreo_trace_db-claim
        persistentVolumeClaim:
          claimName: choreo_trace_db-claim

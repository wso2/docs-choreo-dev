kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: ingress-intra-namespace-allow
spec:
  podSelector: {}
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: dev-choreo-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-nginx-ingress-allow
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: dev-choreo-system-nginx-ingress
      podSelector:
        matchLabels:
          app: nginx-ingress
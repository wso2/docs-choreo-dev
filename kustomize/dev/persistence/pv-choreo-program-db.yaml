apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-choreo-program-db
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 2Gi
  hostPath:
    path: /home/docker/choreo_program_db
  persistentVolumeReclaimPolicy: Delete
  storageClassName: file
  volumeMode: Filesystem

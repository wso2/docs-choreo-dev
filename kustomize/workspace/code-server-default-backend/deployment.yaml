apiVersion: apps/v1
kind: Deployment
metadata:
  name: default-backend
  labels:
    app: code-server-default-backend
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_8=Liveness probe not required
    checkov.io/skip2: CKV_K8S_9=Readiness probe not required
    checkov.io/skip3: CKV_K8S_38=Service account token is required when using Linkerd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-server-default-backend
  template:
    metadata:
      labels:
        app: code-server-default-backend
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: default-backend
          image: choreocontrolplane.azurecr.io/choreoipaas/code-server-default-backend:latest
          ports:
            - containerPort: 8090
              name: http-port
              protocol: TCP
          resources:
            requests:
              memory: 20Mi
              cpu: 50m
            limits:
              memory: 200Mi
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10700
            runAsGroup: 10700
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          envFrom:
            - configMapRef:
                name: env-cs-default-backend

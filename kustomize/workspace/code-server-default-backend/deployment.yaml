apiVersion: apps/v1
kind: Deployment
metadata:
  name: default-backend
  labels:
    app: code-server-default-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-server-default-backend
  template:
    metadata:
      labels:
        app: code-server-default-backend
    spec:
      containers:
        - name: default-backend
          image: choreocontrolplane.azurecr.io/choreoipaas/code-server-default-backend:latest
          ports:
            - containerPort: 8090
          resources:
            requests:
              memory: 20Mi
              cpu: 50m
            limits:
              memory: 200Mi
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          envFrom:
            - configMapRef:
                name: env-cs-default-backend

# Deployment for nginx

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_8=Suppressing since the sidecar should be only run once after container starts
    checkov.io/skip2: CKV_K8S_9=Readiness probe not required
    checkov.io/skip3: CKV_K8S_20=Temporarily suppressing till fixing
    checkov.io/skip4: CKV_K8S_22=Risk Accepted
    checkov.io/skip5: CKV_K8S_25=Temporarily suppressing as there is no defined fix for this by the Bridgecrew
    checkov.io/skip6: CKV_K8S_28=Temporarily suppressing till fixing
    checkov.io/skip7: CKV_K8S_37=Temporarily suppressing till fixing
    checkov.io/skip8: CKV_K8S_AZURE_WSO2_2=LinkerD is not enabled
    reloader.stakater.com/auto: "true"
  name: choreo-nginx-v2-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      deployment: choreo-nginx-v2
      choreo.component: nginx
  template:
    metadata:
      labels:
        deployment: choreo-nginx-v2
        choreo.component: nginx
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: deployment
                    operator: In
                    values:
                      - choreo-nginx
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: redis-config
            - secretRef:
                name: secret-redis
            - configMapRef:
                name: nginx-feature-flags
          image: choreocontrolplane.azurecr.io/choreoipaas/openresty:latest
          imagePullPolicy: Always
          lifecycle:
            postStart:
              exec:
                command:
                  - "sh"
                  - "init.sh"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10500
            runAsGroup: 10500
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_RAW
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "250Mi"
              cpu: "2"
            limits:
              memory: "500Mi"
              cpu: "2"
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: openresty-logs-folder
              mountPath: /usr/local/openresty/nginx/logs
            - name: redis-subscribe-folder
              mountPath: /mnt/redis
            - name: openresty-run-path
              mountPath: /var/run/openresty
            - name: nginx-ca-cert
              mountPath: /etc/certs
              readOnly: true
            - name: nginx-lua-modules
              mountPath: /usr/local/openresty/lualib/util
            - name: nginx-default-vhost
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-config-file
              mountPath: /usr/local/openresty/nginx/conf/nginx.conf
              subPath: nginx.conf
            - name: nginx-vhosts
              mountPath: /etc/nginx/sites-enabled
            - name: secret-redis
              mountPath: /mnt/csi/secret-redis
              readOnly: true
            - name: choreoapis-wildcard-tls
              mountPath: /etc/nginx/ssl/choreo
              readOnly: true
            - name: choreoapis-regional-wildcard-tls
              mountPath: /etc/nginx/ssl/choreo/e1-us-east-gateway
              readOnly: true
            - name: choreoapps-regional-wildcard-tls
              mountPath: /etc/nginx/ssl/choreo/webapps
              readOnly: true
        - name: redis-subscribe
          image: choreocontrolplane.azurecr.io/choreoipaas/redis-subscribe:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10500
            runAsGroup: 10500
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_RAW
          resources:
            requests:
              memory: "64Mi"
              cpu: "256m"
            limits:
              memory: "128Mi"
              cpu: "512m"
          volumeMounts:
            - name: redis-subscribe-folder
              mountPath: /redis
      volumes:
        - name: openresty-logs-folder
          emptyDir: { }
        - name: openresty-run-path
          emptyDir: { }
        - name: redis-subscribe-folder
          emptyDir: { }
        - name: nginx-ca-cert
          configMap:
            name: nginx-ca-cert
        - name: nginx-lua-modules
          configMap:
            name: nginx-lua-modules
        - name: nginx-default-vhost
          configMap:
            name: nginx-default-vhost
        - name: nginx-config-file
          configMap:
            name: nginx-config-file
        - name: nginx-vhosts
          configMap:
            name: nginx-vhosts-v2
        - name: choreoapis-wildcard-tls
          secret:
            secretName: choreoapis-wildcard-tls # '*.preview-dv.choreoapis.dev'
        - name: choreoapis-regional-wildcard-tls
          secret:
            secretName: choreoapis-regional-wildcard-tls # '*.e1-us-east-azure.preview-dv.choreoapis.dev'
        - name: choreoapps-regional-wildcard-tls
          secret:
            secretName: choreoapps-regional-wildcard-tls # '*.e1-us-east-azure.preview-dv.choreoapps.dev'
        - name: secret-redis
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-redis
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always

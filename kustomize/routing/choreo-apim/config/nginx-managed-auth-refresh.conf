content_by_lua_block {
    local function convertToTable(input)
        if type(input) == "table" then return input end
        if type(input) == "string" then return {input} end
        return {}
    end

    local function isEmpty(s)
        return s == nil or s == ''
    end

    local function respondWithUnauthorized()
        -- remove the www-authenticate header from the response
        ngx.header['Www-Authenticate'] = {}
        
        local errorJson = '{"code":"unauthorized"}'
        ngx.header['Content-Type'] = 'application/json'

        ngx.status = 401
        ngx.say(errorJson)
        ngx.exit(ngx.OK)
    end

    local httpc = require("resty.http").new()

    -- create the cookie header to send to oauth agent
    -- ngx.var.cookie_<cookie_name> holds the value of the <cookie_name> cookie sent in the original request

    local access_token_cookie = ngx.var.cookie_auth_at
    local session_cookie = ngx.var.cookie_auth_sessionid

    -- if auth_at cookie is not found in the request, refresh block is not engaged. 
    -- Hence no need to re-check that here.

    if isEmpty(session_cookie) then
        ngx.log(ngx.ERR, "auth_sessionid cookie not found in the request")
        respondWithUnauthorized()
    end

    local auth_cookies = "auth_at=" .. access_token_cookie .. "; auth_sessionid=" .. session_cookie

    -- send POST request to /auth/refresh
    local refresh_res, refresh_err = httpc:request_uri(ngx.var.refresh_target, {
        method = "POST",
        headers = {
            ["Cookie"] = auth_cookies,
        },
        ssl_verify = true,
    })
    if not refresh_res then
        ngx.log(ngx.ERR, "refresh request failed: ", refresh_err)
        respondWithUnauthorized()
    end

    local refresh_status = refresh_res.status
    ngx.log(ngx.DEBUG, "refresh  status: ", refresh_status)

    if refresh_status == 204 then
        -- refresh was successful
        
        -- initialize set_cookie variable with the set cookie headers from refresh response
        local set_cookie = convertToTable(refresh_res.headers["Set-Cookie"])

        -- remove userinfo cookie from the set-cookie header because user application is not aware of a refresh,
        -- hence the user application cannot consume this cookie.
        set_cookie["userinfo"] = nil

        local authATValue

        -- find the new access token value from the set cookie headers sent in refresh response.
        for _, cookie in ipairs(set_cookie) do
            -- example format of cookie: <cookie_name>=<cookie_value>; Path=/; HttpOnly; Secure; SameSite=None

            -- extract the <cookie_value>
            _, _, authATValue = string.find(cookie, "auth_at=(.-);")
            
            -- check if a match was found
            if authATValue ~= nil and authATValue ~= '' then
                break
            end
        end

        if authATValue == nil or authATValue == '' then
            ngx.log(ngx.ERR, "auth_at cookie not found in the set-cookie header")
            respondWithUnauthorized()
        end

        -- retry the original request
        -- ngx.var.request_method holds the original request method
        -- ngx.var.request_body holds the original request body
        -- manually append the new access token to the Authorization header

        ngx.log(ngx.DEBUG, "retry target: ", ngx.var.retry_target)

        local h, err = ngx.req.get_headers()

        if err == "truncated" then
            -- ref: https://github.com/openresty/lua-nginx-module?tab=readme-ov-file#ngxreqget_headers
            ngx.log(ngx.ERR, "request headers are truncated due to exceeding max allowed number of headers")
            respondWithUnauthorized()
        end

        local ignore_initial_req_headers = {
            ["host"] = true,
        }

        local retry_request_headers = {}

        for k, v in pairs(h) do
            if ignore_initial_req_headers[k] then
                ngx.log(ngx.DEBUG, "ignoring initial req header: ", k, ":", v)
            else
                ngx.log(ngx.DEBUG, "adding initial req header: ", k, ":", v)
                retry_request_headers[k] = v
            end
        end
        
        -- header name should be in lower case because we need to override the existing header
        retry_request_headers["authorization"] = "Bearer " .. authATValue

        for k, v in pairs(retry_request_headers) do
            ngx.log(ngx.DEBUG, "retry req header: ", k, ":", v)
        end

        local retry_res, retry_err = httpc:request_uri(ngx.var.retry_target, {
            method = ngx.var.request_method,
            body = ngx.var.request_body,
            headers = retry_request_headers,
            ssl_verify = true,
        })
        if not retry_res then
            ngx.log(ngx.ERR, "retry request failed: ", retry_err)
            respondWithUnauthorized()
        end

        local retry_status = retry_res.status
        local retry_body = retry_res.body
        local retry_headers = retry_res.headers

        ngx.log(ngx.DEBUG, "retry status: ", retry_status)
        ngx.log(ngx.DEBUG, "retry body: ", retry_body)

        local std_hop_by_hop_headers = {
            ["Keep-Alive"] = true,
            ["Transfer-Encoding"] = true,
            ["TE"] = true,
            ["Connection"] = true,
            ["Trailer"] = true,
            ["Upgrade"] = true,
            ["Proxy-Authorization"] = true,
            ["Proxy-Authenticate"] = true,
        }

        for k,v in pairs(retry_headers) do
            if std_hop_by_hop_headers[k] then
                ngx.log(ngx.DEBUG, "skippping hop by hop resp header: ", k, ":", v)
            else
                ngx.log(ngx.DEBUG, "adding resp header: ", k, ":", v)
                ngx.header[k] = v
            end  
        end

        local set_cookie_retry =  convertToTable(retry_headers["Set-Cookie"])

        -- append the elements of set_cookie_retry table to end of set_cookie table
        table.move(set_cookie_retry, 1, #set_cookie_retry, #set_cookie + 1, set_cookie)
        
        ngx.header['Set-Cookie'] = set_cookie 

        -- remove the www-authenticate header from the response.
        -- this is added by the API gateway because the original request was unauthorized.
        -- we can remove this header because the retry request was successful. 
        ngx.header['Www-Authenticate'] = {}

        ngx.log(ngx.DEBUG, 'Responding with response from retry request')
        -- set response status to the status of the retry request
        ngx.status = retry_status
        -- set response body to the body from retry request	
        ngx.say(retry_body)

    elseif refresh_status == 401 then
        ngx.log(ngx.ERR, "failed to refresh token. Refresh token expired or not found.")
        ngx.log(ngx.ERR, "response from agent", refresh_res.body)
        respondWithUnauthorized()

    else
        ngx.log(ngx.ERR, "server error while refreshing token.")
        ngx.log(ngx.ERR, "response status from agent: ", refresh_status)
        ngx.log(ngx.ERR, "response from agent:", refresh_res.body)
        respondWithUnauthorized()
    end
}

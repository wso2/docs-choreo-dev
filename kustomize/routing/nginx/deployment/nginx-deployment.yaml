apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    spec:
      metadata:
        labels:
          app: nginx
      containers:
        - image: nginx
          name: nginx-container
          ports:
            - containerPort: 80

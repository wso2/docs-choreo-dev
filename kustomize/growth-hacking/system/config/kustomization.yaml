configMapGenerator:
  - name: cm-file-choreo-org-stat-data-collector
    behavior: create
    files:
      - choreo-org-stat/data-collector/Config.toml
  - name: cm-file-choreo-org-stat-data-publisher
    behavior: create
    files:
      - choreo-org-stat/data-publisher/application.properties
  - name: cm-file-choreo-bq-data-pipeline
    behavior: create
    files:
      - choreo-org-stat/bq-data-pipeline/application.properties
  - name: env-choreo-bq-data-pipeline
    behavior: create
    literals:
      - CHOREO_APP_INSIGHTS_API_KEY="{{.CHOREO_APP_INSIGHTS_API_KEY}}"
      - CHOREO_APP_INSIGHTS_APP_ID="{{.CHOREO_APP_INSIGHTS_APP_ID}}"
      - BIG_QUERY_TABLE_ID_FOR_APP_INSIGHTS="{{.BIG_QUERY_TABLE_ID_FOR_APP_INSIGHTS}}"
      - FIRST_RUN="{{.FIRST_RUN}}"
      - DURATION="{{.DURATION}}"

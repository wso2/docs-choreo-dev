apiVersion: v1
kind: Service
metadata:
  name: dp-auth-module
  labels:
    choreo.component: dp-auth-module
    choreo.dataplane: "true"
spec:
  ports:
    - name: dp-auth-module-port-http
      port: 80
      protocol: TCP
      targetPort: http-port
  selector:
    choreo.component: dp-auth-module

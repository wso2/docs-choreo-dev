apiVersion: v1
kind: Service
metadata:
  labels:
    choreo.component: dp-mizzen
    choreo.dataplane: "true"
  name: dp-mizzen
spec:
  ports:
    - name: dp-mizzen-http-port
      port: 80
      protocol: TCP
      targetPort: http-port
  selector:
    choreo.component: dp-mizzen

---
apiVersion: v1
kind: Service
metadata:
  labels:
    choreo.component: dp-mizzen
    choreo.dataplane: "true"
  name: dp-mizzen-ws
spec:
  ports:
    - name: dp-mizzen-ws-port
      port: 80
      protocol: TCP
      targetPort: ws-port
  selector:
    choreo.component: dp-mizzen

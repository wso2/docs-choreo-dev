apiVersion: v1
kind: Service
metadata:
  labels:
    choreo.component: choreo-url-management
  name: choreo-url-management
spec:
  ports:
    - name: internal-service-port
      port: 3000
      targetPort: internal-service-port
    - name: service-port
      port: 9090
      targetPort: service-port
    - name: health-port
      port: 9091
      targetPort: health-port
  selector:
    choreo.component: choreo-url-management

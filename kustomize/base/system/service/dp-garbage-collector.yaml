apiVersion: v1
kind: Service
metadata:
  name: dp-garbage-collector
  labels:
    choreo.component: dp-garbage-collector
    choreo.dataplane: "true"
spec:
  ports:
    - name: dp-garbage-collector-port-http
      port: 80
      protocol: TCP
      targetPort: http-port
  selector:
    choreo.component: dp-garbage-collector

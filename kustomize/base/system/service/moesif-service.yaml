apiVersion: v1
kind: Service
metadata:
  labels:
    choreo.component: moesif-service
  name: moesif-service
spec:
  ports:
    - name: internal-http-port
      port: 8080
      targetPort: internal-http-port
    - name: external-http-port
      port: 8081
      targetPort: external-http-port
    - name: healthz
      port: 9092
      targetPort: healthz

  selector:
    choreo.component: moesif-service

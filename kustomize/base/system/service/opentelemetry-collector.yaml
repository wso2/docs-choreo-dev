apiVersion: v1
kind: Service
metadata:
  labels:
    choreo.component: opentelemetry-collector
  name: opentelemetry-collector
spec:
  ports:
  - name: otlp-grpc # Default endpoint for OpenTelemetry gRPC receiver.
    port: 4317
    protocol: TCP
    targetPort: otlp-grpc
  selector:
    choreo.component: opentelemetry-collector

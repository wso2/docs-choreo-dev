apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: perfanalyzer-updater
  annotations:
    checkov.io/skip1: CKV_K8S_43=On hold ,not an high priority issue, requires some CI/CD workflow changes
    checkov.io/skip2: CKV_K8S_20=Temporarily suppressing till fixing
    checkov.io/skip4: CKV_K8S_28=Temporarily suppressing till fixing
    checkov.io/skip5: CKV_K8S_31=Temporarily suppressing till fixing
    checkov.io/skip6: CKV_K8S_37=Temporarily suppressing till fixing
  labels:
    choreo.component: perfanalyzer-updater
spec:
  schedule: 0 * * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            linkerd.io/inject: disabled # https://github.com/linkerd/linkerd2/issues/2833
          labels:
            choreo.component: perfanalyzer-updater
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          containers:
          - name: perfanalyzer-updater
            image: choreocontrolplane.azurecr.io/choreoipaas/perfanalyzer-updater:latest
            automountServiceAccountToken: false
            securityContext:
              readOnlyRootFilesystem: true
              runAsUser: 10500
              runAsGroup: 10500
              capabilities:
                drop:
                  - all
                add: [ "NET_RAW" ]
              allowPrivilegeEscalation: false
            env:
              - name: AZURE_ADX_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    key: AZURE_ADX_CLIENT_SECRET
                    name: secret-perfanalyzer
              - name: CHOREO_PERF_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    key: CHOREO_PERF_DB_PASSWORD
                    name: secret-perfanalyzer
              - name: CHOREO_APP_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    key: CHOREO_DB_PASSWORD
                    name: secret-app-db
            envFrom:
              - configMapRef:
                  name: env-perf-analyzer
            resources:
              limits:
                cpu: 300m
                memory: 1024Mi
              requests:
                cpu: 200m
                memory: 512Mi
            volumeMounts:
              - name: perfanalyzer-config
                mountPath: /home/python-ai/perf-analyzer/config/
              - name: secret-perfanalyzer
                mountPath: "/mnt/csi/secret-perfanalyzer"
                readOnly: true
              - name: secret-app-db
                mountPath: "/mnt/csi/secret-app-db"
                readOnly: true
          volumes:
            - configMap:
                defaultMode: 420
                name: cm-perfanalyzer
              name: perfanalyzer-config
            - name: secret-perfanalyzer
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: secret-perfanalyzer
                nodePublishSecretRef:
                  name: csi-secret-store-azure
            - name: secret-app-db
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: secret-app-db
                nodePublishSecretRef:
                  name: csi-secret-store-azure
          serviceAccountName: sa-choreo-default

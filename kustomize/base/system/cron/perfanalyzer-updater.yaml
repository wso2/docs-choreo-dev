apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: perfanalyzer-updater
  labels:
    choreo.component: perfanalyzer-updater
spec:
  schedule: 0 * * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            linkerd.io/inject: disabled # https://github.com/linkerd/linkerd2/issues/2833
            checkov.io/skip1: CKV_K8S_22=Skipping till the issue is fixed
          labels:
            choreo.component: perfanalyzer-updater
        spec:
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          containers:
          - name: perfanalyzer-updater
            image: choreocontrolplane.azurecr.io/choreoipaas/perfanalyzer-updater:latest
            securityContext:
              runAsUser: 500
              runAsGroup: 500
            env:
              - name: AZURE_ADX_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    key: AZURE_ADX_CLIENT_SECRET
                    name: secret-perfanalyzer
              - name: CHOREO_PERF_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    key: CHOREO_PERF_DB_PASSWORD
                    name: secret-perfanalyzer
              - name: CHOREO_APP_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    key: CHOREO_DB_PASSWORD
                    name: secret-app-db
            resources:
              limits:
                cpu: 300m
                memory: 1024Mi
              requests:
                cpu: 200m
                memory: 512Mi
            volumeMounts:
              - name: perfanalyzer-config
                mountPath: /home/python-ai/perf-analyzer/config/
              - name: secret-perfanalyzer
                mountPath: "/mnt/csi/secret-perfanalyzer"
                readOnly: true
              - name: secret-app-db
                mountPath: "/mnt/csi/secret-app-db"
                readOnly: true
          volumes:
            - configMap:
                defaultMode: 420
                name: cm-perfanalyzer
              name: perfanalyzer-config
            - name: secret-perfanalyzer
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: secret-perfanalyzer
                nodePublishSecretRef:
                  name: csi-secret-store-azure
            - name: secret-app-db
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: secret-app-db
                nodePublishSecretRef:
                  name: csi-secret-store-azure
          serviceAccountName: sa-choreo-default

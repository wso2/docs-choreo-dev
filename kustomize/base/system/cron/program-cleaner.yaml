apiVersion: batch/v1
kind: CronJob
metadata:
  name: program-cleaner
  labels:
    choreo.component: program-cleaner
spec:
  schedule: 30 16 * * 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            seccomp.security.alpha.kubernetes.io/pod: "runtime/default"
            linkerd.io/inject: disabled # https://github.com/linkerd/linkerd2/issues/2833
          labels:
            choreo.component: program-cleaner
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          containers:
            - name: program-cleaner
              image: choreocontrolplane.azurecr.io/choreoipaas/choreo-programcleaner:latest
              securityContext:
                runAsUser: 10500
                runAsGroup: 10500
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - all
              env:
                - name: AZURE_DL_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: AZURE_DL_AST_CLIENT_SECRET
                      name: secret-datalake
                - name: CHOREO_PROGRAM_DB_NAME
                  valueFrom:
                    configMapKeyRef:
                      key: CHOREO_DB_NAME
                      name: cm-choreo-program-db
                - name: CHOREO_PROGRAM_DB_USERNAME
                  valueFrom:
                    configMapKeyRef:
                      key: CHOREO_DB_USERNAME
                      name: cm-choreo-program-db
                - name: CHOREO_DB_DRIVER
                  valueFrom:
                    configMapKeyRef:
                      key: CHOREO_DB_DRIVER
                      name: cm-choreo-program-db
                - name: CHOREO_PROGRAM_DB_HOST
                  valueFrom:
                    configMapKeyRef:
                      key: CHOREO_DB_HOST
                      name: env-choreo-program-db
                - name: CHOREO_PROGRAM_DB_PORT
                  valueFrom:
                    configMapKeyRef:
                      key: CHOREO_DB_PORT
                      name: cm-choreo-program-db
                - name: CHOREO_PROGRAM_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: CHOREO_DB_PASSWORD
                      name: secret-program-db
              envFrom:
                - configMapRef:
                    name: env-datalake-ast
                - configMapRef:
                    name: cm-datalake-ast
              resources:
                limits:
                  cpu: 150m
                  memory: 100Mi
                requests:
                  cpu: 100m
                  memory: 50Mi
              volumeMounts:
                - mountPath: /mnt/csi/secret-program-db
                  name: secret-program-db
                  readOnly: true
                - mountPath: /mnt/csi/secret-datalake
                  name: secret-datalake
                  readOnly: true
          volumes:
            - name: secret-program-db
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: secret-program-db
                nodePublishSecretRef:
                  name: csi-secret-store-azure
            - name: secret-datalake
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: secret-datalake
                nodePublishSecretRef:
                  name: csi-secret-store-azure
          serviceAccountName: sa-choreo-default

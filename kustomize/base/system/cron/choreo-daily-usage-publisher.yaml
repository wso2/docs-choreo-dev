apiVersion: batch/v1
kind: CronJob
metadata:
  name: choreo-daily-usage-publisher
  labels:
    choreo.component: choreo-daily-usage-publisher
spec:
  schedule: 45 23 * * *
  successfulJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 10
      completions: 1
      parallelism: 1
      template:
        metadata:
          annotations:
            seccomp.security.alpha.kubernetes.io/pod: "runtime/default"
            linkerd.io/inject: disabled # https://github.com/linkerd/linkerd2/issues/2833
          labels:
            choreo.component: choreo-daily-usage-publisher
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          containers:
            - name: choreo-daily-usage-publisher
              image: choreocontrolplane.azurecr.io/choreoipaas/choreo-metered-usage-handler:latest
              securityContext:
                runAsUser: 10500
                runAsGroup: 10500
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - all
              env:
                - name: STRIPE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: secret-choreo-metered-usage-handler
                      key: STRIPE_TOKEN
                - name: CHOREO_USAGE_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: secret-choreo-metered-usage-handler
                      key: MSSQL_PASSWORD
                - name: AZURE_AUTH_APP_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: secret-choreo-metered-usage-handler
                      key: AZURE_AUTH_APP_CLIENT_SECRET
                      optional: true
              envFrom:
                - configMapRef:
                    name: cm-file-choreo-metered-usage-handler-daily-publisher
                - configMapRef:
                    name: env-choreo-metered-usage-handler
              resources:
                limits:
                  cpu: 500m
                  memory: 1024Mi
                requests:
                  cpu: 300m
                  memory: 512Mi
              volumeMounts:
                - name: config
                  mountPath: /home/ballerina/Config.toml
                  subPath: Config.toml
                - name: secret-choreo-metered-usage-handler
                  mountPath: "/mnt/csi/secret-choreo-metered-usage-handler"
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: cm-file-choreo-metered-usage-handler
            - name: secret-choreo-metered-usage-handler
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: secret-choreo-metered-usage-handler
                nodePublishSecretRef:
                  name: csi-secret-store-azure
          serviceAccountName: sa-choreo-default

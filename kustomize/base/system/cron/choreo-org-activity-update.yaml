apiVersion: batch/v1
kind: CronJob
metadata:
  name: choreo-org-activity-update
  labels:
    choreo.component: choreo-org-activity-update
spec:
  schedule: 0 22 * * *
  successfulJobsHistoryLimit: 3
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      backoffLimit: 15
      completions: 1
      parallelism: 1
      template:
        metadata:
          annotations:
            seccomp.security.alpha.kubernetes.io/pod: "runtime/default"
            linkerd.io/inject: disabled
          labels:
            choreo.component: choreo-org-activity-update
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          containers:
            - name: choreo-org-activity-update
              image: choreocontrolplane.azurecr.io/choreoipaas/choreo-org-activity-job:latest
              securityContext:
                runAsUser: 10500
                runAsGroup: 10500
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - all
              envFrom:
                - configMapRef:
                    name: cm-choreo-org-activity-update
              env:
                - name: LOG_ANALYTICS_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: secret-org-activity
                      key: AZURE_ACTIVEDIRECTORY_CLIENT_SECRET
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: secret-org-activity
                      key: CHOREO_DB_PASSWORD
                - name: SUBS_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: secret-org-activity
                      key: MSSQL_PASSWORD
                - name: STORAGE_ACCOUNT_KEY
                  valueFrom:
                    secretKeyRef:
                      name: secret-org-activity
                      key: org-deletion-STORAGE-ACCOUNT-KEY
                - name: SCIM_BACKEND_API_USER_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: secret-org-activity
                      key: SCIM_BACKEND_API_USER_PASSWORD
              resources:
                limits:
                  cpu: 450m
                  memory: 300Mi
                requests:
                  cpu: 150m
                  memory: 100Mi
              volumeMounts:
                - name: secret-org-activity
                  mountPath: "/mnt/csi/secret-org-activity"
                  readOnly: true
                - mountPath: /usr/src/app/dist
                  name: dist-volume
          volumes:
            - name: secret-org-activity
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: secret-org-activity
                nodePublishSecretRef:
                  name: csi-secret-store-azure
            - name: dist-volume
              emptyDir: {}
          serviceAccountName: sa-choreo-default

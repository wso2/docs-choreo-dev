apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: observability-data-generator
  annotations:
    checkov.io/skip1: CKV_K8S_43=The image tag gets updated to component git hash when deploying
  labels:
    choreo.component: observability-data-generator
spec:
  schedule: 30 20 1,15 * *
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          annotations:
            seccomp.security.alpha.kubernetes.io/pod: "runtime/default"
            linkerd.io/inject: disabled # https://github.com/linkerd/linkerd2/issues/2833
          labels:
            choreo.component: observability-data-generator
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          containers:
            - name: observability-data-generator
              image: choreocontrolplane.azurecr.io/choreoipaas/observability-data-generator:latest
              securityContext:
                runAsUser: 10500
                runAsGroup: 10500
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                  - all
              env:
                - name: APP_DEPLOYER_ADDRESS
                  valueFrom:
                    configMapKeyRef:
                      key: APP_DEPLOYER_ADDRESS
                      name: cm-observability-data-generator
                - name: APP_SERVICE_ADDRESS
                  valueFrom:
                    configMapKeyRef:
                      key: APP_SERVICE_ADDRESS
                      name: cm-observability-data-generator
                - name: WS_MANAGER_SERVICE_ADDRESS
                  valueFrom:
                    configMapKeyRef:
                      key: WS_MANAGER_SERVICE_ADDRESS
                      name: cm-observability-data-generator
              envFrom:
                - configMapRef:
                    name: env-observability-data-generator
              resources:
                limits:
                  cpu: 300m
                  memory: 1024Mi
                requests:
                  cpu: 200m
                  memory: 512Mi
              volumeMounts:
                - name: app-deployer-manager-output-volume  # Used for passing values from Java program to the calling bash script
                  mountPath: /choreo-data-generator/output
          serviceAccountName: sa-choreo-default
          volumes:
            - name: app-deployer-manager-output-volume
              emptyDir: {}

apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: observability-data-generator
  labels:
    choreo.component: observability-data-generator
spec:
  schedule: 30 20 1,15 * *
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          annotations:
            seccomp.security.alpha.kubernetes.io/pod: "runtime/default"
            linkerd.io/inject: disabled # https://github.com/linkerd/linkerd2/issues/2833
          labels:
            choreo.component: observability-data-generator
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          containers:
            - name: observability-data-generator
              image: choreocontrolplane.azurecr.io/choreoipaas/observability-data-generator:latest
              securityContext:
                runAsUser: 10500
                runAsGroup: 10500
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                  - all
              env:
                - name: APP_DEPLOYER_ADDRESS
                  valueFrom:
                    configMapKeyRef:
                      key: APP_DEPLOYER_ADDRESS
                      name: cm-observability-data-generator
                - name: APP_SERVICE_ADDRESS
                  valueFrom:
                    configMapKeyRef:
                      key: APP_SERVICE_ADDRESS
                      name: cm-observability-data-generator
                - name: WS_MANAGER_SERVICE_ADDRESS
                  valueFrom:
                    configMapKeyRef:
                      key: WS_MANAGER_SERVICE_ADDRESS
                      name: cm-observability-data-generator
                - name: APIM_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      key: APIM_CLIENT_ID
                      name: secret-observability-data-generator
                - name: APIM_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: APIM_CLIENT_SECRET
                      name: secret-observability-data-generator
              envFrom:
                - configMapRef:
                    name: env-observability-data-generator
              resources:
                limits:
                  cpu: 300m
                  memory: 1024Mi
                requests:
                  cpu: 200m
                  memory: 512Mi
              volumeMounts:
                - name: output-volume  # Used for storing the content written during execution
                  mountPath: /choreo-data-generator/output
                - name: libsodium-volume  # Used for storing the content generated by libsodium
                  mountPath: /tmp
                - name: secret-observability-data-generator
                  mountPath: "/mnt/csi/secret-observability-data-generator"
          serviceAccountName: sa-choreo-default
          volumes:
            - name: output-volume
              emptyDir: {}
            - name: libsodium-volume
              emptyDir: {}
            - name: secret-observability-data-generator
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: secret-observability-data-generator
                nodePublishSecretRef:
                  name: csi-secret-store-azure

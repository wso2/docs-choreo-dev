apiVersion: batch/v1
kind: CronJob
metadata:
  name: lowcode-parser
  annotations:
    checkov.io/skip1: CKV_K8S_25=Temporarily suppressing till fixing
  labels:
    choreo.component: choreo-lowcode-parser
spec:
  schedule: 0 9 * * 3
  startingDeadlineSeconds: 600
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            linkerd.io/inject: disabled # https://github.com/linkerd/linkerd2/issues/2833
            seccomp.security.alpha.kubernetes.io/pod: "runtime/default"
          labels:
            choreo.component: lowcode-parser
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          containers:
          - name: lowcode-parser
            image: choreocontrolplane.azurecr.io/choreoipaas/lowcode-parser:latest
            securityContext:
              readOnlyRootFilesystem: true
              runAsUser: 10500
              runAsGroup: 10500
              capabilities:
                drop:
                  - all
                add: [ "NET_RAW" ]
              allowPrivilegeEscalation: false
            env:
              - name: CHOREO_PROG_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    key: CHOREO_DB_PASSWORD
                    name: secret-program-db
            envFrom:
              - configMapRef:
                  name: env-choreo-program-db
              - secretRef:
                  name: secret-lowcode-parser
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 150m
                memory: 256Mi
            volumeMounts:
              - name: lowcode-parser-config
                mountPath: lowcode-parser/parser/config/
              - name: secret-lowcode-parser
                mountPath: "/mnt/csi/secret-lowcode-parser"
                readOnly: true
              - name: secret-program-db
                mountPath: "/mnt/csi/secret-program-db"
                readOnly: true
          volumes:
            - configMap:
                defaultMode: 420
                name: cm-lowcode-parser
              name: lowcode-parser-config
            - name: secret-lowcode-parser
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: secret-lowcode-parser
                nodePublishSecretRef:
                  name: csi-secret-store-azure
            - name: secret-program-db
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass:  secret-program-db
                nodePublishSecretRef:
                  name: csi-secret-store-azure

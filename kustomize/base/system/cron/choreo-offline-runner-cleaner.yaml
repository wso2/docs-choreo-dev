apiVersion: batch/v1
kind: CronJob
metadata:
  name: github-offline-runners-cleaner
  labels:
    choreo.component: github-offline-runners-cleaner
spec:
  schedule: 0 */12 * * *
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            seccomp.security.alpha.kubernetes.io/pod: "runtime/default"
            linkerd.io/inject: disabled # https://github.com/linkerd/linkerd2/issues/2833
          labels:
            choreo.component: github-offline-runners-cleaner
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          containers:
            - name: github-offline-runners-cleaner
              image: choreocontrolplane.azurecr.io/choreoipaas/dp-cicd-runners-cleaner:latest
              securityContext:
                runAsUser: 10500
                runAsGroup: 10500
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - all
              envFrom:
                - configMapRef:
                    name: env-runner-cleaner
                - configMapRef:
                    name: cm-runner-cleaner
              resources:
                limits:
                  cpu: 300m
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi


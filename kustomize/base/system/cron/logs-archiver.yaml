apiVersion: batch/v1
kind: CronJob
metadata:
  name: logs-archiver
  labels:
    choreo.component: logs-archiver
spec:
  schedule: 5 0 * * *
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            seccomp.security.alpha.kubernetes.io/pod: "runtime/default"
            linkerd.io/inject: disabled # https://github.com/linkerd/linkerd2/issues/2833
          labels:
            choreo.component: logs-archiver
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 30
          containers:
            - name: logs-archiver
              image: choreocontrolplane.azurecr.io/choreoipaas/choreo-logsarchiver:latest
              securityContext:
                runAsUser: 10500
                runAsGroup: 10500
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - all
              env:
                - name: AZURE_LA_CLIENT_ID
                  valueFrom:
                    configMapKeyRef:
                      key: AZURE_ACTIVEDIRECTORY_CLIENT_ID
                      name: env-loggingapi
                - name: AZURE_LA_TENANT_ID
                  valueFrom:
                    configMapKeyRef:
                      key: AZURE_ACTIVEDIRECTORY_TENANT_ID
                      name: cm-loggingapi
                - name: AZURE_LA_WORKSPACE_ID
                  valueFrom:
                    configMapKeyRef:
                      key: LOG_WORKSPACE_ID
                      name: env-loganalytics-replica
                - name: AZURE_LA_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: AZURE_ACTIVEDIRECTORY_CLIENT_SECRET
                      name: secret-loggingapi
                - name: AZURE_DL_CLIENT_ID
                  valueFrom:
                    configMapKeyRef:
                      key: AZURE_DL_CLIENT_ID
                      name: env-datalake-ast
                - name: AZURE_DL_ACCOUNT_NAME
                  valueFrom:
                    configMapKeyRef:
                      key: AZURE_DL_ACCOUNT_NAME
                      name: env-datalake-ast
                - name: AZURE_DL_TENANT_ID
                  valueFrom:
                    configMapKeyRef:
                      key: AZURE_DL_TENANT_ID
                      name: cm-datalake-ast
                - name: AZURE_DL_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: AZURE_DL_AST_CLIENT_SECRET
                      name: secret-datalake
              envFrom:
                - configMapRef:
                    name: env-logsarchiver
              resources:
                limits:
                  cpu: 300m
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 256Mi
              volumeMounts:
                - mountPath: /mnt/csi/secret-loggingapi
                  name: secret-loggingapi
                  readOnly: true
                - mountPath: /mnt/csi/secret-datalake
                  name: secret-datalake
                  readOnly: true
          volumes:
            - name: secret-loggingapi
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: secret-loggingapi
                nodePublishSecretRef:
                  name: csi-secret-store-azure
            - name: secret-datalake
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: secret-datalake
                nodePublishSecretRef:
                  name: csi-secret-store-azure
          serviceAccountName: sa-choreo-default

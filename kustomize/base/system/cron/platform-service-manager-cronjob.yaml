apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-service-manager-cronjob
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: platform-services-manager
            image: choreocontrolplane.azurecr.io/choreoipaas/platform-services-manager:latest
            args: ["-cron"]
            envFrom:
              - configMapRef:
                  name: env-choreo-platform-services-manager
              - secretRef:
                  name: secret-choreo-platform-services-manager
              - configMapRef:
                  name: cm-platform-services-manager
            resources:
              limits:
                cpu: 200m
                memory: 250Mi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              seccompProfile:
                type: RuntimeDefault
              runAsUser: 10001
              runAsGroup: 10001
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - all
            volumeMounts:
              - name: secret-choreo-platform-services-manager
                mountPath: "/mnt/csi/secret-choreo-platform-services-manager"
                readOnly: true
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
          volumes:
            - name: secret-choreo-platform-services-manager
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: secret-choreo-platform-services-manager
                nodePublishSecretRef:
                  name: csi-secret-store-azure
          serviceAccountName: sa-choreo-default
          automountServiceAccountToken: false


apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  labels:
    choreo.component: shared-image-viewer
  name: shared-image-viewer
spec:
  maxReplicas: 5
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shared-image-viewer
  targetCPUUtilizationPercentage: 75

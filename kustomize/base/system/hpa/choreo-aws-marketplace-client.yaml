apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: choreo-aws-marketplace-client-hpa
  namespace: choreo-system
spec:
  maxReplicas: 2
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: choreo-aws-marketplace-client
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75

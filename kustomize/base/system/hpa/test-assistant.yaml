apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    choreo.component: test-assistant
  name: test-assistant
spec:
  maxReplicas: 3
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test-assistant
  metrics:
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 80
    - type: Resource
      resource:
        name: memory
        targetAverageUtilization: 80

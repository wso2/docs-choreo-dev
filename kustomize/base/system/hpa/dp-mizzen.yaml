apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    choreo.component: dp-mizzen
  name: dp-mizzen
spec:
  maxReplicas: 12
  minReplicas: 4
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dp-mizzen
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75

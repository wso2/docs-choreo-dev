apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  annotations:
    autoscaling.alpha.kubernetes.io/metrics: '[{"type":"Resource","resource":{"name":"memory","targetAverageUtilization":75}}]'
  labels:
    choreo.component: multivariate-anomaly-detector-notification-manager
  name: multivariate-anomaly-detector-notification-manager
spec:
  maxReplicas: 3
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: multivariate-anomaly-detector-notification-manager
  targetCPUUtilizationPercentage: 75

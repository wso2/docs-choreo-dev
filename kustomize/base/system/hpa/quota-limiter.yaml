apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    choreo.component: quota-limiter
  name: quota-limiter
spec:
  maxReplicas: 5
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quota-limiter
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_25=Temporarily suppressing till fixing
    checkov.io/skip2: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: cp-gw-adapter
  name: cp-gw-adapter
  namespace: choreo-system
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: cp-gw-adapter
  template:
    metadata:
      labels:
        choreo.component: cp-gw-adapter
        antiaffinity: cp-gw-adapter
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cp-gw-adapter
          imagePullPolicy: Always
          image: choreocontrolplane.azurecr.io/choreoipaas/cp-gwadapter:latest
          resources:
            limits:
              cpu: 1
              memory: 768Mi
            requests:
              cpu: 500m
              memory: 300Mi
          env:
            - name: CONFIG_FILE_PATH
              value: /go/bin/config/config.toml
            - name: APIM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: INTROSPECTION_ADMIN_PASSWORD
                  name: secret-choreo-apim-proxy-deployer   
          envFrom:
            - secretRef:
                name: secret-cp-gw-adapter
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          ports:
            - containerPort: 8080
              name: http-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /health
              port: http-port
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /health
              port: http-port
          volumeMounts:
            - name: config
              mountPath: /go/bin/config/config.toml
              subPath: config.toml
              readOnly: true
            - name: secret-cp-gw-adapter
              mountPath: /mnt/csi/secret-cp-gw-adapter
              readOnly: true
            - name: secret-choreo-apim-proxy-deployer
              mountPath: "/mnt/csi/secret-choreo-apim-proxy-deployer"
              readOnly: true  
      volumes:
        - name: config
          configMap:
            name: cm-file-cp-gw-adapter
        - name: secret-cp-gw-adapter
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-cp-gw-adapter
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-choreo-apim-proxy-deployer
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-choreo-apim-proxy-deployer
            nodePublishSecretRef:
              name: csi-secret-store-azure      
      restartPolicy: Always
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - cp-gw-adapter
              topologyKey: kubernetes.io/hostname

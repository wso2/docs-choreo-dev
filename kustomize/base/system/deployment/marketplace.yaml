apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_25=Temporarily suppressing till fixing
    checkov.io/skip2: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: marketplace
  name: marketplace
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: marketplace
  template:
    metadata:
      labels:
        choreo.component: marketplace
        antiaffinity: marketplace
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: marketplace
          imagePullPolicy: Always
          image: choreocontrolplane.azurecr.io/choreoipaas/marketplace:latest
          env:
            - name: RESOURCE_DIR
              value: /home/ballerina/resources/
          resources:
            limits:
              cpu: 200m
              memory: 300Mi
            requests:
              cpu: 100m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          ports:
            - containerPort: 9092
              name: healthz
              protocol: TCP
            - containerPort: 9090
              name: mktplace-port
              protocol: TCP
            - containerPort: 9091
              name: dp-conf-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /health
              port: healthz
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /health
              port: healthz
          volumeMounts:
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: cm-file-marketplace
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - marketplace
              topologyKey: kubernetes.io/hostname

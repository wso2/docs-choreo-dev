apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_40=Temporarily suppressing till fixing
    checkov.io/skip2: CKV_K8S_38=Temporarily suppressing till fixing
    checkov.io/skip3: CKV_K8S_28=Temporarily suppressing till fixing
    checkov.io/skip4: CKV_K8S_37=Temporarily suppressing till fixing
  labels:
    choreo.component: image-share-service
  name: image-share-service
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: image-share-service
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: image-share-service
        antiaffinity: image-share-service
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: image-share-service
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-image-share-service:latest
          env:
          - name: IMAGE_SHARE_SERVICE_SECRET
            valueFrom:
              secretKeyRef:
                name: secret-image-share-service
                key: IMAGE_SHARE_SERVICE_SECRET
          envFrom:
            - configMapRef:
                name: env-image-share-service
          ports:
            - containerPort: 9090
              name: http-port
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: http-port
              path: /healthz
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: http-port
              path: /healthz
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 300m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 100
            runAsGroup: 1000
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: secret-image-share-service
              mountPath: "/mnt/csi/secret-image-share-service"
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: cm-image-share-service-config
        - name: secret-image-share-service
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-image-share-service
            nodePublishSecretRef:
              name: csi-secret-store-azure
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: antiaffinity
                  operator: In
                  values:
                  - image-share-service
              topologyKey: kubernetes.io/hostname

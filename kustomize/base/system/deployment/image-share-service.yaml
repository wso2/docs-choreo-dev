apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip2: CKV_K8S_38=Required by LinkerD
  labels:
    choreo.component: image-share-service
  name: image-share-service
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: image-share-service
  strategy: { }
  template:
    metadata:
      labels:
        choreo.component: image-share-service
        antiaffinity: image-share-service
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: image-share-service
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-image-share-service:latest
          env:
            - name: AZURE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-image-share-service
                  key: IMAGE_SHARE_SERVICE_SECRET
          envFrom:
            - configMapRef:
                name: env-image-share-service
          ports:
            - containerPort: 9090
              name: http-port
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: http-port
              path: /healthz
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: http-port
              path: /healthz
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 300m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10500
            runAsGroup: 10500
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: secret-image-share-service
              mountPath: "/mnt/csi/secret-image-share-service"
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: secret-image-share-service
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-image-share-service
            nodePublishSecretRef:
              name: csi-secret-store-azure
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - image-share-service
              topologyKey: kubernetes.io/hostname

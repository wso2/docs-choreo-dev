apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=Required by LinkerD
  labels:
    choreo.component: workflow-mgt
  name: workflow-mgt
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: workflow-mgt
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: workflow-mgt
        antiaffinity: workflow-mgt
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workflow-mgt
          image: choreocontrolplane.azurecr.io/choreoipaas/workflow-mgt-service:latest
          env:
            - name: CHOREO_WORKFLOW_MGT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-workflow-mgt-db
                  key: CHOREO_WORKFLOW_MGT_DB_PASSWORD
          ports:
            - containerPort: 9082
              name: service-port
            - containerPort: 9050
              name: health-port
          readinessProbe:
            initialDelaySeconds: 60
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health-port
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health-port
              path: /liveness
          resources:
            limits:
              cpu: 300m
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 500Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10500
            runAsGroup: 10500
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
            - name: secret-workflow-mgt-db
              mountPath: "/mnt/csi/secret-workflow-mgt-db"
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: cm-file-workflow-mgt
        - name: secret-workflow-mgt-db
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-workflow-mgt-db
            nodePublishSecretRef:
              name: csi-secret-store-azure
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  antiaffinity: workflow-mgt
              topologyKey: kubernetes.io/hostname

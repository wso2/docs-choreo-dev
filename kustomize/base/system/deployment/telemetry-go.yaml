apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: telemetry-go
  name: telemetry-go
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: telemetry-go
  strategy: { }
  template:
    metadata:
      labels:
        choreo.component: telemetry-go
        choreo.telemetry.all: enabled
        choreo.telemetry.go: enabled
        antiaffinity: telemetry-go
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
        config.linkerd.io/proxy-cpu-limit: 100m
        config.linkerd.io/proxy-cpu-request: 50m
        config.linkerd.io/proxy-memory-limit: 2Gi
        config.linkerd.io/proxy-memory-request: 1Gi
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-redis
                  key: REDIS_PASSWORD
          envFrom:
            - configMapRef:
                name: cm-telemetry
            - configMapRef:
                name: env-telemetry
            - secretRef:
                name: secret-telemetry
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-telemetry-go:latest
          securityContext:
            runAsUser: 10500
            runAsGroup: 10500
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          name: telemetry-go
          volumeMounts:
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
            - name: secret-telemetry
              mountPath: "/mnt/csi/secret-telemetry"
              readOnly: true
            - name: secret-redis
              mountPath: "/mnt/csi/secret-redis"
              readOnly: true
          ports:
            - containerPort: 9090
              name: telemetry-port
              protocol: TCP
            - containerPort: 9091      # To be used for readiness/liveness probes (internal)
              name: health
              protocol: TCP
            - containerPort: 9092      # To be used for public health check (external)
              name: healthz
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /liveness
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 200mi
      volumes:
        - name: config
          configMap:
            name: cm-file-telemetry
        - name: secret-telemetry
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-telemetry
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-redis
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-redis
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - telemetry-go
              topologyKey: kubernetes.io/hostname

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: app-deployer
  name: app-deployer
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: app-deployer
  template:
    metadata:
      labels:
        choreo.component: app-deployer
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: choreocontrolplane.azurecr.io/choreoipaas/app-deployer:latest
        name: app-deployer
        env:
        - name: CHOREO_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-app-db
              key: CHOREO_DB_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-redis
              key: REDIS_PASSWORD
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: secret-app-deployer
              key: GITHUB_TOKEN
        - name: DOCKER_REGISTRY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-app-deployer
              key: DOCKER_REGISTRY_PASSWORD
        - name: K8S_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: secret-app-deployer
              key: K8S_API_TOKEN
        - name: APIM_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: secret-app-deployer
              key: APIM_CLIENT_SECRET
        envFrom:
        - configMapRef:
            name: env-app-deployer
        ports:
        - containerPort: 8080
          name: grpc-port
        readinessProbe:
          exec:
            command: ["/bin/grpc_health_probe", "-addr=:8080"]
          initialDelaySeconds: 5
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "bin/grpc_health_probe -addr=:8080 2>&1 | grep -q SERVING"]
          initialDelaySeconds: 20
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 12000
          runAsGroup: 12000
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - all
        volumeMounts:
        - mountPath: /app-deployer.yaml
          name: config
          subPath: app-deployer.yaml
        - mountPath: /service-account.yaml
          name: secret-apps-k8s-service-account
          readOnly: true
          subPath: APPS_K8S_SERVICE_ACCOUNT
        - name: secret-app-deployer
          mountPath: "/mnt/csi/secret-app-deployer"
          readOnly: true
        - name: secret-app-db
          mountPath: "/mnt/csi/secret-app-db"
          readOnly: true
        - name: secret-redis
          mountPath: "/mnt/csi/secret-redis"
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: cm-app-deployer
      - name: secret-apps-k8s-service-account
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-apps-k8s-service-account
          nodePublishSecretRef:
            name: csi-secret-store-azure
      - name: secret-app-deployer
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-app-deployer
          nodePublishSecretRef:
            name: csi-secret-store-azure
      - name: secret-app-db
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-app-db
          nodePublishSecretRef:
            name: csi-secret-store-azure
      - name: secret-redis
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-redis
          nodePublishSecretRef:
            name: csi-secret-store-azure
      - name: tmp
        emptyDir: {}
      serviceAccountName: sa-choreo-default

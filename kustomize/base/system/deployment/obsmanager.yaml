apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: obsmanager
  name: obsmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: obsmanager
  strategy: { }
  template:
    metadata:
      labels:
        choreo.component: obsmanager
        antiaffinity: obsmanager
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: obsmanager
          envFrom:
            - configMapRef:
                name: cm-obsmanager
            - configMapRef:
                name: env-obsmanager
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-obs-manager:latest
          securityContext:
            runAsUser: 10500
            runAsGroup: 10500
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          volumeMounts:
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
          ports:
            - containerPort: 9094
              name: obsmanager-port
              protocol: TCP
            - containerPort: 9093      # To be used for readiness/liveness probes (internal)
              name: health
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 60
            periodSeconds: 60
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /liveness
          resources:
            limits:
              cpu: 300m
              memory: 750Mi
            requests:
              cpu: 200m
              memory: 500Mi
      volumes:
        - name: config
          configMap:
            name: cm-file-obsmanager
      restartPolicy: Always
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - obsmanager
              topologyKey: kubernetes.io/hostname

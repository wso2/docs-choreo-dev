apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_25=Temporarily suppressing till fixing
    checkov.io/skip2: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: dp-rudder-cilium
    choreo.dataplane: "true"
  name: dp-rudder-cilium
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: dp-rudder-cilium
  template:
    metadata:
      labels:
        choreo.component: dp-rudder-cilium
        antiaffinity: dp-rudder
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dp-rudder
          imagePullPolicy: Always
          image: choreocontrolplane.azurecr.io/choreoipaas/dp-rudder:latest
          command: ["/bin/sh", "-c", "/go/bin/cilium-migration"]
          resources:
            limits:
              cpu: 300m
              memory: 300Mi
            requests:
              cpu: 200m
              memory: 200Mi
          envFrom:
            - configMapRef:
                name: env-dp-rudder
            - configMapRef:
                name: cm-dp-rudder
            - secretRef:
                name: secret-dp-rudder
            - configMapRef:
                name: env-dp-rudder-cilium
                optional: true
          env:
            - name: JOB_TTL_SECONDS_AFTER_FINISHED
              value: "86400"
            - name: APIM_REVISION_LIMIT
              value: "20"
            - name: HPA_ENABLED
              value: "true"
            - name: PDB_ENABLED
              value: "true"
            - name: GORM_PREPARED_STATEMENTS_ENABLED
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          ports:
            - containerPort: 3000
              name: http-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
          volumeMounts:
            - name: secret-dp-rudder
              mountPath: /mnt/csi/secret-dp-rudder
              readOnly: true
      volumes:
        - name: secret-dp-rudder
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-dp-rudder
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: antiaffinity
                      operator: In
                      values:
                        - dp-rudder
                topologyKey: topology.kubernetes.io/zone

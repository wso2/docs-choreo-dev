apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    seccomp.security.alpha.kubernetes.io/pod: "docker/default"
    checkov.io/skip1: CKV_K8S_38=Required by linkerd
  labels:
    choreo.component: billing
  name: billing
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: billing
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        choreo.component: billing
        antiaffinity: billing
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
        seccomp.security.alpha.kubernetes.io/pod: "docker/default"
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: true
      containers:
        - image: choreocontrolplane.azurecr.io/choreoipaas/choreo-billing:latest
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 11000
            runAsGroup: 12000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
                - NET_RAW
          name: billing
          envFrom:
            - configMapRef:
                name: env-billing
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-billing
                  key: BILLING_DB_PASSWORD
            - name: STRIPE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secret-billing
                  key: STRIPE_TOKEN
            - name: BAL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-billing
                  key: BAL_TRUSTSTORE_PASSWORD
          ports:
            - containerPort: 9090
              name: http
              protocol: TCP
            - containerPort: 9091
              name: health-internal
              protocol: TCP
            - containerPort: 9092
              name: health-public
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 15
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health-internal
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 20
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health-internal
              path: /liveness
          resources:
            limits:
              cpu: 500m
              memory: 768Mi
            requests:
              cpu: 300m
              memory: 512Mi
          volumeMounts:
            - name: secret-billing
              mountPath: /mnt/csi/secret-billing
              readonly: true
            - name: secret-billing
              mountPath: /home/ballerina/security/clientTrustStore.p12
              subPath: BAL_TRUSTSTORE
              readOnly: true
            - name: secret-billing
              mountPath: /home/ballerina/security/subscription.dev.rootasgardeo.internal.crt
              subPath: BAL_CERT
              readOnly: true
            - name: tmp
              mountPath: /tmp
      restartPolicy: Always
      volumes:
        - name: secret-billing
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-billing
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - emptyDir: {}
          name: tmp
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: antiaffinity
                  operator: In
                  values:
                  - billing
              topologyKey: kubernetes.io/hostname

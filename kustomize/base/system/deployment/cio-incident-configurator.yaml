apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: cio-incident-configurator
  name: cio-incident-configurator
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: cio-incident-configurator
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: cio-incident-configurator
        antiaffinity: cio-incident-configurator
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cio-incident-configurator
          imagePullPolicy: Always
          image: choreocontrolplane.azurecr.io/choreoipaas/cio-incident-configurator:latest
          resources:
            limits:
              cpu: 800m
              memory: 1024Mi
            requests:
              cpu: 300m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: cm-cio-incident-configurator
            - configMapRef:
                name: env-cio-incident-configurator
            - configMapRef:
                name: common-env-variables
            - secretRef:
                 name: secret-cio-incident-configurator
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 10500
            runAsGroup: 10500
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: service-port
              protocol: TCP
            - containerPort: 8086
              name: health-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 20
            periodSeconds: 20
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /readiness
              port: health-port
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /liveness
              port: health-port
          volumeMounts:
            - name: temp
              mountPath: /tmp
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
            - name: secret-cio-incident-configurator
              mountPath: "/mnt/csi/secret-cio-incident-configurator"
              readOnly: true
      volumes:
        - name: temp
          emptyDir: {}
        - name: config
          configMap:
            name: cm-file-cio-incident-configurator
        - name: secret-cio-incident-configurator
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-cio-incident-configurator
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - cio-incident-configurator
              topologyKey: kubernetes.io/hostname

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_40=Temporarily suppressing till fixing
    checkov.io/skip2: CKV_K8S_43=Temporarily suppressing till fixing
    checkov.io/skip3: CKV_K8S_38=Temporarily suppressing till fixing
    checkov.io/skip4: CKV_K8S_28=Temporarily suppressing till fixing
    checkov.io/skip5: CKV_K8S_37=Temporarily suppressing till fixing
    checkov.io/skip6: CKV_K8S_20=Temporarily suppressing till fixing
  labels:
    choreo.component: loggingapi
  name: loggingapi
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: loggingapi
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: loggingapi
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - env:
            - name: b7a_log_level
              valueFrom:
                configMapKeyRef:
                  key: B7A_LOG_LEVEL
                  name: cm-loglevel-loggingapi
            - name: IDP_ISSUER
              valueFrom:
                configMapKeyRef:
                  key: IDP_ISSUER
                  name: cm-idp-replica
            - name: IDP_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  key: IDP_CLIENT_ID
                  name: cm-idp-replica
            - name: IDP_HOST
              valueFrom:
                configMapKeyRef:
                  key: IDP_HOST
                  name: cm-idp-replica
            - name: IDP_JWKS_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  key: IDP_JWKS_ENDPOINT
                  name: cm-idp-replica
            - name: JWKS_ENDPOINT_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  key: JWKS_ENDPOINT_PROTOCOL
                  name: cm-loggingapi
            - name: AAD_TENANT_ID
              valueFrom:
                configMapKeyRef:
                  key: AZURE_ACTIVEDIRECTORY_TENANT_ID
                  name: cm-loggingapi
            - name: AAD_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  key: AZURE_ACTIVEDIRECTORY_CLIENT_ID
                  name: cm-loggingapi
            - name: USER_APPS_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  key: USER_APPS_NAMESPACE
                  name: cm-k8sservice-replica
            - name: K8S_SERVICE_SUBSCRIPTION_ID
              valueFrom:
                configMapKeyRef:
                  key: K8S_SERVICE_SUBSCRIPTION_ID
                  name: cm-k8sservice-replica
            - name: RESOURCE_GROUP
              valueFrom:
                configMapKeyRef:
                  key: RESOURCE_GROUP
                  name: cm-k8sservice-replica
            - name: CLUSTER_NAME
              valueFrom:
               configMapKeyRef:
                 key: CLUSTER_NAME
                 name: cm-k8sservice-replica
            - name: LOG_WORKSPACE_ID
              valueFrom:
                configMapKeyRef:
                  key: LOG_WORKSPACE_ID
                  name: cm-loganalytics-replica
            - name: NEGOTIATOR_GRPC_ADDRESS
              valueFrom:
                configMapKeyRef:
                  key: NEGOTIATOR_GRPC_ADDRESS
                  name: cm-loggingapi
            - name: APP_SERVICE_GRPC_ADDRESS
              valueFrom:
                configMapKeyRef:
                  key: APP_SERVICE_GRPC_ADDRESS
                  name: cm-loggingapi
            - name: AAD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secret-loggingapi
                  key: AZURE_ACTIVEDIRECTORY_CLIENT_SECRET
            - name: AZURE_K8S_API_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: cm-loggingapi
                  key: AZURE_K8S_API_SERVER_URL  
            - name: AZURE_K8S_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secret-loggingapi
                  key: AZURE_K8S_API_SERVER_ACCESS_TOKEN    
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-logging:latest
          securityContext:
            runAsUser: 100
            runAsGroup: 1000
            readOnlyRootFilesystem: true
          name: loggingapi
          volumeMounts:
          - name: secret-loggingapi
            mountPath: "/mnt/csi/secret-loggingapi"
            readOnly: true
          ports:
            - containerPort: 9097
              name: logapi-port
              protocol: TCP
            - containerPort: 9098      # To be used for readiness/liveness probes (internal)
              name: health
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 60
            periodSeconds: 60
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /liveness
          resources:
            limits:
              cpu: 500m
              memory: 768Mi
            requests:
              cpu: 300m
              memory: 512Mi
      volumes:
      - name: secret-loggingapi
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-loggingapi
          nodePublishSecretRef:
            name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default

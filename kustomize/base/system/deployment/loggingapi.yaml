apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip2: CKV_K8S_43=Temporarily suppressing as this requires CICD level changes
    checkov.io/skip3: CKV_K8S_25=Temporarily suppressing as there is no defined fix for this by the Bridgecrew
  labels:
    choreo.component: loggingapi
  name: loggingapi
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: loggingapi
  strategy: { }
  template:
    metadata:
      labels:
        choreo.component: loggingapi
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loggingapi
          env:
            - name: b7a_log_level
              valueFrom:
                configMapKeyRef:
                  key: B7A_LOG_LEVEL
                  name: cm-loglevel-loggingapi
            - name: IDP_ISSUER
              valueFrom:
                configMapKeyRef:
                  key: IDP_ISSUER
                  name: env-idp-replica
            - name: IDP_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  key: IDP_CLIENT_ID
                  name: env-idp-replica
            - name: IDP_HOST
              valueFrom:
                configMapKeyRef:
                  key: IDP_HOST
                  name: env-idp-replica
            - name: IDP_JWKS_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  key: IDP_JWKS_ENDPOINT
                  name: cm-idp-replica
            - name: JWKS_ENDPOINT_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  key: JWKS_ENDPOINT_PROTOCOL
                  name: cm-loggingapi
            - name: AAD_TENANT_ID
              valueFrom:
                configMapKeyRef:
                  key: AZURE_ACTIVEDIRECTORY_TENANT_ID
                  name: cm-loggingapi
            - name: AAD_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  key: AZURE_ACTIVEDIRECTORY_CLIENT_ID
                  name: env-loggingapi
            - name: NEGOTIATOR_GRPC_ADDRESS
              valueFrom:
                configMapKeyRef:
                  key: NEGOTIATOR_GRPC_ADDRESS
                  name: cm-loggingapi
            - name: APP_SERVICE_GRPC_ADDRESS
              valueFrom:
                configMapKeyRef:
                  key: APP_SERVICE_GRPC_ADDRESS
                  name: cm-loggingapi
            - name: AAD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secret-loggingapi
                  key: AZURE_ACTIVEDIRECTORY_CLIENT_SECRET
            - name: AZURE_K8S_API_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: env-loggingapi
                  key: AZURE_K8S_API_SERVER_URL
            - name: AZURE_K8S_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secret-loggingapi
                  key: AZURE_K8S_API_SERVER_ACCESS_TOKEN
          envFrom:
            - configMapRef:
                name: env-k8sservice-replica
            - configMapRef:
                name: env-loganalytics-replica
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-logging:latest
          securityContext:
            runAsUser: 10500
            runAsGroup: 10500
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - all
          volumeMounts:
            - name: secret-loggingapi
              mountPath: "/mnt/csi/secret-loggingapi"
              readOnly: true
          ports:
            - containerPort: 9097
              name: logapi-port
              protocol: TCP
            - containerPort: 9098      # To be used for readiness/liveness probes (internal)
              name: health
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 60
            periodSeconds: 60
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /liveness
          resources:
            limits:
              cpu: 500m
              memory: 768Mi
            requests:
              cpu: 300m
              memory: 512Mi
      volumes:
        - name: secret-loggingapi
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-loggingapi
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default

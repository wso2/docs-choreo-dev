apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=Required by LinkerD
  labels:
    choreo.component: code-challenge-eval
  name: code-challenge-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: code-challenge-eval
  strategy: { }
  template:
    metadata:
      labels:
        choreo.component: code-challenge-eval
        antiaffinity: code-challenge-eval
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: code-challenge-eval
          image: choreocontrolplane.azurecr.io/choreoipaas/code-challenge-eval:latest
          env:
            - name: CCE_APIM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-code-challenge-eval
                  key: CCE_APIM_DB_PASSWORD
            - name: CCE_CONFIGURATION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-code-challenge-eval
                  key: CCE_CONFIGURATION_DB_PASSWORD
            - name: CCE_PLATFORM_SVC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-code-challenge-eval
                  key: CCE_PLATFORM_SVC_DB_PASSWORD
            - name: CCE_RUDDER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-code-challenge-eval
                  key: CCE_RUDDER_DB_PASSWORD
          ports:
            - containerPort: 8095
              name: service-port
            - containerPort: 8075
              name: health-port
          readinessProbe:
            initialDelaySeconds: 60
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health-port
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health-port
              path: /liveness
          resources:
            limits:
              cpu: 300m
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 500Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10500
            runAsGroup: 10500
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
            - name: secret-code-challenge-eval
              mountPath: "/mnt/csi/secret-code-challenge-eval"
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: cm-file-code-challenge-eval
        - name: secret-code-challenge-eval
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-code-challenge-eval
            nodePublishSecretRef:
              name: csi-secret-store-azure
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - code-challenge-eval
              topologyKey: kubernetes.io/hostname

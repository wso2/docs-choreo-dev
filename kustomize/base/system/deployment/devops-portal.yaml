apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip3: CKV_K8S_40=Temporarily suppressing till fixing
    checkov.io/skip4: CKV_K8S_38=Temporarily suppressing till fixing
    checkov.io/skip5: CKV_K8S_28=Temporarily suppressing till fixing
    checkov.io/skip6: CKV_K8S_37=Temporarily suppressing till fixing
    checkov.io/skip8: CKV_K8S_31=Temporarily suppressing till fixing
    checkov.io/skip10: CKV_K8S_22=Not possible to do ATM, as there are some files such as logs and configs written
    checkov.io/skip11: CKV_K8S_23=Temporarily suppressing till fixing
  labels:
    choreo.component: devops-portal
  name: devops-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: devops-portal
  template:
    metadata:
      labels:
        choreo.component: devops-portal
        antiaffinity: devops-portal
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: choreocontrolplane.azurecr.io/choreoipaas/choreo-devops-portal:latest
          name: devops-portal
          ports:
            - containerPort: 80
              name: devops-portal-port
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 101
            runAsGroup: 101
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /
              port: devops-portal-port
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /
              port: devops-portal-port
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          envFrom:
            - configMapRef:
                name: env-devops-portal
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: antiaffinity
                      operator: In
                      values:
                        - devops-portal
                topologyKey: kubernetes.io/hostname

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: devops-portal
  name: devops-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: devops-portal
  template:
    metadata:
      labels:
        choreo.component: devops-portal
        antiaffinity: devops-portal
      annotations:
        linkerd.io/inject: disabled
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: choreocontrolplane.azurecr.io/choreoipaas/choreo-devops-portal:latest
          name: devops-portal
          ports:
            - containerPort: 80
              name: do-portal-port
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 10014
            runAsGroup: 10014
            capabilities:
              drop:
                - all
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /
              port: do-portal-port
          livenessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /
              port: do-portal-port
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          envFrom:
            - configMapRef:
                name: env-devops-portal
          volumeMounts:
            - mountPath: /var/cache/nginx
              name: cache-volume
            - mountPath: /var/run
              name: pid-volume
      volumes:
        - name: cache-volume
          emptyDir: {}
        - name: pid-volume
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: antiaffinity
                      operator: In
                      values:
                        - devops-portal
                topologyKey: kubernetes.io/hostname

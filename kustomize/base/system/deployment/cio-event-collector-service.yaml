apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: cio-event-collector-service
  name: cio-event-collector-servic
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: cio-event-collector-service
  strategy: { }
  template:
    metadata:
      labels:
        choreo.component: cio-event-collector-service
        antiaffinity: cio-event-collector-service
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cio-event-collector-service
          imagePullPolicy: Always
          image: choreocontrolplane.azurecr.io/choreoipaas/cio-event-collector-service:latest
          resources:
            limits:
              cpu: 800m
              memory: 1024Mi
            requests:
              cpu: 300m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: env-cio-event-collector-service
          env:
            - name: CIO_DB_JDBC_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: env-cio-event-collector-service
                  key: CIO_DB_JDBC_CONNECTION_STRING
            - name: CIO_DB_JDBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: env-cio-event-collector-service
                  key: CIO_DB_JDBC_USERNAME
            - name: DEPLOYMENT_EVENTHUB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: secret-cio-event-collector-service
                  key: DEPLOYMENT_EVENTHUB_CONNECTION_STRING
            - name: CIO_DB_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-cio-event-collector-service
                  key: CIO_DB_JDBC_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 10500
            runAsGroup: 10500
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: collector-service-port
              protocol: TCP
            - containerPort: 8086
              name: health-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 20
            periodSeconds: 20
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /readiness
              port: health-port
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /liveness
              port: health-port
          volumeMounts:
            - name: secret-cio-event-collector-service
              mountPath: "/mnt/csi/secret-cio-event-collector-service"
              readOnly: true
      volumes:
        - name: secret-cio-event-collector-service
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-cio-event-collector-service
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - cio-event-collector-service
              topologyKey: kubernetes.io/hostname
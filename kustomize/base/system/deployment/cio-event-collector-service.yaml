apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: cio-event-collector-service
  name: cio-event-collector-service
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: cio-event-collector-service
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: cio-event-collector-service
        antiaffinity: cio-event-collector-service
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cio-event-collector-service
          imagePullPolicy: Always
          image: choreocontrolplane.azurecr.io/choreoipaas/cio-event-collector-service:latest
          resources:
            limits:
              cpu: 700m
              memory: 500Mi
            requests:
              cpu: 200m
              memory: 350Mi
          envFrom:
            - configMapRef:
                name: env-cio-event-collector-service
            - secretRef:
                name: secret-cio-event-collector-service
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 10500
            runAsGroup: 10500
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: service-port
              protocol: TCP
            - containerPort: 8086
              name: health-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 20
            periodSeconds: 20
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /readiness
              port: health-port
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /liveness
              port: health-port
          volumeMounts:
            - name: temp
              mountPath: /tmp
            - name: secret-cio-event-collector-service
              mountPath: "/mnt/csi/secret-cio-event-collector-service"
              readOnly: true
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
      volumes:
        - name: temp
          emptyDir: {}
        - name: secret-cio-event-collector-service
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-cio-event-collector-service
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: config
          configMap:
            name: cm-file-cio-event-collector
      restartPolicy: Always
      serviceAccountName: sa-choreo-default
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              choreo.component: cio-event-collector-service
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
        - labelSelector:
            matchLabels:
              choreo.component: cio-event-collector-service
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway

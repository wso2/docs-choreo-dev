apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: multivariate-anomaly-detector-notification-manager
  name: multivariate-anomaly-detector-notification-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: multivariate-anomaly-detector-notification-manager
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: multivariate-anomaly-detector-notification-manager
        antiaffinity: multivariate-anomaly-detector-notification-manager
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: multivariate-anomaly-detector-notification-manager
          image: choreocontrolplane.azurecr.io/choreoipaas/multivariate-anomaly-detector-notification-manager:latest
          env:
            - name: BAL_CONFIG_DATA
              valueFrom:
                secretKeyRef:
                  name: secret-multivariate-anomaly-detector-notification-manager
                  key: BAL_CONFIG_DATA
          envFrom:
            - configMapRef:
                name: cm-multivariate-anomaly-detector-notification-manager-control
            - configMapRef:
                name: env-multivariate-anomaly-detector-notification-manager
          securityContext:
            runAsUser: 10500
            runAsGroup: 10500
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - all
          volumeMounts:
            - name: secret-multivariate-anomaly-detector-notification-manager
              mountPath: "/mnt/csi/secret-multivariate-anomaly-detector-notification-manager"
              readOnly: true
          ports:
            - containerPort: 9090
              name: nm-port
              protocol: TCP
            - containerPort: 9091      # To be used for readiness/liveness probes (internal)
              name: health
              protocol: TCP
            - containerPort: 9092      # To be used for public health check (external)
              name: healthz
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /liveness
          resources:
            limits:
              cpu: 500m
              memory: 768Mi
            requests:
              cpu: 300m
              memory: 512Mi
      volumes:
        - name: secret-multivariate-anomaly-detector-notification-manager
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-multivariate-anomaly-detector-notification-manager
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: antiaffinity
                  operator: In
                  values:
                  - multivariate-anomaly-detector-notification-manager
              topologyKey: kubernetes.io/hostname

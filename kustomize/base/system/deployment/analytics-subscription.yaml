apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_43=Risk accpeted
  labels:
    choreo.component: analytics-subs
  name: analytics-subs
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: analytics-subs
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: analytics-subs
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
      - env:
        - name: CHOREO_DB_HOST
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_HOST
              name: env-choreo-app-db
        - name: CHOREO_DB_NAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_NAME
              name: cm-choreo-app-db
        - name: CHOREO_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-app-db
              key: CHOREO_DB_PASSWORD
        - name: CHOREO_DB_PORT
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_PORT
              name: env-choreo-app-db
        - name: CHOREO_DB_USERNAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_USERNAME
              name: env-choreo-app-db
        - name: CHOREO_DB_DRIVER
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_DRIVER
              name: env-choreo-app-db
        - name: IDP_HOST
          valueFrom:
            configMapKeyRef:
              key: IDP_HOST
              name: env-idp-replica
        - name: IDP_JWKS_ENDPOINT
          valueFrom:
            configMapKeyRef:
              key: IDP_JWKS_ENDPOINT
              name: cm-idp-replica
        - name: IDP_ISSUER
          valueFrom:
            configMapKeyRef:
              key: IDP_ISSUER
              name: env-idp-replica
        - name: IDP_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              key: IDP_CLIENT_ID
              name: env-idp-replica
        - name: ORG_API
          valueFrom:
            configMapKeyRef:
              key: ORG_API
              name: env-frontend
        envFrom:
          - configMapRef:
              name: env-analytics-subsmgt
        image: choreocontrolplane.azurecr.io/choreoipaas/analytics-subscription-mgt:latest
        securityContext:
          runAsUser: 10002
          runAsGroup: 10002
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        name: analytics-subs
        readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
             port: healthz
             path: /subsmgt/healthz
        livenessProbe:
            initialDelaySeconds: 30
            httpGet:
             port: healthz
             path: /subsmgt/healthz
        ports:
        - containerPort: 9090
          name: anl-sub-port
          protocol: TCP
        - containerPort: 9093      # To be used for public health check (external)
          name: healthz
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 768Mi
          requests:
            cpu: 300m
            memory: 512Mi
        volumeMounts:
        - mountPath: /mnt/csi/secret-app-db
          name: secret-app-db
          readOnly: true
      restartPolicy: Always
      volumes:
      - name: secret-app-db
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-app-db
          nodePublishSecretRef:
            name: csi-secret-store-azure
      serviceAccountName: sa-choreo-default

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
      reloader.stakater.com/auto: "true"
      checkov.io/skip1: CKV_K8S_22=Skipping till the issue is fixed
  labels:
    choreo.component: test-assistant
  name: test-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: test-assistant
  template:
    metadata:
      labels:
        choreo.component: test-assistant
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        runAsUser: 500
        runAsGroup: 500
        fsGroup: 500
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - image: choreocontrolplane.azurecr.io/choreoipaas/test-assistant-init:latest
        name: test-assistant-init
        resources:
          limits:
            cpu: 300m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: test-assistant-models
          mountPath: "/home/python-ai/choreo-ai-test-assistant/models"
        - name: test-assistant-data
          mountPath: "/home/python-ai/choreo-ai-test-assistant/data"
        - name: test-assistant-model-metadata
          mountPath: "/home/python-ai/choreo-ai-test-assistant/models.properties"
          subPath: "models.properties"
        - name: secret-test-assistant
          mountPath: "/mnt/csi/secret-test-assistant"
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
      containers:
      - image: choreocontrolplane.azurecr.io/choreoipaas/test-assistant:latest
        name: test-assistant
        readinessProbe:
          initialDelaySeconds: 5
          timeoutSeconds: 15
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          httpGet:
            port: ta-port
            path: /readiness
        livenessProbe:
          initialDelaySeconds: 10
          timeoutSeconds: 15
          periodSeconds: 30
          failureThreshold: 3
          successThreshold: 1
          httpGet:
            port: ta-port
            path: /liveness
        resources:
          limits:
            cpu: 500m
            memory: 2300Mi
          requests:
            cpu: 400m
            memory: 2200Mi
        ports:
        - containerPort: 5000
          name: ta-port
          protocol: TCP
        volumeMounts:
        - name: test-assistant-models
          mountPath: "/home/python-ai/choreo-ai-test-assistant/models/"
        - name: test-assistant-data
          mountPath: "/home/python-ai/choreo-ai-test-assistant/data/"
        - name: test-assistant-config
          mountPath: "/home/python-ai/choreo-ai-test-assistant/config/"
        securityContext:
          allowPrivilegeEscalation: false
      volumes:
      - name: test-assistant-models
        emptyDir: {}
      - name: test-assistant-data
        emptyDir: {}
      - name: test-assistant-model-metadata
        configMap:
          defaultMode: 420
          name: cm-test-assistant
      - name: test-assistant-config
        configMap:
          defaultMode: 420
          name: cm-test-assistant-config
      - name: secret-test-assistant
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-test-assistant
          nodePublishSecretRef:
            name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_25=Temporarily suppressing till fixing
    checkov.io/skip2: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: dp-mizzen
    choreo.dataplane: "true"
  name: dp-mizzen
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: dp-mizzen
  template:
    metadata:
      labels:
        choreo.component: dp-mizzen
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dp-mizzen
          imagePullPolicy: Always
          image: choreocontrolplane.azurecr.io/choreoipaas/dp-mizzen:latest
          resources:
            limits:
              cpu: 350m
              memory: 400Mi
            requests:
              cpu: 300m
              memory: 300Mi
          envFrom:
            - configMapRef:
                name: env-dp-mizzen
            - configMapRef:
                name: cm-dp-mizzen
          env:
            - name: MSSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-dp-mizzen
                  key: MSSQL_PASSWORD
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-dp-mizzen
                  key: JWT_KEY
            - name: SERVICE_BUS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: secret-dp-mizzen
                  key: SERVICE_BUS_CONNECTION_STRING
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-dp-mizzen
                  key: REDIS_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          ports:
            - containerPort: 8080
              name: http-port
              protocol: TCP
            - containerPort: 8081
              name: ws-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
          volumeMounts:
            - name: secret-dp-mizzen
              mountPath: /mnt/csi/secret-dp-mizzen
              readonly: true
      volumes:
        - name: secret-dp-mizzen
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-dp-mizzen
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default

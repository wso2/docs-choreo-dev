apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: perfanalyzer-estimator
  name: perfanalyzer-estimator
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      choreo.component: perfanalyzer-estimator
  template:
    metadata:
      labels:
        choreo.component: perfanalyzer-estimator
        antiaffinity: perfanalyzer-estimator
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: choreocontrolplane.azurecr.io/choreoipaas/perfanalyzer-estimator:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 10500
            runAsGroup: 10500
            capabilities:
              drop:
                - all
          name: perfanalyzer-estimator
          env:
            - name: CHOREO_PERF_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: CHOREO_PERF_DB_PASSWORD
                  name: secret-perfanalyzer
          envFrom:
            - configMapRef:
                name: env-perf-analyzer
            - configMapRef:
                name: cm-perf-analyzer
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: perfan-port
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: perfan-port
              path: /liveness
          ports:
            - containerPort: 5005
              name: perfan-port
              protocol: TCP
          resources:
            limits:
              cpu: 400m
              memory: 1000Mi
            requests:
              cpu: 200m
              memory: 750Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - name: perfanalyzer-config
              mountPath: /home/python-ai/perf-analyzer/config/
            - name: secret-perfanalyzer
              mountPath: "/mnt/csi/secret-perfanalyzer"
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - configMap:
            defaultMode: 420
            name: cm-perfanalyzer
          name: perfanalyzer-config
        - name: secret-perfanalyzer
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-perfanalyzer
            nodePublishSecretRef:
              name: csi-secret-store-azure
        ## gunicorn requires a temporary directory. When readOnlyRootFilesystem is set to true, the program raises a
        ## FileNotFoundError because it can't find a writable temporary directory. Therefore the following emptyDir
        ## volume is created and mounted to /tmp as a solution
        - name: tmp-volume
          emptyDir: { }
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - perfanalyzer-estimator
              topologyKey: kubernetes.io/hostname

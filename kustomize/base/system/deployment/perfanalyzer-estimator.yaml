apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_22=Not possible to do ATM, as there are some files such as logs and configs written
    checkov.io/skip2: CKV_K8S_43=On hold ,not an high priority issue, requires some CI/CD workflow changes
  labels:
    choreo.component: perfanalyzer-estimator
  name: perfanalyzer-estimator
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      choreo.component: perfanalyzer-estimator
  template:
    metadata:
      labels:
        choreo.component: perfanalyzer-estimator
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      automountServiceAccountToken: false
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: choreocontrolplane.azurecr.io/choreoipaas/perfanalyzer-estimator:latest
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 10500
          runAsGroup: 10500
          capabilities:
            drop:
              - all
        name: perfanalyzer-estimator
        env:
          - name: CHOREO_PERF_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: CHOREO_PERF_DB_PASSWORD
                name: secret-perfanalyzer
        envFrom:
          - configMapRef:
              name: env-perf-analyzer
        readinessProbe:
          initialDelaySeconds: 5
          timeoutSeconds: 15
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          httpGet:
            port: perfan-port
            path: /readiness
        livenessProbe:
          initialDelaySeconds: 10
          timeoutSeconds: 15
          periodSeconds: 30
          failureThreshold: 3
          successThreshold: 1
          httpGet:
            port: perfan-port
            path: /liveness
        ports:
        - containerPort: 5005
          name: perfan-port
          protocol: TCP
        resources:
          limits:
            cpu: 1100m
            memory: 1024Mi
          requests:
            cpu: 1000m
            memory: 768Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - name: perfanalyzer-config
          mountPath: /home/python-ai/perf-analyzer/config/
        - name: secret-perfanalyzer
          mountPath: "/mnt/csi/secret-perfanalyzer"
          readOnly: true
      volumes:
      - configMap:
          defaultMode: 420
          name: cm-perfanalyzer
        name: perfanalyzer-config
      - name: secret-perfanalyzer
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-perfanalyzer
          nodePublishSecretRef:
            name: csi-secret-store-azure
      serviceAccountName: sa-choreo-default

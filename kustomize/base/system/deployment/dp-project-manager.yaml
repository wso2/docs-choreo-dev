apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_25=Temporarily suppressing till fixing
    checkov.io/skip2: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: dp-project-manager
    choreo.dataplane: "true"
  name: dp-project-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: dp-project-manager
  template:
    metadata:
      labels:
        choreo.component: dp-project-manager
        antiaffinity: dp-project-manager
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      automountServiceAccountToken: true
      securityContext:
        allowPrivilegeEscalation: false
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dp-project-manager
          imagePullPolicy: Always
          image: choreocontrolplane.azurecr.io/choreoipaas/dp-project-manager:latest
          resources:
            limits:
              cpu: 350m
              memory: 250Mi
            requests:
              cpu: 200m
              memory: 150Mi
          envFrom:
            - configMapRef:
                name: env-dp-project-manager
            - configMapRef:
                name: cm-dp-project-manager
          env:
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-dp-project-manager
                  key: MONGODB_PASSWORD
            - name: APIM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secret-dp-project-manager
                  key: APIM_CLIENT_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          ports:
            - containerPort: 3000
              name: http-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
          volumeMounts:
            - name: secret-dp-project-manager
              mountPath: "/mnt/csi/secret-dp-project-manager"
              readOnly: true
      volumes:
        - name: secret-dp-project-manager
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-dp-project-manager
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - dp-project-manager
              topologyKey: kubernetes.io/hostname

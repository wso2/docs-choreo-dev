apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_40=Temporarily suppressing till fixing
    checkov.io/skip2: CKV_K8S_38=Temporarily suppressing till fixing
    checkov.io/skip3: CKV_K8S_28=Temporarily suppressing till fixing
    checkov.io/skip4: CKV_K8S_37=Temporarily suppressing till fixing
  labels:
    choreo.component: negotiator
  name: negotiator
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: negotiator
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: negotiator
        antiaffinity: negotiator
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
      - env:
        - name: b7a_log_level
          valueFrom:
            configMapKeyRef:
              key: B7A_LOG_LEVEL
              name: cm-loglevel-negotiator
        - name: CHOREO_DB_NAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_NAME
              name: cm-choreo-program-db
        - name: CHOREO_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-program-db
              key: CHOREO_DB_PASSWORD
        - name: CHOREO_DB_MAX_POOL
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_MAX_POOL
              name: cm-choreo-program-db
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              key: REDIS_PORT
              name: cm-negotiator
        - name: REDIS_SSL
          valueFrom:
            configMapKeyRef:
              key: REDIS_SSL
              name: cm-negotiator
        - name: REDIS_DATABASE
          valueFrom:
            configMapKeyRef:
              key: REDIS_DATABASE
              name: cm-negotiator
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-redis
              key: REDIS_PASSWORD
        envFrom:
          - configMapRef:
              name: env-negotiator
          - configMapRef:
              name: env-choreo-program-db
        image: choreocontrolplane.azurecr.io/choreoipaas/choreo-negotiator:latest
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 100
          runAsGroup: 1000
          readOnlyRootFilesystem: true
        name: negotiator
        readinessProbe:
          initialDelaySeconds: 5
          timeoutSeconds: 15
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          httpGet:
            port: health
            path: /health/readiness
        livenessProbe:
          initialDelaySeconds: 30
          timeoutSeconds: 15
          periodSeconds: 30
          failureThreshold: 3
          successThreshold: 1
          httpGet:
            port: health
            path: /health/liveness
        lifecycle:
          preStop:
            exec:
              command:
              - "sleep"
              - "20"
        ports:
        - containerPort: 9090
          name: handshake-port
          protocol: TCP
        - containerPort: 9092
          name: negotiator-port
          protocol: TCP
        - containerPort: 9091      # To be used for readiness/liveness probes (internal)
          name: health
          protocol: TCP
        - containerPort: 9093      # To be used for public health check (external)
          name: healthz
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 300m
            memory: 512Mi
        volumeMounts:
        - mountPath: /mnt/csi/secret-program-db
          name: secret-program-db
          readOnly: true
        - name: secret-redis
          mountPath: "/mnt/csi/secret-redis"
          readOnly: true
      restartPolicy: Always
      volumes:
      - name: secret-program-db
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-program-db
          nodePublishSecretRef:
            name: csi-secret-store-azure
      - name: secret-redis
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-redis
          nodePublishSecretRef:
            name: csi-secret-store-azure
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: antiaffinity
                  operator: In
                  values:
                  - negotiator
              topologyKey: kubernetes.io/hostname

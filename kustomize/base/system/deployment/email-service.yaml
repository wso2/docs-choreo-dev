apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_40=Temporarily suppressing till fixing
    checkov.io/skip2: CKV_K8S_43=Temporarily suppressing till fixing
    checkov.io/skip3: CKV_K8S_38=Temporarily suppressing till fixing
    checkov.io/skip4: CKV_K8S_28=Temporarily suppressing till fixing
    checkov.io/skip5: CKV_K8S_37=Temporarily suppressing till fixing
    checkov.io/skip6: CKV_K8S_31=Temporarily suppressing till fixing
  labels:
    choreo.component: email-service
  name: email-service
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: email-service
  template:
    metadata:
      labels:
        choreo.component: email-service
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        runAsUser: 100
        runAsGroup: 1000
      containers:
        - name: email-service
          imagePullPolicy: Always
          image: choreocontrolplane.azurecr.io/choreoipaas/email-service:latest
          resources:
            limits:
              cpu: 800m
              memory: 1000Mi
            requests:
              cpu: 300m
              memory: 300Mi
          envFrom:
            - configMapRef:
                name: cm-email-service
            - configMapRef:
                name: env-email-service
          env:
            - name: MAIL_SMTP_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-email-service
                  key: MAIL_SMTP_AUTH_PASSWORD
            - name: MAIL_SMTP_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: secret-email-service
                  key: MAIL_SMTP_AUTH_USERNAME
            - name: MAIL_SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: secret-email-service
                  key: MAIL_SMTP_HOST
            - name: MAIL_SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: secret-email-service
                  key: MAIL_SMTP_PORT
            - name: SENDER_MAIL
              valueFrom:
                secretKeyRef:
                  name: secret-email-service
                  key: SENDER_MAIL
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8082
              name: email-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /service/healthz
              port: email-port
              scheme: HTTPS
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /service/healthz
              port: email-port
              scheme: HTTPS
          volumeMounts:
          - name: secret-email-service
            mountPath: "/mnt/csi/secret-email-service"
            readOnly: true
      volumes:
      - name: secret-email-service
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-email-service
          nodePublishSecretRef:
            name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_25=Temporarily suppressing till fixing
    checkov.io/skip2: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: dp-utility-api
    choreo.dataplane: "true"
  name: dp-utility-api
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: dp-utility-api
  template:
    metadata:
      labels:
        choreo.component: dp-utility-api
        antiaffinity: dp-utility-api
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: choreocontrolplane.azurecr.io/choreoipaas/dp-utility-api:latest
          name: dp-utility-api
          ports:
            - containerPort: 5200
              name: http-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            httpGet:
              path: /healthz
              port: http-port
          livenessProbe:
            initialDelaySeconds: 5
            periodSeconds: 30
            httpGet:
              path: /healthz
              port: http-port
          resources:
            limits:
              cpu: 250m
              memory: 300Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
              add: [ "NET_RAW" ]
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - dp-utility-api
              topologyKey: kubernetes.io/hostname

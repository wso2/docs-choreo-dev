apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: dp-utility-api
    choreo.dataplane: true
  name: dp-utility-api
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: dp-utility-api
  template:
    metadata:
      labels:
        choreo.component: dp-utility-api
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: choreocontrolplane.azurecr.io/choreoipaas/dp-utility-api:latest
          name: dp-utility-api
          ports:
            - containerPort: 5200
              name: http-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            httpGet:
              path: /healthz
              port: http-port
          livenessProbe:
            initialDelaySeconds: 5
            periodSeconds: 30
            httpGet:
              path: /healthz
              port: http-port
          resources:
            limits:
              cpu: 250m
              memory: 300Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: sa-choreo-default

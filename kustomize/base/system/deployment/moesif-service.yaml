apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_38=Required by LinkerD
  labels:
    choreo.component: moesif-service
  name: moesif-service
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: moesif-service
  strategy: { }
  template:
    metadata:
      labels:
        choreo.component: moesif-service
        antiaffinity: moesif-service
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: moesif-service
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-moesif-service:latest # align  with info given in azure ci pipeline.
          envFrom:
            - configMapRef:
                name: env-moesif-service
          ports:
            - containerPort: 8080      # To be used for internal service
              name: internal-http
            - containerPort: 8081      # To be used for external service
              name: external-http
            - containerPort: 9091      # To be used for readiness/liveness probes (internal)
              name: health
            - containerPort: 9092      # To be used for public health check (external)
              name: healthz
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /liveness
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 300m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10500
            runAsGroup: 10500
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
            - name: secret-moesif-service
              mountPath: /mnt/csi/secret-moesif-service
              readOnly: true
            - name: tmp
              mountPath: /tmp
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: cm-file-moesif-service
        - name: secret-moesif-service
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-moesif-service
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: tmp
          emptyDir: {}
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - moesif-service
              topologyKey: kubernetes.io/hostname

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: log-controller
  name: log-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: log-controller
  strategy: { }
  template:
    metadata:
      labels:
        choreo.component: log-controller
        antiaffinity: log-controller
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-redis
                  key: REDIS_PASSWORD
          envFrom:
            - configMapRef:
                name: cm-log-controller
            - configMapRef:
                name: env-log-controller
            - secretRef:
                name: secret-log-controller
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-log-controller:latest
          securityContext:
            runAsUser: 10500
            runAsGroup: 10500
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          name: log-controller
          volumeMounts:
            - name: secret-telemetry
              mountPath: "/mnt/csi/secret-telemetry"
              readOnly: true
            - name: secret-redis
              mountPath: "/mnt/csi/secret-redis"
              readOnly: true
          ports:
            - containerPort: 9060
              name: health
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /liveness
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 200Mi
      volumes:
        - name: secret-telemetry
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-telemetry
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-redis
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-redis
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  antiaffinity: log-controller
              topologyKey: kubernetes.io/hostname

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_40=Temporarily suppressing till fixing
    checkov.io/skip2: CKV_K8S_38=Temporarily suppressing till fixing
    checkov.io/skip3: CKV_K8S_28=Temporarily suppressing till fixing
    checkov.io/skip4: CKV_K8S_37=Temporarily suppressing till fixing
  labels:
    choreo.component: organization-management
  name: organization-management
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: organization-management
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: organization-management
        antiaffinity: organization-management
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: organization-management
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-organization-management:latest
          env:
            - name: CHOREO_APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-app-db
                  key: CHOREO_DB_PASSWORD
          envFrom:
            - configMapRef:
                name: env-organization-management
          ports:
            - containerPort: 9090
              name: http
            - containerPort: 9091      # To be used for readiness/liveness probes (internal)
              name: health-internal
            - containerPort: 9092      # To be used for public health check (external)
              name: health-public
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health-internal
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health-internal
              path: /liveness
          resources:
            limits:
              cpu: 500m
              memory: 768Mi
            requests:
              cpu: 300m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 100
            runAsGroup: 1000
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
            - name: secret-organization-management
              mountPath: "/mnt/csi/secret-organization-management"
              readOnly: true
            - name: secret-organization-management
              mountPath: "/home/ballerina/resources/gateway.dev.public.cert"
              subPath: GATEWAY_PUBLIC_CERT
              readOnly: true
            - name: secret-app-db
              mountPath: "/mnt/csi/secret-app-db"
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: cm-organization-management-config
        - name: secret-organization-management
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-organization-management
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-app-db
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-app-db
            nodePublishSecretRef:
              name: csi-secret-store-azure
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: antiaffinity
                      operator: In
                      values:
                        - organization-management
                topologyKey: kubernetes.io/hostname

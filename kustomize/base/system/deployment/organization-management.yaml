apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: organization-management
  name: organization-management
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: organization-management
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: organization-management
        antiaffinity: organization-management
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: organization-management
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-organization-management:latest
          command: ["/home/ballerina/docker-entrypoint.sh"]
          env:
            - name: CHOREO_APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-app-db
                  key: CHOREO_DB_PASSWORD
            - name: CHOREO_SUBSCRIPTION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-subscriptions
                  key: MSSQL_PASSWORD
          envFrom:
            - configMapRef:
                name: env-organization-management
            - secretRef:
                name: secret-organization-management
          ports:
            - containerPort: 9090
              name: http
            - containerPort: 9091      # To be used for readiness/liveness probes (internal)
              name: health-internal
            - containerPort: 9092      # To be used for public health check (external)
              name: health-public
            - containerPort: 8080
              name: grpc
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health-internal
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health-internal
              path: /liveness
          resources:
            limits:
              cpu: 300m
              memory: 550Mi
            requests:
              cpu: 200m
              memory: 450Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10500
            runAsGroup: 10500
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          volumeMounts:
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
            - name: secret-organization-management
              mountPath: "/mnt/csi/secret-organization-management"
              readOnly: true
            - name: secret-app-db
              mountPath: "/mnt/csi/secret-app-db"
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: secret-organization-management
              mountPath: /home/ballerina/security/choreo-organization-management-keystore.pfx
              subPath: BAL_KEYSTORE
              readOnly: true
            - name: keystore
              mountPath: /home/ballerina/keystore
            - name: secret-subscriptions
              mountPath: "/mnt/csi/secret-subscriptions"
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: cm-file-organization-management
        - name: secret-organization-management
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-organization-management
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-app-db
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-app-db
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-subscriptions
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-subscriptions
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: tmp
          emptyDir: {}
        - name: keystore
          emptyDir: {}
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - organization-management
              topologyKey: kubernetes.io/hostname

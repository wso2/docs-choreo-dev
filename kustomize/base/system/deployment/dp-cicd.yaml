apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_43=Risk accepted
    checkov.io/skip2: CKV_K8S_25=Temporarily suppressing till fixing
  labels:
    choreo.component: dp-cicd
    choreo.dataplane: "true"
  name: dp-cicd
spec:
  automountServiceAccountToken: false
  replicas: 0
  selector:
    matchLabels:
      choreo.component: dp-cicd
  template:
    metadata:
      labels:
        choreo.component: dp-cicd
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dp-cicd
          imagePullPolicy: Always
          image: choreocontrolplane.azurecr.io/choreoipaas/dp-cicd:latest
          resources:
            limits:
              cpu: 550m
              memory: 550Mi
            requests:
              cpu: 500m
              memory: 500Mi
          envFrom:
            - configMapRef:
                name: env-dp-cicd
          env:  
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DB_PASSWORD
                  name: secret-dp-cicd
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
                - "NET_RAW"
          ports:
            - containerPort: 8080
              name: http-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
          volumeMounts:
            - name: cicd-config
              mountPath: cicd-config.yaml
              subPath: cicd-config.yaml
            - name: secret-dp-cicd
              mountPath: "/mnt/csi/secret-dp-cicd"
              readOnly: true
      volumes:
      - name: cicd-config
        configMap:
          name: cm-dp-cicd
      - name: secret-dp-cicd
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-dp-cicd
          nodePublishSecretRef:
            name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_28=Temporarily suppressing till fixing
    checkov.io/skip2: CKV_K8S_37=Temporarily suppressing till fixing
    checkov.io/skip3: CKV_K8S_38=Temporarily suppressing till fixing
    checkov.io/skip4: CKV_K8S_40=Temporarily suppressing till fixing
    checkov.io/skip5: CKV_K8S_43=Temporarily suppressing till fixing
  labels:
    choreo.component: dp-cicd
    choreo.dataplane: true
  name: dp-cicd
spec:
  replicas: 0
  selector:
    matchLabels:
      choreo.component: dp-cicd
  template:
    metadata:
      labels:
        choreo.component: dp-cicd
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dp-cicd
          imagePullPolicy: Always
          image: choreocontrolplane.azurecr.io/choreoipaas/dp-cicd:latest
          resources:
            limits:
              cpu: 550m
              memory: 550Mi
            requests:
              cpu: 500m
              memory: 500Mi
          env:  
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  key: DB_HOST
                  name: secret-dp-cicd
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  key: DB_PORT
                  name: secret-dp-cicd
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  key: DB_USER
                  name: secret-dp-cicd
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DB_PASSWORD
                  name: secret-dp-cicd
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  key: DB_NAME
                  name: secret-dp-cicd
            - name: DB_TYPE
              valueFrom:
                secretKeyRef:
                  key: DB_TYPE
                  name: secret-dp-cicd
            - name: CICD_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  key: CICD_CLUSTER_ID
                  name: secret-dp-cicd
            - name: CICD_NAMESPACE
              valueFrom:
                secretKeyRef:
                  key: CICD_NAMESPACE
                  name: secret-dp-cicd
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
              name: http-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
          volumeMounts:
            - name: cicd-config
              mountPath: cicd-config.yaml
              subPath: cicd-config.yaml
            - name: secret-dp-cicd
              mountPath: "/mnt/csi/secret-dp-cicd"
              readOnly: true
      volumes:
      - name: cicd-config
        configMap:
          name: cm-dp-cicd
      - name: secret-dp-cicd
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-dp-cicd
          nodePublishSecretRef:
            name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default

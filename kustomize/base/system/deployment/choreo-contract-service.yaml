apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: contract-service
  name: contract-service
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: contract-service
  template:
    metadata:
      labels:
        choreo.component: contract-service
        antiaffinity: contract-service
    spec:
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: contract-service
          imagePullPolicy: Always
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-contract-service:latest
          resources:
            limits:
              cpu: 100m
              memory: 150Mi
            requests:
              cpu: 50m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          ports:
            - containerPort: 8080
              name: http-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /api/v1/healthz
              port: http-port
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /api/v1/healthz
              port: http-port
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secret-contract-service
                  key: GITHUB_TOKEN
          volumeMounts:
            - name: secret-contract-service
              mountPath: "/mnt/csi/secret-contract-service"
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: secret-contract-service
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-contract-service
            nodePublishSecretRef:
              name: csi-secret-store-azure
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - contract-service
              topologyKey: kubernetes.io/hostname

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_25=Temporarily suppressing till fixing
    checkov.io/skip2: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: pdp-manager
  name: pdp-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: pdp-manager
  template:
    metadata:
      labels:
        choreo.component: pdp-manager
        antiaffinity: pdp-manager
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pdp-manager
          imagePullPolicy: Always
          image: choreocontrolplane.azurecr.io/choreoipaas/pdp-manager:latest
          resources:
            limits:
              cpu: 200m
              memory: 250Mi
            requests:
              cpu: 100m
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: env-choreo-pdp-manager
            - configMapRef:
                name: cm-pdp-manager
            - secretRef:
                name: secret-pdp-manager
            - secretRef:
                name: secret-pdp-manager-temp
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          ports:
            - containerPort: 8080
              name: http-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
          volumeMounts:
            - name: secret-pdp-manager
              mountPath: /mnt/csi/secret-pdp-manager
              readOnly: true
            - name: secret-pdp-manager-temp
              mountPath: /mnt/csi/secret-pdp-manager-temp
              readOnly: true
      volumes:
        - name: secret-pdp-manager
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-pdp-manager
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-pdp-manager-temp
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-pdp-manager-temp
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - pdp-manager
              topologyKey: kubernetes.io/hostname

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: telemetry
  name: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: telemetry
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: telemetry
        antiaffinity: telemetry
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - env:
        - name: b7a_log_level
          valueFrom:
            configMapKeyRef:
              key: B7A_LOG_LEVEL
              name: cm-loglevel-telemetry
        - name: NEGOTIATOR_GRPC_ADDRESS
          valueFrom:
            configMapKeyRef:
              key: NEGOTIATOR_GRPC_ADDRESS
              name: cm-telemetry
        - name: NEGOTIATOR_HEALTHZ_ADDRESS
          valueFrom:
            configMapKeyRef:
              key: NEGOTIATOR_HEALTHZ_ADDRESS
              name: cm-telemetry
        - name: PROJECT_SECRET_CACHE_CAPACITY
          valueFrom:
            configMapKeyRef:
              key: PROJECT_SECRET_CACHE_CAPACITY
              name: cm-telemetry
        - name: PROJECT_SECRET_CACHE_EVICTION_FACTOR
          valueFrom:
            configMapKeyRef:
              key: PROJECT_SECRET_CACHE_EVICTION_FACTOR
              name: cm-telemetry
        - name: PROJECT_SECRET_CACHE_MAX_AGE
          valueFrom:
            configMapKeyRef:
              key: PROJECT_SECRET_CACHE_MAX_AGE
              name: cm-telemetry
        - name: PROJECT_SECRET_CACHE_CLEANUP_INTERVAL
          valueFrom:
            configMapKeyRef:
              key: PROJECT_SECRET_CACHE_CLEANUP_INTERVAL
              name: cm-telemetry
        - name: EVENTHUB_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: secret-telemetry
              key: EVENTHUB_CONNECTION_STRING
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              key: REDIS_PORT
              name: cm-negotiator
        - name: REDIS_SSL
          valueFrom:
            configMapKeyRef:
              key: REDIS_SSL
              name: cm-negotiator
        - name: REDIS_DATABASE
          valueFrom:
            configMapKeyRef:
              key: REDIS_DATABASE
              name: cm-negotiator
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-redis
              key: REDIS_PASSWORD
        envFrom:
          - configMapRef:
              name: env-telemetry
        image: choreocontrolplane.azurecr.io/choreoipaas/choreo-telemetry:latest
        securityContext:
          runAsUser: 10500
          runAsGroup: 10500
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - all
        name: telemetry
        volumeMounts:
        - name: secret-telemetry
          mountPath: "/mnt/csi/secret-telemetry"
          readOnly: true
        - name: secret-redis
          mountPath: "/mnt/csi/secret-redis"
          readOnly: true
        ports:
        - containerPort: 9090
          name: telemetry-port
          protocol: TCP
        - containerPort: 9091      # To be used for readiness/liveness probes (internal)
          name: health
          protocol: TCP
        - containerPort: 9092      # To be used for public health check (external)
          name: healthz
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          timeoutSeconds: 15
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          httpGet:
            port: health
            path: /readiness
        livenessProbe:
          initialDelaySeconds: 10
          timeoutSeconds: 15
          periodSeconds: 30
          failureThreshold: 3
          successThreshold: 1
          httpGet:
            port: health
            path: /liveness
        resources:
          limits:
            cpu: 500m
            memory: 768Mi
          requests:
            cpu: 300m
            memory: 512Mi
      volumes:
      - name: secret-telemetry
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-telemetry
          nodePublishSecretRef:
            name: csi-secret-store-azure
      - name: secret-redis
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-redis
          nodePublishSecretRef:
            name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: antiaffinity
                  operator: In
                  values:
                  - telemetry
              topologyKey: kubernetes.io/hostname

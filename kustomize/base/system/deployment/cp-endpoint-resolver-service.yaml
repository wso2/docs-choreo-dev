apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_25=Temporarily suppressing till fixing
    checkov.io/skip2: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: endpoint-resolver
  name: endpoint-resolver
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: endpoint-resolver
  template:
    metadata:
      labels:
        choreo.component: endpoint-resolver
        antiaffinity: endpoint-resolver
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: endpoint-resolver
          imagePullPolicy: Always
          image: choreocontrolplane.azurecr.io/choreoipaas/endpoint-resolver:latest
          resources:
            limits:
              cpu: 150m
              memory: 150Mi
            requests:
              cpu: 100m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          ports:
            - containerPort: 9092
              name: healthz
              protocol: TCP
            - containerPort: 9090
              name: http-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /health
              port: healthz
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /health
              port: healthz
          env:
            - name: APIM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secret-endpoint-resolver
                  key: APIM_CLIENT_SECRET
          volumeMounts:
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
            - name: secret-endpoint-resolver
              mountPath: /mnt/csi/secret-endpoint-resolver
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: cm-file-cp-endpoint-resolver
        - name: secret-endpoint-resolver
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-endpoint-resolver
            nodePublishSecretRef:
              name: csi-secret-store-azure
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - endpoint-resolver
              topologyKey: kubernetes.io/hostname

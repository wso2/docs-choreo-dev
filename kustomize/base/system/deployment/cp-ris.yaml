apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=Required by LinkerD
  labels:
    choreo.component: cp-ris
  name: cp-ris
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: cp-ris
  strategy: { }
  template:
    metadata:
      labels:
        choreo.component: cp-ris
        antiaffinity: cp-ris
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cp-ris
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-cp-ris:latest
          env:
            - name: CP_RIS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-cp-ris
                  key: CP_RIS_DB_PASSWORD
          ports:
            - containerPort: 9090
              name: service-port
            - containerPort: 9091
              name: health-port
          readinessProbe:
            initialDelaySeconds: 60
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health-port
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health-port
              path: /liveness
          resources:
            limits:
              cpu: 300m
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 500Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10500
            runAsGroup: 10500
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
            - name: secret-cp-ris
              mountPath: "/mnt/csi/secret-cp-ris"
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: cm-file-cp-ris
        - name: secret-cp-ris
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-cp-ris
            nodePublishSecretRef:
              name: csi-secret-store-azure
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - cp-ris
              topologyKey: kubernetes.io/hostname

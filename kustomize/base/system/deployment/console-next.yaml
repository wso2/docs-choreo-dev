apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip2: CKV_K8S_38=Required by LinkerD
  labels:
    choreo.component: console-next
  name: console-next
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: console-next
  template:
    metadata:
      labels:
        choreo.component: console-next
        antiaffinity: console-next
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: choreocontrolplane.azurecr.io/choreoipaas/choreo-console-next:latest
          name: console-next
          ports:
            - containerPort: 8080
              name: con-v2-port
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /index.html
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /index.html
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          env:
            - name: REACT_APP_BALLERINA_LOW_CODE_RESOURCES_VERSION
              valueFrom:
                configMapKeyRef:
                  name: common-env-variables
                  key: BALLERINA_LOW_CODE_RESOURCES_VERSION
          envFrom:
            - configMapRef:
                name: env-console-next
            - configMapRef:
                name: cm-console-next
          volumeMounts:
            - name: nginx-vol
              mountPath: /tmp
            - name: app-config
              mountPath: /app/choreo.config.js
      serviceAccountName: sa-choreo-default
      volumes:
        - name: nginx-vol
          emptyDir: { }
        - name: app-config
          configMap:
            name: console-config
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - console-next
              topologyKey: kubernetes.io/hostname

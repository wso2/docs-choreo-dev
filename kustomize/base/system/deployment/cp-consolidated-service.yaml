apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=Required by LinkerD
    checkov.io/skip2: CKV_K8S_9=Skipping Readiness Probe check
  labels:
    choreo.component: cp-consolidated-service
  name: cp-consolidated-service
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: cp-consolidated-service
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: cp-consolidated-service
        antiaffinity: cp-consolidated-service
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cp-consolidated-service
          image: thushi1214/consolidateapps:latest
          envFrom:
            - secretRef:
                name: secret-choreo-apim-proxy-deployer
            - configMapRef:
                name: env-proxy-deployer
          env:
            - name: CP_RRS_ASB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: secret-cp-rrs
                  key: CP_RRS_ASB_CONNECTION_STRING
          ports:
            - containerPort: 9095
              name: http-port
          resources:
            limits:
              cpu: 300m
              memory: 1536Mi
            requests:
              cpu: 100m
              memory: 1024Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10500
            runAsGroup: 10500
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
                - NET_RAW
          volumeMounts:
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
            - name: secret-cp-rrs
              mountPath: "/mnt/csi/secret-cp-rrs"
              readOnly: true
            - name: secret-choreo-apim-proxy-deployer
              mountPath: "/mnt/csi/secret-choreo-apim-proxy-deployer"
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: cm-file-cp-consolidated-service
        - name: secret-cp-rrs
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-cp-rrs
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-choreo-apim-proxy-deployer
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-choreo-apim-proxy-deployer
      serviceAccountName: sa-choreo-default
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              choreo.component: cp-consolidated-service
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
        - labelSelector:
            matchLabels:
              choreo.component: cp-consolidated-service
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway

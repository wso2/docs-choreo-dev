apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=Required by LinkerD
  labels:
    choreo.component: cp-graphql
  name: cp-graphql
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: cp-graphql
  strategy: { }
  template:
    metadata:
      labels:
        choreo.component: cp-graphql
        antiaffinity: cp-graphql
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cp-graphql
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-cp-graphql:latest
          env:
            - name: KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-cp-graphql
                  key: KEYSTORE_PASSWORD
          ports:
            - containerPort: 9090
              name: gql-port
            - containerPort: 9091      # To be used for readiness/liveness probes (internal)
              name: health
            - containerPort: 9092      # To be used for public health check (external)
              name: healthz
            - containerPort: 9095      # This is a temporary http gateway until the CORS issues fixed. https://github.com/ballerina-platform/ballerina-standard-library/issues/1475
              name: http-port
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /liveness
          resources:
            limits:
              cpu: 750m
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10500
            runAsGroup: 10500
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
            - name: secret-cp-graphql
              mountPath: "/mnt/csi/secret-cp-graphql"
              readOnly: true
            - name: secret-idp
              mountPath: "/mnt/csi/secret-idp"
              readOnly: true
            - name: secret-cp-graphql
              mountPath: /home/ballerina/security/choreo-cp-graphql-keystore.pfx
              subPath: BAL_KEYSTORE
              readOnly: true
            - name: keystore
              mountPath: /home/ballerina/keystore
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: cm-file-cp-graphql
        - name: secret-cp-graphql
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-cp-graphql
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-idp
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-idp
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: keystore
          emptyDir: {}
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - cp-graphql
              topologyKey: kubernetes.io/hostname

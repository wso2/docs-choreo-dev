apiVersion: apps/v1
kind: Deployment
metadata:
  name: choreo-aws-marketplace-client
  labels:
    choreo.component: choreo-aws-marketplace-client
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: choreo-aws-marketplace-client
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        choreo.component: choreo-aws-marketplace-client
        antiaffinity: choreo-aws-marketplace-client
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  antiaffinity: choreo-aws-marketplace-client
              topologyKey: kubernetes.io/hostname
      containers:
        - name: choreo-aws-marketplace-client
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-aws-marketplace-client:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: env-choreo-aws-marketplace-client
            - secretRef:
                name: choreo-aws-marketplace-client-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: choreo-aws-marketplace-client-secret-vol
              mountPath: "/mnt/csi/choreo-aws-marketplace-client-secret"
              readOnly: true
      volumes:
        - name: choreo-aws-marketplace-client-secret-vol
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: choreo-aws-marketplace-client-secrets
            nodePublishSecretRef:
              name: csi-secret-store-azure

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=Required by LinkerD
  labels:
    choreo.component: api-key-service
  name: api-key-service
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: api-key-service
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: api-key-service
        antiaffinity: api-key-service
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-key-service
          image: choreocontrolplane.azurecr.io/choreoipaas/api-key-service:latest
          env:
            - name: CHOREO_API_KEY_SVC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-api-key-service
                  key: CHOREO_API_KEY_SVC_DB_PASSWORD
          ports:
            - containerPort: 8080
              name: service-port
          readinessProbe:
            initialDelaySeconds: 60
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: service-port
              path: /health
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: service-port
              path: /health
          resources:
            limits:
              cpu: 300m
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 500Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10500
            runAsGroup: 10500
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: env-choreo-api-key-service
          volumeMounts:
            - name: secret-api-key-service
              mountPath: "/mnt/csi/secret-api-key-svc"
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: secret-api-key-service
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-api-key-service
            nodePublishSecretRef:
              name: csi-secret-store-azure
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  antiaffinity: api-key-service
              topologyKey: kubernetes.io/hostname

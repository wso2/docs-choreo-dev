apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_22=Not possible to do ATM, as there are some files such as logs and configs written
    checkov.io/skip2: CKV_K8S_43=Risk accpeted
    checkov.io/skip4: CKV_K8S_25=Temporarily suppressing till fixing
    checkov.io/skip5: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: datamapper
  name: datamapper
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: datamapper
  template:
    metadata:
      labels:
        choreo.component: datamapper
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        fsGroup: 500
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - env:
        - name: ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: secret-datamapper
              key: ACCESS_KEY
        image: choreocontrolplane.azurecr.io/choreoipaas/datamapper-init:latest
        name: datamapper-init
        resources:
          limits:
            cpu: 300m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: datamapper-models
          mountPath: "/home/python-ai/choreo-ai-data-mapper/models"
        - name: datamapper-models-metadata
          mountPath: "/home/python-ai/choreo-ai-data-mapper/models.properties"
          subPath: "models.properties"
        - name: secret-datamapper
          mountPath: "/mnt/csi/secret-datamapper"
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 10500
          runAsGroup: 10500
          capabilities:
            drop:
              - all
            add: [ "NET_RAW" ]
      containers:
      - image: choreocontrolplane.azurecr.io/choreoipaas/datamapper:latest
        name: datamapper
        readinessProbe:
          initialDelaySeconds: 5
          timeoutSeconds: 15
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          httpGet:
            port: dm-port
            path: /health
        livenessProbe:
          initialDelaySeconds: 10
          timeoutSeconds: 15
          periodSeconds: 30
          failureThreshold: 3
          successThreshold: 1
          httpGet:
            port: dm-port
            path: /health
        ports:
        - containerPort: 5000
          name: dm-port
          protocol: TCP
        resources:
          limits:
            cpu: 1100m
            memory: 2048Mi
          requests:
            cpu: 1000m
            memory: 1536Mi
        volumeMounts:
        - name: datamapper-models
          mountPath: "/home/python-ai/choreo-ai-data-mapper/models/"
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 10500
          runAsGroup: 10500
          capabilities:
            drop:
              - all
            add: [ "NET_RAW" ]
      volumes:
      - name: datamapper-models
        emptyDir: {}
      - name: datamapper-models-metadata
        configMap:
          defaultMode: 420
          name: cm-datamapper
      - name: secret-datamapper
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-datamapper
          nodePublishSecretRef:
            name: csi-secret-store-azure

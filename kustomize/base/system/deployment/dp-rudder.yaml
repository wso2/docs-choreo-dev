apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_43=Risk accepted
    checkov.io/skip2: CKV_K8S_25=Temporarily suppressing till fixing
  labels:
    choreo.component: dp-rudder
    choreo.dataplane: "true"
  name: dp-rudder
spec:
  replicas: 0
  selector:
    matchLabels:
      choreo.component: dp-rudder
  template:
    metadata:
      labels:
        choreo.component: dp-rudder
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      automountServiceAccountToken: false
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dp-rudder
          imagePullPolicy: Always
          image: choreocontrolplane.azurecr.io/choreoipaas/dp-rudder:latest
          resources:
            limits:
              cpu: 350m
              memory: 400Mi
            requests:
              cpu: 300m
              memory: 300Mi
          envFrom:
            - configMapRef:
                name: env-dp-rudder
          env:
          - name: MSSQL_PASSWORD
            valueFrom:
              secretKeyRef: 
                name: secret-dp-rudder
                key: MSSQL_PASSWORD
          - name: MIZZEN_SERVICE_TOKEN
            valueFrom:
              secretKeyRef: 
                name: secret-dp-rudder
                key: MIZZEN_SERVICE_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          ports:
            - containerPort: 3000
              name: http-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
          volumeMounts:
          - name: secret-dp-rudder
            mountPath: /mnt/csi/secret-dp-rudder
            readonly: true
      volumes:
      - name: secret-dp-rudder
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-dp-rudder
          nodePublishSecretRef:
            name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: dp-rudder
    choreo.dataplane: true
  name: dp-rudder
spec:
  replicas: 0
  selector:
    matchLabels:
      choreo.component: dp-rudder
  template:
    metadata:
      labels:
        choreo.component: dp-rudder
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dp-rudder
          imagePullPolicy: Always
          image: choreocontrolplane.azurecr.io/choreoipaas/dp-rudder:latest
          resources:
            limits:
              cpu: 350m
              memory: 400Mi
            requests:
              cpu: 300m
              memory: 300Mi
          env:
          - name: DATABASE_MSSQL_HOST
            valueFrom:
              secretKeyRef: secret-dp-rudder
              key: DATABASE_MSSQL_HOST
          - name: DATABASE_MSSQL_USER
            valueFrom:
              secretKeyRef: secret-dp-rudder
              key: DATABASE_MSSQL_USER
          - name: DATABASE_MSSQL_PASSWORD
            valueFrom:
              secretKeyRef: secret-dp-rudder
              key: DATABASE_MSSQL_PASSWORD
          - name: MIZZEN_SERVICE_TOKEN
            valueFrom:
              secretKeyRef: secret-dp-rudder
              key: MIZZEN_SERVICE_TOKEN
          - name: AUTH_TOKEN
            valueFrom:
              secretKeyRef: secret-dp-rudder
              key: AUTH_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 3000
              name: http-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
      volumeMounts:
      - mountPath: /config/config.json
        name: config
        subPath: config.json
      - name: secret-dp-rudder
        mountPath: /mnt/csi/secret-dp-rudder
        readonly: true
      volumes:
      - name: config
        configMap: 
          name: cm-dp-rudder
      - name: secret-dp-rudder
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-dp-rudder
          nodePublishSecretRef:
            name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default
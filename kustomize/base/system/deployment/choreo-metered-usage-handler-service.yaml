apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip2: CKV_K8S_38=Temporarily suppressing till fixing
    checkov.io/skip3: CKV_K8S_28=Temporarily suppressing till fixing
    checkov.io/skip4: CKV_K8S_37=Temporarily suppressing till fixing
  labels:
    choreo.component: metered-usage-handler-service
  name: metered-usage-handler-service
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: metered-usage-handler-service
  strategy: { }
  template:
    metadata:
      labels:
        choreo.component: metered-usage-handler-service
        antiaffinity: metered-usage-handler-service
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: metered-usage-handler-service
          image: choreocontrolplane.azurecr.io/choreoipaas/metered-usage-handler-service:latest
          envFrom:
            - configMapRef:
                name: env-choreo-metered-usage-handler
            - secretRef:
                name: secret-choreo-metered-usage-handler-service
          ports:
            - containerPort: 9090
              name: grpc-port
            - containerPort: 9091      # To be used for readiness/liveness probes (internal)
              name: health
            - containerPort: 9092      # To be used for public health check (external)
              name: healthz
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /liveness
          resources:
            limits:
              cpu: 500m
              memory: 768Mi
            requests:
              cpu: 300m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10500
            runAsGroup: 10500
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          volumeMounts:
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
            - name: secret-choreo-metered-usage-handler-service
              mountPath: "/mnt/csi/secret-choreo-metered-usage-handler-service"
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: usage-service-ingress-secret
              mountPath: /mnt/csi/usage-service-ingress-secret
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: cm-file-choreo-metered-usage-handler-service
        - name: secret-choreo-metered-usage-handler-service
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-choreo-metered-usage-handler-service
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: usage-service-ingress-secret
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ingress-tls-usage-handler-service
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: tmp
          emptyDir: {}
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - subscriptions
              topologyKey: kubernetes.io/hostname

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_40=Temporarily suppressing till fixing
    checkov.io/skip2: CKV_K8S_38=Temporarily suppressing till fixing
    checkov.io/skip3: CKV_K8S_28=Temporarily suppressing till fixing
    checkov.io/skip4: CKV_K8S_37=Temporarily suppressing till fixing
  labels:
    choreo.component: shared-image-viewer
  name: shared-image-viewer
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: shared-image-viewer
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: shared-image-viewer
        antiaffinity: shared-image-viewer
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shared-image-viewer
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-shared-image-viewer:latest
          env:
          # - name: IMAGE_SHARE_SERVICE_SECRET
          #   valueFrom:
          #     secretKeyRef:
          #       name: secret-shared-image-viewer
          #       key: IMAGE_SHARE_SERVICE_SECRET
          envFrom:
            - configMapRef:
                name: env-shared-image-viewer
          ports:
            - containerPort: 3001
              name: http-port
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: http-port
              path: /api/healthz
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: http-port
              path: /api/healthz
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 300m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 100
            runAsGroup: 1000
            readOnlyRootFilesystem: true
          # volumeMounts:
          #   - name: secret-shared-image-viewer
          #     mountPath: "/mnt/csi/secret-shared-image-viewer"
          #     readOnly: true
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: cm-shared-image-viewer-config
        # - name: secret-shared-image-viewer
        #   csi:
        #     driver: secrets-store.csi.k8s.io
        #     readOnly: true
        #     volumeAttributes:
        #       secretProviderClass: secret-shared-image-viewer
        #     nodePublishSecretRef:
        #       name: csi-secret-store-azure
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: antiaffinity
                  operator: In
                  values:
                  - shared-image-viewer
              topologyKey: kubernetes.io/hostname
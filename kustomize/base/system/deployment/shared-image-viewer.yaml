apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_38=Required by LinkerD
  labels:
    choreo.component: shared-image-viewer
  name: shared-image-viewer
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: shared-image-viewer
  strategy: { }
  template:
    metadata:
      labels:
        choreo.component: shared-image-viewer
        antiaffinity: shared-image-viewer
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shared-image-viewer
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-shared-image-viewer:latest
          envFrom:
            - configMapRef:
                name: env-shared-image-viewer
          ports:
            - containerPort: 3001
              name: http-port
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: http-port
              path: /api/healthz
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: http-port
              path: /api/healthz
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 300m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10500
            runAsGroup: 10500
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      restartPolicy: Always
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - shared-image-viewer
              topologyKey: kubernetes.io/hostname

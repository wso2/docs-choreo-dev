apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: sys-obsapi
  name: sys-obsapi
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: sys-obsapi
  strategy: { }
  template:
    metadata:
      labels:
        choreo.component: sys-obsapi
        antiaffinity: sys-obsapi
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - env:
            - name: AZURE_LA_TENANT_ID
              valueFrom:
                configMapKeyRef:
                  key: AZURE_ACTIVEDIRECTORY_TENANT_ID
                  name: cm-sys-obsapi
            - name: AZURE_LA_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  key: AZURE_ACTIVEDIRECTORY_CLIENT_ID
                  name: env-sys-obsapi
            - name: AZURE_LA_WORKSPACE_ID
              valueFrom:
                configMapKeyRef:
                  key: LOG_WORKSPACE_ID
                  name: env-loganalytics-replica
            - name: AZURE_LA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secret-sys-obsapi
                  key: AZURE_ACTIVEDIRECTORY_CLIENT_SECRET
          envFrom:
            - configMapRef:
                name: cm-sys-obsapi
            - configMapRef:
                name: env-sys-obsapi
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-sys-obsapi:latest
          securityContext:
            runAsUser: 10500
            runAsGroup: 10500
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          name: sys-obsapi
          volumeMounts:
            - name: secret-sys-obsapi
              mountPath: "/mnt/csi/secret-sys-obsapi"
              readOnly: true
          ports:
            - containerPort: 9098
              name: sys-obsapi-port
              protocol: TCP
            - containerPort: 9096      # To be used for readiness/liveness probes (internal)
              name: health
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 60
            periodSeconds: 60
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /liveness
          resources:
            limits:
              cpu: 500m
              memory: 768Mi
            requests:
              cpu: 300m
              memory: 512Mi
      volumes:
        - name: secret-sys-obsapi
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-sys-obsapi
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: antiaffinity
                  operator: In
                  values:
                  - sys-obsapi
              topologyKey: kubernetes.io/hostname

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip1: CKV_K8S_22=Skipping till the issue is fixed
    checkov.io/skip2: CKV_K8S_38=Temporarily suppressing till fixing
    checkov.io/skip3: CKV_K8S_28=Temporarily suppressing till fixing
    checkov.io/skip4: CKV_K8S_37=Temporarily suppressing till fixing
    checkov.io/skip5: CKV_K8S_23=Temporarily suppressing till fixing
    checkov.io/skip6: CKV_K8S_40=Temporarily suppressing till fixing
  labels:
    choreo.component: language-server
  name: language-server
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: language-server
  template:
    metadata:
      labels:
        choreo.component: language-server
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: choreocontrolplane.azurecr.io/choreoipaas/lang-server:latest
        name: language-server
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-redis
              key: REDIS_PASSWORD
        - name: AZURE_INSIGHTS_KEY
          valueFrom:
            secretKeyRef:
              name: secret-azure-insights
              key: AZURE_INSIGHTS_KEY
        envFrom:
          - configMapRef:
              name: env-language-server
        ports:
        - containerPort: 9090
          name: http-port
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          httpGet:
            path: /actuator/health/readiness
            port: 8082
          timeoutSeconds: 2
        livenessProbe:
          failureThreshold: 6
          initialDelaySeconds: 30
          periodSeconds: 10
          httpGet:
            path: /actuator/health/liveness
            port: 8082
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /apps
          name: pvc-userappstorage
        - mountPath: /lang-server/application.properties
          name: config
          subPath: application.properties
        - name: secret-redis
          mountPath: "/mnt/csi/secret-redis"
          readOnly: true
        - name: secret-azure-storage-account
          mountPath: "/mnt/csi/secret-azure-storage-account"
          readOnly: true
        - name: secret-azure-insights
          mountPath: /mnt/csi/secret-azure-insights
          readOnly: true
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: "2"
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
          runAsGroup: 0
      volumes:
      - name: pvc-userappstorage
        persistentVolumeClaim:
          claimName: pvc-userappstorage
      - name: config
        configMap:
          name: cm-language-server
      - name: secret-redis
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-redis
          nodePublishSecretRef:
            name: csi-secret-store-azure
      - name: secret-azure-storage-account
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-azure-storage-account
          nodePublishSecretRef:
            name: csi-secret-store-azure
      - name: secret-azure-insights
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-azure-insights
          nodePublishSecretRef:
            name: csi-secret-store-azure
      serviceAccountName: sa-choreo-default

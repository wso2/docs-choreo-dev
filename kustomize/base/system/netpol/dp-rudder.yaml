apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-dp-rudder
spec:
  podSelector:
    matchLabels:
      choreo.component: dp-rudder
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: choreo-ai
          podSelector:
            matchLabels:
              choreo.component: cp-daily-cron

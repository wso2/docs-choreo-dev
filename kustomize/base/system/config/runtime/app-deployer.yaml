server:
  port: 8080
db:
  username: ${DB_USERNAME}
  password: ${CHOREO_DB_PASSWORD}
  protocol: tcp
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: choreo_app_db
  driver: ${DB_DRIVER}
  loc: UTC
  allowNativePasswords: true
  checkConnLiveness: true
  tlsConfig: true
  parseTime: true
  additionalParams:
    autocommit: 'true'
    time_zone: "'+00:00'"
redis:
  host: ${REDIS_HOST}
  port: 6380
  disableTls: false
  password: ${REDIS_PASSWORD}
deployer:
  github:
    user: ${DEPLOYER_GITHUB_USER}
    org: ${DEPLOYER_GITHUB_ORG}
    token: ${GITHUB_TOKEN}
    email: ${DEPLOYER_GITHUB_EMAIL}
  docker:
    registry: ${DEPLOYER_DOCKER_REGISTRY}
    registryUser: ${DEPLOYER_DOCKER_REGISTRY_USER}
    registryPassword: ${DOCKER_REGISTRY_PASSWORD}
  k8s:
    apiServerUrl: ${DEPLOYER_K8S_API_SERVER_URL}
    apiServerToken: ${K8S_API_TOKEN} # todo
    apiServerCaCert: ${DEPLOYER_K8S_API_SERVER_CA_CERT}
  userapps:
    namespace: ${DEPLOYER_USERAPPS_NAMESPACE}
    svcIngressClass: ${DEPLOYER_USERAPPS_SVC_INGRESS_CLASS}
    svcTlsSecret: ${DEPLOYER_USERAPPS_SVC_TLS_SECRET}
    ingressHostSuffix: ${DEPLOYER_USERAPPS_INGRESS_HOST_SUFFIX}
    periscopeHost: ${DEPLOYER_USERAPPS_PERISCOPE_HOST}
    cleanInterval: 2h    # DEPRECATED. See deployer.userapps.autoUndeploy
    expiryDuration: 12h  # DEPRECATED. See deployer.userapps.autoUndeploy
    taintKeyDeployment: dataplane
    taintKeyJob: dataplane
    executionNodeDeployment: dataplane
    executionNodeJob: dataplane
    autoUndeploy:
      taskInterval: 2h
      serviceExpiry: 0
      jobExpiry: 30m   # Temporary fix to the Issue https://github.com/wso2-enterprise/choreo/issues/7354
      cronJobExpiry: 0
      serviceMaxInactive: 24h
      cleanDanglingApplications: true
    apim:
      clientKey: ${DEPLOYER_USERAPPS_APIM_CLIENT_KEY}
      clientSecret: ${APIM_CLIENT_SECRET}
      idpUrl: ${DEPLOYER_USERAPPS_APIM_IDP_URL}
      serviceUrl: ${DEPLOYER_USERAPPS_APIM_SERVICE_URL}
      gatewaySuffix: ${DEPLOYER_USERAPPS_APIM_GATEWAY_SUFFIX}
  clients:
    app-service: app-service:8080
    workspace-manager: workspace-manager:8080
    negotiator-service: ${DEPLOYER_CLIENTS_NEGOTIATOR_SERVICE}
    observability-service: obsapi:9096
  enableIntegrationApiPublish: true
logger:
  level: ${LOGGER_LEVEL}    # todo: change this to info after the new components get stable in prod.
  encoding: console
  development: ${LOGGER_DEVELOPMENT}
  disableStacktrace: ${LOGGER_DISABLE_STACKTRACE}
  encoderConfig:
    timeKey: time
    levelKey: level
    nameKey: logger
    callerKey: caller
    messageKey: message
    stacktraceKey: stacktrace
    lineEnding: "\n"
    levelEncoder: capitalColor
    timeEncoder: iso8601
    durationEncoder: string
    callerEncoder: short
  outputPaths: stdout
  errorOutputPaths: stdout # we send errors to stdout in dev so that we can easily grep without redirect

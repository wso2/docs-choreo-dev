kubeConfig:
  path: ""
  masterUrl: ""
redis:
  host: ${REDIS_HOST}
  port: 6380
  disableTls: false
  password: ${REDIS_PASSWORD}
server:
  port: 8080
upstream:
  app-service: app-service:8080
  negotiator: ${UPSTREAM_NEGOTIATOR}
workspace:
  namespace: ${WORKSPACE_NAMESPACE}
  pvcName: pvc-userappstorage
  apiHostName: ${WORKSPACE_API_HOST_NAME}
  apiIngressTlsSecret: ${WORKSPACE_API_INGRESS_TLS_SECRET}
  apiPort: 8080
  appIngressHostSuffix: ${WORKSPACE_APP_INGRESS_HOST_SUFFIX}
  appIngressTlsSecret: ${WORKSPACE_APP_INGRESS_TLS_SECRET}
  cleanInterval: 3600s
  apiImage: ${WORKSPACE_IMAGE}
  langServerImage: {{.WORKSPACE_LANGSERVER_IMAGE}} # DEPRECATED. Please use kustomize/<env>/choreo-system/kustomization.yaml to set lang-server image
  projectTemplateDir: /template
  projectBallerinaVersion: {{.WORKSPACE_BALLERINA_VERSION | default "${WORKSPACE_BALLERINA_VERSION}"}}
  userAppsDir: /apps
  periscopeHost: ${WORKSPACE_PERISCOPE_HOST} # DEPRECATED
  azureInsightsKey: ${AZURE_INSIGHTS_KEY}
  taintKey: dataplane
  nodeSelector:
    execution-mode: dataplane
  ingressAnnotations:
    ingress.kubernetes.io/ssl-redirect:                  true
    kubernetes.io/ingress.class:                         ${WORKSPACE_INGRESS_ANNOTATIONS_KUBERNETES_IO_INGRESS_CLASS}
    nginx.ingress.kubernetes.io/affinity:                cookie
    nginx.ingress.kubernetes.io/permanent-redirect-code: 301
    nginx.ingress.kubernetes.io/proxy-body-size:         100m
    nginx.ingress.kubernetes.io/session-cookie-hash:     sha1
    nginx.ingress.kubernetes.io/session-cookie-name:     route
    nginx.ingress.kubernetes.io/ssl-redirect:            true
    nginx.ingress.kubernetes.io/enable-cors:             true
    nginx.ingress.kubernetes.io/cors-allow-origin:       ${WORKSPACE_INGRESS_ANNOTATIONS_NGINX_INGRESS_KUBERNETES_IO_CORS_ALLOW_ORIGIN}
    nginx.ingress.kubernetes.io/proxy-send-timeout:      10800 # 3 hours
    nginx.ingress.kubernetes.io/proxy-read-timeout:      10800 # 3 hours
logger:
  level: ${LOGGER_LEVEL}
  encoding: json
  development: ${LOGGER_DEVELOPMENT}
  disableStacktrace: ${LOGGER_DISABLE_STACKTRACE}
  encoderConfig:
    timeKey: time
    levelKey: level
    nameKey: logger
    callerKey: caller
    messageKey: message
    stacktraceKey: stacktrace
    lineEnding: "\n"
    levelEncoder: capital
    timeEncoder: iso8601
    durationEncoder: string
    callerEncoder: short
  outputPaths: stdout
  errorOutputPaths: stdout # we send errors to stdout in dev so that we can easily grep without redirect
apim:
  clientKey: ${APIM_CLIENT_KEY}
  clientSecret: ${APIM_CLIENT_SECRET}
  idpUrl: ${APIM_IDP_URL}
  serviceUrl: ${APIM_SERVICE_URL}
  gatewaySuffix: ${APIM_GATEWAY_SUFFIX}
  devGatewaySuffix: ${APIM_DEV_GATEWAY_SUFFIX}
  createApiForService: ${CREATE_API_FOR_SERVICE}
codeServer:
  image: ${CODE_SERVER_IMAGE}
  initImage: ${CODE_SERVER_INIT_IMAGE}
  namespacePrefix: {{.CODESERVER_NAMESPACE_PREFIX}}
  ingressTlsSecret: "" # Set to cert-manager/<env>-choreo-workspace-wildcard-tls by using NginX -wildcard-tls-secret command line arg
  githubToken: ${CSM_GITHUB_TOKEN}
  cleanerInterval: 15m
  codeServerMaxAge: 6h
  volumeCleanerInterval: 6h
  volumeMaxAge: 720h
  mizzenApi:
    url: http://dp-mizzen:80
  defaultClusterId: {{.CODESERVER_CLUSTER_ID}}
  defaultIngressHost: {{.CODESERVER_INGRESS_HOST}}
  defaultRegion: us-east-2
  ingressAnnotations:
    kubernetes.io/ingress.class: {{.INGRESS_ANNOTATION_CLASS}}
    ingress.kubernetes.io/ssl-redirect: true
    nginx.org/redirect-to-https: true
    nginx.org/client-max-body-size: 100m
    nginx.org/proxy-send-timeout: 10800 # 3 hours
    nginx.org/proxy-read-timeout: 10800 # 3 hours
  frontendBaseUrl: {{.CODESERVER_FRONTEND_URL}}
  gatewayBaseUrl: {{.CODESERVER_GATEWAY_URL}}
  storageAccSecret: {{.CODESERVER_STORAGE_ACC_SECRET}}
  storageAccSecretNamespace: {{.CODESERVER_STORAGE_ACC_SECRET_NAMESPACE}}
  codeServerDefaultNetworkPolicy: {{.CODESERVER_NETWORK_POLICY}}
  codeServerDefaultNetworkPolicyNamespace: {{.CODESERVER_NETWORK_POLICY_NAMESPACE}}
  maxCodeServersPerCluster: {{.CODESERVER_MAX_CLUSTER}}
  storage:
    azureFiles:  
      fileShareList:
      - location: us-east-2
        config:
          storageAccName: {{.CODESERVER_STORAGE_ACC_NAME}}
          storageAccKey: ${CSM_VOLUME_STORAGE_ACCOUNT_KEY}
  iam:
    apim:
      tokenEndpoint: {{.CODESERVER_TOCKEN_ENDPOINT}}
      clientId: ${CSM_APIM_IDP_VSCODE_CLIENT_ID}
    balCentral:
      tokenEndpoint: {{.CODESERVER_TOCKEN_ENDPOINT}}
      clientId: ${CSM_APIM_IDP_BALLERINA_CENTRAL_CLIENT_ID}
  userConnectors: true
  codeServerEnvs:
    VSCODE_CHOREO_APIM_TOKEN_ENDPOINT: {{.CODESERVER_TOCKEN_ENDPOINT}}
    VSCODE_CHOREO_APIM_CLIENT_ID: ${CSM_APIM_IDP_VSCODE_CLIENT_ID}
    VSCODE_CHOREO_INSTRUMENTATION_KEY: {{.CODESERVER_VSCODE_INSTRUMENTATION_KEY}}
    {{.BALLERINA_ENV_CENTRAL}}: "true"
    CHOREO_WHATFIX_URL: {{.CODESERVER_WHATFIX_URL}}
    #  This is used for sentry configuration
    VSCODE_CHOREO_SENTRY_ENV: {{.CODESERVER_SENTRY_ENV}}
    # Low code editor version
    BALLERINA_LOW_CODE_EDITOR_VERSION: "{{.CODESERVER_LOWCODE_EDITOR_VERSION}}"
    BALLERINA_LOW_CODE_RESOURCES_VERSION: ${BALLERINA_LOW_CODE_RESOURCES_VERSION}
    VSCODE_HOTJAR_ID: "{{.CODESERVER_VSCODE_HOTJAR}}"
  enableCodeServerSSO: "true"
  db:
    username: ${CSM_DB_USERNAME}
    password: ${CSM_DB_PASSWORD} 
    host: ${CSM_DB_HOST} 
    port: 1433  
    name: ${CSM_DB_NAME}

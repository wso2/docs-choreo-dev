[workflow_mgt_service]
healthPort = 9050
servicePort = 9082

[workflow_mgt_service.db]
host = "{{.DB_HOST}}"
port = 5432
user = "{{.DB_USER}}"
database = 'choreo_workflow_mgt_db'

[workflow_mgt_service.rpc_app_service]
appServiceHost = "http://app-service:8080"

[workflow_mgt_service.notification]
notificationService = "http://alert-notification-service:9090"

[ballerina.log]
level = "{{.LOG_LEVEL}}"
format="json"

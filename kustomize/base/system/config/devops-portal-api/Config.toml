[ballerina.log]
level = "{{.LOG_LEVEL | default "INFO"}}"
format = "json"

[ballerina.http.accessLogConfig]
console = true

[devops.api.config]
app_service_url = "http://app-service:8080"
cicd_url = "http://dp-cicd"
cloud_manager_url = "http://dp-cloud-manager"
delete_manager_url = "http://delete-manager"
mizzen_url = "http://dp-mizzen"
port = 8089
project_manager_url = "http://dp-project-manager"
rudder_url = "http://dp-rudder"
subscription_svc_url = "http://subscriptions:9090"
pdp_manager_url = "http://pdp-manager"
apim_url = "{{.APIM_URL}}"
no_of_max_env_per_org = {{.NO_OF_MAX_ENV_PER_ORG}}
ciliumClusterIds = "{{.CILIUM_CLUSTER_IDS | default ""}}"
cdp_capacity_list = "{{.CDP_CAPACITY_LIST}}"
default_cdp_capacity = {{.DEFAULT_CDP_CAPACITY}}
us_cdp_list = "{{.US_CDP_LIST}}"
eu_cdp_list = "{{.EU_CDP_LIST}}"
includeJWTHeader = {{.INCLUDE_JWT_HEADER | default false}}
enableEventPublish= {{.ENABLE_EVENT_PUBLISH | default false}}
websubhubUrl = "{{.WEBSUBHUB_URL | default ""}}"
topic= "{{.WEBSUBHUB_TOPIC | default ""}}"
feature_flag_appdev_sts={{.FEATURE_FLAG_APPDEV_STS | default false}}
feature_flag_default_env_idp_config={{.FEATURE_FLAG_DEFAULT_ENV_IDP_CONFIG | default false}}
default_idp_id="{{.DEFAULT_IDP_ID | default ""}}"
apim_scopes = "apim:admin apim:api_create apim:api_delete apim:api_import_export apim:api_product_import_export apim:api_publish apim:api_view apim:app_import_export apim:client_certificates_add apim:client_certificates_update apim:client_certificates_view apim:document_create apim:document_manage apim:ep_certificates_add apim:ep_certificates_update apim:ep_certificates_view apim:external_services_discover apim:mediation_policy_create apim:mediation_policy_manage apim:mediation_policy_view apim:pub_alert_manage apim:publisher_settings apim:shared_scope_manage apim:subscription_block apim:subscription_view apim:threat_protection_policy_create apim:threat_protection_policy_manage apim:publisher_settings"
apim_client_id = "{{.APIM_REST_API_CONSUMER_KEY}}"
apim_client_secret = "{{.APIM_REST_API_CONSUMER_SECRET}}"

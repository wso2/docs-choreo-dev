Configuration:
  Appenders:
    Console:
      name: Console
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%style{%d{ISO8601}}{white} %highlight{%-5level }[%style{%t}{bright,blue}] %style{%C}{bright,yellow}: %msg%n%throwable"
  Loggers:
    Root:
      level: {{.ROOT_LOG_LEVEL}}
      AppenderRef:
        - ref: Console
    Logger:
      - name: com.wso2.choreo.user.mgt.service
        level: {{.SERVICE_LOG_LEVEL}}
        AppenderRef:
          - ref: Console

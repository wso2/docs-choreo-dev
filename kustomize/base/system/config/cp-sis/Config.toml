[cp.status_info_service]
healthCheckPort = 9090
internalServicePort = 9091
publicServicePort = 9092

[cp.status_info_service.apis]
projectManagerUrl = "http://dp-project-manager:80"

[cp.status_info_service.auth]
choreoJwtIssuer = "{{.CHOREO_JWT_ISSUER}}"
choreoJwtAudience = "{{.CHOREO_JWT_AUDIENCE}}"
site24x7JwtAudience = "{{.SITE24x7_JWT_AUDIENCE}}"
choreoJwtJwksUrl = "{{.CHOREO_JWT_JWKS_URL}}"

[cp.status_info_service.repository]
host = "{{.MSSQL_HOST}}"
port  = 1433
user = "choreo_cp_sis_db_user"
database = "choreo_cp_sis_db"
mssqlPwdSecretPath = "/mnt/csi/secret-cp-sis/CP_SIS_DB_PASSWORD"

[ballerina.log]
level = "{{.LOG_LEVEL}}"

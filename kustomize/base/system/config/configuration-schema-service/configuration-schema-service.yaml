middleware:
  logging:
    dumpRequestBody: false
    dumpRequestHeaders: false
    dumpResponseBody: false
    dumpResponseHeaders: false
    publicKey: ${MIDDLEWARE_LOGGING_PUBLIC_KEY}
  jwt:
    providers:
      - issuer: ${KM_ISSUER}
        audiences: {{.JWT_PROVIDERS_AUDIENCES}}
        jwks:
          url: ${KM_JWKS_URL}
          cacheRefreshInterval: ${JWKS_CACHE_REFRESH_INTERVAL}
          cacheTtl: ${JWKS_CACHE_TTL}
    validationLeeway: ${IDP_JWT_VALIDATION_LEEWAY}
    skipValidation: false
upstream:
  dp-cicd: dp-cicd:80
  config-mapping-service: configuration-service:8084
logger:
  level: ${LOGGER_LEVEL} # todo: change this to info after the new components get stable in prod.
  encoding: console
  development: ${LOGGER_DEVELOPMENT}
  disableStacktrace: ${LOGGER_DISABLE_STACKTRACE}
  encoderConfig:
    timeKey: time
    levelKey: level
    nameKey: logger
    callerKey: caller
    messageKey: message
    stacktraceKey: stacktrace
    lineEnding: "\n"
    levelEncoder: capitalColor
    timeEncoder: iso8601
    durationEncoder: string
    callerEncoder: short
  outputPaths: stdout
  errorOutputPaths: stdout # we send errors to stdout in dev so that we can easily grep without redirect

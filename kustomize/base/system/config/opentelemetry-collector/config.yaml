extensions:
  choreosts:
    issuer_url: {{.STS_ISSUER_URL}}
    data_planes_config_path: data-planes.yaml
  health_check/liveness:
    endpoint: "0.0.0.0:13133"
    path: "/liveness"
  health_check/readiness:
    endpoint: "0.0.0.0:13134"
    path: "/readiness"
    check_collector_pipeline:
      enabled: true
      interval: "5m"
      exporter_failure_threshold: 5

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        include_metadata: true
        auth:
          authenticator: choreosts

exporters:
  logging:
    loglevel: info 
    sampling_initial: 5
    sampling_thereafter: 200
  eventhubexporter/telemetry:
    topic: {{.EVENTHUB_EXPORTER_METRIC_TOPIC}}
    encoding: pixie_telemetry
    brokers:
      - {{.EVENTHUB_EXPORTER_BROCKERS}}
    protocol_version: 2.0.0
    auth:
      sasl:
        username: ConnectionString
        password: ${EVENT_HUB_CONNECTION_STRING}
        mechanism: PLAIN
        insecure: false
  eventhubexporter/dns:
    topic: {{.EVENTHUB_EXPORTER_DNS_TOPIC}}
    encoding: pixie_dns
    brokers:
      - {{.EVENTHUB_EXPORTER_BROCKERS}}
    protocol_version: 2.0.0
    auth:
      sasl:
        username: ConnectionString
        password: ${EVENT_HUB_CONNECTION_STRING}
        mechanism: PLAIN
        insecure: false

processors:
  attributes:
    actions:
      - key: dataplaneId
        from_context: auth.subject
        action: insert
  filter/telemetry:
      metrics:
        include:
          match_type: strict
          metric_names:
            - request_latency_nanoseconds
  filter/dns:
        metrics:
          include:
            match_type: strict
            metric_names:
              - dns_events
  publishingfailuredetection:

service:
  extensions: [choreosts, health_check/liveness, health_check/readiness]
  pipelines:
    metrics/telemetry:
      receivers: [otlp]
      processors: [attributes, filter/telemetry, publishingfailuredetection]
      exporters: [logging, eventhubexporter/telemetry]
    metrics/dns:
      receivers: [otlp]
      processors: [attributes, filter/dns]
      exporters: [logging, eventhubexporter/dns]

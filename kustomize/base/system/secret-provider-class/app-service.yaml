        - objectName: MAX_MIND_GEO_LOC_COUNTRY_PASSWORD
          key: MAX_MIND_GEO_LOC_COUNTRY_PASSWORD
  parameters:
    objects: |
      array:
        - |
          objectName: app-service-BETA-PROGRAM-PREFINERY-INVITATION-DECODER-KEY
          objectType: secret
          objectAlias: BETA_PROGRAM_PREFINERY_INVITATION_DECODER_KEY
          objectVersion: "{{.BETA_PROGRAM_PREFINERY_INVITATION_DECODER_KEY}}"
        - |

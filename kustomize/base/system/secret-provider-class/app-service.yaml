          objectType: secret
          objectAlias: MAX_MIND_GEO_LOC_COUNTRY_USERNAME
          objectVersion: "{{.MAX_MIND_GEO_LOC_COUNTRY_USERNAME}}"
        - |
          objectName: app-service-MAX-MIND-GEO-LOC-COUNTRY-PASSWORD
          objectType: secret
          objectAlias: MAX_MIND_GEO_LOC_COUNTRY_PASSWORD
          objectVersion: "{{.MAX_MIND_GEO_LOC_COUNTRY_PASSWORD}}"

          objectType: secret
          objectAlias: CENTRAL_ORG_REGISTRY_CERTIFICATE_KEY
          objectVersion: "{{.CENTRAL_ORG_REGISTRY_CERTIFICATE_KEY}}"
        - |
          objectName: app-service-MARKETING-CONSENT-APP-CLIENT-SECRET

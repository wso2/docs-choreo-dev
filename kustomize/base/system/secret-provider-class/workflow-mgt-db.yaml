apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-workflow-mgt-db
spec:
  secretObjects:
    - secretName: secret-workflow-mgt-db
      type: Opaque
      data:
        - objectName: CHOREO_WORKFLOW_MGT_DB_PASSWORD
          key: CHOREO_WORKFLOW_MGT_DB_PASSWORD
        - objectName: APIM_CLIENT_SECRET
          key: APIM_CLIENT_SECRET
  parameters:
    objects: |
      array:
        - |
          objectName: choreo-workflow-mgt-db-postgresql-password
          objectType: secret
          objectAlias: CHOREO_WORKFLOW_MGT_DB_PASSWORD
          objectVersion: "{{.CHOREO_WORKFLOW_MGT_DB_PASSWORD}}"
        - |
          objectName: proxy-deployer-apim-secret
          objectType: secret
          objectAlias: APIM_CLIENT_SECRET
          objectVersion: "{{.APIM_CLIENT_SECRET}}"

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-github-connector
spec:
  secretObjects:
    - secretName: secret-github-connector
      type: Opaque
      data:
        - objectName: GH_CONNECTOR_CLIENT_SECRET
          key: GH_CONNECTOR_CLIENT_SECRET
  parameters:
    objects: |
      array:
        - |
          objectName: gh-CONNECTOR-CLIENT-SECRET
          objectType: secret
          objectAlias: GH_CONNECTOR_CLIENT_SECRET
          objectVersion: "{{.GH_CONNECTOR_CLIENT_SECRET}}"

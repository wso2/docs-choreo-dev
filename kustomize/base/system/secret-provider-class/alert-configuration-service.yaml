apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-alert-configuration-service
spec:
  secretObjects:
    - secretName: secret-alert-configuration-service
      type: Opaque
      data:
        - objectName: ALERT_CHOREO_DB_PASSWORD
          key: ALERT_CHOREO_DB_PASSWORD
  parameters:
    objects: |
      array:
        - |
          objectName: choreo-alerts-db-mssql-password
          objectType: secret
          objectAlias: ALERT_CHOREO_DB_PASSWORD
          objectVersion: "{{.ALERT_CHOREO_DB_PASSWORD}}"

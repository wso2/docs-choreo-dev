apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-log-controller
spec:
  secretObjects:
    - secretName: secret-log-controller
      type: Opaque
      data:
        - objectName: AZURE_LA_CLIENT_SECRET
          key: AZURE_LA_CLIENT_SECRET
        - objectName: OPENSEARCH_PASSWORD_EU
          key: OPENSEARCH_PASSWORD_EU
        - objectName: OPENSEARCH_PASSWORD_US
          key: OPENSEARCH_PASSWORD_US
  parameters:
    objects: |
      array:
        - |
          objectName: log-analytics-read-log-controller-client-secret
          objectType: secret
          objectAlias: AZURE_LA_CLIENT_SECRET
          objectVersion: "{{.AZURE_LA_CLIENT_SECRET}}"
        - |
          objectName: "{{.OPENSEARCH_PASSWORD_EU_OBJ_NAME | default "obs-opensearch-log-controller-user-password-eu"}}"
          objectType: secret
          objectAlias: OPENSEARCH_PASSWORD_EU
          objectVersion: "{{.OPENSEARCH_PASSWORD_EU}}"
        - |
          objectName: "{{.OPENSEARCH_PASSWORD_US_OBJ_NAME | default "obs-opensearch-log-controller-user-password-eastus2"}}"
          objectType: secret
          objectAlias: OPENSEARCH_PASSWORD_US
          objectVersion: "{{.OPENSEARCH_PASSWORD_US}}"

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-gsuite
spec:
  secretObjects:
    - secretName: secret-gsuite
      type: Opaque
      data:
        - objectName: GSUITE_CLIENT_SECRET
          key: GSUITE_CLIENT_SECRET
  parameters:
    objects: |
      array:
        - |
          objectName: gsuite-CLIENT-SECRET
          objectType: secret
          objectAlias: GSUITE_CLIENT_SECRET
          objectVersion: "{{.GSUITE_CLIENT_SECRET}}"

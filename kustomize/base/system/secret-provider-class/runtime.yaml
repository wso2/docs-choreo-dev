apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-runtime
spec:
  secretObjects:
    - secretName: secret-runtime
      type: Opaque
      data:
        - objectName: APIM_CLIENT_SECRET
          key: APIM_CLIENT_SECRET
  parameters:
    objects: |
      array:
        - |
          objectName: runtime-APIM-CLIENT-SECRET
          objectType: secret
          objectAlias: APIM_CLIENT_SECRET
          objectVersion: "{{.APIM_CLIENT_SECRET}}"

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-org-activity
spec:
  secretObjects:
    - secretName: secret-org-activity
      type: Opaque
      data:
        - objectName: CHOREO_DB_PASSWORD
          key: CHOREO_DB_PASSWORD
        - objectName: AZURE_ACTIVEDIRECTORY_CLIENT_SECRET
          key: AZURE_ACTIVEDIRECTORY_CLIENT_SECRET
        - objectName: MSSQL_PASSWORD
          key: MSSQL_PASSWORD
        - objectName: org-deletion-STORAGE-ACCOUNT-KEY
          key: org-deletion-STORAGE-ACCOUNT-KEY
        - objectName: SCIM_BACKEND_API_USER_PASSWORD
          key: SCIM_BACKEND_API_USER_PASSWORD
  parameters:
    objects: |
      array:
        - |
          objectName: choreo-app-db-mssql-password
          objectType: secret
          objectAlias: CHOREO_DB_PASSWORD
          objectVersion: "{{.CHOREO_DB_PASSWORD}}"
        - |
          objectName: audit-logging-AZURE-ACTIVEDIRECTORY-CLIENT-SECRET
          objectType: secret
          objectAlias: AZURE_ACTIVEDIRECTORY_CLIENT_SECRET
          objectVersion: "{{.AZURE_ACTIVEDIRECTORY_CLIENT_SECRET}}"
        - |
          objectName: choreo-subscriptions-db-mssql-password
          objectType: secret
          objectAlias: MSSQL_PASSWORD
          objectVersion: "{{.MSSQL_PASSWORD}}"
        - |
          objectName: org-deletion-STORAGE-ACCOUNT-KEY
          objectType: secret
          objectAlias: org-deletion-STORAGE-ACCOUNT-KEY
          objectVersion: "{{.ORG_DELETION_STORAGE_ACCOUNT_KEY}}"
        - |
          objectName: idp-SCIM-BACKEND-API-USER-PASSWORD
          objectType: secret
          objectAlias: SCIM_BACKEND_API_USER_PASSWORD
          objectVersion: "{{.SCIM_BACKEND_API_USER_PASSWORD}}"

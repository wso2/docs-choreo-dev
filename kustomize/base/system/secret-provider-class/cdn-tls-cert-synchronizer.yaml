apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-cdn-tls-cert-synchronizer
spec:
  parameters:
    objects: |
      array:
        - |
          objectName: cdn-tls-cert-synchronizer-client-id
          objectType: secret
          objectAlias: SERVICE_PROVIDER_ID
          objectVersion: "{{.SERVICE_PROVIDER_ID}}"
        - |
          objectName: cdn-tls-cert-synchronizer-client-secret
          objectType: secret
          objectAlias: SERVICE_PROVIDER_PASSWORD
          objectVersion: "{{.SERVICE_PROVIDER_PASSWORD}}"

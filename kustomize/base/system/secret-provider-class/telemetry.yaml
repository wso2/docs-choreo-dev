apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-telemetry
spec:
  secretObjects:
  - secretName: secret-telemetry
    type: Opaque
    data:
      - objectName: EVENTHUB_CONNECTION_STRING
        key: EVENTHUB_CONNECTION_STRING
  parameters:
    objects: |
      array:
        - |
          objectName: telemetry-EVENTHUB-CONNECTION-STRING
          objectType: secret
          objectAlias: EVENTHUB_CONNECTION_STRING
          objectVersion: "{{.EVENTHUB_CONNECTION_STRING}}"

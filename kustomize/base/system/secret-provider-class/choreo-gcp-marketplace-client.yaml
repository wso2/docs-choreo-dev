apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: choreo-gcp-marketplace-client-secrets
spec:
  secretObjects:
    - secretName: choreo-gcp-marketplace-client-secret
      type: Opaque
      data:
        - objectName: GCP_CREDENTIALS_JSON
          key: GCP_CREDENTIALS_JSON
        - objectName: GCP_PROVIDER_ID
          key: GCP_PROVIDER_ID
  parameters:
    objects: |
      array:
        - |
          objectName: gcp-marketplace-client-credentials-json
          objectType: secret
          objectAlias: GCP_CREDENTIALS_JSON
          objectVersion: "{{.GCP_CREDENTIALS_JSON}}"
        - |
          objectName: gcp-marketplace-client-provider-id
          objectType: secret
          objectAlias: GCP_PROVIDER_ID
          objectVersion: "{{.GCP_PROVIDER_ID}}"

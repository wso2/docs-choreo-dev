apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-pdp-manager
spec:
  secretObjects:
    - secretName: secret-pdp-manager
      type: Opaque
      data:
        - objectName: APIM_REST_API_CONSUMER_SECRET
          key: APIM_REST_API_CONSUMER_SECRET
        - objectName: SYSTEM_APIS_REPO_GITHUB_PAT
          key: SYSTEM_APIS_REPO_GITHUB_PAT
  parameters:
    objects: |
      array:
        - |
          objectName: pdp-manager-service-apim-service-provider-consumer-secret
          objectType: secret
          objectAlias: APIM_REST_API_CONSUMER_SECRET
          objectVersion: "{{.APIM_REST_API_CONSUMER_SECRET}}"
        - |
          objectName: system-apis-repo-github-pat
          objectType: secret
          objectAlias: SYSTEM_APIS_REPO_GITHUB_PAT
          objectVersion: "{{.SYSTEM_APIS_REPO_GITHUB_PAT}}"

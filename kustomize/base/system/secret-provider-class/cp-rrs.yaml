apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-cp-rrs
spec:
  secretObjects:
    - secretName: secret-cp-rrs
      type: Opaque
      data:
        - objectName: CP_RRS_ASB_CONNECTION_STRING
          key: CP_RRS_ASB_CONNECTION_STRING
  parameters:
    objects: |
      array:
        - |
          objectName: asb-connection-string
          objectType: secret
          objectAlias: CP_RRS_ASB_CONNECTION_STRING
          objectVersion: "{{.CP_RRS_ASB_CONNECTION_STRING}}"


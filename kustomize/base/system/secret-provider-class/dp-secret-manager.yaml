apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-dp-secret-manager
spec:
  secretObjects:
    - secretName: secret-dp-secret-manager
      type: Opaque
      data:
        - objectName: AZURE_KEYVAULT_CLIENT_ID
          key: AZURE_KEYVAULT_CLIENT_ID
        - objectName: AZURE_KEYVAULT_CLIENT_SECRET
          key: AZURE_KEYVAULT_CLIENT_SECRET
        - objectName: AZURE_KEYVAULT_TENANT_ID
          key: AZURE_KEYVAULT_TENANT_ID
        - objectName: AZURE_KEYVAULT_CLIENT_SECRET
          key: SYSTEM_KV_CLIENT_SECRET
        - objectName: AZURE_KEYVAULT_CLIENT_SECRET
          key: US_CDP_1_KV_CLIENT_SECRET
        - objectName: AZURE_KEYVAULT_CLIENT_SECRET
          key: EU_CDP_1_KV_CLIENT_SECRET
        - objectName: US_CDP_2_KV_CLIENT_SECRET
          key: US_CDP_2_KV_CLIENT_SECRET
  parameters:
    objects: |
      array:
        - |
          objectName: dp-secret-manager-kv-client-id
          objectType: secret
          objectAlias: AZURE_KEYVAULT_CLIENT_ID
          objectVersion: "{{.AZURE_KEYVAULT_CLIENT_ID}}"
        - |
          objectName: dp-secret-manager-keyvault-client-secret
          objectType: secret
          objectAlias: AZURE_KEYVAULT_CLIENT_SECRET
          objectVersion: "{{.AZURE_KEYVAULT_CLIENT_SECRET}}"
        - |
          objectName: tenant-id
          objectType: secret
          objectAlias: AZURE_KEYVAULT_TENANT_ID
          objectVersion: "{{.AZURE_KEYVAULT_TENANT_ID}}"
        - |
          objectName: dp-secret-manager-cp2wu2-AZURE-KEYVAULT-CLIENT-SECRET
          objectType: secret
          objectAlias: US_CDP_2_KV_CLIENT_SECRET
          objectVersion: "{{.US_CDP_2_KV_CLIENT_SECRET}}"

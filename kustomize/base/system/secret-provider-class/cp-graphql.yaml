apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-cp-graphql
spec:
  secretObjects:
    - secretName: secret-cp-graphql
      type: Opaque
      data:
        - objectName: APIM_REST_API_CONSUMER_SECRET
          key: APIM_REST_API_CONSUMER_SECRET
        - objectName: KEYSTORE_PASSWORD
          key: KEYSTORE_PASSWORD
  parameters:
    objects: |
      array:
        - |
          objectName: graphql-apim-rest-api-consumer-secret
          objectType: secret
          objectAlias: APIM_REST_API_CONSUMER_SECRET
          objectVersion: "{{.APIM_REST_API_CONSUMER_SECRET}}"
        - |
          objectName: cp-graphql-EVENT-PUBLISHER-CLIENT-KEY-STORE-PASSWORD
          objectType: secret
          objectAlias: KEYSTORE_PASSWORD
          objectVersion: "{{.KEYSTORE_PASSWORD}}"
        - |
          objectName: cp-graphql-EVENT-PUBLISHER-CLIENT-KEY-STORE
          objectType: secret
          objectFormat: pfx
          objectEncoding: base64
          objectAlias: BAL_KEYSTORE
          objectVersion: "{{.BAL_KEYSTORE}}"

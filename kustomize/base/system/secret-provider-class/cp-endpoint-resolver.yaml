apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-endpoint-resolver
spec:
  secretObjects:
    - secretName: secret-endpoint-resolver
      type: Opaque
      data:
        - objectName: APIM_CLIENT_SECRET
          key: APIM_CLIENT_SECRET
  parameters:
    objects: |
      array:
        - |
          objectName: cp-endpoint-resolver-apim-service-provider-consumer-secret
          objectType: secret
          objectAlias: APIM_CLIENT_SECRET
          objectVersion: "{{.APIM_CLIENT_SECRET}}"

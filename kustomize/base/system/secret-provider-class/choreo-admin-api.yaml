apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-choreo-admin-api
spec:
  secretObjects:
    - secretName: secret-choreo-admin-api
      type: Opaque
      data:
        - objectName: MSSQL_PASSWORD
          key: MSSQL_PASSWORD
        - objectName: SF_CLIENT_ID
          key: SF_CLIENT_ID
        - objectName: SF_CLIENT_SECRET
          key: SF_CLIENT_SECRET
  parameters:
    objects: |
      array:
        - |
          objectName: choreo-subscriptions-db-mssql-password
          objectType: secret
          objectAlias: MSSQL_PASSWORD
          objectVersion: "{{.MSSQL_PASSWORD}}"
        - |
          objectName: stripe-salesforce-salesforce-client-id
          objectType: secret
          objectAlias: SF_CLIENT_ID
          objectVersion: "{{.SF_CLIENT_ID}}"
        - |
          objectName: stripe-salesforce-salesforce-client-secret
          objectType: secret
          objectAlias: SF_CLIENT_SECRET
          objectVersion: "{{.SF_CLIENT_SECRET}}"

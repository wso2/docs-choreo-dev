apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-app-db
spec:
  secretObjects:
    - secretName: secret-app-db
      type: Opaque
      data:
        - objectName: CHOREO_DB_PASSWORD
          key: CHOREO_DB_PASSWORD
  parameters:
    objects: |
      array:
        - |
          objectName: choreo-app-db-mssql-password
          objectType: secret
          objectAlias: CHOREO_DB_PASSWORD
          objectVersion: "{{.CHOREO_DB_PASSWORD}}"

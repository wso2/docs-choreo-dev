apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-testbase-db
spec:
  secretObjects:
  - secretName: secret-testbase-db
    type: Opaque
    data:
      - objectName: CHOREO_DB_PASSWORD
        key: CHOREO_DB_PASSWORD
  parameters:
    objects:  |
      array:
        - |
          objectName: choreo-testbase-db-mssql-password
          objectType: secret
          objectAlias: CHOREO_DB_PASSWORD
          objectVersion: "{{.CHOREO_DB_PASSWORD}}"

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: crypto-service-ingress-tls-secret
  labels:
    app: crypto-key-service
spec:
  secretObjects:
    - secretName: crypto-key-service-tls
      type: kubernetes.io/tls
      data:
        - objectName: cryptoservice-ingress-tls-certificate-keystore
          key: tls.key
        - objectName: cryptoservice-ingress-tls-certificate-keystore
          key: tls.crt
  parameters:
    objects: |
      array:
        - |
          objectName: cryptoservice-ingress-tls-certificate-keystore
          objectType: secret
          objectVersion: "{{.CRYPTO_SERVICE_INGRESS_TLS_CERTIFICATE_KEYSTORE}}"

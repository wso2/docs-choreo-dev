apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tls-secret-crypto-key-service
  labels:
    app: crypto-key-service
spec:
  secretObjects:
    - secretName: crypto-key-service-tls
      type: kubernetes.io/tls
      data:
        - objectName: CRYPTO_SERVICE_INGRESS_TLS_CERTIFICATE_KEYSTORE
          key: tls.key
        - objectName: CRYPTO_SERVICE_INGRESS_TLS_CERTIFICATE_KEYSTORE
          key: tls.crt
  parameters:
    objects: |
      array:
        - |
          objectName: cryptoservice-INGRESS-TLS-CERTIFICATE-KEYSTORE
          objectType: secret
          objectAlias: CRYPTO_SERVICE_INGRESS_TLS_CERTIFICATE_KEYSTORE
          objectVersion: "{{.CRYPTO_SERVICE_INGRESS_TLS_CERTIFICATE_KEYSTORE}}"

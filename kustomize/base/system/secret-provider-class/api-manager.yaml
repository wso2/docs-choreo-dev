apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-api-manager
spec:
  secretObjects:
    - secretName: secret-api-manager
      type: Opaque
      data:
        - objectName: API_MANAGER_CLIENT_SECRET
          key: API_MANAGER_CLIENT_SECRET
  parameters:
    objects: |
      array:
        - |
          objectName: app-service-key-manager-registration-apim-client-secret
          objectType: secret
          objectAlias: API_MANAGER_CLIENT_SECRET
          objectVersion: "{{.API_MANAGER_CLIENT_SECRET}}"

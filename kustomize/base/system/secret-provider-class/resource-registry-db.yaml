apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-resource-registry-db
spec:
  secretObjects:
    - secretName: secret-resource-registry-db
      type: Opaque
      data:
        - objectName: CHOREO_RESOURCE_REGISTRY_DB_PASSWORD
          key: CHOREO_RESOURCE_REGISTRY_DB_PASSWORD
  parameters:
    objects: |
      array:
        - |
          objectName: resource-registry-mongodb-password
          objectType: secret
          objectAlias: CHOREO_RESOURCE_REGISTRY_DB_PASSWORD
          objectVersion: "{{.CHOREO_RESOURCE_REGISTRY_DB_PASSWORD}}"

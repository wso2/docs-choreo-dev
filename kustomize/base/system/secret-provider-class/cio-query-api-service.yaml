apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-cio-query-api
spec:
  secretObjects:
    - secretName: secret-cio-query-api
      type: Opaque
      data:
        - objectName: CIO_ADX_CLIENT_SECRET
          key: CIO_ADX_CLIENT_SECRET
  parameters:
    objects: |
      array:
        - |
          objectName: adx-view-client-secret
          objectType: secret
          objectAlias: CIO_ADX_CLIENT_SECRET
          objectVersion: "{{.CIO_ADX_CLIENT_SECRET}}"

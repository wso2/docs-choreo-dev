apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: opentelemetry-collector
spec:
  secretObjects:
    - secretName: opentelemetry-collector
      type: Opaque
      data:
        - objectName: EVENT_HUB_CONNECTION_STRING
          key: EVENT_HUB_CONNECTION_STRING
  parameters:
    objects: |
      array:
        - |
          objectName: opentelemetry-collector-EVENT-HUB-CONNECTION-STRING
          objectType: secret
          objectAlias: EVENT_HUB_CONNECTION_STRING
          objectVersion: "{{.EVENT_HUB_CONNECTION_STRING}}"

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-azure-storage-account
spec:
  secretObjects:
    - secretName: secret-azure-storage-account
      type: Opaque
      data:
        - objectName: azurestorageaccountkey
          key: azurestorageaccountkey
        - objectName: azurestorageaccountname
          key: azurestorageaccountname
  parameters:
    objects: |
      array:
        - |
          objectName: fileshare-STORAGE-ACCOUNT-KEY
          objectType: secret
          objectAlias: azurestorageaccountkey
          objectVersion: "{{.azurestorageaccountkey}}"
        - |
          objectName: fileshare-STORAGE-ACCOUNT-NAME
          objectType: secret
          objectAlias: azurestorageaccountname
          objectVersion: "{{.azurestorageaccountname}}"

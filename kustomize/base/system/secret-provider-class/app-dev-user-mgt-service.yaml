apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-appdev-user-mgt
spec:
  secretObjects:
    - secretName: secret-appdev-user-mgt
      type: Opaque
      data:
        - objectName: UM_DB_PASSWORD
          key: UM_DB_PASSWORD
  parameters:
    objects: |
      array:
        - |
          objectName: choreo-app-dev-user-mgt-db-mssql-password
          objectType: secret
          objectAlias: UM_DB_PASSWORD
          objectVersion: "{{.UM_DB_PASSWORD}}"

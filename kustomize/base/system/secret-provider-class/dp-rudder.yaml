apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-dp-rudder
spec:
  secretObjects:
    - secretName: secret-dp-rudder
      type: Opaque
      data:
        - objectName: MSSQL_PASSWORD
          key: MSSQL_PASSWORD
        - objectName: APIM_REST_API_CONSUMER_SECRET
          key: APIM_REST_API_CONSUMER_SECRET
        - objectName: ALERT_REST_API_CONSUMER_SECRET
          key: ALERT_REST_API_CONSUMER_SECRET
        - objectName: REDIS_PASSWORD
          key: REDIS_PASSWORD
        - objectName: REDIS_US_CDP_2_PASSWORD
          key: REDIS_US_CDP_2_PASSWORD
  parameters:
    objects: |
      array:
        - |
          objectName: choreo-dp-rudder-db-mssql-password
          objectType: secret
          objectAlias: MSSQL_PASSWORD
          objectVersion: "{{.MSSQL_PASSWORD}}"
        - |
          objectName: apim-REST-API-CONSUMER-SECRET
          objectType: secret
          objectAlias: APIM_REST_API_CONSUMER_SECRET
          objectVersion: "{{.APIM_REST_API_CONSUMER_SECRET}}"
        - |
          objectName: alert-REST-API-CONSUMER-SECRET
          objectType: secret
          objectAlias: ALERT_REST_API_CONSUMER_SECRET
          objectVersion: "{{.ALERT_REST_API_CONSUMER_SECRET}}"
        - |
          objectName: apim-global-adapter-redis-primary-access-key
          objectType: secret
          objectAlias: REDIS_PASSWORD
          objectVersion: "{{.REDIS_PASSWORD}}"
        - |
          objectName: cp2wu2-redis-ga-PASSWORD
          objectType: secret
          objectAlias: REDIS_US_CDP_2_PASSWORD
          objectVersion: "{{.REDIS_US_CDP_2_PASSWORD}}"

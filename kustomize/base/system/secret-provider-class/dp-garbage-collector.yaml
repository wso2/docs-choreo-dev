apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-dp-garbage-collector
spec:
  secretObjects:
    - secretName: secret-dp-garbage-collector
      type: Opaque
      data:
        - objectName: MONGODB_PASSWORD
          key: MONGODB_PASSWORD
  parameters:
    objects: |
      array:
        - |
          objectName: dp-garbage-collector-MONGODB-PASSWORD
          objectType: secret
          objectAlias: MONGODB_PASSWORD
          objectVersion: "{{.MONGODB_PASSWORD}}"

---
apiVersion: "v1"
kind: "Service"
metadata:
  labels:
    app: "choreo-linker-0.1.2"
  name: "choreo-linker-0"
spec:
  ports:
  - name: "linker-svc-1-ht"
    port: 9090
    protocol: "TCP"
    targetPort: 9090
  - name: "linkerunsecured"
    port: 9092
    protocol: "TCP"
    targetPort: 9092
  selector:
    app: "choreo-linker-0.1.2"
  type: "ClusterIP"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  labels:
    app: "choreo-linker-0.1.2"
  name: "choreo-linker-0-deployment"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "choreo-linker-0.1.2"
  template:
    metadata:
      labels:
        app: "choreo-linker-0.1.2"
    spec:
      containers:
      - env:
        - name: "b7a_log_level"
          valueFrom:
            configMapKeyRef:
              key: "B7A_LOG_LEVEL"
              name: "cm-loglevel-linker"
        - name: "IDP_ISSUER"
          valueFrom:
            configMapKeyRef:
              key: "IDP_ISSUER"
              name: "env-idp-replica"
        - name: "IDP_CLIENT_ID"
          valueFrom:
            configMapKeyRef:
              key: "IDP_CLIENT_ID"
              name: "env-idp-replica"
        - name: "IDP_HOST"
          valueFrom:
            configMapKeyRef:
              key: "IDP_HOST"
              name: "env-idp-replica"
        - name: "IDP_JWKS_ENDPOINT"
          valueFrom:
            configMapKeyRef:
              key: "IDP_JWKS_ENDPOINT"
              name: "cm-idp-replica"
        - name: "NEGOTIATOR_GRPC_ADDRESS"
          valueFrom:
            configMapKeyRef:
              key: "NEGOTIATOR_GRPC_ADDRESS"
              name: "cm-negotiator"
        - name: "JWKS_ENDPOINT_PROTOCOL"
          valueFrom:
            configMapKeyRef:
              key: "JWKS_ENDPOINT_PROTOCOL"
              name: "cm-linker"
        - name: "LINKER_INGRESS_ADDRESS"
          valueFrom:
            configMapKeyRef:
              key: "LINKER_INGRESS_ADDRESS"
              name: "cm-linker"
        - name: "APPSERVICE_GRPC_ADDRESS"
          valueFrom:
            configMapKeyRef:
              key: "APPSERVICE_GRPC_ADDRESS"
              name: "cm-linker"
        - name: "PERISCOPE_HOSTNAME"
          valueFrom:
            configMapKeyRef:
              key: "PERISCOPE_HOSTNAME"
              name: "cm-linker"
        image: "choreocontrolplane.azurecr.io/choreoipaas/choreo-linker:latest"
        imagePullPolicy: "IfNotPresent"
        lifecycle:
          preStop:
            exec:
              command:
              - "sleep"
              - "15"
        livenessProbe:
          httpGet:
            path: "/health"
            port: 9091
          initialDelaySeconds: 30
        name: "choreo-linker-0-deployment"
        ports:
        - containerPort: 9090
          name: "linker-svc-1-ht"
          protocol: "TCP"
        - containerPort: 9092
          name: "linkerunsecured"
          protocol: "TCP"
        readinessProbe:
          httpGet:
            path: "/health"
            port: 9091
          initialDelaySeconds: 30
        resources:
          limits:
            memory: "768Mi"
            cpu: "500m"
          requests:
            memory: "512Mi"
            cpu: "300m"
      nodeSelector: {}
---
apiVersion: "autoscaling/v2beta2"
kind: "HorizontalPodAutoscaler"
metadata:
  labels:
    app: "choreo-linker-0.1.2"
  name: "choreo-linker-0-hpa"
spec:
  maxReplicas: 3
  metrics:
  - resource:
      name: "cpu"
      target:
        averageUtilization: 75
        type: "Utilization"
    type: "Resource"
  minReplicas: 2
  scaleTargetRef:
    apiVersion: "apps/v1"
    kind: "Deployment"
    name: "choreo-linker-0-deployment"

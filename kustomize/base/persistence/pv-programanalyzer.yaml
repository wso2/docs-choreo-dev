apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-choreo-programanalyzer
spec:
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  storageClassName: file
  capacity:
    storage: 500Mi
  hostPath:
    path: /home/docker/choreo-programanalyzer
  persistentVolumeReclaimPolicy: Delete
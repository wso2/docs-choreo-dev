apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-choreo-governance-service
spec:
  secretObjects:
    - secretName: secret-choreo-governance-service
      type: Opaque
      data:
        - objectName: CHOREO_GOVERNANCE_DB_MSSQL_PASSWORD
          key: CHOREO_GOVERNANCE_DB_MSSQL_PASSWORD
  parameters:
    objects: |
      array:
        - |
          objectName: choreo-governance-db-mssql-password
          objectType: secret
          objectAlias: CHOREO_GOVERNANCE_DB_MSSQL_PASSWORD
          objectVersion: "{{.CHOREO_GOVERNANCE_DB_MSSQL_PASSWORD}}"

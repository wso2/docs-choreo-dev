apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-cc-ga-credentials
spec:
  secretObjects:
    - secretName: secret-cc-ga-credentials
      type: Opaque
      data:
        - objectName: GLOBAL_ADAPTER_ADMIN_PASSWORD
          key: GLOBAL_ADAPTER_ADMIN_PASSWORD
        - objectName: GLOBAL_ADAPTER_MSSQL_PASSWORD
          key: GLOBAL_ADAPTER_MSSQL_PASSWORD
  parameters:
    objects: |
      array:
        - |
          objectName: apim-cc-global-adapter-admin-password
          objectType: secret
          objectAlias: GLOBAL_ADAPTER_ADMIN_PASSWORD
          objectVersion: "{{.GLOBAL_ADAPTER_ADMIN_PASSWORD}}"
        - |
          objectName: choreo-global-adapter-db-mssql-password
          objectType: secret
          objectAlias: GLOBAL_ADAPTER_MSSQL_PASSWORD
          objectVersion: "{{.GLOBAL_ADAPTER_MSSQL_PASSWORD}}"

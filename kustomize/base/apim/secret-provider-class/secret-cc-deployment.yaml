apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-cc-deployment
spec:
  parameters:
    objects: |
      array:
        - |
          objectName: mgw-ROUTER-KEYSTORE
          objectType: secret
          objectAlias: ROUTER_KEYSTORE_KEY
          objectVersion: "{{.ROUTER_KEYSTORE_KEY}}"
        - |
          objectName: mgw-ENFORCER-JWT-KEYSTORE-KEY
          objectType: secret
          objectAlias: ENFORCER_JWT_KEYSTORE_KEY
          objectVersion: "{{.ENFORCER_JWT_KEYSTORE_KEY}}"
        - |
          objectName: mgw-ENFORCER-JWT-KEYSTORE-CERTIFICATE
          objectType: secret
          objectAlias: ENFORCER_JWT_KEYSTORE_CERTIFICATE
          objectVersion: "{{.ENFORCER_JWT_KEYSTORE_CERTIFICATE}}"
        - |
          objectName: mgw-ENFORCER-KEYSTORE-KEY
          objectType: secret
          objectAlias: ENFORCER_KEYSTORE_KEY
          objectVersion: "{{.ENFORCER_KEYSTORE_KEY}}"

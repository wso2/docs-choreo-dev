apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-cc-rate-limiter
spec:
  secretObjects:
    - secretName: secret-cc-rate-limiter
      type: Opaque
      data:
        - objectName: RATE_LIMITER_REDIS_AUTH_KEY
          key: RATE_LIMITER_REDIS_AUTH_KEY
  parameters:
    objects: |
      array:
        - |
          objectName: mgw-RATE-LIMITER-KEYSTORE-CERT
          objectType: secret
          objectAlias: RATE_LIMITER_KEYSTORE_KEY
          objectVersion: "{{.RATE_LIMITER_KEYSTORE_KEY}}"
        - |
          objectName: {{.RATE_LIMITER_REDIS_AUTH_KEY_OBJ_NAME | default "apim-rate-limiter-redis-primary-access-key"}}
          objectType: secret
          objectAlias: RATE_LIMITER_REDIS_AUTH_KEY
          objectVersion: "{{.RATE_LIMITER_REDIS_AUTH_KEY}}"

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-apim
spec:
  secretObjects:
  - secretName: secret-apim
    type: Opaque
    data:
      - objectName: CHOREO_IS_ADMIN_PSWD
        key: CHOREO_IS_ADMIN_PSWD
      - objectName: H2_SHARED_DB_PSWD
        key: H2_SHARED_DB_PSWD
      - objectName: SUPER_ADMIN_PSWD
        key: SUPER_ADMIN_PSWD
      - objectName: ASGARDEO_SYSTEM_APP_CLIENT_SECRET
        key: ASGARDEO_SYSTEM_APP_CLIENT_SECRET
      - objectName: APIM_DASHBOARD_USER_PWD
        key: APIM_DASHBOARD_USER_PWD
      - objectName: APIM_DASHBOARD_USER_PWD_SHA256
        key: APIM_DASHBOARD_USER_PWD_SHA256
      - objectName: INSTANCE_BASED_AUTHZ_DISABLED_ORG_HANDLES
        key: INSTANCE_BASED_AUTHZ_DISABLED_ORG_HANDLES
  parameters:
    objects: |
      array:
        - |
          objectName: apim-CHOREO-IS-ADMIN-PSWD
          objectType: secret
          objectAlias: CHOREO_IS_ADMIN_PSWD
          objectVersion: "{{.CHOREO_IS_ADMIN_PSWD}}"
        - |
          objectName: apim-h2-shared-database-password
          objectType: secret
          objectAlias: H2_SHARED_DB_PSWD
          objectVersion: "{{.H2_SHARED_DB_PSWD}}"
        - |
          objectName: apim-super-admin-password
          objectType: secret
          objectAlias: SUPER_ADMIN_PSWD
          objectVersion: "{{.SUPER_ADMIN_PSWD}}"
        - |
          objectName: apim-asgardeo-system-app-client-secret
          objectType: secret
          objectAlias: ASGARDEO_SYSTEM_APP_CLIENT_SECRET
          objectVersion: "{{.ASGARDEO_SYSTEM_APP_CLIENT_SECRET}}"
        - |
          objectName: apim-dashboard-user-password
          objectType: secret
          objectAlias: APIM_DASHBOARD_USER_PWD
          objectVersion: "{{.APIM_DASHBOARD_USER_PWD}}"
        - |
          objectName: apim-dashboard-user-password-sha256
          objectType: secret
          objectAlias: APIM_DASHBOARD_USER_PWD_SHA256
          objectVersion: "{{.APIM_DASHBOARD_USER_PWD_SHA256}}"
        - |
          objectName: choreo-prod-auth-paid-org-handles
          objectType: secret
          objectAlias: INSTANCE_BASED_AUTHZ_DISABLED_ORG_HANDLES
          objectVersion: "{{.INSTANCE_BASED_AUTHZ_DISABLED_ORG_HANDLES}}"

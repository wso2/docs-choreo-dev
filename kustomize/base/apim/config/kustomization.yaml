configMapGenerator:
  - name: mgw-adapter-enforcer-conf
    behavior: create
    files:
      - adapter/config.toml
      - adapter/log4j2.properties
      - adapter/log_config.toml
  - name: pvtga-log-config
    behavior: create
    files:
      - private-global-adapter/log_config.toml
  - name: env-common-private-ga
    behavior: create
    literals:
      - moesif_ms_url={{.MOESIF_MS_URL}}
  - name: env-private-ga
    behavior: create
    literals:
      - moesif_ms_url={{.MOESIF_MS_URL}}
  - name: pvtga-feature-flags
    behavior: create
    literals:
      - FEATURE_FLAG_DEFAULT=true
      - FEATURE_STEP_QUOTA_LIMITING=false
      - FEATURE_FLAG_MONGODB_DIRECT_SEARCH=true
      - LOG4J_FORMAT_MSG_NO_LOOKUPS=true
      - FEATURE_FLAG_MONGODB_SINGLE_COLLECTION=true
  - name: cm-file-scheduled-mssql-tasks-config
    behavior: create
    files:
      - scheduled-mssql-tasks/config.yaml
  - name: cm-file-config-deployer-service
    behavior: create
    files:
      - config-deployer-service/config.toml
  - name: choreo-apim-devportal-conf
    behavior: create
    files:
      - devportal/devportal.config.js
  - name: cc-common-private-global-adapter-conf
    behavior: create
    files:
      - common-private-global-adapter/ga_config.toml
      - common-private-global-adapter/log_config.toml
  - name: cc-global-adapter-conf-v2
    behavior: create
    files:
      - global-adapter-v2/ga_config.toml
      - global-adapter-v2/log_config.toml
  - name: cc-global-adapter-conf-eu-migration
    behavior: create
    files:
      - global-adapter-v2/ga_config.toml
      - global-adapter-v2/log_config.toml
  - name: choreo-apim-am-conf
    behavior: create
    files:
      - am/deployment.toml
      - am/log4j2.properties
  - name: choreo-apim-docker-entrypoint
    behavior: create
    files:
      - am/docker-entrypoint.sh
  - name: choreo-governance-service-conf
    behavior: create
    files:
      - choreo-governance-service/application.yml
      - choreo-governance-service/log4j2.yaml
  - name: env-app-gateway-oauth-agent
    behavior: create
    literals:
      - REDIS_HOST="{{.REDIS_HOST | default ""}}"
      - PAT_CLIENT_ID="{{.PAT_CLIENT_ID | default ""}}"
      - PAT_CLIENT_TOKEN_EP="{{.PAT_CLIENT_TOKEN_EP | default ""}}"
      - PAT_TOKEN_TTL_BUFFER="{{.PAT_TOKEN_TTL_BUFFER | default "10"}}"
  - name: cm-app-gateway-oauth-agent
    behavior: create
    literals:
      - ENC_KEY_FILE_PATH="/etc/agent-secrets/OAUTH_AGENT_ENC_KEY"
      - REDIS_PORT="6380"
      - REDIS_PWD_FILE_PATH="/etc/agent-secrets/REDIS_PASSWORD"
      - REDIS_DB="1"
      - PAT_CLIENT_SECRET_FILE_PATH="/etc/agent-secrets/PAT_CLIENT_SECRET"

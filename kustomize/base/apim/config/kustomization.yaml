resources:
  - internal-global-adapter

configMapGenerator:
  - name: cm-file-mgw-adapter-enforcer
    behavior: create
    files:
      - adapter/config.toml
      - adapter/log4j2.properties
      - adapter/log_config.toml  
  - name: cm-file-mgw-ga-cp-adapter
    behavior: create
    files:
      - adapter/control-plane-adapter/config.toml
      - adapter/control-plane-adapter/log4j2.properties
      - adapter/control-plane-adapter/log_config.toml
  - name: cm-file-cc-internal-global_adapter
    behavior: create
    files:
      - internal-global-adapter/ga_config.toml
      - internal-global-adapter/log_config.toml

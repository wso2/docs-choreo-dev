reconnect_retry_count = 10

[database.local]
url = "jdbc:h2:./repository/database/WSO2CARBON_DB;DB_CLOSE_ON_EXIT=FALSE"

[indexing]
enable = false

{{range .SERVICE_PROVIDERS}}
[[choreo.serviceProvider]]
clientId="{{.CLIENT_ID}}"
scopes="{{.SCOPES}}"
{{end}}

[choreo.ChoreoTokenHandler]
appServiceUrl="{{.APP_SERVICE_URL}}"
authzServiceUrl="{{.AUTHZ_SERVICE_URL}}"
authzServiceEnabled={{.AUTHZ_SERVICE_ENABLED}}
choreoControlPlaneOrgUuid="{{.CP_ORG_ID}}"
allowed_claims="aut, given_name, authenticated_idp, name, family_name, middle_name, nickname, updated_at, email, email_verified, groups, username, is_eidp"
instanceBasedAuthzServiceEnabled={{.INSTANCE_BASED_AUTHZ_SERVICE_ENABLED}}
instanceBasedAuthzServiceDisabledOrgs="{{.INSTANCE_BASED_AUTHZ_SERVICE_DISABLED_ORGS}}"

[choreo.azure_service_bus]
connection_string = "$env{ASB_CONNECTION_STRING}"

{{range .PER_ORG_CONNECTIONS}}
[[choreo.per_org_connection]]
orgId="{{.ORG_ID}}"
connection_string = "{{.CONNECTION_STRING}}"
{{end}}

[choreo.azure_service_bus.org_cleanup]
enabled = true
worker_threads = 10
executor = "choreo-apim"
subscription = "choreo-apim"
topic = "org-remover-request"
result_topic = "org-remover-result"

[choreo.choreo_api_quota_limiter]
quota_limit_service_hostname = "{{.QUOTA_LIMIT_HOSTNAME}}"
quotaLimit_service_port = "9090"

[[apim.jwt.issuer]]
name = "{{.JWT_ISSUER_NAME}}"
jwks.url = "{{.JWT_JWKS_URL}}"

{{range .JWT_AUDIENCES}}
[[apim.rest_api.jwt.audience]]
basepath = "{{.BASEPATH}}"
audience = "{{.AUDIENCE}}"
{{end}}

[[oauth.custom_grant_type]]
name="urn:ietf:params:oauth:grant-type:token-exchange"
grant_handler="org.wso2.am.choreo.extensions.token.handler.ChoreoTokenExchangeGrantHandler"
grant_validator="org.wso2.carbon.identity.oauth2.grant.token.exchange.TokenExchangeGrantValidator"
[oauth.custom_grant_type.properties]
IdTokenAllowed=true

[oauth.extensions.token_types.token_type]
name="JWT"
issuer="org.wso2.am.choreo.extensions.token.handler.ChoreoJWTTokenIssuer"

[oauth.grant_type.jwt_bearer]
enable = true
grant_handler = "org.wso2.carbon.identity.oauth2.grant.jwt.JWTBearerGrantHandler"
grant_validator = "org.wso2.carbon.identity.oauth2.grant.jwt.JWTGrantValidator"

[oauth.grant_type.jwt]
enable_iat_validation="true"
iat_validity_period=300

[oauth.token_cleanup]
retain_access_tokens_for_auditing=false

[[resource.access_control]]
context="(.*)/fileupload/resource(.*)"
secure=false
http_method = "all"

[[resource.access_control]]
context="(.*)/fileupload/(.*)"
secure=true
http_method = "all"
permissions = ["/permission/protected/"]

[[resource.access_control]]
context = "(.*)/((\\.+)|(.*;+.*)|%2e)/(.*)"
http_method = "all"
permissions = ["/"]
secure = true

[apim.operation_policy]
provider = "bcentral"
url = "{{.OPERATION_POLICY_URL}}"

[choreo.asgardeo_system_app]
token_endpoint="{{.ASGARDEO_SYSTEM_APP_TOKEN_ENDPOINT}}"
client_id="CHOREO_SYSTEM_APP_MANAGER"
client_secret="$env{ASGARDEO_SYSTEM_APP_CLIENT_SECRET}"
authz_endpoint="{{.ASGARDEO_SYSTEM_AUTHZ_TOKEN_ENDPOINT}}"

{{range .PER_ORG_SETTINGS}}
[[choreo.asgardeo.per_org_settings]]
org_id="{{.ORG_ID}}"
app_owner="app_creator"
app_jwt_token_sub_claim="email"
{{end}}

[identity.auth_framework.endpoint] 
app_password="$env{APIM_DASHBOARD_USER_PWD}"

[account_recovery.endpoint.auth] 
hash="$env{APIM_DASHBOARD_USER_PWD_SHA256}"

[transport.http.properties]
maxHttpHeaderSize="65536"

[cache.jwks_cache]
timeout = 1800

[oauth.jwks_endpoint]
connection_timeout = 10000
read_timeout = 30000

[choreo.api_backend_url_validation]
enable_organization_validation = true

[choreo.rudder]
endpoint_url = "{{.RUDDER_ENDPOINT_URL}}"
enable_domain_cache = false

[choreo.URLManager]
endpoint_url = "{{.URL_MANAGER_ENDPOINT_URL}}"

[authentication.authenticator.choreo_in_built_idp_authenticator]
name="choreo_in_built_idp_authenticator"
enable=true
parameters.userMgtServiceUrl="{{.IDP_AUTH_USER_MGT_URL}}"

[authentication.endpoints]
login_url="/auth/signin"
retry_url="/auth/error"

[oauth.endpoints]
oauth2_error_page="$ref{server.base_path}/auth/error"

[choreo.builtin.authorization]
service_url="{{.AUTHORIZATION_SERVICE_URL}}"

[choreo.app_service]
url="{{.APP_SVC_URL}}"

[cache.app_info_cache]
enable = true
timeout = "60"
capacity = "5000"

[[default.subscription.policy]]
display_name = "Unlimited"
request_count = "-1"
time_unit = "min"
description = "Allows unlimited requests"

[[default.subscription.policy]]
display_name = "Gold"
request_count = "5000"
time_unit = "min"
description = "Allows 5000 requests per minute"

[[default.subscription.policy]]
display_name = "Silver"
request_count = "2000"
time_unit = "min"
description = "Allows 2000 requests per minute"

[[default.subscription.policy]]
display_name = "Bronze"
request_count = "1000"
time_unit = "min"
description = "Allows 1000 requests per minute"

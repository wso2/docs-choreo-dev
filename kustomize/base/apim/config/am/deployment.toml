[server]
hostname = "{{.SERVER_HOST_NAME}}"
node_ip = "$env{NODE_IP}"
#offset=0
mode = "single" #single or ha
base_path = "${carbon.protocol}://${carbon.host}:${carbon.management.port}"
#discard_empty_caches = false
server_role = "control-plane"
enable_traffic_management = false

[super_admin]
username = "{{.SUPER_ADMIN_USERNAME}}"
password = "$env{SUPER_ADMIN_PSWD}"
create_admin_account = true

[user_store]
type = "database_unique_id"

[user_store.properties]
UsernameJavaScriptRegEx="^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$|^[\\S]{3,40}$"
UsernameJavaRegEx="^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$|^[\\S]{3,40}$"
PasswordJavaRegEx = "^[\\S]{5,30}$"
PasswordJavaScriptRegEx = "^[\\S]{5,30}$"
RolenameJavaScriptRegEx = "^[\\S]{3,50}$"
RolenameJavaRegEx = "^[\\S]{3,50}$"
CaseInsensitiveUsername = false

[realm_manager]
data_source = "WSO2USER_DB"

[database.apim_db]
type = "mssql"
url = "{{.APIM_DB_URL}}"
username = "choreo_apim_db_user"
password = "$env{CHOREO_APIM_DB_PASSWORD}"
driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
validationQuery = "SELECT 1"

[database.apim_db.pool_options]
maxActive = "100"
maxWait = "60000"
# (maxAge): do not keep the same connection live over 12 hours (43200000ms)
maxAge = "43200000"
minIdle = "10"
testOnBorrow = "true"
testWhileIdle = "true"
validationQueryTimeout = "2"
validationInterval = "30000"
defaultAutoCommit = "true"
removeAbandoned = "true"
removeAbandonedTimeout = "180"
logAbandoned = "true"
jdbcInterceptors="SlowQueryReport(threshold=200); org.wso2.am.choreo.extensions.core.jdbcpool.ConnectionLoggingInterceptor"

[database.shared_db]
type = "mssql"
url = "{{.SHARED_DB_URL}}"
username = "choreo_apim_shared_db_user"
password = "$env{CHOREO_APIM_SHARED_DB_PASSWORD}"
driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
validationQuery = "SELECT 1"

[database.shared_db.pool_options]
maxActive = "100"
maxWait = "60000"
# (maxAge): do not keep the same connection live over 12 hours (43200000ms)
maxAge = "43200000"
minIdle = "10"
testOnBorrow = "true"
testWhileIdle = "true"
validationQueryTimeout = "2"
validationInterval = "30000"
defaultAutoCommit = "true"
removeAbandoned = "true"
removeAbandonedTimeout = "180"
logAbandoned = "true"
jdbcInterceptors="{{.SHARED_DB_JDBS_INTERCEPTORS}}"

[database.user]
url = "{{.DB_URL}}"
username = "choreo_apim_user_db_user"
password = "$env{CHOREO_APIM_USER_DB_PASSWORD}"
driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
validationQuery = "SELECT 1"

[database.user.pool_options]
maxActive= "100"
maxWait = "60000"
# (maxAge): do not keep the same connection live over 12 hours (43200000ms)
maxAge = "43200000"
minIdle = "10"
testOnBorrow = "true"
testWhileIdle = "true"
validationQueryTimeout = "2"
validationInterval = "30000"
defaultAutoCommit = "true"
removeAbandoned = "true"
removeAbandonedTimeout = "180"
logAbandoned = "true"
jdbcInterceptors="SlowQueryReport(threshold=200)"

[apim.registry]
type = "mongodb"

[apim.persistence.properties]
connection_string = "{{.APIM_PERSISTENCE_CS}}"
api_uri = "https://cloud.mongodb.com/api/atlas/v1.0"
group_id = "{{.APIM_PERSISTENCE_GROUP_ID}}"
cluster_name = "choreo-apim"
public_key = "$env{MONGO_DB_ATLAS_PUBLIC_KEY}"
private_key = "$env{MONGO_DB_ATLAS_PRIVATE_KEY}"
thread_count = 5
retry_count = 3
create_atlas_search_indexes = false

[http_access_log]
useLogger = true
pattern = "%h %A %l %u %t %r %s %b %{Referer}i %{User-Agent}i %{X-Forwarded-For}i %T"

[keystore.primary]
file_name =  "primary-keystore.pfx"
type =  "PKCS12"
password =  "$env{PRIMARY_KEYSTORE_PSWD}"
alias =  "wso2carbon"
key_password =  "$env{PRIMARY_KEYSTORE_KEY_PSWD}"

[keystore.tls]
file_name =  "tls-keystore.pfx"
type =  "PKCS12"
password =  "$env{TLS_KEYSTORE_PSWD}"
alias =  "wso2carbon"
key_password =  "$env{TLS_KEYSTORE_KEY_PSWD}"

[keystore.internal]
file_name =  "internal-keystore.pfx"
type =  "PKCS12"
password =  "$env{INTERNAL_KEYSTORE_PSWD}"
alias =  "wso2carbon"
key_password =  "$env{INTERNAL_KEYSTORE_KEY_PSWD}"

[truststore]
file_name = "client-truststore.jks"
type = "JKS"
password = "$env{TRUSTSTORE_PSWD}"

{{range .ENVIRONMENTS}}
[[apim.gateway.environment]]
name = "{{.NAME}}"
type = "{{.TYPE}}"
display_in_api_console = true
description = "{{.DESCRIPTION}}"
show_as_token_endpoint_url = true
service_url = "https://choreo-am-gateway-service:${mgt.transport.https.port}/services/"
username= "${admin.username}"
password= "${admin.password}"
ws_endpoint = "ws://localhost:9099"
wss_endpoint = "wss://localhost:8099"
http_endpoint = "{{.HTTP_ENDPOINT}}"
https_endpoint = "{{.HTTPS_ENDPINT}}"
display_name = "{{.DISPLAY_NAME}}"
data_plane_id = "{{.DATAPLANE_ID}}"
gateway_accessibility_type = "{{.ACCESSIBILITY_TYPE}}"
{{end}}


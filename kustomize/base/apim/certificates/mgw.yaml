apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mgw-cert
spec:
  commonName: localhost
  secretName: mgw-cert
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS8
  dnsNames:
    - adapter
    - enforcer
    - router
    - localhost
  subject:
    organizations:
      - WSO2
    organizationalUnits:
      - WSO2
    localities:
      - "Mountain View"
    provinces:
      - CA
    countries:
      - US
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io

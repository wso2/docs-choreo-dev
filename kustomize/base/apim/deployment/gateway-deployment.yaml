apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    choreo.component: apim-gateway
  name: choreo-apim-gateway-deployment
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      deployment: choreo-am-gateway
  template:
    metadata:
      labels:
        deployment: choreo-am-gateway
        choreo.component: apim-gateway
    spec:
      # Remove fsGroup due to issue in init container. TODO: Remove init container.
      # securityContext:
      #   fsGroup: 802
      securityContext:
        allowPrivilegeEscalation: false
      containers:
      - name: wso2am-gateway
        image: choreoctrlplane.azurecr.io/choreoipaas/choreo-product-apim:latest
        env:
        - name: PROFILE_NAME
          value: gateway-worker
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: H2_SHARED_DB_PSWD
          valueFrom:
            secretKeyRef:
              key: H2_SHARED_DB_PSWD
              name: secret-apim
        - name: KEYSTORE_KEY_PSWD
          valueFrom:
            secretKeyRef:
              key: KEYSTORE_KEY_PSWD
              name: secret-apim
        - name: KEYSTORE_PSWD
          valueFrom:
            secretKeyRef:
              key: KEYSTORE_PSWD
              name: secret-apim
        - name: SUPER_ADMIN_PSWD
          valueFrom:
            secretKeyRef:
              key: SUPER_ADMIN_PSWD
              name: secret-apim
        - name: TRUSTSTORE_PSWD
          valueFrom:
            secretKeyRef:
              key: TRUSTSTORE_PSWD
              name: secret-apim
        - name: CHOREO_IS_ADMIN_PSWD
          valueFrom:
            secretKeyRef:
              key: CHOREO_IS_ADMIN_PSWD
              name: secret-apim
        - name: JVM_MEM_OPTS
          value: "-Xms512m -Xmx512m"
        livenessProbe:
          httpGet:
            path: /services/Version
            port: 9763
          initialDelaySeconds: 120
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /services/Version
            port: 9763
          initialDelaySeconds: 120
          periodSeconds: 10
        lifecycle:
          preStop:
            exec:
              command:  ['sh', '-c', '${WSO2_SERVER_HOME}/bin/wso2server.sh stop']
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
          limits:
            memory: 2Gi
            cpu: 1000m
        securityContext:
          runAsUser: 802
          runAsGroup: 802
        ports:
        - containerPort: 8280
          protocol: TCP
        - containerPort: 8243
          protocol: TCP
        - containerPort: 9763
          protocol: TCP
        - containerPort: 9443
          protocol: TCP
        volumeMounts:
        - name: wso2am-gateway-storage-volume
          mountPath: /home/wso2carbon/wso2am-3.2.0/repository/deployment/server/synapse-configs
          subPath: synapse-configs
        - name: wso2am-gateway-conf
          mountPath: /home/wso2carbon/wso2-config-volume/repository/conf/deployment.toml
          subPath: deployment.toml
      serviceAccountName: sa-choreo-apim
      volumes:
      - name: wso2am-gateway-storage-volume
        persistentVolumeClaim:
          claimName: pvc-apimstorage
      - name: wso2am-gateway-conf
        configMap:
          name: choreo-apim-gateway-conf

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: apim-gateway
  name: choreo-apim-gateway-deployment
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      deployment: choreo-am-gateway
  template:
    metadata:
      labels:
        deployment: choreo-am-gateway
        choreo.component: apim-gateway
    spec:
      # Remove fsGroup due to issue in init container. TODO: Remove init container.
      # securityContext:
      #   fsGroup: 802
      securityContext:
        allowPrivilegeEscalation: false
      containers:
      - name: wso2am-gateway
        image: choreocontrolplane.azurecr.io/choreoipaas/choreo-product-apim:v4.0.0-r14062021.2
        env:
        - name: PROFILE_NAME
          value: gateway-worker
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: PRIMARY_KEYSTORE_PSWD
          valueFrom:
            secretKeyRef:
              key: PRIMARY_KEYSTORE_PSWD
              name: secret-apim-keystore-passwords
        - name: PRIMARY_KEYSTORE_KEY_PSWD
          valueFrom:
            secretKeyRef:
              key: PRIMARY_KEYSTORE_KEY_PSWD
              name: secret-apim-keystore-passwords
        - name: TLS_KEYSTORE_PSWD
          valueFrom:
            secretKeyRef:
              key: TLS_KEYSTORE_PSWD
              name: secret-apim-keystore-passwords
        - name: TLS_KEYSTORE_KEY_PSWD
          valueFrom:
            secretKeyRef:
              key: TLS_KEYSTORE_KEY_PSWD
              name: secret-apim-keystore-passwords
        - name: INTERNAL_KEYSTORE_PSWD
          valueFrom:
            secretKeyRef:
              key: INTERNAL_KEYSTORE_PSWD
              name: secret-apim-keystore-passwords
        - name: INTERNAL_KEYSTORE_KEY_PSWD
          valueFrom:
            secretKeyRef:
              key: INTERNAL_KEYSTORE_KEY_PSWD
              name: secret-apim-keystore-passwords
        - name: TRUSTSTORE_PSWD
          valueFrom:
            secretKeyRef:
              key: TRUSTSTORE_PSWD
              name: secret-apim-keystore-passwords
        - name: H2_SHARED_DB_PSWD
          valueFrom:
            secretKeyRef:
              key: H2_SHARED_DB_PSWD
              name: secret-apim
        - name: SUPER_ADMIN_PSWD
          valueFrom:
            secretKeyRef:
              key: SUPER_ADMIN_PSWD
              name: secret-apim
        - name: CHOREO_IS_ADMIN_PSWD
          valueFrom:
            secretKeyRef:
              key: CHOREO_IS_ADMIN_PSWD
              name: secret-apim
        - name: JVM_MEM_OPTS
          value: "-Xms2048m -Xmx2048m"
        livenessProbe:
          httpGet:
            path: /services/Version
            port: 9763
          initialDelaySeconds: 120
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /services/Version
            port: 9763
          initialDelaySeconds: 120
          periodSeconds: 10
        lifecycle:
          preStop:
            exec:
              command:  ['sh', '-c', '${WSO2_SERVER_HOME}/bin/wso2server.sh stop']
        resources:
          requests:
            memory: 3Gi
            cpu: 2000m
          limits:
            memory: 4Gi
            cpu: 3000m
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 10500
          runAsGroup: 10500
        ports:
        - containerPort: 8280
          protocol: TCP
        - containerPort: 8243
          protocol: TCP
        - containerPort: 9763
          protocol: TCP
        - containerPort: 9443
          protocol: TCP
        volumeMounts:
        - name: wso2am-gateway-conf
          mountPath: /home/wso2carbon/wso2-config-volume/repository/conf/deployment.toml
          subPath: deployment.toml
        - name: apim-docker-entrypoint
          mountPath: /home/wso2carbon/docker-entrypoint.sh
          subPath: docker-entrypoint.sh
        - name: secret-apim-keystore-passwords
          mountPath: /mnt/csi/keystore-passwords
          readOnly: true
        - name: secret-apim-primary-keystore
          mountPath: /home/wso2carbon/wso2-keystores/primary-keystore.pfx
          readOnly: true
          subPath: APIM_PRIMARY_KEYSTORE
        - name: secret-apim-tls-keystore
          mountPath: /home/wso2carbon/wso2-keystores/tls-keystore.pfx
          readOnly: true
          subPath: APIM_TLS_KEYSTORE
        - name: secret-apim-internal-keystore
          mountPath: /home/wso2carbon/wso2-keystores/internal-keystore.pfx
          readOnly: true
          subPath: APIM_INTERNAL_KEYSTORE
        - name: apim-truststore
          mountPath: /home/wso2carbon/wso2am-4.0.0-SNAPSHOT/repository/resources/security/client-truststore.jks
          subPath: client-truststore.jks
        - name: secret-apim
          mountPath: /mnt/csi/secret-apim
          readOnly: true
      serviceAccountName: sa-choreo-apim
      volumes:
      - name: wso2am-gateway-conf
        configMap:
          name: choreo-apim-gateway-conf
      - name: apim-docker-entrypoint
        configMap:
          name: choreo-apim-docker-entrypoint
          defaultMode: 0407
      - name: secret-apim-keystore-passwords
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-apim-keystore-passwords
          nodePublishSecretRef:
            name: csi-secret-store-azure
      - name: secret-apim-primary-keystore
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-apim-primary-keystore
          nodePublishSecretRef:
            name: csi-secret-store-azure
      - name: secret-apim-tls-keystore
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-apim-tls-keystore
          nodePublishSecretRef:
            name: csi-secret-store-azure
      - name: secret-apim-internal-keystore
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-apim-internal-keystore
          nodePublishSecretRef:
            name: csi-secret-store-azure
      - name: apim-truststore
        configMap:
          name: choreo-apim-truststore
      - name: secret-apim
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-apim
          nodePublishSecretRef:
            name: csi-secret-store-azure

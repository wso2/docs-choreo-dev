# Deployment for Health check service of Global Adapter

apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-adapter-health-check-client
  annotations:
    checkov.io/skip1: CKV_K8S_25=Temporarily suppressing as there is no defined fix for this by the Bridgecrew
    checkov.io/skip2: CKV_K8S_AZURE_WSO2_2=LinkerD is not enabled
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: global-adapter-health-check-client
  template:
    metadata:
      labels:
        choreo.component: global-adapter-health-check-client
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
      - name: global-adapter-health-check-client
        image: ga-new:1
        imagePullPolicy: Never
        securityContext:
          runAsNonRoot: true
          runAsUser: 10500
          runAsGroup: 10500
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - all
            add: [ "NET_RAW" ]
          readOnlyRootFilesystem: true
        env:
        - name: SERVER_PORT
          value: "7777"
        - name: ASB_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: secret-asb
              key: ASB_CONNECTION_STRING
        - name: TOPIC_CLIENT_ID
          value: 520bc16b-6ff6-4d94-970e-1fa9c4708084
        - name: IDLE_TIMEOUT
          value: "1800000"
        - name: PRICING_TIER
          value: Standard
        - name: MESSAGING_DESTINATION
          value: notification
        - name: HEALTH_CHECK_SCHEDULE
          value: "*/60 * * * * *"
        readinessProbe:
          initialDelaySeconds: 15
          timeoutSeconds: 15
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          exec:
            command:
              - /bin/sh
              - -c
              - pgrep java
        livenessProbe:
          initialDelaySeconds: 20
          timeoutSeconds: 15
          periodSeconds: 30
          failureThreshold: 3
          successThreshold: 1
          exec:
            command:
            - /bin/sh
            - -c
            - pgrep java
        ports:
        - containerPort: 7777
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 256Mi
      volumes:
        - name: secret-asb
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-asb
            nodePublishSecretRef:
              name: csi-secret-store-azure

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
    checkov.io/skip4: CKV_K8S_25=Temporarily suppressing as there is no defined fix for this by the Bridgecrew
    checkov.io/skip6: CKV_K8S_38=Service account token is required when using Linkerd
  labels:
    choreo.component: apim-devportal
  name: apim-devportal-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: apim-devportal
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        choreo.component: apim-devportal
        antiaffinity: apim-devportal-deployment
      annotations:
        linkerd.io/inject: enabled
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - apim-devportal-deployment
              topologyKey: kubernetes.io/hostname
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: true
      containers:
        - image: choreocontrolplane.azurecr.io/choreoipaas/choreo-apim-devportal:v0.1.8
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10500
            runAsGroup: 10500
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
              add:
                - NET_RAW
            readOnlyRootFilesystem: true
          name: apim-devportal
          envFrom:
            - configMapRef:
                name: cm-feature-flags
          readinessProbe:
            initialDelaySeconds: 15
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: 8080
              path: /health
          livenessProbe:
            initialDelaySeconds: 20
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: 8080
              path: /health
          ports:
            - containerPort: 8080
              name: devportal-port
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 768Mi
            requests:
              cpu: 300m
              memory: 512Mi
          volumeMounts:
            - name: devportal-var-cache-dir
              mountPath: /var/cache/nginx
            - name: devportal-var-run-dir
              mountPath: /var/run
            - name: devportal-conf
              mountPath: /app/devportal.config.js
              subPath: devportal.config.js
      restartPolicy: Always
      volumes:
        - name: devportal-conf
          configMap:
            name: choreo-apim-devportal-conf
        - name: devportal-var-cache-dir
          emptyDir: { }
        - name: devportal-var-run-dir
          emptyDir: { }
      serviceAccountName: sa-choreo-apim

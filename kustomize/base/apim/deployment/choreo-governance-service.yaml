apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=Required by LinkerD
  labels:
    choreo.component: choreo-governance-service
  name: choreo-governance-service
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: choreo-governance-service
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: choreo-governance-service
        antiaffinity: choreo-governance-service
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: choreo-governance-service
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-governance-service:latest
          env:
            - name: GOVERNANCE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: CHOREO_GOVERNANCE_DB_MSSQL_PASSWORD
                  name: secret-choreo-governance-service
          ports:
            - containerPort: 8080
              name: service-port
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: service-port
              path: /healthz/readiness
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: service-port
              path: /healthz/liveness
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 500Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10500
            runAsGroup: 10500
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: choreo-governance-service-conf
              mountPath: /home/wso2/application.yml
              subPath: application.yml
              readOnly: true
            - name: choreo-governance-service-conf
              mountPath: /home/wso2/log4j2.yaml
              subPath: log4j2.yaml
              readOnly: true
            - name: secret-choreo-governance-service
              mountPath: "/mnt/csi/secret-choreo-governance-service"
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: choreo-governance-service-conf
          configMap:
            name: choreo-governance-service-conf
        - name: secret-choreo-governance-service
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-choreo-governance-service
            nodePublishSecretRef:
              name: csi-secret-store-azure
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  choreo.component: choreo-governance-service
              topologyKey: kubernetes.io/hostname

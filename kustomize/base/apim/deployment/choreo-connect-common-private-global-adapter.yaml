# Deployment for Common Private Global Adapter

apiVersion: apps/v1
kind: Deployment
metadata:
  name: choreo-connect-common-private-global-adapter
  annotations:
    checkov.io/skip1: CKV_K8S_25=Temporarily suppressing as there is no defined fix for this by the Bridgecrew
    checkov.io/skip2: CKV_K8S_AZURE_WSO2_2=LinkerD is not enabled
spec:
  progressDeadlineSeconds: 900
  replicas: 1
  selector:
    matchLabels:
      choreo.component: choreo-connect-common-private-global-adapter
  template:
    metadata:
      labels:
        choreo.component: choreo-connect-common-private-global-adapter
        antiaffinity: choreo-connect-common-private-global-adapter
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - choreo-connect-common-private-global-adapter
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10500
        runAsGroup: 10500
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: choreo-connect-global-adapter
          volumeMounts:
            - mountPath: /home/wso2/security/keystore/mg.key
              name: secret-mgw-keystore
              readOnly: true
              subPath: ADAPTER_KEYSTORE_KEY
            - mountPath: /home/wso2/security/keystore/mg.pem
              name: mgw-common-cert-vol
              readOnly: true
              subPath: mg.pem
            - mountPath: /home/wso2/security/truststore/controlplane.pem
              name: mgw-adapter-truststore-vol
              readOnly: true
              subPath: controlplane.pem
            - mountPath: /home/wso2/security/truststore/local-adapter.pem
              name: mgw-common-cert-vol
              readOnly: true
              subPath: mg.pem
            - mountPath: /home/wso2/conf
              name: global-adapter-config
            - name: secret-cc-ga-credentials
              mountPath: /mnt/csi/secret-cc-ga-credentials
              readOnly: true
            - name: secret-apim
              mountPath: /mnt/csi/secret-apim
              readOnly: true
            - name: log-volume
              mountPath: logs
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-connect-common-private-global-adapter:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
              add:
                - "NET_RAW"
          envFrom:
            - configMapRef:
                name: cm-feature-flags
            - secretRef:
                name: secret-redis
          env:
            - name: ADAPTER_PRIVATE_KEY_PATH
              value: "/home/wso2/security/keystore/mg.key"
            - name: ADAPTER_PUBLIC_CERT_PATH
              value: "/home/wso2/security/keystore/mg.pem"
            - name: ga_db_pwd
              valueFrom:
                secretKeyRef:
                  key: GLOBAL_ADAPTER_MSSQL_PASSWORD
                  name: secret-cc-ga-credentials
            - name: cp_admin_pwd
              valueFrom:
                secretKeyRef:
                  key: SUPER_ADMIN_PSWD
                  name: secret-apim
            - name: moesif_ms_auth_pwd
              valueFrom:
                secretKeyRef:
                  key: MOESIF_MS_AUTH_PWD
                  name: secret-mgw-analytics
          resources:
            requests:
              memory: "1000Mi"
              cpu: "500m"
            limits:
              memory: "1000Mi"
              cpu: "750m"
          ports:
            - containerPort: 18000
            - containerPort: 9745
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: 9745
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /readyz
              port: 9745
            initialDelaySeconds: 8
            periodSeconds: 5
      volumes:
        - name: log-volume
          emptyDir: {}
        - name: global-adapter-config
          configMap:
            name: cc-common-private-global-adapter-conf
        - name: mgw-common-cert-vol
          configMap:
            name: mgw-common-cert
        - name: mgw-adapter-truststore-vol
          configMap:
            name: mgw-adapter-truststore
        - name: secret-mgw-keystore
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-mgw-keystore
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-mgw-analytics
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-mgw-analytics
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-cc-ga-credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-cc-ga-credentials
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-apim
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-apim
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always

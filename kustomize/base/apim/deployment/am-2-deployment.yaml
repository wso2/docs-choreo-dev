apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: apim-am
  name: choreo-apim-am-2-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      deployment: choreo-am
      node: choreo-am-2
  template:
    metadata:
      labels:
        deployment: choreo-am
        node: choreo-am-2
        choreo.component: apim-am
    spec:
      # Remove fsGroup due to issue in init container. TODO: Remove init container.
      # securityContext:
      #   fsGroup: 802
      securityContext:
        allowPrivilegeEscalation: false    
      containers:
        - name: wso2am
          image: choreoctrlplane.azurecr.io/choreoipaas/choreo-apim:latest
          livenessProbe:
            httpGet:
              path: /services/Version
              port: 9763
            initialDelaySeconds: 300
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /services/Version
              port: 9763
            initialDelaySeconds: 300
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command:  ['sh', '-c', '${WSO2_SERVER_HOME}/bin/wso2server.sh stop']
          resources:
            requests:
              memory: 2Gi
              cpu: 2000m
            limits:
              memory: 3Gi
              cpu: 3000m
          securityContext:
            runAsUser: 802
            runAsGroup: 802
          ports:
            - containerPort: 9763
              protocol: "TCP"
            - containerPort: 9443
              protocol: "TCP"
            - containerPort: 9711
              protocol: "TCP"
            - containerPort: 9611
              protocol: "TCP"
            - containerPort: 5672
              protocol: "TCP"
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: H2_SHARED_DB_PSWD
              valueFrom:
                secretKeyRef:
                  key: H2_SHARED_DB_PSWD
                  name: secret-apim
            - name: KEYSTORE_KEY_PSWD
              valueFrom:
                secretKeyRef:
                  key: KEYSTORE_KEY_PSWD
                  name: secret-apim
            - name: KEYSTORE_PSWD
              valueFrom:
                secretKeyRef:
                  key: KEYSTORE_PSWD
                  name: secret-apim
            - name: CHOREO_APIM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: CHOREO_APIM_DB_PASSWORD
                  name: secret-apim-db
            - name: CHOREO_APIM_SHARED_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: CHOREO_APIM_SHARED_DB_PASSWORD
                  name: secret-apim-shared-db
            - name: CHOREO_APIM_USER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: CHOREO_APIM_USER_DB_PASSWORD
                  name: secret-apim-user-db                  
            - name: SUPER_ADMIN_PSWD
              valueFrom:
                secretKeyRef:
                  key: SUPER_ADMIN_PSWD
                  name: secret-apim
            - name: TRUSTSTORE_PSWD
              valueFrom:
                secretKeyRef:
                  key: TRUSTSTORE_PSWD
                  name: secret-apim
            - name: CHOREO_IS_ADMIN_PSWD
              valueFrom:
                secretKeyRef:
                  key: CHOREO_IS_ADMIN_PSWD
                  name: secret-apim        
            - name: JVM_MEM_OPTS
              value: "-Xms1024m -Xmx1024m"
          volumeMounts:
            - name: wso2am-storage
              mountPath: /home/wso2carbon/wso2am-3.2.0/repository/deployment/server/executionplans
              subPath: executionplans
            - name: wso2am-conf
              mountPath: /home/wso2carbon/wso2-config-volume/repository/conf
            - name: wso2am-storage
              mountPath: /home/wso2carbon/solr/database
              subPath: solr/node2/database
            - name: wso2am-storage
              mountPath: /home/wso2carbon/solr/indexed-data
              subPath: solr/node2/indexed-data
            - name: wso2am-conf-entrypoint
              mountPath: /home/wso2carbon/docker-entrypoint.sh
              subPath: docker-entrypoint.sh
            - name: mysql-connector-jar
              mountPath: /home/wso2carbon/wso2-artifact-volume/repository/components/lib
      serviceAccountName: sa-choreo-apim
      volumes:
        - name: wso2am-storage
          persistentVolumeClaim:
            claimName: pvc-apimstorage
        - name: wso2am-conf
          configMap:
            name: choreo-apim-am-2-conf
        - name: wso2am-conf-entrypoint
          configMap:
            name: choreo-apim-am-entrypoint-conf
            defaultMode: 0407
        - name: mysql-connector-jar
          emptyDir: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: apim-am
  name: choreo-apim-am-1-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      deployment: choreo-am
      node: choreo-am-1
  template:
    metadata:
      labels:
        deployment: choreo-am
        node: choreo-am-1
        choreo.component: apim-am
    spec:
      # Remove fsGroup due to issue in init container. TODO: Remove init container.
      # securityContext:
      #   fsGroup: 802
      securityContext:
        allowPrivilegeEscalation: false
      containers:
        - name: wso2am
          image: choreoctrlplane.azurecr.io/choreoipaas/choreo-product-apim:latest
          livenessProbe:
            httpGet:
              path: /services/Version
              port: 9763
            initialDelaySeconds: 300
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /services/Version
              port: 9763
            initialDelaySeconds: 300
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command:  ['sh', '-c', '${WSO2_SERVER_HOME}/bin/wso2server.sh stop']
          resources:
            requests:
              memory: 2Gi
              cpu: 2000m
            limits:
              memory: 3Gi
              cpu: 3000m
          securityContext:
            runAsUser: 802
            runAsGroup: 802
          ports:
            - containerPort: 9763
              protocol: "TCP"
            - containerPort: 9443
              protocol: "TCP"
            - containerPort: 9711
              protocol: "TCP"
            - containerPort: 9611
              protocol: "TCP"
            - containerPort: 5672
              protocol: "TCP"
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PRIMARY_KEYSTORE_PSWD
              valueFrom:
                secretKeyRef:
                  key: PRIMARY_KEYSTORE_PSWD
                  name: secret-apim-keystore-passwords
            - name: PRIMARY_KEYSTORE_KEY_PSWD
              valueFrom:
                secretKeyRef:
                  key: PRIMARY_KEYSTORE_KEY_PSWD
                  name: secret-apim-keystore-passwords
            - name: TLS_KEYSTORE_PSWD
              valueFrom:
                secretKeyRef:
                  key: TLS_KEYSTORE_PSWD
                  name: secret-apim-keystore-passwords
            - name: TLS_KEYSTORE_KEY_PSWD
              valueFrom:
                secretKeyRef:
                  key: TLS_KEYSTORE_KEY_PSWD
                  name: secret-apim-keystore-passwords
            - name: INTERNAL_KEYSTORE_PSWD
              valueFrom:
                secretKeyRef:
                  key: INTERNAL_KEYSTORE_PSWD
                  name: secret-apim-keystore-passwords
            - name: INTERNAL_KEYSTORE_KEY_PSWD
              valueFrom:
                secretKeyRef:
                  key: INTERNAL_KEYSTORE_KEY_PSWD
                  name: secret-apim-keystore-passwords
            - name: TRUSTSTORE_PSWD
              valueFrom:
                secretKeyRef:
                  key: TRUSTSTORE_PSWD
                  name: secret-apim-keystore-passwords
            - name: H2_SHARED_DB_PSWD
              valueFrom:
                secretKeyRef:
                  key: H2_SHARED_DB_PSWD
                  name: secret-apim
            - name: CHOREO_APIM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: CHOREO_APIM_DB_PASSWORD
                  name: secret-apim-db
            - name: CHOREO_APIM_SHARED_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: CHOREO_APIM_SHARED_DB_PASSWORD
                  name: secret-apim-shared-db
            - name: CHOREO_APIM_USER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: CHOREO_APIM_USER_DB_PASSWORD
                  name: secret-apim-user-db
            - name: SUPER_ADMIN_PSWD
              valueFrom:
                secretKeyRef:
                  key: SUPER_ADMIN_PSWD
                  name: secret-apim
            - name: CHOREO_IS_ADMIN_PSWD
              valueFrom:
                secretKeyRef:
                  key: CHOREO_IS_ADMIN_PSWD
                  name: secret-apim
            - name: MONGO_DB_PSWD
              valueFrom:
                secretKeyRef:
                    key: MONGO_DB_PSWD
                    name: secret-apim-mongodb
            - name: MONGO_DB_ATLAS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                    key: MONGO_DB_ATLAS_PRIVATE_KEY
                    name: secret-apim-mongodb
            - name: MONGO_DB_ATLAS_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                    key: MONGO_DB_ATLAS_PUBLIC_KEY
                    name: secret-apim-mongodb   
            - name: JVM_MEM_OPTS
              value: "-Xms1024m -Xmx1024m"
          volumeMounts:
            - name: wso2am-storage
              mountPath: /home/wso2carbon/wso2am-4.0.0-SNAPSHOT/repository/deployment/server/executionplans
              subPath: executionplans
            - name: wso2am-conf
              mountPath: /home/wso2carbon/wso2-config-volume/repository/conf
            - name: apim-docker-entrypoint
              mountPath: /home/wso2carbon/docker-entrypoint.sh
              subPath: docker-entrypoint.sh
            - name: mysql-connector-jar
              mountPath: /home/wso2carbon/wso2-artifact-volume/repository/components/lib
            - name: secret-apim-keystore-passwords
              mountPath: /mnt/csi/keystore-passwords
              readOnly: true
            - name: secret-apim-primary-keystore
              mountPath: /home/wso2carbon/wso2-keystores/primary-keystore.pfx
              readOnly: true
              subPath: APIM_PRIMARY_KEYSTORE
            - name: secret-apim-tls-keystore
              mountPath: /home/wso2carbon/wso2-keystores/tls-keystore.pfx
              readOnly: true
              subPath: APIM_TLS_KEYSTORE
            - name: secret-apim-internal-keystore
              mountPath: /home/wso2carbon/wso2-keystores/internal-keystore.pfx
              readOnly: true
              subPath: APIM_INTERNAL_KEYSTORE
            - name: apim-truststore
              mountPath: /home/wso2carbon/wso2am-4.0.0-SNAPSHOT/repository/resources/security/client-truststore.jks
              subPath: client-truststore.jks
      serviceAccountName: sa-choreo-apim
      volumes:
        - name: wso2am-storage
          persistentVolumeClaim:
            claimName: pvc-apimstorage
        - name: wso2am-conf
          configMap:
            name: choreo-apim-am-1-conf
        - name: apim-docker-entrypoint
          configMap:
            name: choreo-apim-docker-entrypoint
            defaultMode: 0407
        - name: mysql-connector-jar
          emptyDir: {}
        - name: secret-apim-keystore-passwords
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-apim-keystore-passwords
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-apim-primary-keystore
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-apim-primary-keystore
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-apim-tls-keystore
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-apim-tls-keystore
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-apim-internal-keystore
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-apim-internal-keystore
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: apim-truststore
          configMap:
            name: choreo-apim-truststore

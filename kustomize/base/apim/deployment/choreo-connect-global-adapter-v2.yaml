# Deployment for Global Adapter v2

apiVersion: apps/v1
kind: Deployment
metadata:
  name: choreo-connect-global-adapter-v2
  annotations:
    checkov.io/skip1: CKV_K8S_25=Temporarily suppressing as there is no defined fix for this by the Bridgecrew
    checkov.io/skip2: CKV_K8S_AZURE_WSO2_2=LinkerD is not enabled
spec:
  progressDeadlineSeconds: 900
  replicas: 1
  selector:
    matchLabels:
      choreo.component: choreo-connect-global-adapter-v2
  template:
    metadata:
      labels:
        choreo.component: choreo-connect-global-adapter-v2
        antiaffinity: choreo-connect-global-adapter-v2
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - choreo-connect-global-adapter-v2
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10500
        runAsGroup: 10500
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: choreo-connect-global-adapter
          volumeMounts:
            - mountPath: /home/wso2/security/keystore/mg.key
              name: secret-mgw-keystore
              readOnly: true
              subPath: ADAPTER_KEYSTORE_KEY
            - mountPath: /home/wso2/security/keystore/mg.pem
              name: mgw-common-cert-vol
              readOnly: true
              subPath: mg.pem
            - mountPath: /home/wso2/security/keystore/global-adapter.key
              name: secret-cc-ga-keystore
              readOnly: true
              subPath: GLOBAL_ADAPTER_KEYSTORE_KEY
            - mountPath: /home/wso2/security/keystore/global-adapter.pem
              name: global-adapter-keystore-vol
              subPath: global-adapter.pem
            - mountPath: /home/wso2/security/truststore/controlplane.pem
              name: mgw-adapter-truststore-vol
              readOnly: true
              subPath: controlplane.pem
            - mountPath: /home/wso2/security/truststore/local-adapter.pem
              name: mgw-common-cert-vol
              readOnly: true
              subPath: mg.pem
            - mountPath: /home/wso2/conf
              name: global-adapter-config
            - name: secret-mgw
              mountPath: /mnt/csi/secret-mgw
              readOnly: true
            - name: secret-redis
              mountPath: /mnt/csi/secret-redis
              readOnly: true
            - name: secret-cc-ga-credentials
              mountPath: /mnt/csi/secret-cc-ga-credentials
              readOnly: true
            - name: secret-asb
              mountPath: /mnt/csi/secret-asb
              readOnly: true
            - name: secret-apim
              mountPath: /mnt/csi/secret-apim
              readOnly: true
            - name: log-volume
              mountPath: logs
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-connect-global-adapter-v2:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
              add:
                - "NET_RAW"
          envFrom:
            - configMapRef:
                name: cm-feature-flags
            - secretRef:
                name: secret-redis
          env:
            - name: GLOBAL_ADAPTER_PRIVATE_KEY_PATH
              value: /home/wso2/security/keystore/global-adapter.key
            - name: GLOBAL_ADAPTER_PUBLIC_CERT_PATH
              value: /home/wso2/security/keystore/global-adapter.pem
            - name: ADAPTER_PRIVATE_KEY_PATH
              value: "/home/wso2/security/keystore/mg.key"
            - name: ADAPTER_PUBLIC_CERT_PATH
              value: "/home/wso2/security/keystore/mg.pem"
            - name: GLOBAL_ADAPTER_SERVER_NAME
              value: global-adapter
            - name: ga_admin_pwd
              valueFrom:
                secretKeyRef:
                  key: GLOBAL_ADAPTER_ADMIN_PASSWORD
                  name: secret-cc-ga-credentials
            - name: ga_db_pwd
              valueFrom:
                secretKeyRef:
                  key: GLOBAL_ADAPTER_MSSQL_PASSWORD
                  name: secret-cc-ga-credentials
            - name: cp_admin_pwd
              valueFrom:
                secretKeyRef:
                  key: SUPER_ADMIN_PSWD
                  name: secret-apim
            - name: ASB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: secret-asb
                  key: ASB_CONNECTION_STRING
            - name: PARTITION_CHECK_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: "100Mi"
              cpu: "200m"
            limits:
              memory: "150Mi"
              cpu: "250m"
          ports:
            - containerPort: 18000
            - containerPort: 9843
          livenessProbe:
            exec:
              command: ["sh", "check_health.sh", "liveness"]
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["sh", "check_health.sh", "readiness"]
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            exec:
              command: ["sh", "check_health.sh", "readiness"]
            failureThreshold: 30
            periodSeconds: 30
      volumes:
        - name: log-volume
          emptyDir: {}
        - name: global-adapter-keystore-vol
          configMap:
            name: global-adapter-keystore-vol
        - name: global-adapter-config
          configMap:
            name: cc-global-adapter-conf-v2
        - name: mgw-common-cert-vol
          configMap:
            name: mgw-common-cert
        - name: mgw-adapter-truststore-vol
          configMap:
            name: mgw-adapter-truststore
        - name: secret-mgw-keystore
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-mgw-keystore
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-mgw
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-mgw
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-cc-ga-keystore
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-cc-ga-keystore
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-cc-ga-credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-cc-ga-credentials
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-redis
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-redis
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-asb
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-asb
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-apim
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-apim
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always

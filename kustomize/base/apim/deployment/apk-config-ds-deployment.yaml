apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip2: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: config-deployer-service
  name: config-deployer-service
  namespace: choreo-apim
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: config-deployer-service
  template:
    metadata:
      labels:
        choreo.component: config-deployer-service
        antiaffinity: config-deployer-service
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: config-deployer-service
          imagePullPolicy: Always
          image: choreocontrolplane.azurecr.io/config-deployer-service:1.0.0-amd64
          resources:
            limits:
              cpu: 400m
              memory: 1024Mi
            requests:
              cpu: 200m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          ports:
            - containerPort: 9443
              name: http-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 20
            timeoutSeconds: 1
            periodSeconds: 20
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              scheme: HTTPS
              path: /health
              port: 9443
          livenessProbe:
            initialDelaySeconds: 20
            timeoutSeconds: 1
            periodSeconds: 20
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /health
              scheme: HTTPS
              port: 9443
          volumeMounts:
            - name: config-toml-volume
              mountPath: /home/wso2apk/config-deployer/conf/Config.toml
              subPath: config.toml
              readOnly: true
            - name: secret-apk-config-ds-certificate
              mountPath: /home/wso2apk/config-deployer/security/config.key
              subPath: config-ds-KEY
              readOnly: true
            - name: secret-apk-config-ds-certificate
              mountPath: /home/wso2apk/config-deployer/security/config.pem
              subPath: config-ds-CERTIFICATE
              readOnly: true
            - mountPath: /tmp
              name: tmp
            - mountPath: /home/wso2apk/config-deployer/tmp
              name: config-deployer-temp
      volumes:
        - configMap:
            defaultMode: 420
            name: cm-file-config-deployer-service
          name: config-toml-volume
        - name: secret-apk-config-ds-certificate
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-apk-config-ds-certificate
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - emptyDir: {}
          name: tmp
        - emptyDir: {}
          name: config-deployer-temp
      restartPolicy: Always
      serviceAccountName: sa-choreo-apim
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - config-deployer-service
              topologyKey: kubernetes.io/hostname

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    choreo.component: choreo-connect-global-adapter-v2
  name: choreo-connect-global-adapter-v2
spec:
  maxReplicas: 8
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: choreo-connect-global-adapter-v2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          # Allowing memory to go upto 75% of the limit
          averageUtilization: 95

apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: choreo-apim-whitelisted-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/session-cookie-hash: sha1
    nginx.ingress.kubernetes.io/session-cookie-name: apim
spec:
  tls:
  - hosts:
    - apim.domain.com
    secretName: ingress-cert    
  rules:
    - host: apim.domain.com
      http:
        paths:
        - path: /oauth2
          backend:
            serviceName: choreo-am-service
            servicePort: 9443
        - path: /commonauth
          backend:
            serviceName: choreo-am-service
            servicePort: 9443
        - path: /api/am/store/v1/
          backend:
            serviceName: choreo-am-service
            servicePort: 9443
        - path: /authenticationendpoint
          backend:
            serviceName: choreo-am-service
            servicePort: 9443

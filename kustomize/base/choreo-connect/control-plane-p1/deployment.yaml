apiVersion: apps/v1
kind: Deployment
metadata:
  name: choreo-connect-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: choreo-connect-deployment-control-plane-p1
  template:
    metadata:
      labels:
        choreo.component: choreo-connect-deployment-control-plane-p1
        antiaffinity: choreo-connect-deployment-control-plane-p1
    spec:
      containers:
        - name: choreo-connect-enforcer
          env:
            - name: ADAPTER_HOST
              value: adapter-control-plane-p1
            - name: ENFORCER_LABEL
              value: control-plane
        - name: choreo-connect-router
          env:
            - name: ADAPTER_HOST
              value: adapter-control-plane-p1
            - name: ROUTER_LABEL
              value: control-plane
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - choreo-connect-deployment-control-plane-p1
              topologyKey: kubernetes.io/hostname

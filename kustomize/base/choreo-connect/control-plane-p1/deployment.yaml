apiVersion: apps/v1
kind: Deployment
metadata:
  name: choreo-connect-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: choreo-connect-deployment-control-plane-p1
  template:
    metadata:
      labels:
        choreo.component: choreo-connect-deployment-control-plane-p1
        antiaffinity: choreo-connect-deployment-control-plane-p1
    spec:
      initContainers:
        - name: init-adapter-service
          command: [ 'sh', '-c', 'echo -e "Checking for the availability of Adapter"; while ! nc -z adapter-control-plane-p1 18000; do sleep 1; printf "-"; done; echo -e "  >> Adapter has started";' ]
      containers:
        - name: choreo-connect-enforcer
          volumeMounts:
            - name: enforcer-km-public-cert
              mountPath: /home/wso2/security/truststore/apim-service-root.pem
              subPath: apim-service-root.pem
          env:
            - name: ADAPTER_HOST
              value: adapter-control-plane-p1
            - name: ENFORCER_LABEL
              value: control-plane
        - name: choreo-connect-router
          env:
            - name: ADAPTER_HOST
              value: adapter-control-plane-p1
            - name: ROUTER_LABEL
              value: control-plane
      volumes:
        - name: enforcer-config
          configMap:
            name: mgw-ga-cp-adapter-conf
        - name: enforcer-km-public-cert
          configMap:
            name: mgw-keymanager-public-cert
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - choreo-connect-deployment-control-plane-p1
              topologyKey: kubernetes.io/hostname

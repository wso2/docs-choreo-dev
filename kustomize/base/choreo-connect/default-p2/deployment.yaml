apiVersion: apps/v1
kind: Deployment
metadata:
  name: choreo-connect-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: choreo-connect-deployment-default-p2
  template:
    metadata:
      labels:
        choreo.component: choreo-connect-deployment-default-p2
    spec:
     initContainers:
       - name: init-adapter-service
         command: [ 'sh', '-c', 'echo -e "Checking for the availability of Adapter"; while ! nc -z adapter-default-p2 18000; do sleep 1; printf "-"; done; echo -e "  >> Adapter has started";' ]
     containers:
       - name: choreo-connect-enforcer
         volumeMounts:
          - name: enforcer-km-public-cert
            mountPath: /home/wso2/security/truststore/apim-service-root.pem
            subPath: apim-service-root.pem
         env:
         - name: ADAPTER_HOST
           value: adapter-default-p2
       - name: choreo-connect-router
         env:
         - name: ADAPTER_HOST
           value: adapter-default-p2
     volumes:
       - name: enforcer-km-public-cert
         configMap:
          name: mgw-keymanager-public-cert

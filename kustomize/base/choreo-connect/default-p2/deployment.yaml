apiVersion: apps/v1
kind: Deployment
metadata:
  name: choreo-connect-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: choreo-connect-deployment-default-p2
  template:
    metadata:
      labels:
        choreo.component: choreo-connect-deployment-default-p2
        antiaffinity: choreo-connect-deployment-default-p2
    spec:
      containers:
        - name: choreo-connect-enforcer
          env:
            - name: ADAPTER_HOST
              value: adapter-default-p2
        - name: choreo-connect-router
          env:
            - name: ADAPTER_HOST
              value: adapter-default-p2
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - choreo-connect-deployment-default-p2
              topologyKey: kubernetes.io/hostname

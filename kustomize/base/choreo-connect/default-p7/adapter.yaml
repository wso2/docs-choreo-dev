apiVersion: apps/v1
kind: Deployment
metadata:
  name: choreo-connect-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: choreo-connect-adapter-default-p7
  template:
    metadata:
      labels:
        choreo.component: choreo-connect-adapter-default-p7
        antiaffinity: choreo-connect-adapter-default-p7
    spec:
      containers:
      - name: choreo-connect-adapter
        env:
        - name: localLabel
          value: default-p7
        - name: environmentLabel
          value: Production and Sandbox
      volumes:
      - name: global-adapter-keystore-vol
        configMap:
          name: global-adapter-keystore-vol
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: antiaffinity
                  operator: In
                  values:
                  - choreo-connect-adapter-default-p7
              topologyKey: kubernetes.io/hostname

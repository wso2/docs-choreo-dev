apiVersion: apps/v1
kind: Deployment
metadata:
  name: choreo-connect-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: choreo-connect-deployment-default-p5
  template:
    metadata:
      labels:
        choreo.component: choreo-connect-deployment-default-p5
        antiaffinity: choreo-connect-deployment-default-p5
    spec:
      initContainers:
      - name: init-adapter-service
        command: [ 'sh', '-c', 'echo -e "Checking for the availability of Adapter"; while ! nc -z adapter-default-p5 18000; do sleep 1; printf "-"; done; echo -e "  >> Adapter has started";' ]
      containers:
      - name: choreo-connect-enforcer
        env:
        - name: ADAPTER_HOST
          value: adapter-default-p5
      - name: choreo-connect-router
        env:
        - name: ADAPTER_HOST
          value: adapter-default-p5
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: antiaffinity
                  operator: In
                  values:
                  - choreo-connect-deployment-default-p5
              topologyKey: kubernetes.io/hostname

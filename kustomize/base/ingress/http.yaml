apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: ingress-http
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "false"
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: balanced
    nginx.ingress.kubernetes.io/backend-protocol: http
    nginx.ingress.kubernetes.io/permanent-redirect-code: "301"
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/session-cookie-expires: "300"
    nginx.ingress.kubernetes.io/session-cookie-hash: sha1
    nginx.ingress.kubernetes.io/session-cookie-max-age: "300"
    nginx.ingress.kubernetes.io/session-cookie-name: route
    #  nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/whitelist-source-range: 0.0.0.0/0
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://domain.com"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  tls:
    - hosts:
        - domain.com
        - app.domain.com
        - programanalyzer.domain.com
        - datamapper.domain.com
        - www.domain.com
        - console.domain.com
      secretName: ingress-cert
  rules:
    - host: domain.com
      http:
        paths:
        - backend:
            serviceName: obsapi
            servicePort: obsapi-port
          path: /graphql
        - backend:
            serviceName: choreowww
            servicePort: choreowww-port
          path: /
    - host: app.domain.com
      http:
        paths:
        - backend:
            serviceName: linker
            servicePort: linker-sport
          path: /linkersec 
        - backend:
            serviceName: linker
            servicePort: linker-port
          path: /linker             
        - backend:
            serviceName: appservice
            servicePort: appservice-port
          path: /
        - backend:
            serviceName: loggingapi
            servicePort: logapi-port
          path: /logs/0.1.0
    - host: programanalyzer.domain.com
      http:
        paths:
        - backend:
            serviceName: programanalyzer
            servicePort: progan-port
          path: /
    - host: datamapper.domain.com
      http:
        paths:
        - backend:
            serviceName: datamapper
            servicePort: dm-port
          path: /
    - host: www.domain.com
      http:
        paths:
        - backend:
            serviceName: choreowww
            servicePort: choreowww-port
          path: /
    - host: console.domain.com
      http:
        paths:
        - backend:
            serviceName: frontend
            servicePort: frontend-port
          path: /

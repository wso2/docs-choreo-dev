apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: perfanalyzer-updater
  labels:
    choreo.component: perfanalyzer-updater
spec:
  schedule: 0 * * * *
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            linkerd.io/inject: disabled # https://github.com/linkerd/linkerd2/issues/2833
          labels:
            choreo.component: perfanalyzer-updater
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          containers:
          - name: perfanalyzer-updater
            image: choreoctrlplane.azurecr.io/choreoipaas/perfanalyzer-updater:latest
            securityContext:
              runAsUser: 100
              runAsGroup: 1000
            env:
              - name: AZURE_ADX_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    key: AZURE_ADX_CLIENT_SECRET
                    name: secret-perfanalyzer
              - name: CHOREO_PERF_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    key: CHOREO_PERF_DB_PASSWORD
                    name: secret-perfanalyzer
            resources:
              limits:
                cpu: 300m
                memory: 1024Mi
              requests:
                cpu: 200m
                memory: 512Mi
            volumeMounts:
              - name: perfanalyzer-config
                mountPath: /home/perf-analyzer/config/
          volumes:
            - configMap:
                defaultMode: 420
                name: cm-perfanalyzer
              name: perfanalyzer-config
          serviceAccountName: sa-choreo-default


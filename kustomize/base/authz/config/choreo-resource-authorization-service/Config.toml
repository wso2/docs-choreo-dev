[choreo.resource_authz_service]
# Service configs
grpcApiPortConf = 9090
enableServiceReflectionConf = true

[choreo.resource_authz_service.authzSpiceDb]
# Service configs
jwtKeyUserGroupsConf = "groups"
authHeaderKeyConf = "x-jwt-assertion"
getProjectUuidRegexConf = '^.*/|\+.+'
getGroupUuidRegexConf =  '^.*\+'
objectUuidRegexConf = '^([a-zA-Z0-9_\-=]{20,36})$'
permissionRegexConf = '^(([a-zA-Z0-9_\-]+:)+[a-zA-Z0-9_\-]+)$'
isActionAuthorizationEnabled = {{.ACTION_AUTHORIZATION_ENABLED}}

# SpiceDB configs
enableCheckPermissionConsistencyConf = true

# Permissions
projectViewPermissionConf = "choreo:project_view"
projectUpdatePermissionConf = "choreo:project_manage"
projectDeletePermissionConf = "choreo:project_manage"
userManagementPermissionConf = "urn:choreosystem:usermanagement:user_manage"
roleViewPermissionConf = "urn:choreosystem:usermanagement:role_view"
roleCreatePermissionConf = "urn:choreosystem:usermanagement:role_create"
roleUpdatePermissionConf = "urn:choreosystem:usermanagement:role_update"
roleDeletePermissionConf = "urn:choreosystem:usermanagement:role_delete"

# Asgardeo token validation
asgardeoTokenIssuerConf = "{{.ASGARDEO_TOKEN_ISSUER}}"

[choreo.resource_authz_service.spicedbGrpcClient]
# SpiceDB configs
spiceDbGrpcPortConf = 50051
spiceDbHttpSchemeConf = "http://"
spiceDbHostConf = "spicedb-cluster.spicedb-operator.svc.cluster.local"
spiceDbAuthTokenFilePath = "/mnt/csi/secret-authz-management/SPICEDB-PRESHARED-KEY"


[ballerina.log]
level = "{{.LOG_LEVEL}}"

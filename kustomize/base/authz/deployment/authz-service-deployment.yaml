apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    choreo.component: choreo-resource-authorization-service
  name: choreo-resource-authorization-service
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: choreo-resource-authorization-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        choreo.component: choreo-resource-authorization-service
        antiaffinity: choreo-resource-authorization-service
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: choreo-resource-authorization-service
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-resource-authorization-service:latest
          ports:
            - containerPort: 9090
              name: service-port
            - containerPort: 9091
              name: health-port
          readinessProbe:
            exec:
              command:
                - /bin/grpc_health_probe
                - -addr=:9091
            initialDelaySeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/grpc_health_probe
                - -addr=:9091
            initialDelaySeconds: 20
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 300m
              memory: 300Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10500
            runAsGroup: 10500
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          volumeMounts:
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
            - name: secret-authz-service
              mountPath: "/mnt/csi/secret-authz-management"
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: cm-file-choreo-resource-authorization-service
        - name: secret-authz-service
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-authz-service
            nodePublishSecretRef:
              name: csi-secret-store-azure
      serviceAccountName: sa-choreo-default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  antiaffinity: choreo-resource-authorization-service
              topologyKey: kubernetes.io/hostname

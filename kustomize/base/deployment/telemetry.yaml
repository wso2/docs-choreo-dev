apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: telemetry
  name: telemetry
spec:
  replicas: 1 
  selector:
    matchLabels:
      choreo.component: telemetry
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: telemetry
    spec:
      containers:
      - env:
        - name: METRICS_EVENTHUB_NAME
          valueFrom:
            configMapKeyRef:
              key: METRICS_EVENTHUB_NAME
              name: cm-eventhub
        - name: TRACES_EVENTHUB_NAME
          valueFrom:
            configMapKeyRef:
              key: TRACES_EVENTHUB_NAME
              name: cm-eventhub
        - name: EVENTHUB_CONNECTION_STRING
          valueFrom: 
            secretKeyRef:
              name: secret-telemetry
              key: EVENTHUB_CONNECTION_STRING
        image: choreoipaas/choreo-telemetry:latest
        securityContext:
          runAsUser: 100
          runAsGroup: 1000
        name: telemetry
        ports:
        - containerPort: 9090
          name: telemetry-port
          protocol: TCP
        - containerPort: 9091
          name: health
          protocol: TCP
        readinessProbe:
            httpGet:
             port: health
             path: /health
        livenessProbe:
            httpGet:
             port: health
             path: /health
        resources: {}
      restartPolicy: Always
      serviceAccountName: sa-choreo-default

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: telemetry
  name: telemetry
spec:
  replicas: 1 
  selector:
    matchLabels:
      choreo.component: telemetry
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: telemetry
    spec:
      containers:
      - env:
        - name: CHOREO_DB_HOST
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_HOST
              name: cm-choreo-trace-db
        - name: CHOREO_DB_NAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_NAME
              name: cm-choreo-trace-db
        - name: CHOREO_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-trace-db
              key: CHOREO_DB_PASSWORD
        - name: CHOREO_DB_PORT
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_PORT
              name: cm-choreo-trace-db
        - name: CHOREO_DB_USERNAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_USERNAME
              name: cm-choreo-trace-db
        - name: EVENTHUB_NAMESPACE
          valueFrom:
            configMapKeyRef:
              key: EVENTHUB_NAMESPACE
              name: cm-eventhub
        - name: EVENTHUB_SHARED_ACCESS_POLICY_NAME
          valueFrom:
            configMapKeyRef:
              key: EVENTHUB_SHARED_ACCESS_POLICY_NAME
              name: cm-eventhub
        - name: METRICS_EVENTHUB_NAME
          valueFrom:
            configMapKeyRef:
              key: METRICS_EVENTHUB_NAME
              name: cm-eventhub
        - name: EVENTHUB_SHARED_ACCESS_SIGNATURE_KEY
          valueFrom: 
            secretKeyRef:
              name: secret-telemetry
              key: EVENTHUB_SHARED_ACCESS_SIGNATURE_KEY
        image: choreoipaas/choreo-telemetry:latest
        name: telemetry
        ports:
        - containerPort: 9090
          name: telemetry-port
          protocol: TCP
        - containerPort: 9091
          name: health
          protocol: TCP
        readinessProbe:
            httpGet:
             port: health
             path: /health
        livenessProbe:
            httpGet:
             port: health
             path: /health
        resources: {}
      restartPolicy: Always
      serviceAccountName: sa-choreo-default

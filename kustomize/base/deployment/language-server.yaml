apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: language-server
  name: language-server
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: language-server
  template:
    metadata:
      labels:
        choreo.component: language-server
      annotations:
        linkerd.io/inject: enabled
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: choreoipaas/lang-server:latest
        name: language-server
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-redis
              key: REDIS_PASSWORD
        ports:
        - containerPort: 9090
          name: http-port
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          httpGet:
            path: /actuator/health/readiness
            port: 8082
          timeoutSeconds: 2
        livenessProbe:
          failureThreshold: 6
          initialDelaySeconds: 30
          periodSeconds: 10
          httpGet:
            path: /actuator/health/liveness
            port: 8082
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /apps
          name: pvc-userappstorage
        - name: secret-redis
          mountPath: "/mnt/csi/secret-redis"
          readOnly: true
        - name: secret-azure-storage-account
          mountPath: "/mnt/csi/secret-azure-storage-account"
          readOnly: true
        - mountPath: /lang-server/application.properties
          name: config
          subPath: application.properties
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            drop:
            - NET_RAW
      volumes:
      - name: pvc-userappstorage
        persistentVolumeClaim:
          claimName: pvc-userappstorage
      - name: secret-redis
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-redis
          nodePublishSecretRef:
            name: csi-secret-store-azure
      - name: secret-azure-storage-account
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-azure-storage-account
          nodePublishSecretRef:
            name: csi-secret-store-azure
      - name: config
        configMap:
          name: cm-language-server
      serviceAccountName: sa-choreo-default

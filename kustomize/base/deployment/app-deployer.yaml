apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: app-deployer
  name: app-deployer
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: app-deployer
  template:
    metadata:
      labels:
        choreo.component: app-deployer
      annotations:
        linkerd.io/inject: enabled
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: choreoctrlplane.azurecr.io/choreoipaas/app-deployer:latest
        name: app-deployer
        env:
        - name: CHOREO_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-app-db
              key: CHOREO_DB_PASSWORD
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: secret-app-deployer
              key: GITHUB_TOKEN
        - name: DOCKER_REGISTRY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-app-deployer
              key: DOCKER_REGISTRY_PASSWORD
        - name: K8S_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: secret-app-deployer
              key: K8S_API_TOKEN
        ports:
        - containerPort: 8080
          name: grpc-port
        readinessProbe:
          exec:
            command: ["/bin/grpc_health_probe", "-addr=:8080"]
          initialDelaySeconds: 5
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "bin/grpc_health_probe -addr=:8080 2>&1 | grep -q SERVING"]
          initialDelaySeconds: 20
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
              - NET_RAW
        volumeMounts:
        - mountPath: /app-deployer.yaml
          name: config
          subPath: app-deployer.yaml
        - mountPath: /service-account.yaml
          name: sa-config
          subPath: APPS_K8S_SERVICE_ACCOUNT
      volumes:
      - name: config
        configMap:
          name: cm-app-deployer
      - name: sa-config
        secret:
          secretName: secret-apps-k8s-service-account
      serviceAccountName: sa-choreo-default

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: perfanalyzer-estimator
  name: perfanalyzer-estimator
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      choreo.component: perfanalyzer-estimator
  template:
    metadata:
      labels:
        choreo.component: perfanalyzer-estimator
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
      - image: choreoctrlplane.azurecr.io/choreoipaas/perfanalyzer-estimator:latest
        securityContext:
          runAsUser: 500
          runAsGroup: 500
        name: perfanalyzer-estimator
        env:
          - name: CHOREO_PERF_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: CHOREO_PERF_DB_PASSWORD
                name: secret-perfanalyzer
        ports:
        - containerPort: 5005
          name: perfan-port
          protocol: TCP
        resources:
          limits:
            cpu: 1100m
            memory: 1024Mi
          requests:
            cpu: 1000m
            memory: 768Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - name: perfanalyzer-config
          mountPath: /home/python-ai/perf-analyzer/config/
      volumes:
      - configMap:
          defaultMode: 420
          name: cm-perfanalyzer
        name: perfanalyzer-config
      serviceAccountName: sa-choreo-default

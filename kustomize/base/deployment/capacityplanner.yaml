apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: capacity-planner
  name: capacity-planner
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: capacity-planner
  template:
    metadata:
      labels:
        choreo.component: capacity-planner
      annotations:
        linkerd.io/inject: enabled
    spec:
      securityContext:
        runAsUser: 500
        runAsGroup: 500
        fsGroup: 500
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        image: choreoctrlplane.azurecr.io/choreoipaas/capacity-planner-init:latest
        name: capacity-planner-init
        resources:
          limits:
            cpu: 300m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: capacity-planner-model
          mountPath: "/home/python-ai/choreo-ai-capacity-planner/model"
        - name: capacity-planner-model-metadata
          mountPath: "/home/python-ai/choreo-ai-capacity-planner/models.properties"
          subPath: "models.properties"
        - name: secret-capacity-planner
          mountPath: "/mnt/csi/secret-capacity-planner"
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
              drop:
                - NET_RAW
      containers:
      - image: choreoctrlplane.azurecr.io/choreoipaas/capacity-planner:latest
        name: capacity-planner
        ports:
        - containerPort: 5000
          name: capacity-planner-port
          protocol: TCP
        resources:
          limits:
            cpu: 1100m
            memory: 2048Mi
          requests:
            cpu: 1000m
            memory: 1536Mi
        volumeMounts:
        - name: capacity-planner-model
          mountPath: "/home/python-ai/choreo-ai-capacity-planner/model/"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - NET_RAW
      volumes:
      - name: capacity-planner-model
        emptyDir: {}
      - name: capacity-planner-model-metadata
        configMap:
          defaultMode: 420
          name: cm-capacity-planner
      - name: secret-capacity-planner
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secret-capacity-planner
          nodePublishSecretRef:
            name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: sa-choreo-default


apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: negotiator
  name: negotiator
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: negotiator
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: negotiator
    spec:
      containers:
      - env:
        - name: CHOREO_APP_URL
          valueFrom:
            configMapKeyRef:
              key: CHOREO_APP_URL
              name: cm-negotiator
        - name: CHOREO_DB_HOST
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_HOST
              name: cm-choreo-program-db
        - name: CHOREO_DB_NAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_NAME
              name: cm-choreo-program-db
        - name: CHOREO_DB_PASSWORD
          valueFrom: 
           secretKeyRef:
             name: secret-program-db
             key: CHOREO_DB_PASSWORD
        - name: CHOREO_DB_PORT
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_PORT
              name: cm-choreo-program-db
        - name: CHOREO_DB_USERNAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_USERNAME
              name: cm-choreo-program-db
        image: choreoipaas/choreo-negotiator:latest
        securityContext:
          runAsUser: 100
          runAsGroup: 1000
        name: negotiator
        readinessProbe:
            httpGet:
             port: health
             path: /health
        livenessProbe:
            httpGet:
             port: health
             path: /health
        ports:
        - containerPort: 9090
          name: handshake-port
          protocol: TCP
        - containerPort: 9092
          name: negotiator-port
          protocol: TCP
        - containerPort: 9091
          name: health
          protocol: TCP
        resources: {}
      restartPolicy: Always
      serviceAccountName: sa-choreo-default

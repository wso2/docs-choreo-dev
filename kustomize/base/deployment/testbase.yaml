apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: testbase
  name: testbase
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: testbase
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: testbase
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
      - env:
        - name: IDP_ISSUER
          valueFrom:
            configMapKeyRef:
              key: IDP_ISSUER
              name: cm-idp
        - name: IDP_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              key: IDP_CLIENT_ID
              name: cm-idp              
        - name: IDP_HOST
          valueFrom:
            configMapKeyRef:
              key: IDP_HOST
              name: cm-idp   
        - name: IDP_JWKS_ENDPOINT
          valueFrom:
            configMapKeyRef:
              key: IDP_JWKS_ENDPOINT
              name: cm-idp
        - name: CHOREO_DB_PORT
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_PORT
              name: cm-choreo-testbase-db
        - name: CHOREO_DB_HOST
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_HOST
              name: cm-choreo-testbase-db
        - name: CHOREO_DB_NAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_NAME
              name: cm-choreo-testbase-db
        - name: CHOREO_DB_USERNAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_USERNAME
              name: cm-choreo-testbase-db
        - name: CHOREO_DB_PASSWORD
          valueFrom:
           secretKeyRef:
             name: secret-testbase-db
             key: CHOREO_DB_PASSWORD
        image: choreoctrlplane.azurecr.io/choreoipaas/choreo-testbase:latest
        securityContext:
          runAsUser: 100
          runAsGroup: 1000
        name: testbase
        readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
             port: health
             path: /health
        livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
             port: health
             path: /health
        ports:
        - containerPort: 9090
          name: tb-sport
          protocol: TCP
        - containerPort: 9091
          name: health
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 768Mi
          requests:
            cpu: 300m
            memory: 512Mi
      restartPolicy: Always
      serviceAccountName: sa-choreo-default

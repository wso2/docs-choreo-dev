apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    choreo.component: perfanalyzer
  name: perfanalyzer
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      choreo.component: perfanalyzer
  template:
    metadata:
      labels:
        choreo.component: perfanalyzer
    spec:
      containers:
      - env:
        - name: platformer_configmap_hash
          value: a4d06c01-6ce3-11ea-971f-6f4ac6d7b9e0
        - name: platformer_secret_hash
          value: a4d06c00-6ce3-11ea-971f-6f4ac6d7b9e0
        - name: PLATFORMER_IMG_TAG
          value: master-2b73d0186d4040929b6d33e9554e8eaf0665a8ab
        image: choreoipaas/perfanalyzer:latest
        name: perfanalyzer
#        command: ["sleep", "48000"]
        ports:
        - containerPort: 5005
          name: port-7a8r
          protocol: TCP
        - containerPort: 5006
          name: port-7a8s
          protocol: TCP
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /home/perfAnalyzer/
          name: perfanalyzer-config
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: platformer-1580893230462-5ggle
      volumes:
      - configMap:
          defaultMode: 420
          name: cm-perfanalyzer
        name: perfanalyzer-config

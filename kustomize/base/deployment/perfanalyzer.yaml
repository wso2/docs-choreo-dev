apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: perfanalyzer
  name: perfanalyzer
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      choreo.component: perfanalyzer
  template:
    metadata:
      labels:
        choreo.component: perfanalyzer
    spec:
      containers:
      - image: choreoipaas/perfanalyzer:latest
        name: perfanalyzer
        ports:
        - containerPort: 5005
          name: port-7a8r
          protocol: TCP
        - containerPort: 5006
          name: port-7a8s
          protocol: TCP
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - name: perfanalyzer-config
          mountPath: /home/perf-analyzer/db_config.py
          subPath: db_config.py
        - name: perfanalyzer-config
          mountPath: /home/perf-analyzer/tsi_config.py
          subPath: tsi_config.py
      volumes:
      - configMap:
          defaultMode: 420
          name: cm-perfanalyzer
        name: perfanalyzer-config

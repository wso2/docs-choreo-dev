apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: programanalyzer
  name: programanalyzer
spec:
  selector:
    matchLabels:
      choreo.component: programanalyzer
  template:
    metadata:
      labels:
        choreo.component: programanalyzer
    spec:
      containers:
      - image: choreoipaas/programanalyzer:latest
        name: programanalyzer
        ports:
        - containerPort: 9000
          name: progan-port
          protocol: TCP
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: '/home/program-analyzer/config'
          name: programanalyzer-config
        - mountPath: /repo
          name: pvc-userappstorage
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: platformer-1580893230462-5ggle
      volumes:
      - name: programanalyzer-config
        configMap:
          defaultMode: 420
          name: cm-programanalyzer
      - name: pvc-userappstorage
        persistentVolumeClaim:
          claimName: pvc-userappstorage
          readOnly: true
      serviceAccountName: sa-choreo-default

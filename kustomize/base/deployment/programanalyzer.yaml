apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "15"
  labels:
    choreo.component: programanalyzer
  name: programanalyzer
spec:
  selector:
    matchLabels:
      choreo.component: programanalyzer
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        choreo.component: programanalyzer
    spec:
      containers:
      - image: choreoipaas/programanalyzer:latest
        name: programanalyzer
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: port-7ydy
          protocol: TCP
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: '/home/program-analyzer/config'
          name: programanalyzer-config
        - mountPath: /repo
          name: repo
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: platformer-1580893230462-5ggle
      volumes:
      - name: programanalyzer-config
        configMap:
          defaultMode: 420
          name: cm-programanalyzer
      - name: repo
        persistentVolumeClaim:
          claimName: programanalyzer-claim
          readOnly: true

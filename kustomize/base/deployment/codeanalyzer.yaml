    deployment.kubernetes.io/revision: "15"
  labels:
    choreo.component: codeanalyzer
  name: codeanalyzer
spec:
  selector:
    matchLabels:
      choreo.component: codeanalyzer
  template:
    metadata:
      labels:
        choreo.component: codeanalyzer
    spec:
      containers:
      - env:
        - name: platformer_configmap_hash

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "15"
  labels:
    choreo.component: codeanalyzer
  name: codeanalyzer
spec:
  selector:
    matchLabels:
      choreo.component: codeanalyzer
  template:
    metadata:
      labels:
        choreo.component: codeanalyzer
    spec:
      containers:
      - image: choreoipaas/codeanalyzer:latest
#        command: ["sleep", "48000"]
        name: codeanalyzer
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: port-7ydy
          protocol: TCP
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: '/home/ballerina/src/main/resources/'
          name: codeanalyzer-config
        - mountPath: /repo
          name: repo
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: platformer-1580893230462-5ggle
      volumes:
      - name: codeanalyzer-config
        configMap:
          defaultMode: 420
          name: cm-codeanalyzer
      - name: repo
        persistentVolumeClaim:
          claimName: codeanalyzer-claim
          readOnly: true

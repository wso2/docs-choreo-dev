apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: frontend
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: frontend
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: frontend
      annotations:
        linkerd.io/inject: enabled
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
      - env:
        - name: LOGS_API
          valueFrom:
            configMapKeyRef:
              key: LOGS_API
              name: cm-frontend
        - name: OBSERVE_API
          valueFrom:
            configMapKeyRef:
              key: OBSERVE_API
              name: cm-frontend
        - name: LOG_COLLECTION_API
          valueFrom:
            configMapKeyRef:
              key: LOG_COLLECTION_API
              name: cm-frontend
        - name: SYS_OBSAPI
          valueFrom:
            configMapKeyRef:
              key: SYS_OBSAPI
              name: cm-frontend
        - name: ANALYZE_API
          valueFrom:
            configMapKeyRef:
              key: ANALYZE_API
              name: cm-frontend
        - name: APP_API
          valueFrom:
            configMapKeyRef:
              key: APP_API
              name: cm-frontend
        - name: LINKER_API_WS
          valueFrom:
            configMapKeyRef:
              key: LINKER_API_WS
              name: cm-frontend
        - name: LINKER_API
          valueFrom:
            configMapKeyRef:
              key: LINKER_API
              name: cm-frontend
        - name: TESTBASE_API
          valueFrom:
            configMapKeyRef:
              key: TESTBASE_API
              name: cm-frontend
        - name: AI_API
          valueFrom:
            configMapKeyRef:
              key: AI_API
              name: cm-frontend
        - name: IDP_URL
          valueFrom:
            configMapKeyRef:
              key: IDP_URL
              name: cm-idp
        - name: IDP_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              key: IDP_CLIENT_ID
              name: cm-idp
        - name: IDP_REDIRECT_URL
          valueFrom:
            configMapKeyRef:
              key: IDP_REDIRECT_URL
              name: cm-idp
        - name: APP_INSIGHTS_KEY
          valueFrom:
            configMapKeyRef:
              key: APP_INSIGHTS_KEY
              name: cm-frontend
        - name: BETA_PROGRAM_WIDGET_URL
          valueFrom:
            configMapKeyRef:
              key: BETA_PROGRAM_WIDGET_URL
              name: cm-frontend
        - name: BETA_PROGRAM_PROJECT_CODE
          valueFrom:
            configMapKeyRef:
              key: BETA_PROGRAM_PROJECT_CODE
              name: cm-frontend
        image: choreoctrlplane.azurecr.io/choreoipaas/choreo-console:latest
        securityContext:
          runAsUser: 101
          runAsGroup: 101
          capabilities:
            drop:
              - NET_RAW
        name: frontend
        ports:
        - containerPort: 8080
          name: frontend-port
          protocol: TCP
        resources:
          limits:
            cpu: 300m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
      restartPolicy: Always
      serviceAccountName: sa-choreo-default

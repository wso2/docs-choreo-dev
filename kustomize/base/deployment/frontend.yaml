apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: frontend
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: frontend
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: frontend
    spec:
      containers:
      - env:
        - name: LOGS_API
          valueFrom:
            configMapKeyRef:
              key: LOGS_API
              name: cm-frontend
        - name: OBSERVE_API
          valueFrom:
            configMapKeyRef:
              key: OBSERVE_API
              name: cm-frontend
        - name: LOG_COLLECTION_API
          valueFrom:
            configMapKeyRef:
              key: LOG_COLLECTION_API
              name: cm-frontend
        - name: ANALYZE_API
          valueFrom:
            configMapKeyRef:
              key: ANALYZE_API
              name: cm-frontend
        - name: APP_API
          valueFrom:
            configMapKeyRef:
              key: APP_API
              name: cm-frontend
        - name: IDP_URL
          valueFrom:
            configMapKeyRef:
              key: IDP_URL
              name: cm-idp
        - name: IDP_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              key: IDP_CLIENT_ID
              name: cm-idp
        - name: IDP_REDIRECT_URL
          valueFrom:
            configMapKeyRef:
              key: IDP_REDIRECT_URL
              name: cm-idp
        image: choreoipaas/console-app:latest
        securityContext:
          runAsUser: 101
          runAsGroup: 101
        name: frontend
        lifecycle:
          # This "sleep" preStop hook delays the Pod shutdown until after the Ingress controller removes the matching Endpoint
          preStop:
            exec:
              command:
                - /bin/sleep
                - "20"
        ports:
        - containerPort: 8080
          name: frontend-port
          protocol: TCP
        resources:
          limits:
            cpu: 300m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
      restartPolicy: Always
      serviceAccountName: sa-choreo-default

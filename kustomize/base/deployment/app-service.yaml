apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: app-service
  name: app-service
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: app-service
  template:
    metadata:
      labels:
        choreo.component: app-service
      annotations:
        linkerd.io/inject: enabled
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: choreoctrlplane.azurecr.io/choreoipaas/app-service:latest
        name: app-service
        env:
        - name: CHOREO_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-app-db
              key: CHOREO_DB_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-redis
              key: REDIS_PASSWORD
        - name: GITHUB_BOT_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: secret-app-service
              key: GITHUB_BOT_ACCESS_TOKEN
        - name: USER_FEEDBACK_AZURE_BLOB_ACCOUNT_KEY
          valueFrom:
            secretKeyRef:
              name: secret-app-service
              key: USER_FEEDBACK_AZURE_BLOB_ACCOUNT_KEY
        - name: BETA_PROGRAM_PREFINERY_INVITATION_DECODER_KEY
          valueFrom:
            secretKeyRef:
              name: secret-app-service
              key: BETA_PROGRAM_PREFINERY_INVITATION_DECODER_KEY
        - name: IDP_BACKEND_API_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: secret-idp
              key: IDP_BACKEND_API_CLIENT_SECRET
        - name: AZURE_KEY_VAULT_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: secret-key-vault
              key: AZURE_KEY_VAULT_CLIENT_SECRET
        - name: GH_CONNECTOR_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: github-connector
              key: GH_CONNECTOR_CLIENT_SECRET
        ports:
        - containerPort: 8080
          name: grpc-port
        readinessProbe:
          exec:
            command: ["/bin/grpc_health_probe", "-addr=:8080"]
          initialDelaySeconds: 5
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "bin/grpc_health_probe -addr=:8080 2>&1 | grep -q SERVING"]
          initialDelaySeconds: 20
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
              - NET_RAW
        volumeMounts:
        - mountPath: /app-service.yaml
          name: config
          subPath: app-service.yaml
      volumes:
      - name: config
        configMap:
          name: cm-app-service
      serviceAccountName: sa-choreo-default

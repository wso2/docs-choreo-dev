apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: loggingapi
  name: loggingapi
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: loggingapi
  strategy: {}
  template:
    metadata:
      labels:
        choreo.component: loggingapi
    spec:
      containers:
        - env:
            - name: CHOREO_DB_HOST
              valueFrom:
                configMapKeyRef:
                  key: CHOREO_DB_HOST
                  name: cm-choreo-app-db
            - name: CHOREO_DB_NAME
              valueFrom:
                configMapKeyRef:
                  key: CHOREO_DB_NAME
                  name: cm-choreo-app-db
            - name: CHOREO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-app-db
                  key: CHOREO_DB_PASSWORD
            - name: CHOREO_DB_PORT
              valueFrom:
                configMapKeyRef:
                  key: CHOREO_DB_PORT
                  name: cm-choreo-app-db
            - name: CHOREO_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  key: CHOREO_DB_USERNAME
                  name: cm-choreo-app-db
            - name: AAD_TENANT_ID
              valueFrom:
                configMapKeyRef:
                  key: AZURE_ACTIVEDIRECTORY_TENANT_ID
                  name: cm-activedirectory
            - name: AAD_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  key: AZURE_ACTIVEDIRECTORY_CLIENT_ID
                  name: cm-activedirectory
            - name: USER_APPS_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  key: USER_APPS_NAMESPACE
                  name: cm-k8sservice
            - name: K8S_SERVICE_SUBSCRIPTION_ID
              valueFrom:
                configMapKeyRef:
                  key: K8S_SERVICE_SUBSCRIPTION_ID
                  name: cm-k8sservice
            - name: RESOURCE_GROUP
              valueFrom:
                configMapKeyRef:
                  key: RESOURCE_GROUP
                  name: cm-k8sservice
            - name: CLUSTER_NAME
              valueFrom:
               configMapKeyRef:
                 key: CLUSTER_NAME
                 name: cm-k8sservice
            - name: LOG_WORKSPACE_ID
              valueFrom:
                configMapKeyRef:
                  key: LOG_WORKSPACE_ID
                  name: cm-loganalytics
            - name: AAD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secret-loggingapi
                  key: AZURE_ACTIVEDIRECTORY_CLIENT_SECRET
          image: choreoipaas/choreo-logging:latest
          securityContext:
            runAsUser: 100
            runAsGroup: 1000
          name: loggingapi
          ports:
            - containerPort: 9097
              name: logapi-port
              protocol: TCP
          readinessProbe:
            httpGet:
              port: logapi-port
              path: /api/0.1.0/health
          livenessProbe:
            httpGet:
              port: logapi-port
              path: /api/0.1.0/health
          resources:
            limits:
              cpu: 500m
              memory: 768Mi
            requests:
              cpu: 300m
              memory: 512Mi
      restartPolicy: Always
      serviceAccountName: sa-choreo-default

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: appservice
  name: appservice
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: appservice
  template:
    metadata:
      labels:
        choreo.component: appservice
    spec:
      containers:
      - env:
        - name: PLATFORMER_RUDDER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-appservice
              key: PLATFORMER_RUDDER_PASSWORD
        - name: PLATFORMER_GOOGLE_ID
          valueFrom:
            configMapKeyRef:
              key: PLATFORMER_GOOGLE_ID
              name: cm-appservice

        - name: DISABLE_AUTHN
          valueFrom:
            configMapKeyRef:
              key: DISABLE_AUTHN
              name: cm-appservice
        - name: PLATFORMER_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              key: PLATFORMER_CLUSTER_NAME
              name: cm-appservice
        - name: PLATFORMER_RUDDER_URL
          valueFrom:
            configMapKeyRef:
              key: PLATFORMER_RUDDER_URL
              name: cm-appservice
        - name: REPO_PATH
          valueFrom:
            configMapKeyRef:
              key: REPO_PATH
              name: cm-appservice
        - name: REDIS_ADDRESS
          valueFrom:
            configMapKeyRef:
              key: REDIS_ADDRESS
              name: cm-appservice
        - name: PLATFORMER_RUDDER_USERNAME
          valueFrom:
            configMapKeyRef:
              key: PLATFORMER_RUDDER_USERNAME
              name: cm-appservice
        - name: NEGOTIATOR_GRPC_ADDRESS
          valueFrom:
            configMapKeyRef:
              key: NEGOTIATOR_GRPC_ADDRESS
              name: cm-appservice
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: secret-appservice
              key: GITHUB_TOKEN
        - name: DEPLOY_APP_NAMESPACE
          valueFrom:
            configMapKeyRef:
              key: DEPLOY_APP_NAMESPACE
              name: cm-appservice
        - name: DEPLOY_INGRESS_SECRET
          valueFrom:
            configMapKeyRef:
              key: DEPLOY_INGRESS_SECRET
              name: cm-appservice
        # APP DB
        - name: DATABASE_USERNAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_USERNAME
              name: cm-choreo-app-db
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-app-db
              key: CHOREO_DB_PASSWORD
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_HOST
              name: cm-choreo-app-db
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_PORT
              name: cm-choreo-app-db
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_NAME
              name: cm-choreo-app-db
        # -----------------------
        - name: IDP_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: secret-idp
              key: IDP_CLIENT_SECRET
        - name: IDP_ISSUER
          valueFrom:
            configMapKeyRef:
              key: IDP_ISSUER
              name: cm-idp
        - name: IDP_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              key: IDP_CLIENT_ID
              name: cm-idp
        - name: IDP_HOST
          valueFrom:
            configMapKeyRef:
              key: IDP_HOST
              name: cm-idp
        - name: IDP_WHITELISTED_REDIRECT_URLS
          valueFrom:
            configMapKeyRef:
              key: IDP_WHITELISTED_REDIRECT_URLS
              name: cm-idp
        - name: IDP_AUTH_RESPONSE_COOKIE_MAX_AGE
          valueFrom:
            configMapKeyRef:
              key: IDP_AUTH_RESPONSE_COOKIE_MAX_AGE
              name: cm-idp
        - name: IDP_TOKEN_ENDPOINT
          valueFrom:
            configMapKeyRef:
              key: IDP_TOKEN_ENDPOINT
              name: cm-idp
        - name: IDP_JWKS_ENDPOINT
          valueFrom:
            configMapKeyRef:
              key: IDP_JWKS_ENDPOINT
              name: cm-idp
        # -----------------------------
        - name: GITHUB_APP_ORG
          valueFrom:
            configMapKeyRef:
              key: GITHUB_APP_ORG
              name: cm-appservice
        - name: LANG_SERVER_IMAGE
          valueFrom:
            configMapKeyRef:
              key: LANG_SERVER_IMAGE
              name: cm-appservice
        - name: DEPLOY_INGRESS_HOST_SUFFIX
          valueFrom:
            configMapKeyRef:
              key: DEPLOY_INGRESS_HOST_SUFFIX
              name: cm-appservice
        - name: GITHUB_USER_EMAIL
          valueFrom:
            configMapKeyRef:
              key: GITHUB_USER_EMAIL
              name: cm-appservice
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-appservice
              key: REDIS_PASSWORD
        - name: PLATFORMER_PROJECT_ID
          valueFrom:
            configMapKeyRef:
              key: PLATFORMER_PROJECT_ID
              name: cm-appservice
        - name: PLATFORMER_ORG_ID
          valueFrom:
            configMapKeyRef:
              key: PLATFORMER_ORG_ID
              name: cm-appservice
        - name: GITHUB_USER
          valueFrom:
            configMapKeyRef:
              key: GITHUB_USER
              name: cm-appservice
        - name: WORKSPACE_NAMESPACE
          valueFrom:
            configMapKeyRef:
              key: WORKSPACE_NAMESPACE
              name: cm-appservice
        - name: WORKSPACE_VOLUME_CLAIM
          valueFrom:
            configMapKeyRef:
              key: WORKSPACE_VOLUME_CLAIM
              name: cm-appservice
        - name: WORKSPACE_INGRESS_CLASS
          valueFrom:
            configMapKeyRef:
              name: cm-appservice
              key: WORKSPACE_INGRESS_CLASS
        - name: WORKSPACE_API_INGRESS_HOSTNAME
          valueFrom:
            configMapKeyRef:
              name: cm-appservice
              key: WORKSPACE_API_INGRESS_HOSTNAME
        - name: WORKSPACE_API_INGRESS_TLS_SECRET
          valueFrom:
            configMapKeyRef:
              name: cm-appservice
              key: WORKSPACE_API_INGRESS_TLS_SECRET
        - name: WORKSPACE_API_PORT
          valueFrom:
            configMapKeyRef:
              name: cm-appservice
              key: WORKSPACE_API_PORT
        - name: WORKSPACE_INGRESS_HOST_SUFFIX
          valueFrom:
            configMapKeyRef:
              name: cm-appservice
              key: WORKSPACE_INGRESS_HOST_SUFFIX
        - name: WORKSPACE_APP_INGRESS_TLS_SECRET
          valueFrom:
            configMapKeyRef:
              name: cm-appservice
              key: WORKSPACE_APP_INGRESS_TLS_SECRET
        - name: WORKSPACE_DISABLE_AUTO_CLEAN
          valueFrom:
            configMapKeyRef:
              name: cm-appservice
              key: WORKSPACE_DISABLE_AUTO_CLEAN
        - name: WORKSPACE_IMAGE
          valueFrom:
            configMapKeyRef:
              name: cm-appservice
              key: WORKSPACE_IMAGE
        image: choreoipaas/app-service:latest
        name: appservice
        ports:
        - containerPort: 8080
          name: appservice-port
          protocol: TCP
        resources:
          limits:
            cpu: 300m
            memory: 512Mi
          requests:
            cpu: 300m
            memory: 512Mi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
      imagePullSecrets:
      - name: platformer-1580893230462-5ggle
      serviceAccountName: sa-choreo-appservice

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: obsapi
  name: obsapi
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: obsapi
  template:
    metadata:
      labels:
        choreo.component: obsapi
    spec:
      containers:
      - env:
        # --------------------------------------------------------
        # PROGRAM_DB
        - name: CHOREO_PROGRAM_DB_HOST
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_HOST
              name: cm-choreo-program-db
        - name: CHOREO_PROGRAM_DB_NAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_NAME
              name: cm-choreo-program-db
        - name: CHOREO_PROGRAM_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-program-db
              key: CHOREO_DB_PASSWORD
        - name: CHOREO_PROGRAM_DB_PORT
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_PORT
              name: cm-choreo-program-db
        - name: CHOREO_PROGRAM_DB_USERNAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_USERNAME
              name: cm-choreo-program-db
        # TRACE_DB
        - name: CHOREO_TRACE_DB_HOST
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_HOST
              name: cm-choreo-trace-db
        - name: CHOREO_TRACE_DB_NAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_NAME
              name: cm-choreo-trace-db
        - name: CHOREO_TRACE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-trace-db
              key: CHOREO_DB_PASSWORD
        - name: CHOREO_TRACE_DB_PORT
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_PORT
              name: cm-choreo-trace-db
        - name: CHOREO_TRACE_DB_USERNAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_USERNAME
              name: cm-choreo-trace-db
        # AZURE TSI
        - name: AZURE_TIMESERIESINSIGHTS_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: cm-obsapi
              key: AZURE_TIMESERIESINSIGHTS_CLIENT_ID
        - name: AZURE_TIMESERIESINSIGHTS_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: cm-obsapi
              key: AZURE_TIMESERIESINSIGHTS_TENANT_ID
        - name: AZURE_TIMESERIESINSIGHTS_ENVIRONMENT_FQDN
          valueFrom:
            configMapKeyRef:
              name: cm-obsapi
              key: AZURE_TIMESERIESINSIGHTS_ENVIRONMENT_FQDN
        - name: AZURE_TIMESERIESINSIGHTS_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: secret-obsapi
              key: AZURE_TIMESERIESINSIGHTS_CLIENT_SECRET
          # AZURE ADX
        - name: AZURE_ADX_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: cm-obsapi
              key: AZURE_ADX_CLIENT_ID
        - name: AZURE_ADX_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: cm-obsapi
              key: AZURE_ADX_ENDPOINT
        - name: AZURE_ADX_DB
          valueFrom:
            configMapKeyRef:
              name: cm-obsapi
              key: AZURE_ADX_DB
        - name: AZURE_ADX_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: cm-obsapi
              key: AZURE_ADX_TENANT_ID
        - name: AZURE_ADX_METRIC_TABLE
          valueFrom:
            configMapKeyRef:
              name: cm-obsapi
              key: AZURE_ADX_METRIC_TABLE
        - name: AZURE_ADX_TRACE_TABLE
          valueFrom:
            configMapKeyRef:
              name: cm-obsapi
              key: AZURE_ADX_TRACE_TABLE
        - name: AZURE_ADX_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: secret-obsapi
              key: AZURE_ADX_CLIENT_SECRET
        # --------------------------------------------------------
        image: choreoipaas/observability-api:latest
        securityContext:
          runAsUser: 100
          runAsGroup: 1000
        name: obsapi
        ports:
        - containerPort: 9095
          name: obsapi-port
          protocol: TCP
        readinessProbe:
          httpGet:
            port: obsapi-port
            path: /health
        livenessProbe:
          httpGet:
            port: obsapi-port
            path: /health
      serviceAccountName: sa-choreo-default

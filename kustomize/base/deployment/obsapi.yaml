apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
#    secret.reloader.stakater.com/reload: "choreo-secret"
#    configmap.reloader.stakater.com/reload: "cm-choreo-program-db,cm-choreo-trace-db"
    reloader.stakater.com/auto: "true"
  labels:
    choreo.component: obsapi
  name: obsapi
spec:
  replicas: 1
  selector:
    matchLabels:
      choreo.component: obsapi
  template:
    metadata:
      labels:
        choreo.component: obsapi
    spec:
      containers:
      - env:
        - name: CHOREO_PROGRAM_DB_HOST
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_HOST
              name: cm-choreo-program-db
        - name: CHOREO_PROGRAM_DB_NAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_NAME
              name: cm-choreo-program-db
        - name: CHOREO_PROGRAM_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: choreo-secret
              key: choreo_program_db_password
        - name: CHOREO_PROGRAM_DB_PORT
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_PORT
              name: cm-choreo-program-db
        - name: CHOREO_PROGRAM_DB_USERNAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_USERNAME
              name: cm-choreo-program-db
        - name: CHOREO_TRACE_DB_HOST
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_HOST
              name: cm-choreo-trace-db
        - name: CHOREO_TRACE_DB_NAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_NAME
              name: cm-choreo-trace-db
        - name: CHOREO_TRACE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: choreo-secret
              key: choreo_trace_db_password
        - name: CHOREO_TRACE_DB_PORT
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_PORT
              name: cm-choreo-trace-db
        - name: CHOREO_TRACE_DB_USERNAME
          valueFrom:
            configMapKeyRef:
              key: CHOREO_DB_USERNAME
              name: cm-choreo-trace-db
        - name: AZURE_TIMESERIESINSIGHTS_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: choreo-secret
              key: tsi_client_id
        - name: AZURE_TIMESERIESINSIGHTS_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: choreo-secret
              key: tsi_client_secret
        - name: AZURE_TIMESERIESINSIGHTS_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: choreo-secret
              key: tsi_tenant_id 
        - name: AZURE_TIMESERIESINSIGHTS_ENVIRONMENT_FQDN
          valueFrom:
            secretKeyRef:
              name: choreo-secret
              key: tsi_env_fqdn
        image: choreoipaas/observability-api:latest
        name: obsapi
        ports:
        - containerPort: 9095

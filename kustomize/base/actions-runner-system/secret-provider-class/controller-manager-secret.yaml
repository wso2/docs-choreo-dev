apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: controller-manager-secret
spec:
  secretObjects:
    - secretName: controller-manager
      type: Opaque
      data:
        - objectName: ARC_GITHUB_TOKEN
          key: github_token
  parameters:
    objects:  |
      array:
        - |
          objectName: ARC-GITHUB-TOKEN
          objectType: secret
          objectAlias: ARC_GITHUB_TOKEN
          objectVersion: "{{.ARC_GITHUB_TOKEN}}"

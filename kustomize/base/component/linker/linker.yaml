---
apiVersion: "v1"
kind: "Service"
metadata:
  labels:
    app: "choreo-linker-0.1.2"
  name: "linker-svc"
spec:
  ports:
  - name: "http-linker-svc"
    port: 9090
    protocol: "TCP"
    targetPort: 9090
  selector:
    app: "choreo-linker-0.1.2"
  type: "ClusterIP"
---
apiVersion: "v1"
kind: "Service"
metadata:
  labels:
    app: "choreo-linker-0.1.2"
  name: "linkerunsecured-svc"
spec:
  ports:
  - name: "http-linkerunse"
    port: 9092
    protocol: "TCP"
    targetPort: 9092
  selector:
    app: "choreo-linker-0.1.2"
  type: "ClusterIP"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  labels:
    app: "choreo-linker-0.1.2"
  name: "choreo-linker-0-deployment"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "choreo-linker-0.1.2"
  template:
    metadata:
      labels:
        app: "choreo-linker-0.1.2"
    spec:
      containers:
      - image: "choreoctrlplane.azurecr.io/choreoipaas/choreo-linker:latest"
        imagePullPolicy: "IfNotPresent"
        lifecycle:
          preStop:
            exec:
              command:
              - "sleep"
              - "15"
        livenessProbe:
          httpGet:
            path: "/health"
            port: 9091
          initialDelaySeconds: 30
        name: "choreo-linker-0-deployment"
        ports:
        - containerPort: 9090
          name: "http-linker-svc"
          protocol: "TCP"
        - containerPort: 9092
          name: "http-linkerunse"
          protocol: "TCP"
        readinessProbe:
          httpGet:
            path: "/health"
            port: 9091
          initialDelaySeconds: 30
        resources:
          limits:
            memory: "768Mi"
            cpu: "500m"
          requests:
            memory: "512Mi"
            cpu: "300m"
      nodeSelector: {}
---
apiVersion: "autoscaling/v2beta2"
kind: "HorizontalPodAutoscaler"
metadata:
  labels:
    app: "choreo-linker-0.1.2"
  name: "choreo-linker-0-hpa"
spec:
  maxReplicas: 3
  metrics:
  - resource:
      name: "cpu"
      target:
        averageUtilization: 75
        type: "Utilization"
    type: "Resource"
  minReplicas: 2
  scaleTargetRef:
    apiVersion: "apps/v1"
    kind: "Deployment"
    name: "choreo-linker-0-deployment"

kind: HorizontalPodAutoscaler
metadata:
  name: "choreo-linker-0-hpa"
spec:
  maxReplicas: 3
  minReplicas: 2
  metrics:
    - resource:
        name: "cpu"
        target:
          averageUtilization: 75
          type: "Utilization"
      type: "Resource"
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    choreo.component: identity-server
  name: identity-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: identity-server
  minReplicas: 2
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 85
    - type: Resource
      resource:
        name: memory
        targetAverageUtilization: 85

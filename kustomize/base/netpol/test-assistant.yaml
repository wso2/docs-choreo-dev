apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-test-assistant
spec:
  podSelector:
    matchLabels:
      choreo.component: test-assistant
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-ingress-controller
  egress: []

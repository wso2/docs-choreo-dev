helmCharts:
  - name: actions-runner-controller
    includeCRDs: true
    valuesInline:
      additionalVolumes:
        - name: controller-manager-secret
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: controller-manager-secret
            nodePublishSecretRef:
              name: csi-secret-store-azure
      additionalVolumeMounts:
        - name: controller-manager-secret
          mountPath: /mnt/csi/secrets/controller-manager-secret
      authSecret:
        name: controller-manager-secret
        create: false
      githubWebhookServer:
        enabled: true
        nodeSelector:
          execution-mode: ghrunner
        podDisruptionBudget:
          enabled: true
          minAvailable: 50%
        ports:
          - nodePort: 33080
        replicaCount: 2
        tolerations:
          - effect: NoSchedule
            key: ghrunner
            operator: Exists
      image:
        actionsRunnerRepositoryAndTag: choreocontrolplane.azurecr.io/summerwind/actions-runner:latest
        dindSidecarRepositoryAndTag: choreocontrolplane.azurecr.io/docker:dind
        repository: choreocontrolplane.azurecr.io/summerwind/actions-runner-controller
      metrics:
        proxy:
          image:
            repository: choreocontrolplane.azurecr.io/brancz/kube-rbac-proxy
      nodeSelector:
        execution-mode: ghrunner
      podDisruptionBudget:
        enabled: true
        minAvailable: 50%
      replicaCount: 2
      tolerations:
        - effect: NoSchedule
          key: ghrunner
          operator: Exists
    releaseName: actions-runner-controller
    version: 0.23.3
    repo: https://actions-runner-controller.github.io/actions-runner-controller

resources:
  - deployment
  - hpa

namespace: actions-runner-system

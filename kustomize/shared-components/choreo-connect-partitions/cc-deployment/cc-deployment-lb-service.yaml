apiVersion: v1
kind: Service
metadata:
  labels:
    choreo.component: choreo-connect-deployment
  name: router-lb
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: ""
spec:
  selector:
    choreo.component: choreo-connect-deployment
  ports:
    - name: "http-routeradmin"
      port: 9000
      protocol: TCP
      targetPort: 9000
    - name: "https-router"
      port: 9095
      protocol: TCP
      targetPort: 9095
  type: LoadBalancer
  loadBalancerIP: ""

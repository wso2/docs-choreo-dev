apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_AZURE_WSO2_2=LinkerD is not enabled
    checkov.io/skip2: CKV_K8S_25=NetRAW is required
  name: choreo-apim-tm-2-deployment
spec:
  progressDeadlineSeconds: 900
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      deployment: choreo-tm-2
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: deployment
                      operator: In
                      values:
                        - choreo-tm-2
                topologyKey: kubernetes.io/hostname
      # Remove fsGroup due to issue in init container. TODO: Remove init container.
      # securityContext:
      #   fsGroup: 802
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wso2am
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-product-apim:latest
          imagePullPolicy: Always
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - nc -z -v -w 4 localhost 9611
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - nc -z -v -w 4 localhost 9611
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - ${WSO2_SERVER_HOME}/bin/api-manager.sh stop
          resources:
            requests:
              memory: 4Gi
              cpu: 3000m
            limits:
              memory: 4Gi
              cpu: 3000m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 10500
            runAsGroup: 10500
            capabilities:
              drop:
                - ALL
              add:
                - NET_RAW
          ports:
            - containerPort: 9711
              protocol: "TCP"
            - containerPort: 9611
              protocol: "TCP"
            - containerPort: 5672
              protocol: "TCP"
          envFrom:
            - configMapRef:
                name: cm-feature-flags
            - configMapRef:
                name: env-tm-2
            - secretRef:
                name: secret-apim-keystore-passwords
            - secretRef:
                name: secret-apim
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: apim-vol
              mountPath: /home/wso2carbon/wso2am-4.0.0-SNAPSHOT
            - name: wso2am-conf
              mountPath: /home/wso2carbon/wso2-config-volume/repository/conf/deployment.toml
              subPath: tm-2-deployment.toml
            - name: wso2am-conf
              mountPath: /home/wso2carbon/wso2-config-volume/repository/conf/log4j2.properties
              subPath: log4j2.properties
            - name: apim-docker-entrypoint
              mountPath: /home/wso2carbon/docker-entrypoint.sh
              subPath: docker-entrypoint.sh
            - name: mysql-connector-jar
              mountPath: /home/wso2carbon/wso2-artifact-volume/repository/components/lib
            - name: secret-apim-keystores
              mountPath: /mnt/csi/secret-apim-keystores
              readOnly: true
            - name: secret-apim-keystores
              mountPath: /home/wso2carbon/wso2-keystores/primary-keystore.pfx
              readOnly: true
              subPath: APIM_PRIMARY_KEYSTORE
            - name: secret-apim-keystores
              mountPath: /home/wso2carbon/wso2-keystores/tls-keystore.pfx
              readOnly: true
              subPath: APIM_TLS_KEYSTORE
            - name: secret-apim-keystores
              mountPath: /home/wso2carbon/wso2-keystores/internal-keystore.pfx
              readOnly: true
              subPath: APIM_INTERNAL_KEYSTORE
            - name: apim-truststore
              mountPath: /home/wso2carbon/wso2-config-volume/repository/resources/security/client-truststore.jks
              subPath: client-truststore.jks
            - name: secret-apim
              mountPath: /mnt/csi/secret-apim
              readOnly: true
      volumes:
        - name: apim-vol
          emptyDir: { }
        - name: wso2am-conf
          configMap:
            name: choreo-apim-tm-2-conf
        - name: apim-docker-entrypoint
          configMap:
            name: choreo-apim-docker-entrypoint
            defaultMode: 0407
        - name: mysql-connector-jar
          emptyDir: { }
        - name: secret-apim-keystores
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-apim-keystores
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: apim-truststore
          configMap:
            name: choreo-apim-truststore
        - name: secret-apim
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-apim
            nodePublishSecretRef:
              name: csi-secret-store-azure

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    seccomp.security.alpha.kubernetes.io/pod: "docker/default"
    checkov.io/skip1: "CKV_K8S_38=Need this to talk to kube api"
  labels:
    choreo.component: opentelemetry-agent
  name: opentelemetry-agent
spec:
  selector:
    matchLabels:
      choreo.component: opentelemetry-agent
  template:
    metadata:
      labels:
        choreo.component: opentelemetry-agent
        antiaffinity: opentelemetry-agent
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "60"
        seccomp.security.alpha.kubernetes.io/pod: "docker/default"
    spec:
      automountServiceAccountToken: true
      serviceAccountName: pixie-opentelemetry-agent-sa
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - envFrom:
          - configMapRef:
              name: opentelemetry-agent-env
          - secretRef:
              name: opentelemetry-agent
        image: choreocontrolplane.azurecr.io/choreoipaas/choreo-opentelemetry-collector:latest
        name: otel-collector
        resources:
          limits:
            cpu: 500m
            memory: 500Mi
          requests:
            cpu: 100m
            memory: 100Mi
        ports:
          - containerPort: 4317 
            name: otlp-grpc
            protocol: TCP # Default endpoint for OpenTelemetry receiver.
          - containerPort: 13133
            name: liveness-port
            protocol: TCP
          - containerPort: 13134
            name: readiness-port
            protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          timeoutSeconds: 15
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          httpGet:
            port: readiness-port
            path: /readiness
        livenessProbe:
          initialDelaySeconds: 10
          timeoutSeconds: 15
          periodSeconds: 30
          failureThreshold: 3
          successThreshold: 1
          httpGet:
            port: liveness-port
            path: /liveness
        securityContext:
          runAsUser: 10500
          runAsGroup: 10500
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - all
        volumeMounts:
          - name: config
            mountPath: /app/config.yaml
            subPath: config.yaml
            readOnly: true
          - mountPath: /mnt/csi/secret-otel
            name: secret-otel
            readOnly: true
      volumes:
        - name: secret-otel
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: opentelemetry-agent
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: config
          configMap:
            name: opentelemetry-agent-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: antiaffinity
                  operator: In
                  values:
                  - opentelemetry-agent
              topologyKey: kubernetes.io/hostname

apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-enricher
  labels:
    app.kubernetes.io/name: choreo-log-enricher
    app.kubernetes.io/part-of: choreo-observability
    choreo.component: log-enricher
    app: log-enricher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: choreo-log-enricher
      app.kubernetes.io/part-of: choreo-observability
      choreo.component: log-enricher
      app: log-enricher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: choreo-log-enricher
        app.kubernetes.io/part-of: choreo-observability
        choreo.component: log-enricher
        app: log-enricher
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: log-enricher
          envFrom:
            - configMapRef:
                name: log-enricher-config
          env:
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: log-enricher
                  key: opensearch-password
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-log-enricher:latest
          securityContext:
            runAsUser: 10500
            runAsGroup: 10500
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          volumeMounts:
            - name: opensearch-password
              mountPath: "/mnt/csi/opensearch-password"
              readOnly: true
          ports:
            - containerPort: 9090
              name: log-enricher-port
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: log-enricher-port
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: log-enricher-port
              path: /liveness
          resources:
            limits:
              cpu: "500m"
              memory: "1200Mi"
            requests:
              cpu: "300m"
              memory: "800Mi"
      volumes:
        - name: opensearch-password
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: log-enricher
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always
      serviceAccountName: log-enricher-sa

apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-enricher
  namespace: default
  labels:
    app.kubernetes.io/name: choreo-log-enricher
    app.kubernetes.io/part-of: choreo-observability
    choreo.component: log-enricher
    app: log-enricher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: choreo-log-enricher
      app.kubernetes.io/part-of: choreo-observability
      choreo.component: log-enricher
      app: log-enricher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: choreo-log-enricher
        app.kubernetes.io/part-of: choreo-observability
        choreo.component: log-enricher
        app: log-enricher
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - envFrom:
          - configMapRef:
              name: log-enricher-config
          image: log-enricher:latest
          name: log-enricher
          ports:
          - containerPort: 9090
            name: log-enricher-port
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: log-enricher-port
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: log-enricher-port
              path: /liveness
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      serviceAccountName: log-enricher-sa
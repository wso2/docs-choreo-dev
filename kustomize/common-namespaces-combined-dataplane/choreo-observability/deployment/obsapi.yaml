apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_AZURE_WSO2_2=Linkerd is not used in dataplanes
  labels:
    app.kubernetes.io/name: choreo-hubble-exporter
    app.kubernetes.io/part-of: choreo-observability
    choreo.component: obsapi
  name: obsapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: obsapi
      app.kubernetes.io/part-of: choreo-observability
      choreo.component: obsapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obsapi
        app.kubernetes.io/part-of: choreo-observability
        choreo.component: obsapi
        antiaffinity: obsapi
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - envFrom:
            - configMapRef:
                name: cm-obsapi
            - configMapRef:
                name: obsapi-env
            - secretRef:
                name: secret-obsapi
          image: choreocontrolplane.azurecr.io/choreoipaas/observability-api-dp:latest
          securityContext:
            runAsUser: 10500
            runAsGroup: 10500
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          name: obsapi
          ports:
            - containerPort: 9095
              name: obsapi-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: obsapi-port
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: obsapi-port
              path: /liveness
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 50m
              memory: 50Mi
          volumeMounts:
            - mountPath: /mnt/csi/secret-obsapi
              name: secret-obsapi
              readOnly: true
      volumes:
        - name: secret-obsapi
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-obsapi
            nodePublishSecretRef:
              name: csi-secret-store-azure
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - obsapi
              topologyKey: kubernetes.io/hostname

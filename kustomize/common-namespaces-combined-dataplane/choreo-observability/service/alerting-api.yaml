apiVersion: v1
kind: Service
metadata:
  name: choreo-alerting-service
  namespace: choreo-observability
spec:
  selector:
    choreo.component: choreo-alerting-api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: service
    - protocol: TCP
      port: 8081
      targetPort: 8081
      name: webhook
  type: ClusterIP
  
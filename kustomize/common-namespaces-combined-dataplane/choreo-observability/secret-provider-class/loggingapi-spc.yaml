apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: loggingapi-secret
spec:
  secretObjects:
    - secretName: loggingapi-secret
      type: Opaque
      data:
        - objectName: AZURE_LA_CLIENT_SECRET
          key: AZURE_LA_CLIENT_SECRET
  parameters:
    objects: |
      array:
        - |
          objectName: {{.AZURE_LA_CLIENT_SECRET_OBJ_NAME | default "obs-log-analytics-read-logging-api-client-secret"}}
          objectType: secret
          objectAlias: AZURE_LA_CLIENT_SECRET
          objectVersion: "{{.AZURE_LA_CLIENT_SECRET}}"

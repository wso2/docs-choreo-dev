apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: log-enricher
  secretObjects:
    - secretName: log-enricher
      type: Opaque
      data:
        - key: opensearch-password
          objectName: OPENSEARCH_PASSWORD
  parameters:
    objects: |
      array:
        - |
          objectName: {{.OPENSEARCH_PASSWD_OBJ_NAME | default "obs-opensearch-password"}}
          objectType: secret
          objectAlias: OPENSEARCH_PASSWORD
          objectVersion: "{{.OPENSEARCH_PASSWD}}"

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: insights-api-opensearch-password
spec:
  secretObjects:
    - secretName: insights-api-opensearch-password
      type: Opaque
      data:
        - key: insights-api-opensearch-password
          objectName: OPENSEARCH_PASSWORD
  parameters:
    objects: |
      array:
        - |
          objectName: {{.OPENSEARCH_PASSWORD_OBJ_NAME | default "insights-api-opensearch-password"}}
          objectType: secret
          objectAlias: OPENSEARCH_PASSWORD
          objectVersion: "{{.OPENSEARCH_PASSWORD}}"

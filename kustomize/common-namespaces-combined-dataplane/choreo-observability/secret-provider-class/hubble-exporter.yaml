apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-hubble-exporter
spec:
  secretObjects:
    - secretName: secret-hubble-exporter
      type: Opaque
      data:
        - objectName: EVENT_HUB_CONNECTION_STRING
          key: EVENT_HUB_CONNECTION_STRING
  parameters:
    objects: |
      array:
        - |
          objectName: obs-eh-primary-conn-string
          objectType: secret
          objectAlias: EVENT_HUB_CONNECTION_STRING
          objectVersion: "{{.EVENT_HUB_CONNECTION_STRING}}"

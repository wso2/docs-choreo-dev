apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-rules-insights-query-api
spec:
  endpointSelector:
    matchLabels:
      choreo.component: insights-query-api
  ingress:
    - fromEndpoints:
        - matchLabels:
            cc.component: choreo-connect-deployment
            k8s:io.kubernetes.pod.namespace: dev-choreo-apim
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
    - toEndpoints:
        # Allow egress from query API to OpenSearch
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: choreo-observability
            app.kubernetes.io/name: opensearch
        # Allow egress from query API to the operator based OpenSearch
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: choreo-observability
            opster.io/opensearch-cluster: opensearch
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
    - toFQDNs:
        - matchName: sts.preview-dv.choreo.dev
        - matchName: apis.preview-dv.choreo.dev
        - matchName: appv2.preview-dv.choreo.dev

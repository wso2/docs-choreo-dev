apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-rules-opensearch
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: choreo-observability
            app.kubernetes.io/name: opensearch
      toPorts:
        - ports:
            - port: "9300"
              protocol: TCP
  ingress:
    - fromEntities:
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: choreo-observability
            app.kubernetes.io/name: opensearch
      toPorts:
        - ports:
            - port: "9300"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: choreo-observability
            choreo.component: loggingapi
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: choreo-observability
            app.kubernetes.io/name: fluent-bit
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP

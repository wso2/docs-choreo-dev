configMapGenerator:
  - name: choreo-analytics-query-api-conf
    behavior: create
    literals:
      - ORG_ENDPOINT={{.ORG_ENDPOINT}}
      - CHOREO_API_DETAILS_ENDPOINT={{.CHOREO_API_DETAILS_ENDPOINT}}
      - CHOREO_ON_PREM_KEY_LIST_ENDPOINT={{.CHOREO_ON_PREM_KEY_LIST_ENDPOINT}}
      - CHOREO_ORG_UUID={{.CHOREO_ORG_UUID}}
      - RUDDER_ENDPOINT={{.RUDDER_ENDPOINT}}
      - PROJECT_ENDPOINT={{.PROJECT_ENDPOINT}}
      - CORS_ALLOW_CREDENTIALS={{.CORS_ALLOW_CREDENTIALS}}
      - CORS_ALLOW_ORIGINS={{.CORS_ALLOW_ORIGINS}}
      - CORS_ALLOWED_METHODS={{.CORS_ALLOWED_METHODS}}
      - CORS_ALLOWED_HEADERS={{.CORS_ALLOWED_HEADERS}}
      - INTROSPECTION_ENDPOINT={{.INTROSPECTION_ENDPOINT}}
      - USER_TOKEN_CACHE_EXPIRYTIME=3600
      - USER_TOKEN_CACHE_SIZE=100
      - ON_PREM_TOKEN_CACHE_EXPIRYTIME=3600
      - ON_PREM_TOKEN_CACHE_SIZE=100
      - PROJECT_CACHE_SIZE=100
      - PROJECT_CACHE_EXPIRYTIME=60
      - CHOREO_APIM_ORG_UUID={{.CHOREO_APIM_ORG_UUID}}
      - LOGGER_LEVEL_ORG_WSO2_CHOREO_ANALYTICS_API={{.LOGGER_LEVEL_ORG_WSO2_CHOREO_ANALYTICS_API}}
      - SECURITY_JWKS={{.SECURITY_JWKS}}
      - SECURITY_JWKS_ISSUER={{.SECURITY_JWKS_ISSUER}}
      - JWT_ASSERTION_AUTH_HEADER=X-JWT-Assertion
      - CHOREO_SYSTEM_ORG_UUID={{.CHOREO_SYSTEM_ORG_UUID}}
      - SERVER_MAX_HTTP_HEADER_SIZE=20KB
      - CODEC_MAX_IN_MEMORY_SIZE=10485760
      - TRUSTSTORE_PATH=/mnt/csi/client-truststore/truststore.p12
      - ENABLE_DEFAULT_TRUSTSTORE=false
      - REDIS=choreo-analytics-query-api
  - name: analytics-client-truststore
    behavior: create
    files:
      - client-truststore/truststore.p12

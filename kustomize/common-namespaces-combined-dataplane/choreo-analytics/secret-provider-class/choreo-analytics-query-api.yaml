apiVersion: secrets-store.csi.x-k8s.io/v1alpha1
kind: SecretProviderClass
metadata:
  name: choreo-analytics-query-api-cert
spec:
  provider: azure
  secretObjects:
    - secretName: choreo-analytics-query-api-secret
      type: Opaque
      data:
        - key: ALERT_API_PASSWORD
          objectName: ALERT_API_PASSWORD
        - key: TRUSTSTORE_PASSWORD
          objectName: truststore-password
  parameters:
    objects: |
      array:
        - |
          objectName: truststore-password
          objectType: secret
          objectAlias: TRUSTSTORE_PASSWORD
          objectVersion: "{{.TRUSTSTORE_PASSWORD}}"
        - |
          objectName: keystore-pw-alert-api
          objectType: secret
          objectAlias: ALERT_API_PASSWORD
          objectVersion: "{{.ALERT_API_PASSWORD}}"

apiVersion: secrets-store.csi.x-k8s.io/v1alpha1
kind: SecretProviderClass
metadata:
  name: analytics-api-cert
spec:
  provider: azure
  parameters:
    objects: |
      array:
        - |
          objectName: analytics-api-store
          objectAlias: https.pfx.base64
          objectType: secret
          objectFormat: pfx

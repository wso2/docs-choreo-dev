apiVersion: batch/v1
kind: CronJob
metadata:
  name: cost-optimizer-dp-daily-cron
  namespace: choreo-ai
  labels:
    choreo.component: cost-optimizer-dp-daily-cron
spec:
  schedule: "0 1 * * *"
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 3
      completions: 1
      parallelism: 1
      template:
        metadata:
          annotations:
            seccomp.security.alpha.kubernetes.io/pod: "runtime/default"
            linkerd.io/inject: disabled
          labels:
            choreo.component: cost-optimizer-dp-daily-cron
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          containers:
            - name: cost-optimizer-dp-daily-cron
              image: choreocontrolplane.azurecr.io/choreoipaas/cost-optimizer-dp-daily-cron:latest
              securityContext:
                runAsUser: 10500
                runAsGroup: 10500
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - all
              envFrom:
                - configMapRef:
                    name: env-cost-optimizer-dp-daily-cron-cm
              resources:
                limits:
                  cpu: 500m
                  memory: 1024Mi
                requests:
                  cpu: 300m
                  memory: 512Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}

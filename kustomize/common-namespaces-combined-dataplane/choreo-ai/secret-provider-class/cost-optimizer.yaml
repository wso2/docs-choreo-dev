apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-cost-optimizer
spec:
  secretObjects:
    - secretName: secret-cost-optimizer
      type: Opaque
      data:
        - objectName: REDIS_PASSWORD
          key: REDIS_PASSWORD
  parameters:
    objects: |
      array:
        - |
          objectName: {{.REDIS_PASSWORD_OBJ_NAME | default "ai-api-test-redis-primary-access-key"}}
          objectType: secret
          objectAlias: REDIS_PASSWORD
          objectVersion: "{{.REDIS_PASSWORD}}"

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: marketplace-assistant-secret
spec:
  secretObjects:
    - secretName: marketplace-assistant-secret
      type: Opaque
      data:
        - objectName: AZURE_OPENAI_API_KEY
          key: AZURE_OPENAI_API_KEY
        - objectName: ZILLIZ_CLOUD_API_KEY
          key: ZILLIZ_CLOUD_API_KEY
  parameters:
    objects: |
      array:
        - |
          objectName: {{.AZURE_OPENAI_API_KEY_OBJ_NAME | default "ai-cogsvc-dp-westus-primary-access-key"}}
          objectType: secret
          objectAlias: AZURE_OPENAI_API_KEY
          objectVersion: "{{.AZURE_OPENAI_API_KEY}}"
        - |
          objectName: {{.ZILLIZ_CLOUD_API_KEY_OBJ_NAME | default "ai-zilliz-CLUSTER-API-KEY"}}
          objectType: secret
          objectAlias: ZILLIZ_CLOUD_API_KEY
          objectVersion: "{{.ZILLIZ_CLOUD_API_KEY}}"

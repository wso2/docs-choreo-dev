[ballerina.log]
format = "json"
level = "{{.LOG_LEVEL}}"

[[ballerina.log.modules]]
name = "choreo/testgpt"
level = "{{.LOG_LEVEL_TESTGPT}}"

[choreo.testgpt.config]
azureOpenAIServiceUrl =  "{{.OPENAI_SERVICE_URL_TESTGPT}}"
azureOpenAITextDeploymentId = "{{.OPENAI_TEXT_DEPLOYMENT_ID_TESTGPT}}"
azureOpenAIChatDeploymentId = "{{.OPENAI_CHAT_DEPLOYMENT_ID_TESTGPT}}"
azureOpenAIApiVersion = "2023-05-15"
azureOpenAIToken = "/mnt/csi/secret-testgpt/OPENAI-ACCESS-KEY"

isClusterConnection="{{.IS_REDIS_CLUSTER_CONNECTION | default "false"}}"
redisClusterHost = "redis-cluster-headless.redis.svc.cluster.local"
redisClusterUser = "testgpt_user"
redisClusterPassword = "/mnt/csi/secret-testgpt/REDIS-CLUSTER-AUTH-KEY"
redisHost = "{{.REDIS_HOST_TESTGPT}}"
redisPassword = "/mnt/csi/secret-testgpt/REDIS-AUTH-KEY"

appServiceUrl = "{{.APP_SERVICE_URL}}"
graphqlUrl = "{{.GRAPHQL_URL}}"
apimUrl = "{{.APIM_URL}}"
region = "{{.REGION}}"

testAuthHeaderName = "{{.TEST_AUTH_HEADER_NAME | default "API-Key"}}"


apiVersion: v1
kind: Service
metadata:
  namespace: keda
  name: keda-http-add-on-external-scaler
  labels:
    app.kubernetes.io/instance: external-scaler
spec:
  selector:
    app.kubernetes.io/instance: external-scaler
  ports:
  - name: grpc
    protocol: TCP
    port: 9090
    targetPort: grpc
  - name: health
    protocol: TCP
    port: 9091
    targetPort: health

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: keda-http-add-on-interceptor
  namespace: keda
spec:
  maxReplicaCount: 10
  minReplicaCount: 3
  pollingInterval: 1
  scaleTargetRef:
    kind: Deployment
    name: keda-http-add-on-interceptor
  triggers:
  - metadata:
      interceptorTargetPendingRequests: "200"
      scalerAddress: keda-http-add-on-external-scaler.keda:9090
    type: external

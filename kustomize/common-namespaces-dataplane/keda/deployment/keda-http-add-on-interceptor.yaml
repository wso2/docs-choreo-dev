apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-http-add-on-interceptor
  namespace: keda
  labels:
    app.kubernetes.io/instance: interceptor
  annotations:
    checkov.io/skip1: CKV_K8S_38=Service account is needed
    checkov.io/skip2: CKV_K8S_29=Container level security context is set
    checkov.io/skip3: CKV_K8S_AZURE_WSO2_2=Default is set by NIC
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: interceptor
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: interceptor
      annotations:
        policy.cilium.io/proxy-visibility: <Ingress/8080/TCP/HTTP>,<Egress/8080/UDP/DNS>,<Egress/80/TCP/HTTP>
        seccomp.security.alpha.kubernetes.io/pod: "runtime/default"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - arm64
      containers:
      - name: interceptor
        image: choreocontrolplane.azurecr.io/choreoipaas/dp-keda-http-add-on-interceptor:latest
        env:
        - name: KEDA_HTTP_ROUTING_TABLE_UPDATE_DURATION_MS
          value: "500"
        - name: KEDA_HTTP_CURRENT_NAMESPACE
          value: "keda"
        - name: KEDA_HTTP_PROXY_PORT
          value: "8080"
        - name: KEDA_HTTP_ADMIN_PORT
          value: "9090"
        - name: KEDA_HTTP_CONNECT_TIMEOUT
          value: "500ms"
        - name: KEDA_HTTP_KEEP_ALIVE
          value: "1s"
        - name: KEDA_RESPONSE_HEADER_TIMEOUT
          value: "120000ms"
        - name: KEDA_CONDITION_WAIT_TIMEOUT
          value: "20s"
        - name: KEDA_HTTP_DEPLOYMENT_CACHE_POLLING_INTERVAL_MS
          value: "1000"
        - name: KEDA_HTTP_FORCE_HTTP2
          value: "false"
        - name: KEDA_HTTP_MAX_IDLE_CONNS
          value: "100"
        - name: KEDA_HTTP_IDLE_CONN_TIMEOUT
          value: "90s"
        - name: KEDA_HTTP_TLS_HANDSHAKE_TIMEOUT
          value: "10s"
        - name: KEDA_HTTP_EXPECT_CONTINUE_TIMEOUT
          value: "1s"
        ports:
        # TODO(pedrotorres): remove after implementing new routing table
        - name: admin
          containerPort: 9090
        - name: proxy
          containerPort: 8080
        # TODO(pedrotorres): set better default values avoiding overcommitment
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 1000m
            memory: 1000Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          # choreo changes
          # runAsNonRoot: true
          runAsUser: 10001
          # choreo changes
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        # added by choreo
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        # added by choreo
      serviceAccountName: keda-http-add-on-interceptor
      terminationGracePeriodSeconds: 10

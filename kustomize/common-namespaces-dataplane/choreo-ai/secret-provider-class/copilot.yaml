apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-ai-copilot
spec:
  secretObjects:
    - secretName: secret-ai-copilot
      type: Opaque
      data:
        - objectName: AZURE_OPENAI_API_KEY
          key: AZURE_OPENAI_API_KEY
        - objectName: REDIS_PASSWORD
          key: REDIS_PASSWORD
  parameters:
    objects: |
      array:
        - |
          objectName: ai-cogsvc-eastus2-primary-access-key
          objectType: secret
          objectAlias: AZURE_OPENAI_API_KEY
          objectVersion: "{{.AZURE_OPENAI_API_KEY}}"
        - |
          objectName: ai-api-test-redis-primary-access-key
          objectType: secret
          objectAlias: REDIS_PASSWORD
          objectVersion: "{{.REDIS_PASSWORD}}"

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-docs-assistant
spec:
  secretObjects:
    - secretName: secret-docs-assistant
      type: Opaque
      data:
        - objectName: AZURE_OPENAI_API_KEY
          key: AZURE_OPENAI_API_KEY
        - objectName: ZILLIZ_CLOUD_API_KEY
          key: ZILLIZ_CLOUD_API_KEY
        - objectName: CP_AZURE_OPENAI_API_KEY
          key: CP_AZURE_OPENAI_API_KEY
        - objectName: COHERE_API_KEY
          key: COHERE_API_KEY
  parameters:
    objects: |
      array:
        - |
          objectName: ai-cogsvc-dp-eastus2-primary-access-key
          objectType: secret
          objectAlias: AZURE_OPENAI_API_KEY
          objectVersion: "{{.AZURE_OPENAI_API_KEY}}"
        - |
          objectName: ai-zilliz-CLUSTER-API-KEY
          objectType: secret
          objectAlias: ZILLIZ_CLOUD_API_KEY
          objectVersion: "{{.ZILLIZ_CLOUD_API_KEY}}"
        - |
          objectName: ai-cogsvc-cp-eastus2-primary-access-key
          objectType: secret
          objectAlias: CP_AZURE_OPENAI_API_KEY
          objectVersion: "{{.CP_AZURE_OPENAI_API_KEY}}"
        - |
          objectName: {{.COHERE_API_KEY_OBJ_NAME | default "cohere-api-key"}}
          objectType: secret
          objectAlias: COHERE_API_KEY
          objectVersion: "{{.COHERE_API_KEY}}"

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: obs-assistant-secret
spec:
  secretObjects:
    - secretName: obs-assistant-secret
      type: Opaque
      data:
        - objectName: AZURE_OPENAI_API_KEY
          key: AZURE_OPENAI_API_KEY
  parameters:
    objects: |
      array:
        - |
          objectName: ai-cogsvc-primary-access-key
          objectType: secret
          objectAlias: AZURE_OPENAI_API_KEY
          objectVersion: "{{.AZURE_OPENAI_API_KEY}}"
      
      

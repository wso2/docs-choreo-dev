[ballerina.log]
format = "json"
level = "{{.LOG_LEVEL}}"

[[ballerina.log.modules]]
name = "choreo/loggingapi"
level = "{{.LOG_LEVEL_LOGGINGAPI}}"

[choreo.loggingapi.enovyRespCodeLookupTableMap]
via_upstream = "SERVICE_RESPONSE"
cors_response = "CORS_RESPONSE"
ext_authz_denied = "AUTH_FAILURE"
no_healthy_upstream = "NO_HEALTHY_SERVICE"
request_rate_limited = "RATE_LIMITED"
route_not_found = "RESOURCE_NOT_FOUND"
upstream_response_timeout = "SERVICE_TIMEOUT"
cluster_not_found = "GATEWAY_ERROR"

[choreo.loggingapi.envoyRespCodeExtendedStatusCodeLookupMap]
502 = "BAD_GATEWAY"
503 = "SERVICE_UNAVAILABLE"
504 = "GATEWAY_TIMEOUT"

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-obsapi
spec:
  secretObjects:
    - secretName: secret-obsapi
      type: Opaque
      data:
        - objectName: AZURE_ADX_CLIENT_SECRET
          key: AZURE_ADX_CLIENT_SECRET
  parameters:
    objects: |
      array:
        - |
          objectName: obsapi-ADX-CLIENT-SECRET
          objectType: secret
          objectAlias: AZURE_ADX_CLIENT_SECRET
          objectVersion: "{{.AZURE_ADX_CLIENT_SECRET}}"

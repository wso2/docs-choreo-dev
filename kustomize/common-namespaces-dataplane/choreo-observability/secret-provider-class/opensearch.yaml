apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: opensearch
spec:
  provider: azure
  secretObjects:
    - secretName: opensearch-internal-users
      type: Opaque
      data:
        - key: internal_users.yml
          objectName: OPENSEARCH_INTERNAL_USERS
    - secretName: opensearch-password
      type: Opaque
      data:
        - key: password
          objectName: OPENSEARCH_PASSWORD
  parameters:
    usePodIdentity: "false"
    keyvaultName: dev-csi-64
    tenantId: da76d684-740f-4d94-8717-9d5fb21dd1f9
    objects: |
      array:
        - |
          objectName: open-search-internal-users-us
          objectType: secret
          objectAlias: OPENSEARCH_INTERNAL_USERS
          objectVersion: {{.OPENSEARCH_INTERNAL_USERS}}
        - |
          objectName: open-search-password-us
          objectType: secret
          objectAlias: OPENSEARCH_PASSWORD
          objectVersion: {{.OPENSEARCH_PASSWORD}}

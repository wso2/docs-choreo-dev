apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sys-obsapi-secret
spec:
  secretObjects:
    - secretName: sys-obsapi-secret
      type: Opaque
      data:
        - objectName: AZURE_LA_CLIENT_SECRET
          key: AZURE_LA_CLIENT_SECRET
  parameters:
    objects:  |
      array:
        - |
          objectName: choreo-dev-log-analytics-read-sysobs-api
          objectType: secret
          objectAlias: AZURE_LA_CLIENT_SECRET
          objectVersion: {{.AZURE_LA_CLIENT_SECRET}}

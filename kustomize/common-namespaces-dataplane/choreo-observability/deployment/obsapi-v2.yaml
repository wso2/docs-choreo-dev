apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_AZURE_WSO2_2=Linkerd is not used in dataplanes
  labels:
    app.kubernetes.io/name: choreo-obs-api-v2
    app.kubernetes.io/part-of: choreo-observability
    choreo.component: obsapi-v2
  name: obsapi-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: obsapi-v2
      app.kubernetes.io/part-of: choreo-observability
      choreo.component: obsapi-v2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obsapi-v2
        app.kubernetes.io/part-of: choreo-observability
        choreo.component: obsapi-v2
        antiaffinity: obsapi-v2
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - envFrom:
            - configMapRef:
                name: cm-obsapi-v2
            - configMapRef:
                name: obsapi-env
          image: choreocontrolplane.azurecr.io/choreoipaas/observability-api:latest
          securityContext:
            runAsUser: 10500
            runAsGroup: 10500
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          name: obsapi-v2
          ports:
            - containerPort: 9095
              name: obsapi-v2-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: obsapi-v2-port
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: obsapi-v2-port
              path: /liveness
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 50m
              memory: 50Mi
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - obsapi-v2
              topologyKey: kubernetes.io/hostname

server {
        listen 8080 default_server;
        server_name "";
        listen [::]:8080 default_server;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        location / {
            rewrite ^/(.*) https://wso2.com/choreo permanent;
        }

        location /init-redis-subscribe {
            lua_socket_log_errors off;
            resolver kube-dns.kube-system.svc.cluster.local ipv6=off;

            set_by_lua_block $REDIS_HOST { return os.getenv("REDIS_HOST") }
            set_by_lua_block $REDIS_PORT { return os.getenv("REDIS_PORT") }
            set_by_lua_block $REDIS_SSL { return os.getenv("REDIS_SSL") }
            set_by_lua_block $REDIS_SSL_VERIFY { return os.getenv("REDIS_SSL_VERIFY") }
            set_by_lua_block $REDIS_DATABASE { return os.getenv("REDIS_DATABASE") }
            set_by_lua_block $REDIS_PASSWORD { return os.getenv("REDIS_PASSWORD") }
            set_by_lua_block $NAMESPACE { return os.getenv("NAMESPACE") }

            allow 127.0.0.1;
            deny all;

            access_by_lua_block {
                local redis = require "resty.redis"
                local split = require "choreo-util.split"
                local cjson = require "cjson"
                local cacheModule = require "choreo-util.cache"
  
                local cache = cacheModule.getCache()

                local red = redis:new()
                red:set_timeout(1000) -- 1 second

                local initConnection = function()
                    local ok, err = red:connect(ngx.var.REDIS_HOST, ngx.var.REDIS_PORT, {ssl=ngx.var.REDIS_SSL, ssl_verify=ngx.var.REDIS_SSL_VERIFY})
                    if not ok then
                        ngx.log(ngx.ERR, "failed to connect to redis: ", err)
                        return err
                    end

                    local res, err = red:auth(ngx.var.REDIS_PASSWORD)
                    if not res then
                        ngx.log(ngx.ERR, "failed to authenticate redis server: ", err)
                        return err
                    end

                    red:select(ngx.var.REDIS_DATABASE)

                    local subscribeResponse, err = red:psubscribe("#global-adapter#*")
                    if not subscribeResponse then
                        ngx.log(ngx.ERR, "failed to subscribe to redis: #global-adapter#*")
                        return err
                    else
                        ngx.log(ngx.INFO, "subscribed to redis channel: #global-adapter#*")
                    end
                end    

                local err = initConnection()
                if not err then
                    -- write to file to signal the sidecar redis-subscribe about the status
                    local file = io.open("/mnt/redis/redis-subscribe.txt", "w")
                    file:write("subscribed")
                    file:close()
                    local counter = 0
                    -- this is not intended to exit unless there is an issue with the nginx instance
                    while not ngx.worker.exiting() do
                        repeat
                            local key, err = red:read_reply()
                            if not key then
                                -- for redis subscribe read timeouts are usual and not considered as errors
                                if err ~= "timeout" then
                                    ngx.log(ngx.ERR, "redis read_reply() error: ", err)
                                    initConnection()
                                else
                                    if counter == 30 then
                                        local retry = false
                                        for i=1,3,1
                                        do
                                            local pong = red:ping()
                                            if not pong then
                                                retry = true
                                            else
                                                retry = false
                                            end
                                        end
                                        if retry then 
                                            ngx.log(ngx.ERR, "closing down stale redis connection")
                                            local ok, err = red:close()
                                            if not ok then
                                                ngx.say("failed to close redis connection: ", err)
                                            end
                                        end
                                        counter = 0
                                    else
                                        counter = counter + 1
                                    end 
                                end 
                                break
                            else
                                ngx.log(ngx.DEBUG, "key: ", key[3])
                                ngx.log(ngx.DEBUG, "subscribe: ", key[4])
                                if key[4] == "delete" then
                                    local cachekey = key[3]
                                    cache:delete(cachekey)
                                end
                            end
                        until true
                    end
                end

                -- this code block is not intended to execute under the normal operation. if the initial initConnection fails then this
                -- will get executed. for any subsequent connections this will not get executed as we always do retries in case of a connection failure.  
                local ok, err = red:close()
                if not ok then
                    ngx.log(ngx.ERR, "failed to close redis connection: ", err)
                    return
                end
                ngx.log(ngx.INFO, "redis connection closed")
           }
       }
}

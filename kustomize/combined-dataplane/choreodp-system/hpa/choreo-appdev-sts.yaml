apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: choreo-appdev-sts
  labels:
    choreo.component: choreo-appdev-sts
spec:
  maxReplicas: 3
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: choreo-appdev-sts
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75

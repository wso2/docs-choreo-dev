configMapGenerator:
  - name: cm-file-choreo-metered-usage-handler
    behavior: create
    files:
      - choreo-metered-usage-handler/Config.toml
  - name: cm-choreo-metered-usage-handler-collector
    behavior: create
    literals:
      - CHOREO_USAGE_HANDLER_CRONJOB_MODE="collector"
  - name: cm-app-gateway-oauth-agent
    behavior: create
    literals:
      - ENC_KEY_FILE_PATH="/etc/secrets/OAUTH_AGENT_ENC_KEY"
      - CACHE_ENC_KEY_FILE_PATH="/etc/secrets/OAUTH_AGENT_CACHE_ENC_KEY"
      - REDIS_PORT="6380"
      - REDIS_PWD_FILE_PATH="/etc/secrets/OAUTH_AGENT_REDIS_PWD"
      - REDIS_DB="5"
  - name: env-dp-mizzen-agent
    behavior: create
    literals:
      - ENV={{.ENV}}
      - SERVER_FQDN="{{.SERVER_FQDN}}"
  - name: env-dp-kv-resolver
    behavior: create
    literals:
      - ENV={{.ENV}}
      - AZURE_KEYVAULT_NAME={{.AZURE_KEYVAULT_NAME}}
      - SYSTEM_KEYVAULT_NAME={{.SYSTEM_KEYVAULT_NAME}}
      - MAX_CONCURRENT_RECONCILES={{.MAX_CONCURRENT_RECONCILES}}
      - MAX_RETRY_COUNT={{.MAX_RETRY_COUNT}}
  - name: env-choreo-metered-usage-handler
    behavior: create
    literals:
      - CHOREO_USAGE_DB_URL="{{.CHOREO_USAGE_DB_URL}}"
      - CHOREO_USAGE_PUBLISHER_EMAILS="{{.CHOREO_USAGE_PUBLISHER_EMAILS}}"
      - AZURE_AUTH_APP_CLIENT_ID="{{.AZURE_AUTH_APP_CLIENT_ID}}"
      - CHOREO_TOKEN_ENDPOINT="{{.CHOREO_TOKEN_ENDPOINT}}"
      - CHOREO_JWT_ISSUER="{{.CHOREO_JWT_ISSUER}}"
      - CHOREO_JWT_JWKS_URL="{{.CHOREO_JWT_JWKS_URL}}"
      - CHOREO_JWT_AUDIENCE="{{.CHOREO_JWT_AUDIENCE}}"
      - METERED_USAGE_SERVICE_URL="{{.METERED_USAGE_SERVICE_URL}}"
      - CLIENT_TRUSTSTORE_PATH="{{.CLIENT_TRUSTSTORE_PATH}}"
      - INFRACOST_COLLECTOR_CLUSTER_ID="{{.INFRACOST_COLLECTOR_CLUSTER_ID}}"
  - name: env-app-gateway-oauth-agent
    behavior: create
    literals:
      - REDIS_HOST="{{.REDIS_HOST}}"
      - SECRET_RESOLVER_GET_ENDPOINT="{{.SECRET_RESOLVER_GET_ENDPOINT}}"
  - name: cm-files-choreo-appdev-sts
    behavior: create
    files:
      - choreo-appdev-sts/configuration.yaml
      - choreo-appdev-sts/application.properties
      - choreo-appdev-sts/log4j2.yaml
      - choreo-appdev-sts/json-log-layout.json
  - name: env-buildpack-cache-daemonset
    behavior: create
    literals:
      - LIFECYCLE_IMAGE_TAG={{.LIFECYCLE_IMAGE_TAG | default "0.20.2"}}
      - BUILDER_IMAGE_TAG={{.BUILDER_IMAGE_TAG | default "google-22@sha256:a1fd64eb789cb8b11c9169ea3f0cfe3741c565eb8e2a337fcd2b179cfde09231"}}
      - RUN_IMAGE_TAG={{.RUN_IMAGE_TAG | default "2941124e39ef19f49aabac4257daf5f652805e81"}}
      - AZURE_CONTAINER_REGISTRY_USERNAME={{.AZURE_CONTAINER_REGISTRY_USERNAME | default "choreo-buildpacks-pull-tf-dev"}}

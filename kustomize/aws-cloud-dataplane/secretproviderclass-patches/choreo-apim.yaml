apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-cc-rate-limiter
spec:
  secretObjects:
    - secretName: secret-cc-rate-limiter
      type: Opaque
      data:
        - objectName: RATE_LIMITER_REDIS_AUTH_KEY
          key: RATE_LIMITER_REDIS_AUTH_KEY
  parameters:
    objects: |
      - objectName: {{.RATE_LIMITER_KEYSTORE_KEY_OBJ_NAME | default "mgw-RATE-LIMITER-KEYSTORE-CERT" }}
        objectType: secretsmanager
        objectAlias: RATE_LIMITER_KEYSTORE_KEY
        objectVersion: "{{.RATE_LIMITER_KEYSTORE_KEY}}"
      - objectName: {{.RATE_LIMITER_REDIS_AUTH_KEY_OBJ_NAME | default "apim-rate-limiter-redis-primary-access-key"}}
        objectType: secretsmanager
        objectAlias: RATE_LIMITER_REDIS_AUTH_KEY
        objectVersion: "{{.RATE_LIMITER_REDIS_AUTH_KEY}}"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-cc-rate-limiter-cert
spec:
  parameters:
    objects: |
      - objectName: {{.RATE_LIMITER_KEYSTORE_CERT_OBJ_NAME | default "mgw-RATE-LIMITER-KEYSTORE-CERT" }}
        objectType: secretsmanager
        objectAlias: RATE_LIMITER_KEYSTORE_CERT
        objectVersion: "{{.RATE_LIMITER_KEYSTORE_CERT}}"
---

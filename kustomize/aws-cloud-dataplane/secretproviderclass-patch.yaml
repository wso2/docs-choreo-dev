apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-dp-mizzen-agent
  namespace: choreodp-system
spec:
  parameters:
    objects: |
      - objectName: {{.TOKEN_OBJ_NAME}}
        objectType: secretsmanager
        objectAlias: TOKEN
        objectVersion: {{.TOKEN}}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-dp-kv-resolver
  namespace: choreodp-system
spec:
  secretObjects:
    - secretName: secret-dp-kv-resolver
      type: Opaque
      data:
        - objectName: HC_VAULT_ROOT_TOKEN
          key: HC_VAULT_ROOT_TOKEN
  parameters:
    objects: |
      - objectName: {{.VAULT_ROOT_TOKEN_OBJ_NAME}}
        objectType: secretsmanager
        objectAlias: AWS_REGION
        objectVersion: {{.VAULT_ROOT_TOKEN}}

resources:
  - ../combined-dataplane
  - service-accounts

configMapGenerator:
  - name: env-dp-kv-resolver
    behavior: replace
    literals:
      - ENV={{.ENV}}
      - SECRET_STORE_TYPE=HCVault
      - HC_VAULT_ADDRESS="http://vault.vault:8200"
      - HC_VAULT_ROLE=vault
      - MAX_CONCURRENT_RECONCILES={{.MAX_CONCURRENT_RECONCILES}}
      - MAX_RETRY_COUNT={{.MAX_RETRY_COUNT}}

patchesStrategicMerge:
  - secretproviderclass-patches/choreodp-system.yaml
  - serviceaccount-patch.yaml
  - services-patch.yaml

patches:
  - path: spc-aws-patch.yaml
    target:
      group: secrets-store.csi.x-k8s.io
      version: v1
      kind: SecretProviderClass

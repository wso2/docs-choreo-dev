apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: opensearch
spec:
  secretObjects:
    - secretName: opensearch-internal-users
      type: Opaque
      data:
        - key: internal_users.yml
          objectName: OPENSEARCH_INTERNAL_USERS
    - secretName: opensearch-password
      type: Opaque
      data:
        - key: password
          objectName: OPENSEARCH_PASSWORD
  parameters:
    objects: |
      - |
        objectName: {{.OPENSEARCH_INTERNAL_USERS_OBJ_NAME | default "obs-opensearch-internal-users"}}
        objectType: secretsmanager
        objectAlias: OPENSEARCH_INTERNAL_USERS
        objectVersion: "{{.OPENSEARCH_INTERNAL_USERS}}"
      - |
        objectName: {{.OPENSEARCH_PASSWORD_OBJ_NAME | default "obs-opensearch-password"}}
        objectType: secretsmanager
        objectAlias: OPENSEARCH_PASSWORD
        objectVersion: "{{.OPENSEARCH_PASSWORD}}"

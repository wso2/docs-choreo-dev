  - ../common-namespaces-combined-dataplane/choreo-egress-gateway
  - ../common-namespaces-combined-dataplane/choreo-observability
  - ../common-namespaces-combined-dataplane/choreo-sts
  - ../common-namespaces-combined-dataplane/keda
  - ../../helm/cert-manager
  - ../../helm/reflector
  - ../../helm/reloader
  - ../../helm/keda-core

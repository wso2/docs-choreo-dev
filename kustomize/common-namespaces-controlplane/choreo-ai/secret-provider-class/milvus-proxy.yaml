apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: milvus-proxy-secret
spec:
  secretObjects:
    - secretName: milvus-proxy-secret
      type: Opaque
      data:
        - objectName: MILVERSE_API_KEY
          key: MILVERSE_API_KEY
  parameters:
    objects: |
      array:
        - |
          objectName: ai-zilliz-CLUSTER-API-KEY
          objectType: secret
          objectAlias: MILVERSE_API_KEY
          objectVersion: "{{.MILVERSE_API_KEY}}"

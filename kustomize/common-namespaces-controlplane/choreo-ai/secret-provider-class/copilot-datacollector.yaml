apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: copilot-datacollector-secret
spec:
  secretObjects:
    - secretName: copilot-datacollector-secret
      type: Opaque
      data:
        - objectName: DB_PASSWORD
          key: DB_PASSWORD
        - objectName: BQ_SERVICE_ACCOUNT_KEY
          key: BQ_SERVICE_ACCOUNT_KEY
  parameters:
    objects: |
      array:
        - |
          objectName: ai-datacollector-db-password-mssql-password
          objectType: secret
          objectAlias: DB_PASSWORD
          objectVersion: "{{.DB_PASSWORD}}"
        - |
          objectName: ai-datacollector-bq-service-account-key
          objectType: secret
          objectAlias: MILVERSE_API_KEY
          objectVersion: "{{.BQ_SERVICE_ACCOUNT_KEY}}"

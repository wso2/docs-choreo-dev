apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: spec-populator-secret
spec:
  secretObjects:
    - secretName: spec-populator-secret
      type: Opaque
      data:
        - objectName: AZURE_OPENAI_API_KEY
          key: AZURE_OPENAI_API_KEY
        - objectName: MILVERSE_API_KEY
          key: MILVERSE_API_KEY
  parameters:
    objects: |
      array:
        - |
          objectName: {{.AZURE_OPENAI_API_KEY_OBJ_NAME | default "ai-cogsvc-dp-westus-primary-access-key"}}
          objectType: secret
          objectAlias: AZURE_OPENAI_API_KEY
          objectVersion:  "{{.AZURE_OPENAI_API_KEY}}"
        - |
          objectName: ai-zilliz-CLUSTER-API-KEY
          objectType: secret
          objectAlias: MILVERSE_API_KEY
          objectVersion:  "{{.MILVERSE_API_KEY}}"

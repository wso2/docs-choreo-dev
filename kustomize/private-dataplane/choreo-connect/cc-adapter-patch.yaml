apiVersion: apps/v1
kind: Deployment
metadata:
  name: choreo-connect-adapter
spec:
  template:
    spec:
      containers:
        - name: choreo-connect-adapter
          env:
            - name: adapter_admin_pwd
              $patch: delete
            - name: enforcer_management_password
              $patch: delete
            - name: cp_admin_pwd
              $patch: delete
            - name: PRIVATE_GLOBAL_ADAPTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: PRIVATE_GLOBAL_ADAPTER_PASSWORD
                  name: secret-apim
            - name: ASB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: secret-asb
                  key: ASB_CONNECTION_STRING
          volumeMounts:
            - mountPath: /mnt/csi/secret-mgw
              $patch: delete
      volumes:
        - name: secret-mgw
          $patch: delete

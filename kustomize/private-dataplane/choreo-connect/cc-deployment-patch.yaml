apiVersion: apps/v1
kind: Deployment
metadata:
  name: choreo-connect-deployment
spec:
  template:
    spec:
      containers:
        - name: choreo-connect-enforcer
          env:
            - name: tm_admin_pwd
              $patch: delete
            - name: PRIVATE_GLOBAL_ADAPTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: PRIVATE_GLOBAL_ADAPTER_PASSWORD
                  name: secret-apim
            - name: TM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: TM_ADMIN_PASSWORD
                  name: secret-apim
            - name: analytics_authToken
              valueFrom:
                secretKeyRef:
                  key: ANALYTICS_AUTH_TOKEN
                  name: secret-mgw-analytics
          volumeMounts:
            - mountPath: /home/wso2/security/jwt/key.pem
              $patch: delete
            - mountPath: /home/wso2/security/jwt/cert.pem
              $patch: delete

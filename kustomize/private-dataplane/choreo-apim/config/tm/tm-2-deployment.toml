[server]
hostname = "apim.dv.choreo.dev"
node_ip = "$env{NODE_IP}"
#offset=0
mode = "single" #single or ha
base_path = "${carbon.protocol}://${carbon.host}:${carbon.management.port}"
#discard_empty_caches = false
server_role = "traffic-manager"

[super_admin]
username = "choreo_dev_apim_admin"
password = "$env{SUPER_ADMIN_PSWD}"
create_admin_account = true

[user_store]
type = "database_unique_id"

[user_store.properties]
UsernameJavaScriptRegEx = "^[\\S]{3,40}$"
UsernameJavaRegEx = "^[\\S]{3,40}$"
PasswordJavaRegEx = "^[\\S]{5,30}$"
PasswordJavaScriptRegEx = "^[\\S]{5,30}$"
RolenameJavaScriptRegEx = "^[\\S]{3,50}$"
RolenameJavaRegEx = "^[\\S]{3,50}$"

[database.apim_db]
type = "h2"
url = "jdbc:h2:./repository/database/WSO2AM_DB;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE"
username = "wso2carbon"
password = "$env{H2_SHARED_DB_PSWD}"

[database.shared_db]
type = "h2"
url = "jdbc:h2:./repository/database/WSO2SHARED_DB;DB_CLOSE_ON_EXIT=FALSE"
username = "wso2carbon"
password = "$env{H2_SHARED_DB_PSWD}"

[keystore.primary]
file_name =  "primary-keystore.pfx"
type =  "PKCS12"
password =  "$env{PRIMARY_KEYSTORE_PSWD}"
alias =  "wso2carbon"
key_password =  "$env{PRIMARY_KEYSTORE_KEY_PSWD}"

[keystore.tls]
file_name =  "tls-keystore.pfx"
type =  "PKCS12"
password =  "$env{TLS_KEYSTORE_PSWD}"
alias =  "wso2carbon"
key_password =  "$env{TLS_KEYSTORE_KEY_PSWD}"

[keystore.internal]
file_name =  "internal-keystore.pfx"
type =  "PKCS12"
password =  "$env{INTERNAL_KEYSTORE_PSWD}"
alias =  "wso2carbon"
key_password =  "$env{INTERNAL_KEYSTORE_KEY_PSWD}"

[truststore]
file_name = "client-truststore.jks"
type = "JKS"
password = "$env{TRUSTSTORE_PSWD}"


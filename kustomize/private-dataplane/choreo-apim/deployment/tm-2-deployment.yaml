apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    choreo.component: apim-tm
  name: choreo-apim-tm-2-deployment
  annotations:
    checkov.io/skip1: CKV_K8S_25=Temporarily suppressing as there is no defined fix for this by the Bridgecrew
    checkov.io/skip2: CKV_K8S_AZURE_WSO2_2=LinkerD is not enabled
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      deployment: choreo-tm-2
  template:
    metadata:
      labels:
        deployment: choreo-tm-2
        choreo.component: apim-tm
        antiaffinity: choreo-apim-tm-2-deployment
    spec:
      automountServiceAccountToken: false
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wso2am
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-product-apim:v4.0.0-r06102021.1
          imagePullPolicy: Always
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - nc -z -v localhost 9611
            initialDelaySeconds: 120
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - nc -z -v localhost 9611
            initialDelaySeconds: 120
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: [ 'sh', '-c', '${WSO2_SERVER_HOME}/bin/api-manager.sh stop' ]
          resources:
            requests:
              memory: 4Gi
              cpu: 3000m
            limits:
              memory: 4Gi
              cpu: 3000m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 10500
            runAsGroup: 10500
            capabilities:
              drop:
                - all
              add: [ "NET_RAW" ]
          ports:
            - containerPort: 9711
              protocol: "TCP"
            - containerPort: 9611
              protocol: "TCP"
            - containerPort: 5672
              protocol: "TCP"
          envFrom:
            - configMapRef:
                name: cm-feature-flags
            - secretRef:
                name: keystore-passwords
            - secretRef:
                name: apim-passwords
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: JVM_MEM_OPTS
              value: "-Xms2048m -Xmx2048m"
            - name: PROFILE_NAME
              value: traffic-manager
          volumeMounts:
            - name: apim-vol
              mountPath: /home/wso2carbon/wso2am-4.0.0-SNAPSHOT
            - name: wso2am-conf
              mountPath: /home/wso2carbon/wso2-config-volume/repository/conf/deployment.toml
              subPath: tm-2-deployment.toml
            - name: apim-docker-entrypoint
              mountPath: /home/wso2carbon/docker-entrypoint.sh
              subPath: docker-entrypoint.sh
            - name: mysql-connector-jar
              mountPath: /home/wso2carbon/wso2-artifact-volume/repository/components/lib
            - name: secret-apim
              mountPath: /home/wso2carbon/wso2-keystores/primary-keystore.pfx
              readOnly: true
              subPath: APIM_PRIMARY_KEYSTORE
            - name: secret-apim
              mountPath: /home/wso2carbon/wso2-keystores/tls-keystore.pfx
              readOnly: true
              subPath: APIM_TLS_KEYSTORE
            - name: secret-apim
              mountPath: /home/wso2carbon/wso2-keystores/internal-keystore.pfx
              readOnly: true
              subPath: APIM_INTERNAL_KEYSTORE
            - name: apim-truststore
              mountPath: /home/wso2carbon/wso2-config-volume/repository/resources/security/client-truststore.jks
              subPath: client-truststore.jks
            - name: secret-apim
              mountPath: /mnt/csi/secret-apim
              readOnly: true
      volumes:
        - name: apim-vol
          emptyDir: { }
        - name: wso2am-conf
          configMap:
            name: choreo-apim-tm-2-conf
        - name: apim-docker-entrypoint
          configMap:
            name: choreo-apim-docker-entrypoint
            defaultMode: 0407
        - name: mysql-connector-jar
          emptyDir: { }
        - name: apim-truststore
          configMap:
            name: choreo-apim-truststore
        - name: secret-apim
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-apim
            nodePublishSecretRef:
              name: csi-secret-store-azure
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: antiaffinity
                    operator: In
                    values:
                      - choreo-apim-tm-2-deployment
              topologyKey: kubernetes.io/hostname

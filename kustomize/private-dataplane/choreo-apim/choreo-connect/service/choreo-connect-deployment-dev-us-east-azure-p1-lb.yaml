apiVersion: v1
kind: Service
metadata:
  labels:
    app: choreo-dataplane
    choreo.component: choreo-connect-deployment-dev-us-east-azure-p1
  name: router-dev-us-east-azure-p1-lb
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  selector:
    app: choreo-dataplane
    choreo.component: choreo-connect-deployment-dev-us-east-azure-p1
  ports:
    - name: "http-routeradmin"
      port: 9000
      protocol: TCP
      targetPort: 9000
    - name: "https-router"
      port: 9095
      protocol: TCP
      targetPort: 9095
  type: LoadBalancer
  loadBalancerIP: 10.91.129.51

# Deployment for Adapter

apiVersion: apps/v1
kind: Deployment
metadata:
  name: choreo-connect-adapter-default-p1
  annotations:
    checkov.io/skip1: CKV_K8S_25=Temporarily suppressing as there is no defined fix for this by the Bridgecrew
    checkov.io/skip2: CKV_K8S_AZURE_WSO2_2=LinkerD is not enabled
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      choreo.component: choreo-connect-adapter-default-p1
  template:
    metadata:
      labels:
        choreo.component: choreo-connect-adapter-default-p1
        antiaffinity: choreo-connect-adapter-default-p1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: antiaffinity
                      operator: In
                      values:
                        - choreo-connect-adapter-default-p1
                topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10500
        runAsGroup: 10500
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: choreo-connect-adapter
          volumeMounts:
            - mountPath: /home/wso2/security/keystore/mg.key
              name: secret-choreo-connect
              readOnly: true
              subPath: ADAPTER_KEYSTORE_KEY
            - mountPath: /home/wso2/security/keystore/mg.pem
              name: secret-choreo-connect
              readOnly: true
              subPath: ADAPTER_KEYSTORE_CERTIFICATE
            - mountPath: /home/wso2/security/truststore/controlplane.pem
              name: secret-choreo-connect
              readOnly: true
              subPath: CONTROL_PLANE_CERTIFICATE
            - mountPath: /home/wso2/security/truststore/mg.pem
              name: secret-choreo-connect
              readOnly: true
              subPath: ADAPTER_TRUSTSTORE_CERTIFICATE
            - mountPath: /home/wso2/security/truststore/global-adapter.pem
              name: global-adapter-keystore-vol
              subPath: global-adapter.pem
            - mountPath: /home/wso2/conf
              name: adapter-config
            - name: secret-choreo-connect
              mountPath: /mnt/csi/secret-choreo-connect
              readOnly: true
            - name: secret-apim
              mountPath: /mnt/csi/secret-apim
              readOnly: true
          image: choreocontrolplane.azurecr.io/choreoipaas/choreo-mgw-adapter:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
              add: [ "NET_RAW" ]
          envFrom:
            - configMapRef:
                name: cm-feature-flags
            - configMapRef:
                name: env-choreo-connect
          env:
            - name: localLabel
              value: poc-dev-p1
            - name: ADAPTER_PRIVATE_KEY_PATH
              value: "/home/wso2/security/keystore/mg.key"
            - name: ADAPTER_PUBLIC_CERT_PATH
              value: "/home/wso2/security/keystore/mg.pem"
            - name: cp_admin_pwd
              valueFrom:
                secretKeyRef:
                  key: SUPER_ADMIN_PSWD
                  name: apim-passwords
            - name: ASB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: secret-asb
                  key: ASB_CONNECTION_STRING
            - name: AZURE_SDK_GO_LOGGING
              value: "all"
          resources:
            requests:
              memory: "500Mi"
              cpu: "500m"
            limits:
              memory: "750Mi"
              cpu: "750m"
          ports:
            - containerPort: 18000
            - containerPort: 9843
            - containerPort: 6060
          livenessProbe:
            exec:
              command: [ "sh", "check_health.sh" ]
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command: [ "sh", "check_health.sh" ]
            initialDelaySeconds: 8
            periodSeconds: 5
          startupProbe:
            exec:
              command: [ "sh", "check_health.sh" ]
            periodSeconds: 5
            failureThreshold: 60
      volumes:
        - name: adapter-config
          configMap:
            name: mgw-adapter-enforcer-conf
        - name: global-adapter-keystore-vol
          configMap:
            name: global-adapter-keystore-vol
        - name: secret-choreo-connect
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-choreo-connect
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - name: secret-apim
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: secret-apim
            nodePublishSecretRef:
              name: csi-secret-store-azure
      restartPolicy: Always

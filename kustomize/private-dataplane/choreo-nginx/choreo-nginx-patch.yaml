apiVersion: apps/v1
kind: Deployment
metadata:
  name: choreo-nginx-deployment
spec:
  template:
    spec:
      containers:
        - name: nginx
          envFrom:
            - configMapRef:
                name: nginx-feature-flags
            - configMapRef:
                name: nginx-lua-config
          volumeMounts:
            - name: choreo-api-e1-us-east-azure-wildcard-tls
              mountPath: /etc/nginx/ssl/choreo/e1-us-east-gateway
              readOnly: true
      volumes:
        - name: choreo-api-e1-us-east-azure-wildcard-tls
          secret:
            secretName: choreo-api-e1-us-east-azure-wildcard-tls

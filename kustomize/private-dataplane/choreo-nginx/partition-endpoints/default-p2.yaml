kind: "Service"
apiVersion: "v1"
metadata:
  name: router-default-p2
spec:
  ports:
    - protocol: "TCP"
      port: 9095
      targetPort: 9095
  clusterIP: None
---
apiVersion: discovery.k8s.io/v1beta1
kind: EndpointSlice
metadata:
  name: router-default-p2
  labels:
    kubernetes.io/service-name: router-default-p2
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 9095
endpoints:
  - addresses:
      - 10.1.64.4
    conditions:
      ready: true
    hostname: router-default-p2

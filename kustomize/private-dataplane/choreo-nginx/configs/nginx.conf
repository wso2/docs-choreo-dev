worker_rlimit_nofile 65535;

error_log  /var/log/error.log notice;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

env REDIS_HOST;
env REDIS_PORT;
env REDIS_SSL;
env REDIS_SSL_VERIFY;
env REDIS_DATABASE;
env REDIS_PASSWORD;
env NAMESPACE;
env PARTITION_ENABLED;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    lua_ssl_verify_depth 3;
    lua_ssl_trusted_certificate /etc/certs/ca-certs.pem;

    ssl_certificate /etc/nginx/ssl/choreo/tls.crt;
    ssl_certificate_key /etc/nginx/ssl/choreo/tls.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # pre-load Lua modules at server start-up
    init_by_lua_block {
      require "resty.redis"
    }

    client_body_temp_path /var/run/openresty/nginx-client-body;
    proxy_temp_path       /var/run/openresty/nginx-proxy;
    fastcgi_temp_path     /var/run/openresty/nginx-fastcgi;
    uwsgi_temp_path       /var/run/openresty/nginx-uwsgi;
    scgi_temp_path        /var/run/openresty/nginx-scgi;

    sendfile        on;

    keepalive_timeout  75s;
    keepalive_requests 100;
    reset_timedout_connection on;

    client_header_buffer_size       1k;
    client_header_timeout           60s;
    large_client_header_buffers     4 8k;
    client_body_buffer_size         8k;
    client_body_timeout             60s;

    http2_max_field_size            4k;
    http2_max_header_size           16k;
    http2_max_requests              1000;
    http2_max_concurrent_streams    128;

    types_hash_max_size             2048;
    server_names_hash_max_size      1024;
    server_names_hash_bucket_size   64;
    map_hash_bucket_size            64;

    proxy_headers_hash_max_size     512;
    proxy_headers_hash_bucket_size  64;

    variables_hash_bucket_size      256;
    variables_hash_max_size         2048;

    # Reverse proxies can detect if a client provides a X-Request-ID header, and pass it on to the backend server.
    # If no such header is provided, it can provide a random value.
    map $http_x_request_id $req_id {
      default   $http_x_request_id;
      ""        $request_id;
    }

    map $http_x_correlation_id $correlation_id {
      default   $request_id;
      ""        $request_id;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" $request_length $request_time '
                      '$upstream_addr $upstream_response_length '
                      '$upstream_response_time $upstream_status $req_id $correlation_id';

    access_log  /var/log/access.log main;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}

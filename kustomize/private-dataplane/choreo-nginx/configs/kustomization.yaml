configMapGenerator:
  - name: nginx-lua-modules
    behavior: create
    files:
      - cache.lua
      - split.lua
      - util.lua
  - name: nginx-ca-cert
    behavior: create
    files:
      - ca-certs.pem
  - name: nginx-default-vhost
    behavior: create
    files:
      - default.conf
  - name: nginx-config-file
    behavior: create
    files:
      - nginx.conf
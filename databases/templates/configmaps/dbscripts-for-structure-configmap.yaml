apiVersion: v1
kind: ConfigMap
metadata:
  name: dbscripts-for-structure-configmap
  namespace: {{ .Values.namespace }}
data:
  {{- $file := .Files }}
  {{- range $path, $byte := .Files.Glob "scripts/*" }}
  {{- $list := $path | splitList "/"}}
  {{- $length := len $list }}
  {{- $last := add $length -1 }}
  {{ index $list $last }}: |-
    {{- range $file.Lines $path }}
    {{ tpl ( . ) $ }}
    {{- end }}
  {{- end }}

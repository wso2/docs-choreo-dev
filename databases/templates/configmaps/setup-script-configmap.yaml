apiVersion: v1
kind: ConfigMap
metadata:
  name: setup-script-configmap
  namespace: {{ .Values.namespace }}
data:
  setup.sh: |
    #!/usr/bin/env bash
    set -e

    # Read required secrets from the Azure Key Vault
    CSI_DRIVER_MOUNT_PATH="/mnt/secrets-store"

    DATABASE_ADMIN_USER=$(cat ${CSI_DRIVER_MOUNT_PATH}/DB-SERVER-ADMIN-USERNAME)
    DATABASE_ADMIN_USER_PASSWORD=$(cat ${CSI_DRIVER_MOUNT_PATH}/DB-SERVER-ADMIN-PASSWORD)

    # Set database user credentials from secret data stored at the Azure Key Vault
    # Make a copy of the SQL script for creating databases, database users and granting permissions
    cp /sql-scripts/init/initialize.sql /tmp/initialize.sql

    # Set the credentials read from the Azure Key Vault
    sed -i "s|<pw_app_db_user>|${app-CHOREO-DB-PASSWORD}|g" /tmp/initialize.sql
    sed -i "s|<pw_perf_db_user>|${perfanalyzer-CHOREO-PERF-DB-PASSWORD}|g" /tmp/initialize.sql
    sed -i "s|<pw_testbase_db_user>|${testbase-CHOREO-DB-PASSWORD}|g" /tmp/initialize.sql
    sed -i "s|<pw_apim_db_user>|${apim-CHOREO-APIM-DB-PASSWORD}|g" /tmp/initialize.sql

    # Create databases, database users and grant permissions
    echo "Create the databases, database users and grant permissions to the created users..."
    mysql --host=${AZURE_DB_SERVICE_HOST} --port=${AZURE_DB_SERVICE_PORT} --user=${DATABASE_ADMIN_USER} --password=${DATABASE_ADMIN_USER_PASSWORD} --ssl-ca=/certs/mysql-ca.crt.pem --ssl-verify-server-cert=TRUE < /tmp/initialize.sql
    echo "Done."

    # Populate the databases
    echo "Populate the Choreo APIM database..."
    mysql --host=${AZURE_DB_SERVICE_HOST} --port=${AZURE_DB_SERVICE_PORT} --user=${DATABASE_ADMIN_USER} --password=${DATABASE_ADMIN_USER_PASSWORD} --ssl-ca=/certs/mysql-ca.crt.pem --ssl-verify-server-cert=TRUE < /sql-scripts/structure/choreo_apim_db.sql
    echo "Done."
    echo "Populate the Choreo APIM Shared database..."
    mysql --host=${AZURE_DB_SERVICE_HOST} --port=${AZURE_DB_SERVICE_PORT} --user=${DATABASE_ADMIN_USER} --password=${DATABASE_ADMIN_USER_PASSWORD} --ssl-ca=/certs/mysql-ca.crt.pem --ssl-verify-server-cert=TRUE < /sql-scripts/structure/choreo_apim_shared_db.sql
    echo "Done."
    echo "Populate the Choreo APIM User database..."
    mysql --host=${AZURE_DB_SERVICE_HOST} --port=${AZURE_DB_SERVICE_PORT} --user=${DATABASE_ADMIN_USER} --password=${DATABASE_ADMIN_USER_PASSWORD} --ssl-ca=/certs/mysql-ca.crt.pem --ssl-verify-server-cert=TRUE < /sql-scripts/structure/choreo_apim_user_db.sql
    echo "Done."
    echo "Populate the Choreo App database..."
    mysql --host=${AZURE_DB_SERVICE_HOST} --port=${AZURE_DB_SERVICE_PORT} --user=${DATABASE_ADMIN_USER} --password=${DATABASE_ADMIN_USER_PASSWORD} --ssl-ca=/certs/mysql-ca.crt.pem --ssl-verify-server-cert=TRUE < /sql-scripts/structure/choreo_app_db.sql
    echo "Done."
    echo "Populate the Choreo Perf database..."
    mysql --host=${AZURE_DB_SERVICE_HOST} --port=${AZURE_DB_SERVICE_PORT} --user=${DATABASE_ADMIN_USER} --password=${DATABASE_ADMIN_USER_PASSWORD} --ssl-ca=/certs/mysql-ca.crt.pem --ssl-verify-server-cert=TRUE < /sql-scripts/structure/choreo_perf_db.sql
    echo "Done."
    echo "Populate the Choreo Testbase database..."
    mysql --host=${AZURE_DB_SERVICE_HOST} --port=${AZURE_DB_SERVICE_PORT} --user=${DATABASE_ADMIN_USER} --password=${DATABASE_ADMIN_USER_PASSWORD} --ssl-ca=/certs/mysql-ca.crt.pem --ssl-verify-server-cert=TRUE < /sql-scripts/structure/choreo_testbase_db.sql
    echo "Done."

    # IDP DBs

    # Create databases, database users and grant permissions
    echo "Create the Choreo IDP databases, tables, database users and grant permissions to the created users..."
    cd /sql-scripts/structure-idp/
    mysql --host=${AZURE_DB_SERVICE_HOST} --port=${AZURE_DB_SERVICE_PORT} --user=${DATABASE_ADMIN_USER} --password=${DATABASE_ADMIN_USER_PASSWORD} --ssl-ca=/certs/mysql-ca.crt.pem --ssl-verify-server-cert=TRUE < idp-init-is.sql
    echo "Done."

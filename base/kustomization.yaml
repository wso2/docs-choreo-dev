resources:
  - pv-mysql.yaml
  - pvc-choreo-mysql.yaml
  - dep-choreo-mysql.yaml
  - dep-frontend.yaml
  - dep-negotiator.yaml
  - dep-obs-api.yaml
  - dep-telemetry.yaml
  - svc-choreo-mysql.yaml
  - svc-frontend.yaml
  - svc-negotiator.yaml
  - svc-obs-api.yaml
  - svc-telemetry.yaml
  - ingress-grpc.yaml
  - ingress-http.yaml

vars:
  - name: CHOREO_DB_SERVICE
    objref:
      kind: Service
      name: choreo-mysql
      apiVersion: v1
  - name: CHOREO_HTTP_INGRESS
    objref:
      apiVersion: networking.k8s.io/v1beta1
      kind: Ingress
      name: ingress-http
    fieldref:
      fieldpath: spec.rules[0].host
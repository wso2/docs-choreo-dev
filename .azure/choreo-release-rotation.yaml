resources:
  repositories:
    - repository: TEMPLATE_REPOSITORY
      type: github
      name: wso2-enterprise/choreo-common-pipeline-templates
      ref: refs/heads/main
      endpoint: wso2-enterprise

pr: none
trigger: none
# schedules:
#   - cron: "30 10 * * 5"
#     displayName: Friday 4pm build (IST)
#     branches:
#       include:
#         - main
#     always: true

variables:
  - group: rotation

steps:
  - template: install/install-yq.yml@TEMPLATE_REPOSITORY
  - script: |
      ## Obtain webhook URLs from variable group
      echo $(System.AccessToken) | az devops login
      variable_group=$(az pipelines variable-group variable list \
                        --group-id $(group_id) \
                        --org https://dev.azure.com/choreo-devops \
                        --project dev-control-plane-deployments)

      ## Obtain the week number for next week from the 1st January 1970
      ## since this will be executed on Friday
      week_number=$((($(date -d "$(TZ=Asia/Colombo date +%Y-%m-%d)" +%s) / 86400) / 7))

      ## Obtain subjects
      readarray subjects < <(yq e -o=j -I=0 '.rotations[]' "choreo-rotations.yaml")

      for subject in "${subjects[@]}"; do
        subjectName=$(echo "$subject" | yq e '.subject')
        endMessage=$(echo "$subject" | yq e '.endMessage')
        message="The following member/s will be assigned for $subjectName\n"

        ## Obtain teams
        readarray teams < <(echo "$subject" | yq e -o=j -I=0 '.teams[]')

        for team in "${teams[@]}"; do
          teamName=$(echo "$team" | yq e '.name')

          ## Obtain team members
          readarray members < <(echo "$team" | yq e -o=j -I=0 '.members[]')
          member_index=$(expr $week_number % ${#members[@]})

          message+="\n$teamName: *$(echo "${members[$member_index]}" | tr -d '"')*"
        done
        message+="\n\nStart Date: $(TZ=Asia/Colombo date '+%Y/%m/%d' -d '+3 days')"
        message+="\nEnd Date: $(TZ=Asia/Colombo date '+%Y/%m/%d' -d '+7 days')"
        message+="\n\n$endMessage"

        ## Generate notification body
        ## printf %b is used to convert escape sequence to characters
        ## which will otherwise be passed to jq --arg as '\\n' instead of '\n'
        printf -v unescaped_message %b "$message"
        body="$(jq -n --arg message "$unescaped_message" '{"text": $message}')"

        readarray webhooks < <(echo "$subject" | yq e -o=j -I=0 '.notifications[]')
        for webhook in "${webhooks[@]}"; do
          webhookURL="$(echo "$variable_group" | jq --arg key $(echo "$webhook" | tr -d '"') '.[$key].value' | tr -d '"')"
          echo "webhookURL: $webhookURL"
          curl -sSX POST \
            -H 'Content-Type: application/json' "$webhookURL" -d "$body"
        done
      done
    displayName: Notify rotation

parameters:
- name: 'GH_VERSION'
  type: string
  default: 1.2.0
    
steps:
- script: |
    echo "Installing Github Cli in the environment"
    mkdir $HOME/bin
    pushd $HOME/bin
    curl -s -O -L https://github.com/cli/cli/releases/download/v${{parameters.GH_VERSION}}/gh_${{parameters.GH_VERSION}}_linux_amd64.tar.gz
    tar xzf ./gh_${{parameters.GH_VERSION}}_linux_amd64.tar.gz
    ./gh_${{parameters.GH_VERSION}}_linux_amd64/bin/gh version
    echo "##vso[task.setvariable variable=gh]$(HOME)/bin/gh_${{parameters.GH_VERSION}}_linux_amd64/bin/gh"
    popd
  displayName: "Setup Github CLI"
    
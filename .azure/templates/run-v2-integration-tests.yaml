parameters:
  - name: CHOREO_ENDPOINT
    type: string
    default: 'https://app.preview-dv.choreo.dev'
  - name: STS_ENDPOINT
    type: string
    default: 'https://sts.preview-dv.choreo.dev'
  - name: TEST_CHOREO_ORG_HANDLE
    type: string
    default: 'choreointegrationtestsuserdevdlwqo'
  - name: TEST_CHOREO_ORG_ID
    type: string
    default: $(testChoreoOrgID)
  - name: TEST_CHOREO_ORG_UUID
    type: string
    default: $(testChoreoOrgUUID)
  - name: TEST_SPEC_DIR
    type: string
    default: 'integration-tests'
  - name: ALERT_CHOREO_GW_HOST
    type: string
    default: 'https://choreocontrolplane.preview-dv.choreo.dev'
  - name: ANOMALY_DETECTION_PROJECT_ID
    type: string
    default: '655c81ad-d2cf-42b7-a08a-0914236843ae'
  - name: ANOMALY_DETECTION_PASSTHROUGH_COMPONENT_ID
    type: string
    default: 'd2675bd8-63e5-42c0-8902-9b677367fb7f'
  - name: ANOMALY_DETECTION_PASSTHROUGH_COMPONENT_NAME
    type: string
    default: 'devintegrationtestpassthroughservice ohx'
  - name: ANOMALY_DETECTION_PASSTHROUGH_INVOKE_URL
    type: string
    default: 'https://1283ca61-2b5a-40f5-aa45-e2fcc865a4e3-prod.e1-us-east-azure.preview-dv.choreoapis.dev/oihi/devintegrationtestpassthroughservice-ohx/1.0.0'
  - name: ANOMALY_DETECTION_PASSTHROUGH_RELEASE_ID
    type: string
    default: 'ad07a3cb-6281-43b3-9d35-b252c0803b5d'
  - name: ANOMALY_DETECTION_PASSTHROUGH_VERSION_ID
    type: string
    default: 'f8f07364-45cb-40a5-91d8-9ee2dd19d874'
  - name: ANOMALY_DETECTION_TEST_USER_EMAIL
    type: string
    default: 'choreoanomalydetectortest@gmail.com@carbon.super'
  - name: ANOMALY_DETECTION_TEST_CHOREO_ORG_HANDLE
    type: string
    default: 'choreoanomalydetectortestdevnzupd'
  - name: CHOREO_CP_GW_ENDPOINT
    type: string
    default: 'https://choreocontrolplane.preview-dv.choreo.dev'
  - name: TEST_USER_EMAIL
    type: string
    default: 'choreo-integration-test-user-dev@wso2.com@carbon.super'
  - name: ASGARDEO_ENDPOINT
    type: string
    default: 'https://dev.api.asgardeo.io'
  - name: INSIGHTS_ENDPOINT
    type: string
    default: 'https://analytics-event-auth.dv.choreo.dev'
  - name: GITHUB_ENDPOINT
    type: string
    default: 'https://api.github.com'
  - name: GITHUB_ORG
    type: string
    default: 'choreo-test-apps'
  - name: CHOREO_CP_PROJECTS_ENDPOINT
    type: string
    default: 'https://apis.preview-dv.choreo.dev/projects/1.0.0'
  - name: GMAIL_API_CK
    type: string
    default: '412441153337-r3a3sj5ecba3a04aqlb3l05ro25tf08l.apps.googleusercontent.com'
  - name: MAVEN_INTEGRATION_TEST_PROPERTIES
    type: string
    default: '-DTestConfig=dev-env-config.yaml'
  - name: TYPE
    type: string
    default: 'integration'
  - name: LOW_PRIVILEGED_USER_EMAIL
    type: string
    default: ''
  - name: LOW_PRIVILEGED_USER_PASSWORD
    type: string
    default: ''
  - name: REGIONS
    type: string
    default: ''

steps:
  - script: |
      mvn clean verify ${{ parameters.MAVEN_INTEGRATION_TEST_PROPERTIES }}
    displayName: 'Integration Tests'
    continueOnError: true
    workingDirectory: ${{ parameters.TEST_SPEC_DIR }}
    env:
      ALERT_CHOREO_GW_HOST: ${{ parameters.ALERT_CHOREO_GW_HOST }}
      ALERT_MAIL_IMAP_PASS: $(alertMailIMAPPass)
      ALERT_ORG_UUID: $(alertOrgUUID)
      ALERT_RELEASE_ID: $(alertReleaseID)
      COMMIT_LIST_EXAMPLE_RESPONSE: $(commitListExampleResponse)
      ANOMALY_DETECTION_TEST_CHOREO_ORG_ID: $(anomalyDetectionOrgId)
      ANOMALY_DETECTION_TEST_CHOREO_ORG_UUID: $(anomalyDetectionOrgUUID)
      ANOMALY_DETECTION_PROJECT_ID: ${{ parameters.ANOMALY_DETECTION_PROJECT_ID }}
      ANOMALY_DETECTION_PASSTHROUGH_CLIENT_ID: $(anomalyDetectionPassthroughClientId)
      ANOMALY_DETECTION_PASSTHROUGH_CLIENT_SECRET: $(anomalyDetectionPassthroughClientSecret)
      ANOMALY_DETECTION_PASSTHROUGH_COMPONENT_ID: ${{ parameters.ANOMALY_DETECTION_PASSTHROUGH_COMPONENT_ID }}
      ANOMALY_DETECTION_PASSTHROUGH_COMPONENT_NAME: ${{ parameters.ANOMALY_DETECTION_PASSTHROUGH_COMPONENT_NAME }}
      ANOMALY_DETECTION_PASSTHROUGH_INVOKE_URL: ${{ parameters.ANOMALY_DETECTION_PASSTHROUGH_INVOKE_URL }}
      ANOMALY_DETECTION_PASSTHROUGH_RELEASE_ID: ${{ parameters.ANOMALY_DETECTION_PASSTHROUGH_RELEASE_ID }}
      ANOMALY_DETECTION_PASSTHROUGH_VERSION_ID: ${{ parameters.ANOMALY_DETECTION_PASSTHROUGH_VERSION_ID }}
      ANOMALY_DETECTION_MAIL_IMAP_PASS: $(anomalyDetectionMailIMAPPass)
      ANOMALY_DETECTION_TEST_USER_EMAIL: ${{ parameters.ANOMALY_DETECTION_TEST_USER_EMAIL }}
      ANOMALY_DETECTION_TEST_USER_PASSWORD: $(anomalyDetectionTestUserPassword)
      ANOMALY_DETECTION_TEST_CHOREO_ORG_HANDLE: ${{ parameters.ANOMALY_DETECTION_TEST_CHOREO_ORG_HANDLE }}
      ASGARDEO_CLIENT_ID: $(asgardeoClientID)
      ASGARDEO_CLIENT_SECRET: $(asgardeoClientSecret)
      ASGARDEO_ENDPOINT: ${{ parameters.ASGARDEO_ENDPOINT }}
      CHOREO_ENDPOINT: ${{ parameters.CHOREO_ENDPOINT }}
      STS_CLIENT_ID: $(stsClientID)
      STS_CLIENT_SECRET: $(stsClientSecret)
      STS_ENDPOINT: ${{ parameters.STS_ENDPOINT }}
      TEST_CHOREO_ORG_HANDLE: ${{ parameters.TEST_CHOREO_ORG_HANDLE }}
      TEST_CHOREO_ORG_ID: ${{ parameters.TEST_CHOREO_ORG_ID }}
      TEST_CHOREO_ORG_UUID: ${{ parameters.TEST_CHOREO_ORG_UUID }}
      TEST_USER_EMAIL: ${{ parameters.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: $(testUserPassword)
      REGIONS: ${{ parameters.REGIONS }}
      CP_APP_CLIENT_ID: $(CP_APP_CLIENT_ID)
      CP_APP_CLIENT_SECRET: $(CP_APP_CLIENT_SECRET)
      CHOREO_CP_GW_ENDPOINT: ${{ parameters.CHOREO_CP_GW_ENDPOINT }}
      INSIGHTS_ENDPOINT: ${{ parameters.INSIGHTS_ENDPOINT }}
      INSIGHTS_ONPREM_KEY: $(insightsOnPremKey)
      GITHUB_PAT: $(githubPAT)
      GITHUB_ENDPOINT: ${{ parameters.GITHUB_ENDPOINT }}
      GITHUB_ORG: ${{ parameters.GITHUB_ORG }}
      CHOREO_CP_PROJECTS_ENDPOINT: ${{ parameters.CHOREO_CP_PROJECTS_ENDPOINT }}
      GMAIL_API_CK: ${{ parameters.GMAIL_API_CK }}
      GMAIL_API_CS: $(gmailAPICS)
      GMAIL_API_REFRESH_TOKEN: $(gmailAPIRefreshToken)
      branch: $(Build.SourceBranchName)
      LOW_PRIVILEGED_USER_EMAIL: ${{ parameters.LOW_PRIVILEGED_USER_EMAIL }}
      LOW_PRIVILEGED_USER_PASSWORD: ${{ parameters.LOW_PRIVILEGED_USER_PASSWORD }}
  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/target/failsafe-reports/TEST-TestSuite.xml'
  - template: install/install-yq.yml@TEMPLATE_REPOSITORY
    parameters:
      VERSION: v4.40.5
  - script: |
      yq -oy TEST-TestSuite.xml --xml-attribute-prefix "xml_attr_" >test-results.yaml
      yq -e '.testsuite.testcase | map(select(.failure != null))' test-results.yaml >failed-tests.yaml
      yq '((.[] |= del(.failure.+content))[] | .system-out) = ""' failed-tests.yaml >$(Build.ArtifactStagingDirectory)/failed-tests.yaml
    workingDirectory: choreo-control-plane/integration-tests/target/failsafe-reports
    displayName: Obtain failed tests

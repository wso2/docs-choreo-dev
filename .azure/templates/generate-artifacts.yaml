parameters:
  - name: 'overlays'
    type: object
    default: []

steps:
  - template: install/install-kustomize.yml@TEMPLATE_REPOSITORY
  - template: install/install-helm.yaml@TEMPLATE_REPOSITORY
  - template: helm/login.yaml@TEMPLATE_REPOSITORY
    parameters:
      HELM_USERNAME: $(controlplane_oci_username)
      HELM_PASSWORD: $(controlplane_oci_password)
  - task: Docker@2
    displayName: 'Login to ACR'
    inputs:
      command: login
      containerRegistry: choreo-util-acr
  - template: helm/pull-from-oci.yaml@TEMPLATE_REPOSITORY
    parameters:
      HELM_KUSTOMIZATION_DIR: choreo-control-plane/helm
  - template: helm/pull-from-oci.yaml@TEMPLATE_REPOSITORY
    parameters:
      HELM_KUSTOMIZATION_DIR: choreo-cp-env-overlay/helm
  - script: |
      find . -type f -name "kustomization.y*ml" -print0 | xargs -0 sed -i 's|/base-ci|/base|g'
      find . -type f -name "kustomization.y*ml" -print0 | xargs -0 sed -i 's|/combined-dataplane-ci|/combined-dataplane|g'
      find . -type f -name "kustomization.y*ml" -print0 | xargs -0 sed -i 's|/common-namespaces-controlplane-ci|/common-namespaces-controlplane|g'
      find . -type f -name "kustomization.y*ml" -print0 | xargs -0 sed -i 's|/common-namespaces-dataplane-ci|/common-namespaces-dataplane|g'
      find . -type f -name "kustomization.y*ml" -print0 | xargs -0 sed -i 's|/common-namespaces-combined-dataplane-ci|/common-namespaces-combined-dataplane|g'
      find . -type f -name "kustomization.y*ml" -print0 | xargs -0 sed -i 's|/shared-components-ci|/shared-components|g'
      find . -type f -name "kustomization.y*ml" -print0 | xargs -0 sed -i 's|/growth-hacking-ci|/growth-hacking|g'
    displayName: Update kustomize references
    workingDirectory: choreo-cp-env-overlay/kustomize
  - ${{ if gt(length(parameters.overlays),0) }}:
      - ${{ each overlay in parameters.overlays }}:
          - script: |
              set -eo pipefail
              kustomize build \
                --enable-helm \
                --enable-alpha-plugins ${{ overlay }} | tee $(Build.ArtifactStagingDirectory)/${{ overlay }}.yaml
            displayName: Generate k8s artifacts(${{ overlay }})
            workingDirectory: choreo-cp-env-overlay/kustomize
      - task: PublishBuildArtifacts@1
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)
          artifactName: k8s-artifacts

parameters:
  - name: 'overlays'
    type: object
    default: [ ]

steps:
  - checkout: self
  - checkout: OVERLAY_REPOSITORY
  - template: install/install-kustomize.yml@TEMPLATE_REPOSITORY
  - template: install/install-helm.yaml@TEMPLATE_REPOSITORY
  - template: helm/login.yaml@TEMPLATE_REPOSITORY
    parameters:
      HELM_USERNAME: $(controlplane_oci_username)
      HELM_PASSWORD: $(controlplane_oci_password)
  - template: helm/pull-from-oci.yaml@TEMPLATE_REPOSITORY
    parameters:
      HELM_KUSTOMIZATION_DIR: choreo-control-plane/helm
  - template: helm/pull-from-oci.yaml@TEMPLATE_REPOSITORY
    parameters:
      HELM_KUSTOMIZATION_DIR: choreo-cp-env-overlay/helm
  - script: |
      find . -type f -name "kustomization.y*ml" -print0 | xargs -0 sed -i 's|../../../../choreo-control-plane/kustomize/dataplane-ci/observability-ci|../../../../choreo-control-plane/kustomize/dataplane/choreo-observability|'
      find . -type f -name "kustomization.y*ml" -print0 | xargs -0 sed -i 's|../../../../choreo-control-plane/kustomize/dataplane-ci/ai-ci|../../../../choreo-control-plane/kustomize/dataplane/choreo-ai|'
      find . -type f -name "kustomization.y*ml" -print0 | xargs -0 sed -i 's|/base-ci|/base|g'
      find . -type f -name "kustomization.y*ml" -print0 | xargs -0 sed -i 's|/dataplane-ci|/dataplane|g'
      find . -type f -name "kustomization.y*ml" -print0 | xargs -0 sed -i 's|/routing-ci|/routing|g'
      find . -type f -name "kustomization.y*ml" -print0 | xargs -0 sed -i 's|/shared-components-ci|/shared-components|g'
    displayName: Update kustomize references
    workingDirectory: choreo-cp-env-overlay/kustomize
  - ${{ if gt(length(parameters.overlays),0) }}:
      - ${{ each overlay in parameters.overlays }}:
          - script: |
              set -eo pipefail
              kustomize build \
                --enable-helm \
                --enable-alpha-plugins ${{ overlay }} | tee $(Build.ArtifactStagingDirectory)/${{ overlay }}.yaml
            displayName: Generate k8s artifacts(${{ overlay }})
            workingDirectory: choreo-cp-env-overlay/kustomize
      - task: PublishBuildArtifacts@1
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)
          artifactName: k8s-artifacts

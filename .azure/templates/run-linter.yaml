parameters:
  - name: BRANCH
    type: string
  - name: SUPER_LINTER_VERSION
    type: string
    default: v3.13.1
  - name: OPTIONS
    type: string

steps:
  - script: |
      changedFiles=$(git diff --name-only HEAD origin/${{ parameters.BRANCH }})
      printf "Changed files:\n%s\n" "${changedFiles}"
      mkdir -p scan
      for file in ${changedFiles}; do
        if [[ -f $file ]]; then
          cp ${file} scan/
        else
          echo "${file} has been deleted"
        fi
      done
    displayName: 'Copy Changed Files to scan Directory'
    workingDirectory: $(System.DefaultWorkingDirectory)
  - script: |
      docker pull github/super-linter:${{ parameters.SUPER_LINTER_VERSION }}
      docker run -e RUN_LOCAL=true ${{ parameters.OPTIONS }} \
      -v $(System.DefaultWorkingDirectory)/scan:/tmp/lint github/super-linter:${{ parameters.SUPER_LINTER_VERSION }}
    displayName: 'Code Scan using GitHub Super-Linter'



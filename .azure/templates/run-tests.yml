parameters:
## cypress.env.json
  - name: 'CONSOLE_LOGIN_URL'
    type: string
    default: 'http://consolev2.preview-dv.choreo.dev/?fidp=choreoe2etest'
  - name: 'BAL_REGISTRY_URL'
    type: string
    default: 'https://api.dev-central.ballerina.io/2.0/registry'
  - name: 'APP_SVC_URL'
    type: string
    default: 'https://appv2.preview-dv.choreo.dev'
  - name: 'IDP_URL'
    type: string
    default: 'https://id.dv.choreo.dev'
  - name: 'APIM_SVC_URL'
    type: string
    default: 'https://sts.preview-dv.choreo.dev'
  - name: 'DEVPORTAL_LOGIN_URL'
    type: string
    default: 'https://devportal.preview-dv.choreo.dev'

## Config Files
  - name: 'CYPRESS_ENV_CONFIG'
    type: string
    default: 'cypress.env.json'
  - name: 'CYPRESS_CONFIG'
    type: string
    default: 'cypress.json'

## Others
  - name: 'NODE_VERSION'
    type: string
    default: 14.16.0
  - name: 'TEST_SPEC_DIR'
    type: string
    default: 'e2e-tests-cypress'
  - name: 'SELECTED_ORG_HANDLE'
    type: string
    default: 'choreouser'

steps:
  - script: |
      INTEGRATION_TEST_RUN_ID=$(uuidgen)
      echo "##vso[task.setvariable variable=INTEGRATION_TEST_RUN_ID]${INTEGRATION_TEST_RUN_ID}"
      echo "Generated integration test run id: ${INTEGRATION_TEST_RUN_ID}"
    displayName: 'Generate a unique id for the run'
  - task: NodeTool@0
    inputs:
      versionSpec: ${{ parameters.NODE_VERSION }}
    displayName: 'Install Node.js'
  - task: CacheBeta@1
    inputs:
      key: '"$(Agent.OS)" | ${{ parameters.TEST_SPEC_DIR }}/package-lock.json'
      path: '$(HOME)/.npm'
    displayName: "Cache npm packages"
  - script: |
      cd ${{ parameters.TEST_SPEC_DIR }}
      npm install webpack
      npm install
    displayName: 'Install Cypress and other dependencies'
  - script: |
      cd ${{ parameters.TEST_SPEC_DIR }}
      jq '.loginURL = $CONSOLE_LOGIN_URL | .balRegistryURL = $BAL_REGISTRY_URL | .appSvcURL = $APP_SVC_URL
        | .idpURL = $IDP_URL | .apimSvcURL = $APIM_SVC_URL | .devportalLoginURL = $DEVPORTAL_LOGIN_URL' \
        --arg CONSOLE_LOGIN_URL "${{ parameters.CONSOLE_LOGIN_URL }}" \
        --arg BAL_REGISTRY_URL "${{ parameters.BAL_REGISTRY_URL }}"  \
        --arg APP_SVC_URL "${{ parameters.APP_SVC_URL }}" \
        --arg IDP_URL "${{ parameters.IDP_URL }}" \
        --arg APIM_SVC_URL "${{ parameters.APIM_SVC_URL }}" \
        --arg DEVPORTAL_LOGIN_URL "${{ parameters.DEVPORTAL_LOGIN_URL }}" \
        ${{ parameters.CYPRESS_ENV_CONFIG }} > tmp.$$.json && mv tmp.$$.json ${{ parameters.CYPRESS_ENV_CONFIG }}
      jq '.projectId = $CYPRESS_PROJECT_ID' \
        --arg CYPRESS_PROJECT_ID "$(cypress_project_id)" \
        ${{ parameters.CYPRESS_CONFIG }} > tmp.$$.json && mv tmp.$$.json ${{ parameters.CYPRESS_CONFIG }}
      npx cypress run --headless \
                      --spec 'cypress/e2e-smoke/devportal/*.ts','cypress/e2e-smoke/console/**/*' \
                      --record --tag $(Build.BuildNumber)
##--parallel --ci-build-id $(Build.BuildId)
    displayName: 'Run E2E tests'
    env:
      CYPRESS_RECORD_KEY: $(cypress_record_key)
      choreoIDPUsername: $(idpUsername)
      choreoIDPPassword: $(idpPassword)
      choreoOrgHandle: ${{ parameters.SELECTED_ORG_HANDLE }}
  - task: PublishPipelineArtifact@1
    displayName: 'Publish test fail screenshots'
    name: PublishTestFailScreenshots
    condition: failed()
    inputs:
      targetPath: '${{ parameters.TEST_SPEC_DIR }}/cypress/screenshots'
      artifactName: 'e2e-tests-cypress-screenshots-$(INTEGRATION_TEST_RUN_ID)'
  - task: PublishPipelineArtifact@1
    displayName: 'Publish test fail videos'
    name: PublishTestFailVideos
    condition: always()
    inputs:
      targetPath: '${{ parameters.TEST_SPEC_DIR }}/cypress/videos'
      artifactName: 'e2e-tests-cypress-recordings-$(INTEGRATION_TEST_RUN_ID)'

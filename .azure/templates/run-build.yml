parameters:
  - name: 'BRANCH_NAME'
    type: string
  - name: 'AZURE_SUBSCRIPTION'
    type: string
  - name: 'AKS_RESOURCE_GROUP'
    type: string
  - name: 'AKS_CLUSTER_NAME'
    type: string
  - name: 'APP_NAME'
    type: string
  - name: 'BASE_KUSTOMIZATION_FILE'
    type: string
  - name: 'OVERLAY_WORKING_DIRECTORY'
    type: string
    default: 'choreo-cp-env-overlay/kustomize'

steps:
  - checkout: OVERLAY_REPOSITORY@${{ parameters.BRANCH_NAME }}
  - script: |
      set -eo pipefail
      mkdir build
      sed -i 's/- ..\/..\/..\/..\/choreo-control-plane\/kustomize\/base-ci/- ..\/..\/..\/..\/choreo-control-plane\/kustomize\/base/' ${{ parameters.BASE_KUSTOMIZATION_FILE }}
      $KUSTOMIZE build ${{ parameters.BRANCH_NAME }} | tee build/kustomize-all.yml
      git reset --hard
    displayName: 'Generate k8s artifacts [$(parameters.BRANCH_NAME)]'
    workingDirectory: ${{ parameters.OVERLAY_WORKING_DIRECTORY }}
  - task: AzureCLI@1
    displayName: 'Generate kube config'
    inputs:
      azureSubscription: ${{ parameters.AZURE_SUBSCRIPTION }}
      scriptLocation: inlineScript
      inlineScript: 'az aks get-credentials --resource-group ${{ parameters.AKS_RESOURCE_GROUP }} --name ${{ parameters.AKS_CLUSTER_NAME }} --admin'
  - script: |
      $KAPP version
      $KAPP -y deploy -a ${{ parameters.APP_NAME }} --diff-run --diff-changes -f build/kustomize-all.yml -f ../../choreo-control-plane/kustomize/kapp-config.yaml
    displayName: "KAPP diff run"
    workingDirectory: ${{ parameters.OVERLAY_WORKING_DIRECTORY }}

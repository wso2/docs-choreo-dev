parameters:
  - name: 'OVERLAY_SUB_DIR'
    type: string
  - name: 'AZURE_SUBSCRIPTION'
    type: string
  - name: 'AKS_RESOURCE_GROUP'
    type: string
  - name: 'AKS_CLUSTER_NAME'
    type: string
  - name: 'APP_NAME'
    type: string
  - name: 'BASE_KUSTOMIZATION_FILE'
    type: string
  - name: 'OVERLAY_WORKING_DIRECTORY'
    type: string
    default: 'choreo-cp-env-overlay'
  - name: 'UPDATE_KUSTOMIZE_CI_PATH'
    type: string
    default: 's/- ..\/..\/..\/..\/choreo-control-plane\/kustomize\/base-ci/- ..\/..\/..\/..\/choreo-control-plane\/kustomize\/base/'

steps:
  - task: Docker@2
    displayName: 'Login to ACR'
    inputs:
      command: login
      containerRegistry: choreo-util-acr
  - checkout: OVERLAY_REPOSITORY
  - template: install/install-helm.yaml@TEMPLATE_REPOSITORY
  - script: |
      find . -type f -name "*.y*ml" -print0 | xargs -0 sed -i "s#/shared-components-ci/#/shared-components/#g"
      if [[ "${{ parameters.OVERLAY_SUB_DIR }}/dataplane" ]]; then
        find . -type f -name "kustomization.y*ml" -print0 | xargs -0 sed -i 's|../../../../choreo-control-plane/kustomize/dataplane-ci/observability-ci|../../../../choreo-control-plane/kustomize/dataplane/choreo-observability|'
        find . -type f -name "kustomization.y*ml" -print0 | xargs -0 sed -i 's|../../../../choreo-control-plane/kustomize/dataplane-ci/ai-ci|../../../../choreo-control-plane/kustomize/dataplane/choreo-ai|'
      fi
    workingDirectory: ${{ parameters.OVERLAY_WORKING_DIRECTORY }}/kustomize/${{ parameters.OVERLAY_SUB_DIR }}
    displayName: 'Replacing CI directories'
  - script: |
      set -eo pipefail
      mkdir -p build
      sed -i '${{ parameters.UPDATE_KUSTOMIZE_CI_PATH }}' ${{ parameters.BASE_KUSTOMIZATION_FILE }}
      kustomize build \
        --enable-helm \
        --enable-alpha-plugins kustomize/${{ parameters.OVERLAY_SUB_DIR }} | tee build/kustomize-all.yml
    displayName: 'Generate k8s artifacts'
    workingDirectory: ${{ parameters.OVERLAY_WORKING_DIRECTORY }}
  - task: AzureCLI@1
    displayName: 'Generate kube config'
    inputs:
      azureSubscription: ${{ parameters.AZURE_SUBSCRIPTION }}
      scriptLocation: inlineScript
      inlineScript: 'az aks get-credentials --resource-group ${{ parameters.AKS_RESOURCE_GROUP }} --name ${{ parameters.AKS_CLUSTER_NAME }} --admin'
  - script: |
      kapp version
      kapp -y deploy -a ${{ parameters.APP_NAME }} --diff-run --diff-changes -f build/kustomize-all.yml -f ../choreo-control-plane/kustomize/kapp-config.yaml
    displayName: "KAPP diff run"
    workingDirectory: ${{ parameters.OVERLAY_WORKING_DIRECTORY }}

parameters:
  - name: 'BRANCH_NAME'
    type: string
  - name: 'AZURE_SUBSCRIPTION'
    type: string
  - name: 'AKS_RESOURCE_GROUP'
    type: string
  - name: 'AKS_CLUSTER_NAME'
    type: string
  - name: 'APP_NAME'
    type: string
  - name: 'BASE_KUSTOMIZATION_FILE'
    type: string

variables:
  - name: OVERLAY_WORKING_DIRECTORY
    value: choreo-cp-env-overlay/kustomize

resources:
  repositories:
    - repository: OVERLAY_REPOSITORY
      type: github
      name: wso2-enterprise/choreo-cp-env-overlay
      ref: refs/heads/${{ parameters.BRANCH_NAME }}
      endpoint: choreo-cicd

steps:
  - checkout: OVERLAY_REPOSITORY
  - script: |
      set -eo pipefail
      mkdir build
      sed -i 's/- ..\/..\/..\/..\/choreo-control-plane\/kustomize\/base-ci/- ..\/..\/..\/..\/choreo-control-plane\/kustomize\/base/' ${{ variables.BASE_KUSTOMIZATION_FILE }}
      $KUSTOMIZE build ${{ parameters.BRANCH_NAME }} | tee build/kustomize-all.yml
      git reset --hard
    displayName: 'Generate k8s artifacts [$(parameters.BRANCH_NAME)]'
    workingDirectory: $(OVERLAY_WORKING_DIRECTORY)
  - task: AzureCLI@1
    displayName: 'Generate kube config'
    inputs:
      azureSubscription: ${{ parameters.AZURE_SUBSCRIPTION }}
      scriptLocation: inlineScript
      inlineScript: 'az aks get-credentials --resource-group ${{ parameters.AKS_RESOURCE_GROUP }} --name ${{ parameters.AKS_CLUSTER_NAME }} --admin'
  - script: |
      $KAPP version
      $KAPP -y deploy -a ${{ parameters.APP_NAME }} --diff-run --diff-changes -f build/kustomize-all.yml -f ../../choreo-control-plane/kustomize/kapp-config.yaml
    displayName: "KAPP diff run"
    workingDirectory: $(OVERLAY_WORKING_DIRECTORY)

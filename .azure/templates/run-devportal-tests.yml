parameters:
- name: 'NODE_VERSION'
  type: string
  default: 14.2.0
- name: 'DEVPORTAL_LOGIN_URL'
  type: string
  default: 'https://devportal.dv.choreo.dev/?fidp=id.preprod.choreo.dev'
- name: 'DEVPORTAL_TEST_SRC'
  type: string
  default: 'integration-tests-cypress'
- name: 'USER_CONFIG_FILE_NAME'
  type: string
  default: 'cypress.env.json'

steps:
- script: |
    INTEGRATION_TEST_RUN_ID=$(uuidgen)
    echo "##vso[task.setvariable variable=INTEGRATION_TEST_RUN_ID]${INTEGRATION_TEST_RUN_ID}"
    echo "Generated integration test run id: ${INTEGRATION_TEST_RUN_ID}"
  displayName: 'Generate a unique id for the run'
- task: NodeTool@0
  inputs:
    versionSpec: ${{parameters.NODE_VERSION}}
  displayName: 'Install Node.js'
- task: CacheBeta@1
  inputs:
    key: '"$(Agent.OS)" | integration-tests-cypress/package-lock.json'
    path: '$(HOME)/.npm'
  displayName: "Cache npm packages"
- script: |
    cd ${{parameters.DEVPORTAL_TEST_SRC}}
    npm install
  displayName: 'Install Cypress'
- script: |
    cd ${{parameters.DEVPORTAL_TEST_SRC}}
    jq '.devportalLoginURL = $DEVPORTAL_LOGIN_URL | .devportalIdpUsername = $DEVPORTAL_IDP_USERNAME | .devportalIdpPassword = $DEVPORTAL_IDP_PASSWORD' \
      --arg DEVPORTAL_LOGIN_URL "${{parameters.DEVPORTAL_LOGIN_URL}}" --arg DEVPORTAL_IDP_USERNAME "$(idpUsername)" --arg DEVPORTAL_IDP_PASSWORD "$(idpPassword)" \
      ${{parameters.USER_CONFIG_FILE_NAME}} > tmp.$$.json && mv tmp.$$.json ${{parameters.USER_CONFIG_FILE_NAME}}
    npm run devportal-e2etest:headless
  displayName: 'Run Devportal E2E Tests'
- task: PublishPipelineArtifact@1
  name: publishScreenshots
  condition: failed()
  displayName: 'Publish Cypress Screenshots'
  inputs:
    targetPath: 'integration-tests-cypress/cypress/screenshots'
    artifactName: Devportal-Tests-cypress-screenshots-$(INTEGRATION_TEST_RUN_ID)
- task: PublishPipelineArtifact@1
  name: publishRecording
  condition: always()
  displayName: 'Publish Cypress Recordings'
  inputs:
    targetPath: 'integration-tests-cypress/cypress/videos'
    artifactName: Devportal-Tests-cypress-recordings-$(INTEGRATION_TEST_RUN_ID)

parameters:
- name: 'NODE_VERSION'
  type: string
  default: 10.14
- name: 'DEVPORTAL_TEST_SRC'
  type: string
  default: 'integration-tests/devportal'
- name: 'ENVIRONMENT_NAME'
  type: string
- name: 'USER_CONFIG_FILE_NAME'
  type: string
  default: 'testcafe-user-config.json'

steps:
- script: |
    INTEGRATION_TEST_RUN_ID=$(uuidgen)
    echo "##vso[task.setvariable variable=INTEGRATION_TEST_RUN_ID]${INTEGRATION_TEST_RUN_ID}"
    echo "Generated integration test run id: ${INTEGRATION_TEST_RUN_ID}"
  displayName: 'Generate a unique id for the run'
- task: NodeTool@0
  inputs:
    versionSpec: ${{parameters.NODE_VERSION}}
  displayName: 'Install Node.js'
- task: CacheBeta@1
  inputs:
    key: '"$(Agent.OS)" | integration-tests/devportal/package-lock.json'
    path: '$(HOME)/.npm'
  displayName: "Cache npm packages"
- script: |
    cd ${{parameters.DEVPORTAL_TEST_SRC}}
    npm install
  displayName: 'Install TestCafe'
- task: JavaToolInstaller@0
  displayName: 'Install JDK 11'
  inputs:
    versionSpec: '11'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'
- script: |
    cd ${{parameters.DEVPORTAL_TEST_SRC}}
    jq '.idpUsername = $IDP_USERNAME | .apimPassword = $APIM_PASSWORD' \
      --arg IDP_USERNAME "$(idpUsername)" --arg APIM_PASSWORD "$(apimPassword)" \
      ${{parameters.USER_CONFIG_FILE_NAME}} > tmp.$$.json && mv tmp.$$.json ${{parameters.USER_CONFIG_FILE_NAME}}
    npm run e2etest:headless
  env:
    CHOREO_ENV: ${{parameters.ENVIRONMENT_NAME}}
  displayName: 'Run Devportal TestCafe Tests'
- task: PublishPipelineArtifact@1
  name: publishRecordingDevportal
  condition: always()
  displayName: 'Publish Testcafe Recordings'
  inputs:
    targetPath: 'integration-tests/devportal/artifacts' 
    artifactName: test-cafe-recordings-$(INTEGRATION_TEST_RUN_ID)


parameters:
- name: 'CHANGES_FILE'
  type: string
  default: kustomize/build/changes.txt

steps:
- task: Docker@2
  displayName: Login to ACR
  inputs:
    command: login
    containerRegistry: 'wso2choreo-control-plane-acr'
- script: |
    set -eo pipefail
    addedImagePattern='^.*[[:blank:]]*\+[[:blank:]]*image:[[:blank:]].*'
    while IFS= read -r line; do
      if [[ "$line" =~ $addedImagePattern ]]
      then
        image=$(echo $line | sed -r  's/^.*[[:blank:]]*\+[[:blank:]]*image:[[:blank:]](.*)/\1/')
        docker pull $image
      fi
    done < ${{parameters.CHANGES_FILE}}
  displayName: "Verify Docker Image availability"

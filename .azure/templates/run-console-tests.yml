parameters:
- name: 'NODE_VERSION'
  type: string
  default: 14.16.0
- name: 'ENVIRONMENT_NAME'
  type: string
  default: 'DEV'
- name: 'USER_CONFIG_FILE_NAME'
  type: string
  default: 'cypress.env.json'
- name: 'RUN_UNSTABLE_TEST'
  type: boolean
  default: false 
- name: 'BASE_URL'
  type: string
  default: 'https://console.dv.choreo.dev/'
- name: 'CONSOLE_TEST_SPEC_DIR'
  type: string
  default: 'integration-tests-cypress'
- name: 'CONSOLE_LOGIN_URL'
  type: string
  default: 'https://console.dv.choreo.dev/login/'
- name: 'SELECTED_ORG_HANDLE'
  type: string
  default: 'choreouser'
- name: 'REPORTER_HOST_NAME'
  type: string
  default: 'periscope.dv.choreo.dev'
- name: 'USER_NAME'
  type: string
  default: 'choreo-user' 
- name: 'USER_EMAIL'
  type: string
  default: 'choreo-test-user@wso2.com'
- name: 'PIC_URL'
  type: string
  default: 'https://avatars1.githubusercontent.com/u/65526909?v=4'  
- name: 'IDP_URL'
  type: string
  default: 'https://id.preprod.choreo.dev/oauth2/token' 
- name: 'TEST_URL'
  type: string
  default: 'https://console.dv.choreo.dev/' 
- name: 'APP_SVC_URL'
  type: string
  default: 'https://app.dv.choreo.dev'
- name: 'ORG'
  type: object
  default:
    id: 32
    name: 'choreo-user'
    handle: 'choreouser'
    uuid: '14375014-a037-4b8e-a2df-c6e4d95917e4'      

steps:
- script: |
    INTEGRATION_TEST_RUN_ID=$(uuidgen)
    echo "##vso[task.setvariable variable=INTEGRATION_TEST_RUN_ID]${INTEGRATION_TEST_RUN_ID}"
    echo "Generated integration test run id: ${INTEGRATION_TEST_RUN_ID}"
  displayName: 'Generate a unique id for the run'
- task: NodeTool@0
  inputs:
    versionSpec: ${{parameters.NODE_VERSION}}
  displayName: 'Install Node.js'
- task: CacheBeta@1
  inputs:
    key: '"$(Agent.OS)" | integration-tests-cypress/package-lock.json'
    path: '$(HOME)/.npm'
  displayName: "Cache npm packages"
- script: | 
    cd ${{parameters.CONSOLE_TEST_SPEC_DIR}}
    npm install
  displayName: 'Install Cypress and other dependencies'
- script: |
    cd ${{parameters.CONSOLE_TEST_SPEC_DIR}}
    npm run console-e2etest:headless
  env:
    cypress_baseUrl: ${{parameters.BASE_URL}}
    cypress_loginURL: ${{parameters.CONSOLE_LOGIN_URL}}
    cypress_idpUsername: $(idpUsername)
    cypress_idpPassword: $(idpPassword)
    cypress_idpAuthHeader: $(idpAuthHeader)
    cypress_reporterHostName: ${{parameters.REPORTER_HOST_NAME}}
    cypress_idpURL: ${{parameters.IDP_URL}}
    cypress_orgs:
      -
        ${{parameters.ORG}}
    cypress_picURL: ${{parameters.PIC_URL}}
    cypress_appSvcURL: ${{parameters.APP_SVC_URL}}
    cypress_testURL: ${{parameters.TEST_URL}}
    cypress_name: ${{parameters.USER_NAME}}
    cypress_email: ${{parameters.USER_EMAIL}}
    cypress_selectedOrgHandle: ${{parameters.SELECTED_ORG_HANDLE}}
  displayName: 'Run Console E2E tests'
- task: PublishPipelineArtifact@1
  displayName: 'Publishing test fail screenshots'
  name: PublishTestFailScreenshots
  condition: failed()
  inputs:
    targetPath: 'integration-tests-cypress/cypress/screenshots'
    artifactName: 'console-e2e-tests-cypress-screenshots-$(INTEGRATION_TEST_RUN_ID)'
- task: PublishPipelineArtifact@1
  displayName: 'Publishing test fail videos'
  name: PublishTestFailVideos
  condition: always()
  inputs:
    targetPath: 'integration-tests-cypress/cypress/videos'
    artifactName: 'console-e2e-tests-cypress-screenshots-$(INTEGRATION_TEST_RUN_ID)'

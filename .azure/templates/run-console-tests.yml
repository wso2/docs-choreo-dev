parameters:
- name: 'NODE_VERSION'
  type: string
  default: 14.16.0
- name: 'ENVIRONMENT_NAME'
  type: string
  default: 'DEV'
- name: 'USER_CONFIG_FILE_NAME'
  type: string
  default: 'cypress.env.json'
- name: 'CONFIG_FILE_NAME'
  type: string
  default: 'cypress.json'
- name: 'RUN_UNSTABLE_TEST'
  type: boolean
  default: false 
- name: 'BASE_URL'
  type: string
  default: 'https://console.dv.choreo.dev/'
- name: 'CONSOLE_TEST_SPEC_DIR'
  type: string
  default: 'e2e-tests-cypress'
- name: 'CONSOLE_LOGIN_URL'
  type: string
  default: 'https://console.dv.choreo.dev/login/'
- name: 'SELECTED_ORG_HANDLE'
  type: string
  default: 'choreouser'
- name: 'REPORTER_HOST_NAME'
  type: string
  default: 'periscope.dv.choreo.dev'
- name: 'USER_NAME'
  type: string
  default: 'choreo-user' 
- name: 'USER_EMAIL'
  type: string
  default: 'choreo-test-user@wso2.com'
- name: 'PIC_URL'
  type: string
  default: 'https://avatars1.githubusercontent.com/u/65526909?v=4'  
- name: 'IDP_URL'
  type: string
  default: 'https://id.dv.choreo.dev/oauth2/token' 
- name: 'TEST_URL'
  type: string
  default: 'https://console.dv.choreo.dev/' 
- name: 'APP_SVC_URL'
  type: string
  default: 'https://app.dv.choreo.dev'
- name: 'ORG_ID'
  type: number
  default: 32
- name: 'ORG_NAME'
  type: string
  default: 'choreo-user' 
- name: 'ORG_UUID'
  type: string
  default: '14375014-a037-4b8e-a2df-c6e4d95917e4'
- name: 'MEMBER_NAME'
  type: string
  default: 'choreo-user'
- name: 'TEST_SCRIPT'
  type: string
  default: 'npm run console-e2etest:headless'
- name: 'APIM_SVC_URL'
  type: string
  default: 'https://apim.dv.choreo.dev'

steps:
- script: |
    INTEGRATION_TEST_RUN_ID=$(uuidgen)
    echo "##vso[task.setvariable variable=INTEGRATION_TEST_RUN_ID]${INTEGRATION_TEST_RUN_ID}"
    echo "Generated integration test run id: ${INTEGRATION_TEST_RUN_ID}"
  displayName: 'Generate a unique id for the run'
- task: NodeTool@0
  inputs:
    versionSpec: ${{parameters.NODE_VERSION}}
  displayName: 'Install Node.js'
- task: CacheBeta@1
  inputs:
    key: '"$(Agent.OS)" | ${{parameters.CONSOLE_TEST_SPEC_DIR}}/package-lock.json'
    path: '$(HOME)/.npm'
  displayName: "Cache npm packages"
- script: | 
    cd ${{parameters.CONSOLE_TEST_SPEC_DIR}}
    npm install
  displayName: 'Install Cypress and other dependencies'
- script: |
    cd ${{parameters.CONSOLE_TEST_SPEC_DIR}}
    jq '.loginURL = $CONSOLE_LOGIN_URL | .idpUsername = $IDP_USERNAME | .idpPassword = $IDP_PASSWORD 
      | .idpAuthHeader = $IDP_AUTH_HEADER | .baseUrl = $BASE_URL | .reporterHostName = $REPORTER_HOST_NAME | .idpURL = $IDP_URL 
      | .orgs[0].id = $ORG_ID | .orgs[0].name = $ORG_NAME | .orgs[0].uuid = $ORG_UUID | .orgs[0].handle = $ORG_HANDLE
      | .appSvcURL = $APP_SVC_URL | .testURL = $TEST_URL | .name = $USER_NAME | .email = $USER_EMAIL | .picURL = $PIC_URL
      | .selectedOrgHandle = $SELECTED_ORG_HANDLE | .memberName = $MEMBER_NAME | .apimSvcUrl = $APIM_SVC_URL' \
      --arg CONSOLE_LOGIN_URL "${{parameters.CONSOLE_LOGIN_URL}}" \
      --arg IDP_USERNAME "$(idpUsername)" \
      --arg IDP_PASSWORD "$(idpPassword)" \
      --arg IDP_AUTH_HEADER "$(idpAuthHeader)" \
      --arg BASE_URL "${{parameters.BASE_URL}}" \
      --arg REPORTER_HOST_NAME "${{parameters.REPORTER_HOST_NAME}}" \
      --arg IDP_URL "${{parameters.IDP_URL}}" \
      --arg APP_SVC_URL "${{parameters.APP_SVC_URL}}" \
      --arg TEST_URL "${{parameters.TEST_URL}}" \
      --arg USER_NAME "${{parameters.USER_NAME}}" \
      --arg USER_EMAIL "${{parameters.USER_EMAIL}}" \
      --arg PIC_URL "${{parameters.PIC_URL}}" \
      --arg ORG_ID "${{parameters.ORG_ID}}" \
      --arg ORG_NAME "${{parameters.ORG_NAME}}" \
      --arg ORG_UUID "${{parameters.ORG_UUID}}" \
      --arg ORG_HANDLE "${{parameters.SELECTED_ORG_HANDLE}}" \
      --arg SELECTED_ORG_HANDLE "${{parameters.SELECTED_ORG_HANDLE}}" \
      --arg MEMBER_NAME "${{parameters.MEMBER_NAME}}" \
      --arg APIM_SVC_URL "${{parameters.APIM_SVC_URL}}" \
      ${{parameters.USER_CONFIG_FILE_NAME}} > tmp.$$.json && mv tmp.$$.json ${{parameters.USER_CONFIG_FILE_NAME}}
    jq '.projectId = $CYPRESS_PROJECT_ID' \
      --arg CYPRESS_PROJECT_ID "$(cypress_project_id)" \
      ${{parameters.CONFIG_FILE_NAME}} > tmp.$$.json && mv tmp.$$.json ${{parameters.CONFIG_FILE_NAME}}
    ${{parameters.TEST_SCRIPT}} -- --record --tag $(Build.BuildNumber) --parallel --ci-build-id $(Build.BuildId)
  displayName: 'Run Console E2E tests'
  env:
    CYPRESS_RECORD_KEY: $(cypress_record_key)
- task: PublishPipelineArtifact@1
  displayName: 'Publish test fail screenshots'
  name: PublishTestFailScreenshots
  condition: failed()
  inputs:
    targetPath: '${{parameters.CONSOLE_TEST_SPEC_DIR}}/cypress/screenshots'
    artifactName: 'console-e2e-tests-cypress-screenshots-$(INTEGRATION_TEST_RUN_ID)'
- task: PublishPipelineArtifact@1
  displayName: 'Publish test fail videos'
  name: PublishTestFailVideos
  condition: always()
  inputs:
    targetPath: '${{parameters.CONSOLE_TEST_SPEC_DIR}}/cypress/videos'
    artifactName: 'console-e2e-tests-cypress-recordings-$(INTEGRATION_TEST_RUN_ID)'

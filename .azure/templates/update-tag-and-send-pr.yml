parameters:
- name: 'ISSUE_ID'
  type: string
- name: 'UPDATED_IMAGES'
  type: string
- name: 'TARGET_BRANCH'
  type: string
  default: 'stage'
- name: 'COMMIT_MESSAGE'
  type: string
  default: 'Update image tag'
    
steps:
- script: |
    set -eo
    updatedImages="${{ parameters.UPDATED_IMAGES }}"
    targetBranch="${{ parameters.TARGET_BRANCH }}"
    commitMessage="${{ parameters.COMMIT_MESSAGE }}"
    
    # Generate branch name
    randomNumber=$(shuf -i0-10 -n1)
    branchName=$(echo -n "$updatedImages" | md5sum | cut -d' ' -f1)
    branchName="${branchName}${randomNumber}"

    echo "Create branch $branchName"
    git branch "$branchName" "origin/$targetBranch"
    git checkout "$branchName"

    cd "kustomize/$targetBranch/choreo-system"

    trimmedUpdatedImages=${updatedImages//$'\n'/}
    echo "Repos : $trimmedUpdatedImages"
    echo "$trimmedUpdatedImages" | tr ',' '\n' | while read imageName; do
      echo "Updating image tag for $imageName"
      $KUSTOMIZE edit set image "$imageName"
    done

    git config --global user.email "choreo-cicd-component-builder@wso2.com"
    git config --global user.name "Choreo CI Agent"
    git diff
    git commit -am "$commitMessage"
    
    git remote -v
    git branch -al
    git push origin "$branchName"

    echo "Creating the PR : [$targetBranch] $commitMessage"
    gh pr create -H "$branchName" -B "$targetBranch" --title "[$targetBranch] $commitMessage" --body "## Related Issue"$'\n'$'\n'"#${{ parameters.ISSUE_ID }}"
  displayName: 'Send PR to update the image version'

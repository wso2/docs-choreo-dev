parameters:
- name: 'NODE_VERSION'
  type: string
  default: 10.14
- name: 'UI_TEST_SRC'
  type: string
  default: 'integration-tests/ui'
- name: 'SECURE_FILE_NAME'
  type: string
  default: 'testcafe-user-config-dev-v1.json'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: ${{parameters.NODE_VERSION}}
  displayName: 'Install Node.js'
- task: CacheBeta@1
  inputs:
    key: '"$(Agent.OS)" | integration-tests/ui/package-lock.json'
    path: '$(HOME)/.npm'
  displayName: "Cache npm packages"
- script: |
    cd ${{parameters.UI_TEST_SRC}}
    npm install
  displayName: 'Install TestCafe'
- task: DownloadSecureFile@1
  name: testConfig
  displayName: 'Download test configs'
  inputs:
    secureFile: ${{parameters.SECURE_FILE_NAME}}
- script: |
    cd ${{parameters.UI_TEST_SRC}}
    cp $(testConfig.secureFilePath) testcafe-user-config.json
    npm run e2etest:headless
  displayName: 'Run TestCafe Tests'
- task: PublishPipelineArtifact@1
  name: publishRecording
  condition: always()
  displayName: 'Publish Testcafe Recordings'
  inputs:
    targetPath: 'integration-tests/ui/artifacts' 
    artifactName: 'test-cafe-recordings'


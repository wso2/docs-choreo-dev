parameters:
- name: 'NODE_VERSION'
  type: string
  default: 10.14
- name: 'UI_TEST_SRC'
  type: string
  default: 'integration-tests/ui'
- name: 'ENVIRONMENT_NAME'
  type: string
  default: 'DEV'
- name: 'USER_CONFIG_FILE_NAME'
  type: string
  default: 'testcafe-user-config.json'
- name: 'PERIODIC_USER_CONFIG_FILE_NAME'
  type: string
  default: 'testcafe-periodic-user-config.json'
- name: 'CHOREO_APP_CONFIG_FILE_NAME'
  type: string
  default: 'choreo-app-config.json'
- name: 'TEST_NAME'
  type: string
  default: 'stable'

steps:
- script: |
    INTEGRATION_TEST_RUN_ID=$(uuidgen)
    echo "##vso[task.setvariable variable=INTEGRATION_TEST_RUN_ID]${INTEGRATION_TEST_RUN_ID}"
    echo "Generated integration test run id: ${INTEGRATION_TEST_RUN_ID}"
  displayName: 'Generate a unique id for the run'
- task: NodeTool@0
  inputs:
    versionSpec: ${{parameters.NODE_VERSION}}
  displayName: 'Install Node.js'
- task: CacheBeta@1
  inputs:
    key: '"$(Agent.OS)" | integration-tests/ui/package-lock.json'
    path: '$(HOME)/.npm'
  displayName: "Cache npm packages"
- script: |
    cd ${{parameters.UI_TEST_SRC}}
    npm install
  displayName: 'Install TestCafe'
- task: JavaToolInstaller@0
  displayName: 'Install JDK 11'
  inputs:
    versionSpec: '11'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'
- script: |
    cd ${{parameters.UI_TEST_SRC}}
    
    if [ "${{ parameters.TEST_NAME }}" == "periodic" ]
    then
      JQ_CHANGES=".github.pat = \$GITHUB_PAT\
        | .calendar.token = \$GOOGLE_CALENDAR_TOKEN\
        | .calendar.refresh_token = \$GOOGLE_CALENDAR_REFRESH_TOKEN\
        | .calendar.client_id = \$GOOGLE_CALENDAR_CLIENT_ID\
        | .calendar.client_secret = \$GOOGLE_CALENDAR_CLIENT_SECRET\
        | .gmail.token = \$GMAIL_TOKEN\
        | .gmail.refresh_token = \$GMAIL_REFRESH_TOKEN\
        | .gmail.client_id = \$GMAIL_CLIENT_ID\
        | .gmail.client_secret = \$GMAIL_CLIENT_SECRET"

      jq "$JQ_CHANGES" \
        --arg GITHUB_PAT "$(githubPat)" \
        --arg GOOGLE_CALENDAR_TOKEN "$(googleCalenderToken)" \
        --arg GOOGLE_CALENDAR_REFRESH_TOKEN "$(googleCalenderRefreshToken)" \
        --arg GOOGLE_CALENDAR_CLIENT_ID "$(googleCalenderClientId)" \
        --arg GOOGLE_CALENDAR_CLIENT_SECRET "$(googleCalenderClientSecret)" \
        --arg GMAIL_TOKEN "$(gmailToken)" \
        --arg GMAIL_REFRESH_TOKEN "$(gmailRefreshToken)" \
        --arg GMAIL_CLIENT_ID "$(gmailClientId)" \
        --arg GMAIL_CLIENT_SECRET "$(gmailClientSecret)" \
        ${{parameters.CHOREO_APP_CONFIG_FILE_NAME}} > tmp.$$.json && mv tmp.$$.json ${{parameters.CHOREO_APP_CONFIG_FILE_NAME}}

      rm ${{parameters.USER_CONFIG_FILE_NAME}}
      cp ${{parameters.PERIODIC_USER_CONFIG_FILE_NAME}} ${{parameters.USER_CONFIG_FILE_NAME}}

      jq '.idpUsername = $IDP_USERNAME | .idpPassword = $IDP_PASSWORD | .idpAuthHeader = $IDP_AUTH_HEADER' \
        --arg IDP_USERNAME "$(idpPeriodicUsername)" \
        --arg IDP_PASSWORD "$(idpPeriodicUserPassword)" \
        --arg IDP_AUTH_HEADER "$(idpPeriodicUserAuthHeader)" \
        ${{parameters.USER_CONFIG_FILE_NAME}} > tmp.$$.json && mv tmp.$$.json ${{parameters.USER_CONFIG_FILE_NAME}}

      npm run e2etest:headless-periodic
    else
      jq '.idpUsername = $IDP_USERNAME | .idpPassword = $IDP_PASSWORD | .idpAuthHeader = $IDP_AUTH_HEADER' \
        --arg IDP_USERNAME "$(idpUsername)" --arg IDP_PASSWORD "$(idpPassword)" --arg IDP_AUTH_HEADER "$(idpAuthHeader)" \
        ${{parameters.USER_CONFIG_FILE_NAME}} > tmp.$$.json && mv tmp.$$.json ${{parameters.USER_CONFIG_FILE_NAME}}
      if [ "${{ parameters.TEST_NAME }}" == "unstable" ]
      then
        npm run e2etest:headless-unstable
      else
        npm run e2etest:headless
      fi
    fi
  env:
    CHOREO_ENV: ${{parameters.ENVIRONMENT_NAME}}
  displayName: 'Run TestCafe Tests'
- task: PublishPipelineArtifact@1
  name: publishRecording
  condition: always()
  displayName: 'Publish Testcafe Recordings'
  inputs:
    targetPath: 'integration-tests/ui/artifacts' 
    artifactName: test-cafe-recordings-$(INTEGRATION_TEST_RUN_ID)

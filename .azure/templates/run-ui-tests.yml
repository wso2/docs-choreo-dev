parameters:
- name: 'NODE_VERSION'
  type: string
  default: 10.14
- name: 'UI_TEST_SRC'
  type: string
  default: 'integration-tests/ui'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: ${{parameters.NODE_VERSION}}
  displayName: 'Install Node.js'
- task: CacheBeta@1
  inputs:
    key: '"$(Agent.OS)" | integration-tests/ui/package-lock.json'
    path: '$(HOME)/.npm'
  displayName: "Cache npm packages"
- script: |
    cd ${{parameters.UI_TEST_SRC}}
    npm install
  displayName: 'Install TestCafe'
- task: DownloadSecureFile@1
  name: testConfig
  displayName: 'Download test configs'
  inputs:
    secureFile: 'testcafe-user-config.json'
- script: |
    cd ${{parameters.UI_TEST_SRC}}
    cp $(testConfig.secureFilePath) testcafe-user-config.json
    npm run e2etest:headless
  displayName: 'Run TestCafe Tests'
- task: PublishTestResults@2
  inputs:
    testResultsFiles: '**/${{parameters.UI_TEST_SRC}}/report.xml'
    testResultsFormat: 'JUnit'


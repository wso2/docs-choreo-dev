parameters:
- name: 'NODE_VERSION'
  type: string
  default: 14.16.0
- name: 'UI_TEST_SRC'
  type: string
  default: 'integration-tests/ui'
- name: 'ENVIRONMENT_NAME'
  type: string
  default: 'DEV'
- name: 'USER_CONFIG_FILE_NAME'
  type: string
  default: 'testcafe-user-config.json'
- name: 'RUN_UNSTABLE_TEST'
  type: boolean
  default: false

steps:
- script: |
    INTEGRATION_TEST_RUN_ID=$(uuidgen)
    echo "##vso[task.setvariable variable=INTEGRATION_TEST_RUN_ID]${INTEGRATION_TEST_RUN_ID}"
    echo "Generated integration test run id: ${INTEGRATION_TEST_RUN_ID}"
  displayName: 'Generate a unique id for the run'
- task: NodeTool@0
  inputs:
    versionSpec: ${{parameters.NODE_VERSION}}
  displayName: 'Install Node.js'
- task: CacheBeta@1
  inputs:
    key: '"$(Agent.OS)" | integration-tests/ui/package-lock.json'
    path: '$(HOME)/.npm'
  displayName: "Cache npm packages"
- script: |
    cd ${{parameters.UI_TEST_SRC}}
    npm install
  displayName: 'Install TestCafe'
- task: JavaToolInstaller@0
  displayName: 'Install JDK 11'
  inputs:
    versionSpec: '11'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'
- script: |
    cd ${{parameters.UI_TEST_SRC}}
    jq '.idpUsername = $IDP_USERNAME | .idpPassword = $IDP_PASSWORD | .idpAuthHeader = $IDP_AUTH_HEADER' \
      --arg IDP_USERNAME "$(idpUsername)" --arg IDP_PASSWORD "$(idpPassword)" --arg IDP_AUTH_HEADER "$(idpAuthHeader)" \
      ${{parameters.USER_CONFIG_FILE_NAME}} > tmp.$$.json && mv tmp.$$.json ${{parameters.USER_CONFIG_FILE_NAME}}
    
    if [ "${{ parameters.RUN_UNSTABLE_TEST }}" == "True" ]
    then
      echo "##vso[task.setvariable variable=TEST_NAME]Unstale-Tests"
      npm run e2etest:headless-unstable
    else
      echo "##vso[task.setvariable variable=TEST_NAME]Stable-Tests"
      npm run e2etest:headless
    fi
  env:
    CHOREO_ENV: ${{parameters.ENVIRONMENT_NAME}}
  displayName: 'Run TestCafe Tests'
- task: PublishPipelineArtifact@1
  name: publishRecording
  condition: always()
  displayName: 'Publish Testcafe Recordings'
  inputs:
    targetPath: 'integration-tests/ui/artifacts' 
    artifactName: $(TEST_NAME)-test-cafe-recordings-$(INTEGRATION_TEST_RUN_ID)

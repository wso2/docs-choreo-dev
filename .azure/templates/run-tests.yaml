parameters:
  ## cypress.env.json
  - name: "ASGARDEO_DOMAIN"
    type: string
    default: "api.dev.asgardeo.io"
  - name: "ASGARDEO_TOKEN_URL"
    type: string
    default: "https://dev.api.asgardeo.io/t/a/oauth2/authorize?*"
  - name: "CONSOLE_LOGIN_URL"
    type: string
    default: "https://consolev2.preview-dv.choreo.dev/login?fidp=choreoe2etest"
  - name: "BAL_REGISTRY_URL"
    type: string
    default: "https://api.dev-central.ballerina.io/2.0/registry"
  - name: "APP_SVC_URL"
    type: string
    default: "https://app.preview-dv.choreo.dev"
  - name: "NEW_APP_SVC_URL"
    type: string
    default: "https://apis.preview-dv.choreo.dev"
  - name: "IDP_URL"
    type: string
    default: "https://id.dv.choreo.dev"
  - name: "APIM_SVC_URL"
    type: string
    default: "https://sts.preview-dv.choreo.dev"
  - name: "DEVPORTAL_LOGIN_URL"
    type: string
    default: "https://devportal.preview-dv.choreo.dev"
  - name: "DEVPORTAL_CUSTOM_DOMAIN_LOGIN_URL"
    type: string
    default: "dev-devportal-e2e.mychoreoapp.com"
  - name: "INVITATION_USER_EMAIL"
    type: string
    default: "test.user.choreo@gmail.com"
  - name: "MAIL_READER_SVC_URL"
    type: string
    default: "https://9e979875-bc74-4e49-8a48-b18155d04043-prod.e1-us-east-azure.choreoapis.dev/598g/e2etestemailservice/1.0.0/readmail?startTimestamp="
  - name: "MAIL_READER_TOKEN_URL"
    type: string
    default: "https://sts.choreo.dev/oauth2/token"
  - name: "MAIL_READER_CLIENT_ID"
    type: string
    default: "rpff4c__c6QSdmKvIZDT0l7Efiga"
  - name: "IS_PRIVATE_ORG"
    type: string
    default: false
  - name: "PRIVATE_ORG_NAME"
    type: string
    default: "choreopdpe2edev"
  - name: "ENTERPRISE_LOGIN_URL"
    type: string
    default: "https://consolev2.preview-dv.choreo.dev/login"
  - name: "AUTH0_LOGOUT_URL"
    type: string
    default: "https://dev--ttt9jsa.us.auth0.com/v2/logout"
  - name: "AUTH0_CLIENT_ID"
    type: string
    default: "99KpQbwW511xPsW0j8KklK35fGQOPev3"
  - name: "ENTERPRISE_IDP_USERNAME"
    type: string
    default: "choreo-test-user@wso2choreoe2e.com"
  - name: "ENABLE_KUBECON_FEATURES"
    type: string
    default: "false"
  - name: "EP_USER"
    type: string
    default: "choreouser"
  - name: PROXY_DEPLOYER_ENDPOINT
    type: string
    default: "https://app.preview-dv.choreo.dev/proxy/deployer/v1/components"

  ## Config Files
  - name: "CYPRESS_ENV_CONFIG"
    type: string
    default: "cypress.env.json"
  - name: "CYPRESS_CONFIG"
    type: string
    default: "cypress.config.ts"

  ## Others
  - name: "NODE_VERSION"
    type: string
    default: 14.16.0
  - name: "TEST_SPEC_DIR"
    type: string
    default: "e2e-tests-cypress"
  - name: "SELECTED_ORG_HANDLE"
    type: string
    default: "choreouser"
  - name: "USER_NAME"
    type: string
    default: "choreo-user"
  - name: "USER_EMAIL"
    type: string
    default: "choreo-test-user@wso2.com"
  - name: "CYPRESS_OPTIONS"
    type: string
    default: "--spec 'cypress/e2e-stable/devportal/*.ts','cypress/e2e-stable/console/**/*','cypress/e2e-unstable/devportal/*.ts','cypress/e2e-unstable/console/**/*'"
  - name: "CYPRESS_COMMAND"
    type: string
    default: >-
          npx cypress run --headless
          --spec 'cypress/e2e-stable/devportal/*.ts','cypress/e2e-stable/console/**/*','cypress/e2e-unstable/devportal/*.ts','cypress/e2e-unstable/console/**/*'
          --record --tag $(Build.BuildNumber) --parallel --ci-build-id $(Build.BuildId)
  - name: "CYPRESS_FAIL_FAST_PLUGIN"
    type: string
    default: "true"

  ## Cypress Dashboard
  - name: "CYPRESS_RECORD_KEY"
    type: string
  - name: "CYPRESS_PROJECT_ID"
    type: string

steps:
  - script: |
      INTEGRATION_TEST_RUN_ID=$(uuidgen)
      echo "##vso[task.setvariable variable=INTEGRATION_TEST_RUN_ID]${INTEGRATION_TEST_RUN_ID}"
      echo "Generated integration test run id: ${INTEGRATION_TEST_RUN_ID}"
    displayName: "Generate a unique id for the run"
  - task: NodeTool@0
    inputs:
      versionSpec: ${{ parameters.NODE_VERSION }}
    displayName: "Install Node.js"
  - task: CacheBeta@1
    inputs:
      key: '"$(Agent.OS)" | ${{ parameters.TEST_SPEC_DIR }}/package-lock.json'
      path: "$(HOME)/.npm"
    displayName: "Cache npm packages"
  - script: |
      cd ${{ parameters.TEST_SPEC_DIR }}
      npm install webpack
      npm install
    displayName: "Install Cypress and other dependencies"
  - script: |
      cd ${{ parameters.TEST_SPEC_DIR }}
      jq '.asgardeoDomain = $ASGARDEO_DOMAIN | .asgardeoTokenURL = $ASGARDEO_TOKEN_URL | .loginURL = $CONSOLE_LOGIN_URL
        | .balRegistryURL = $BAL_REGISTRY_URL | .appSvcURL = $APP_SVC_URL | .isPrivateOrg = $IS_PRIVATE_ORG
        | .idpURL = $IDP_URL | .apimSvcURL = $APIM_SVC_URL | .newAppSvcURL = $NEW_APP_SVC_URL | .devportalLoginURL = $DEVPORTAL_LOGIN_URL
        | .invitationUserEmail = $INVITATION_USER_EMAIL | .mailReaderSvcURL = $MAIL_READER_SVC_URL | .privateOrgName = $PRIVATE_ORG_NAME
        | .mailReaderTokenURL =  $MAIL_READER_TOKEN_URL | .mailReaderClientId = $MAIL_READER_CLIENT_ID
        | .enableKubeConFeatures = $ENABLE_KUBECON_FEATURES
        | .choreoIDPInvitedUsername = $CHOREO_IDP_INVITED_USERNAME | .choreoIDPInvitedPassword = $CHOREO_IDP_INVITED_PASSWORD
        | .mailReaderClientSecret = $MAIL_READER_CLIENT_SECRET | .enterpriseLoginUrl = $ENTERPRISE_LOGIN_URL
        | .auth0LogoutUrl = $AUTH0_LOGOUT_URL | .auth0ClientID = $AUTH0_CLIENT_ID | .enterpriseIDPUsername = $ENTERPRISE_IDP_USERNAME
        | .enterpriseIDPPassword = $ENTERPRISE_IDP_PASSWORD | .devportalCustomDomain = $DEVPORTAL_CUSTOM_DOMAIN_LOGIN_URL
        | .epuser = $EP_USER | .proxyDeployerEP = $PROXY_DEPLOYER_ENDPOINT' \
        --arg ASGARDEO_DOMAIN "${{ parameters.ASGARDEO_DOMAIN }}" \
        --arg ASGARDEO_TOKEN_URL "${{ parameters.ASGARDEO_TOKEN_URL }}" \
        --arg CONSOLE_LOGIN_URL "${{ parameters.CONSOLE_LOGIN_URL }}" \
        --arg BAL_REGISTRY_URL "${{ parameters.BAL_REGISTRY_URL }}"  \
        --arg APP_SVC_URL "${{ parameters.APP_SVC_URL }}" \
        --arg NEW_APP_SVC_URL "${{ parameters.NEW_APP_SVC_URL }}" \
        --arg IDP_URL "${{ parameters.IDP_URL }}" \
        --argjson IS_PRIVATE_ORG "${{ parameters.IS_PRIVATE_ORG }}" \
        --argjson ENABLE_KUBECON_FEATURES "${{ parameters.ENABLE_KUBECON_FEATURES }}" \
        --arg APIM_SVC_URL "${{ parameters.APIM_SVC_URL }}" \
        --arg DEVPORTAL_LOGIN_URL "${{ parameters.DEVPORTAL_LOGIN_URL }}" \
        --arg INVITATION_USER_EMAIL "${{ parameters.INVITATION_USER_EMAIL }}" \
        --arg MAIL_READER_SVC_URL "${{ parameters.MAIL_READER_SVC_URL }}" \
        --arg MAIL_READER_TOKEN_URL "${{ parameters.MAIL_READER_TOKEN_URL }}" \
        --arg MAIL_READER_CLIENT_ID "${{ parameters.MAIL_READER_CLIENT_ID }}" \
        --arg PRIVATE_ORG_NAME "${{ parameters.PRIVATE_ORG_NAME }}" \
        --arg CHOREO_IDP_INVITED_USERNAME "$(choreoIDPInvitedUsername)" \
        --arg CHOREO_IDP_INVITED_PASSWORD "$(choreoIDPInvitedPassword)" \
        --arg MAIL_READER_CLIENT_SECRET "$(mailReaderClientSecret)" \
        --arg ENTERPRISE_LOGIN_URL "${{ parameters.ENTERPRISE_LOGIN_URL }}" \
        --arg AUTH0_LOGOUT_URL "${{ parameters.AUTH0_LOGOUT_URL }}" \
        --arg AUTH0_CLIENT_ID "${{ parameters.AUTH0_CLIENT_ID }}" \
        --arg ENTERPRISE_IDP_USERNAME "${{ parameters.ENTERPRISE_IDP_USERNAME }}" \
        --arg ENTERPRISE_IDP_PASSWORD "$(enterprise_idp_password)" \
        --arg DEVPORTAL_CUSTOM_DOMAIN_LOGIN_URL "${{ parameters.DEVPORTAL_CUSTOM_DOMAIN_LOGIN_URL }}" \
        --arg EP_USER  "${{ parameters.EP_USER }}" \
        --arg PROXY_DEPLOYER_ENDPOINT "${{ parameters.PROXY_DEPLOYER_ENDPOINT }}" \
        ${{ parameters.CYPRESS_ENV_CONFIG }} > tmp.$$.json && mv tmp.$$.json ${{ parameters.CYPRESS_ENV_CONFIG }}

      envsubst < ${{ parameters.CYPRESS_CONFIG }} > tmp.$$.ts && mv tmp.$$.ts ${{ parameters.CYPRESS_CONFIG }}
      cat ${{ parameters.CYPRESS_ENV_CONFIG }}

      CHOREO_E2E_TESTS_PASS_COUNT=0
      ${{ parameters.CYPRESS_COMMAND }}
      echo "##vso[task.setvariable variable=E2E_PASS_COUNT;isOutput=true]$CHOREO_E2E_TESTS_PASS_COUNT"
      echo "[DEBUG] e2e test pass count: $CHOREO_E2E_TESTS_PASS_COUNT"
    displayName: "Run E2E tests"
    name: RunE2ETests
    env:
      CYPRESS_PROJECT_ID: ${{ parameters.CYPRESS_PROJECT_ID }}
      CYPRESS_RECORD_KEY: ${{ parameters.CYPRESS_RECORD_KEY }}
      CYPRESS_FAIL_FAST_PLUGIN: ${{ parameters.CYPRESS_FAIL_FAST_PLUGIN }}
      choreoIDPUsername: $(idpUsername)
      choreoIDPPassword: $(idpPassword)
      choreoOrgHandle: ${{ parameters.SELECTED_ORG_HANDLE }}
      userName: ${{ parameters.USER_NAME }}
      userEmail: ${{ parameters.USER_EMAIL }}
      gitPAT: $(gitPAT)
      branch: $(Build.SourceBranchName)
  - task: PublishPipelineArtifact@1
    displayName: "Publish test fail screenshots"
    name: PublishTestFailScreenshots
    condition: failed()
    inputs:
      targetPath: "${{ parameters.TEST_SPEC_DIR }}/cypress/screenshots"
      artifactName: "e2e-tests-cypress-screenshots-$(INTEGRATION_TEST_RUN_ID)"
  - task: PublishPipelineArtifact@1
    displayName: "Publish test fail videos"
    name: PublishTestFailVideos
    condition: always()
    inputs:
      targetPath: "${{ parameters.TEST_SPEC_DIR }}/cypress/videos"
      artifactName: "e2e-tests-cypress-recordings-$(INTEGRATION_TEST_RUN_ID)"
  - script: |
      filePaths=$(find "${{ parameters.TEST_SPEC_DIR }}/cypress/screenshots" -type f -printf '{"path":"%p"}\n' | jq -s .)
      echo "$filePaths"
    displayName: "Get the file paths of the failed ßscreenshots"

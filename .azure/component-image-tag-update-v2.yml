resources:
  webhooks:
  - webhook: ImageUpdateTrigger
    connection: predev-image-update-trigger-connection
  repositories:
  - repository: TEMPLATE_REPOSITORY
    type: github
    name: wso2-enterprise/choreo-common-pipeline-templates
    ref: refs/heads/main
    endpoint: choreo-cicd

trigger: none

pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
  persistCredentials: true
- template: install/install-kustomize.yml@TEMPLATE_REPOSITORY
- script: |
    update_image () {
      updatedImages="${{ parameters.ImageUpdateTrigger.updatedImages }}"
      trimmedUpdatedImages=${updatedImages//$'\n'/}
      echo "Repos : $trimmedUpdatedImages"
      echo "$trimmedUpdatedImages" | tr ',' '\n' | while read imageName; do
        echo "Updating image tag for $imageName"
      done

      updatedConfigs="${{ parameters.ImageUpdateTrigger.updatedConfigs }}"
      envFileName='common-env-variables.yaml'
      if [ ! -z "$updatedConfigs" ]
      then
        trimmedUpdatedConfigs=${updatedConfigs//$'\n'/}
        echo "Configs : $trimmedUpdatedConfigs"
      fi
    }

    echo "Pipeline triggered from a webhook"
    clusterName="${{ parameters.ImageUpdateTrigger.clusterName }}"
    
    if [ $clusterName = "controlplane" ]
    then 
      cd kustomize/base-ci
      update_image
   
    elif [ $clusterName = "dataPlane" ]
    then 
      cd kustomize/dataplane-ci
      update_image

    elif [ $clusterName = "routing" ]
    then
      cd kustomize/routing-ci
      update_image

    else
      echo "Invalid cluster name"
      exit 1
    fi
    
    git config --global user.email "choreo-cicd@wso2.com"
    git config --global user.name "Choreo CI Agent"
    git diff
    git commit -am "Update image tags in $(Build.BuildNumber)"
    git remote -v
    git branch -al
    if git push origin HEAD:$(Build.SourceBranchName) ; then
      echo "Changes pushed successfully"
    else
      git fetch origin
      git merge --no-edit --strategy recursive --strategy-option theirs origin/$(Build.SourceBranchName)
      git push origin HEAD:$(Build.SourceBranchName)
    fi
  displayName: 'Update image latest tags'

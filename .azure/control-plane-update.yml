trigger:
  batch: true
  branches:
    include:
    - main
  paths:
    include:
    - kustomize/*
    - .azure/*
    - integration-tests/*

pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: |
    curl -v --header "Content-Type: application/json" \
    --request POST \
    --data '{ "head" : "$(Build.SourceVersion)" \
    https://dev.azure.com/choreo-devops/_apis/public/distributedtask/webhooks/control-plane-base-update?api-version=6.0-preview
  displayName: 'Trigger dev version update pipeline'
variables:
  SUPER_LINTER_VERSION: v3.13.1

trigger: none

pr:
  branches:
    include:
      - 'main'

pool:
  vmImage: 'ubuntu-latest'


steps:
  - script: |
      changedFiles=$(git diff --name-only HEAD origin/prod)
      printf "Changed files:\n%s\n" "${changedFiles}"

      mkdir -p scan
      for file in ${changedFiles}; do
        if [[ -f $file ]]; then
          cp ${file} scan/
        else
          echo "${file} has been deleted"
        fi
      done
    displayName: 'Copy Changed Files to scan Directory'
    workingDirectory: $(System.DefaultWorkingDirectory)
  - script: |
      docker pull github/super-linter:$(SUPER_LINTER_VERSION)
      docker run -e RUN_LOCAL=true -e VALIDATE_YAML=true \
      -e VALIDATE_MD=true -e VALIDATE_BASH=true \
      -e VALIDATE_TYPESCRIPT_ES=true -e VALIDATE_JAVASCRIPT_ES=true \
      -e VALIDATE_DOCKERFILE=true -e VALIDATE_DOCKERFILE_HADOLINT=true \
      -v $(System.DefaultWorkingDirectory)/scan:/tmp/lint github/super-linter:$(SUPER_LINTER_VERSION)
    displayName: 'Code Scan using GitHub Super-Linter'

resources:
  repositories:
    - repository: TEMPLATE_REPOSITORY
      type: github
      name: wso2-enterprise/choreo-common-pipeline-templates
      ref: refs/heads/main
      endpoint: wso2-enterprise

trigger: none

pr:
  branches:
    include:
      - 'main'
      - 'deprecated'

pool:
  vmImage: 'ubuntu-latest'

steps:
  - template: run-super-linter.yaml@TEMPLATE_REPOSITORY
    parameters:
      OPTIONS: |-
        -e VALIDATE_YAML=true \
        -e VALIDATE_MD=true -e VALIDATE_BASH=true \
        -e VALIDATE_TYPESCRIPT_ES=true -e VALIDATE_JAVASCRIPT_ES=true \
        -e VALIDATE_DOCKERFILE=true -e VALIDATE_DOCKERFILE_HADOLINT=true

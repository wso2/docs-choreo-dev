resources:
  repositories:
    - repository: choreo-common-pipeline-templates
      type: github
      name: wso2-enterprise/choreo-common-pipeline-templates
      ref: refs/heads/main
      endpoint: wso2-enterprise

trigger: none

pr:
  branches:
    include:
      - 'main'

pool:
  vmImage: 'ubuntu-latest'

steps:
#  - template: install/install-yamllint.yaml@choreo-common-pipeline-templates
#  - template: install/install-shellcheck.yaml@choreo-common-pipeline-templates
#  - script: |
#      npm install -g markdownlint-cli
#    displayName: Install markdownlint-cli
#  - script: |
#      yamllint -c .linters/yamllint/config.yaml .
#    displayName: Lint YAML files
#  - script: |
#      shellcheck ./**/*.sh
#    displayName: Lint Shell scripts
#  - script: |
#      markdownlint -c .linters/markdownlint/config.yaml '**/*.md'
#    displayName: Lint Markdown files
  - script: |
      docker run \
        -e LOG_LEVEL=INFO \
        -e RUN_LOCAL=true \
        -e VALIDATE_YAML=true \
        -e VALIDATE_BASH=true \
        -e VALIDATE_TYPESCRIPT_ES=true \
        -e VALIDATE_JAVASCRIPT_ES=true \
        -v $(System.DefaultWorkingDirectory):/tmp/lint \
        ghcr.io/super-linter/super-linter:slim-latest

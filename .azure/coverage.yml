resources:
  repositories:
    - repository: choreo-console
      type: github
      name: wso2-enterprise/choreo-console
      ref: refs/heads/main
      endpoint: wso2-enterprise
trigger: none
pr: none
schedules:
  - cron: "0 0 * * *"
    displayName: 'Run pipeline every day at 12 midnight'
    branches:
      include:
        - main
    always: true
variables:
  - group: dev-end2end-tests
  - name: CYPRESS_COVERAGE
    value: 'true'
  - name: ELECTRON_BROWSER_ARGS
    value: '--remote-debugging-port=9222'
  - name: TEST_SPEC_DIR
    value: choreo-control-plane/e2e-tests-cypress
  - name: CYPRESS_FAIL_FAST_PLUGIN
    value: 'true'
  - name: CYPRESS_CONSOLE_ONLY_MODE
    value: 'true'  
pool: choreo-dev-custom-cp-release-vmss-agents-001
jobs:
  - job: coverageJob
    timeoutInMinutes: 180
    strategy:
      parallel: 5
    steps:
      - checkout: self
      - checkout: choreo-console
      - task: UseNode@0
        inputs:
          versionSpec: 20.x
        displayName: Install Nodejs and npm
      - task: UseDotNet@2
        inputs:
          packageType: sdk
          version: 7.x
      - script: |
          npm install --legacy-peer-deps
        workingDirectory: choreo-console
        displayName: Install npm packages
        env:
          gitPAT: $(consoleNPMToken)
      - script: |
          npm install --save-dev ts-node typescript --legacy-peer-deps
        workingDirectory: choreo-console
        displayName: Install ts-node and TypeScript
      - script: |
          ulimit -Sn
          ulimit -Sn 100000
          sudo sysctl fs.inotify.max_queued_events=32768
          sudo sysctl fs.inotify.max_user_instances=16384
          sudo sysctl fs.inotify.max_user_watches=1048576
        displayName: Increase limits
      - script: |
          export INSTR_COVERAGE=true
          export NODE_OPTIONS=--max-old-space-size=15874
          npx vite build && cp public/404/404.html build

          npx vite preview  --port 3000 --no-open &
          sleep 10 # Wait for Vite to start properly before running Cypress
        workingDirectory: choreo-console
        displayName: Start Vite with Coverage
      - script: |
          INTEGRATION_TEST_RUN_ID=$(uuidgen)

          echo "##vso[task.setvariable
          variable=INTEGRATION_TEST_RUN_ID]${INTEGRATION_TEST_RUN_ID}"

          echo "Generated integration test run id: ${INTEGRATION_TEST_RUN_ID}"
        displayName: Generate a unique id for the run
      - script: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk2.0-0 \
            libgtk-3-0 \
            libgbm-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libasound2 \
            libxtst6 \
            xauth \
            xvfb
        displayName: Install dependencies for Cypress
      - script: |
          npm install
          npx cypress run \
            --spec 'cypress/e2e-stable/console/**/*' \
            --record --tag $(Build.BuildNumber) \
            --parallel --ci-build-id $(Build.BuildId)
        workingDirectory: choreo-control-plane/e2e-tests-cypress
        displayName: Start e2e tests
        env:
          cypress_consoleOnlyMode: $(CYPRESS_CONSOLE_ONLY_MODE)
          CYPRESS_RECORD_KEY: $(coverage-cypress-record-key)
          CYPRESS_PROJECT_ID: $(coverage-cypress-project-id)
          CYPRESS_COVERAGE: $(CYPRESS_COVERAGE)
          ELECTRON_EXTRA_LAUNCH_ARGS: $(ELECTRON_BROWSER_ARGS)
          TEST_SPEC_DIR: $(TEST_SPEC_DIR)
          CYPRESS_FAIL_FAST_PLUGIN: $(CYPRESS_FAIL_FAST_PLUGIN)
          choreoIDPUsername: $(idpUsername)
          choreoIDPPassword: $(idpPassword)
          cypress_loginURL: 'https://localhost:3000/login?fidp=choreoe2etest'
          cypress_appSvcURL: 'https://localhost:3000'
          cypress_newAppSvcURL: 'https://localhost:3000'
          cypress_baseUrl: 'https://localhost:3000'
          cypress_apimSvcURL: 'https://localhost:3000'
          cypress_overridenNewAppSvcURL: 'https://apis.preview-dv.choreo.dev'
      - task: PublishPipelineArtifact@1
        displayName: Publish test fail screenshots
        name: PublishTestFailScreenshots
        condition: failed()
        inputs:
          targetPath: '${{variables.TEST_SPEC_DIR}}/cypress/screenshots/e2e-smoke/'
          artifactName: e2e-tests-cypress-screenshots-$(INTEGRATION_TEST_RUN_ID)
      - task: PublishPipelineArtifact@1
        displayName: Publish test fail videos
        name: PublishTestFailVideos
        condition: always()
        inputs:
          targetPath: '${{variables.TEST_SPEC_DIR}}/cypress/videos/e2e-smoke/'
          artifactName: e2e-tests-cypress-recordings-$(INTEGRATION_TEST_RUN_ID)
      - task: PublishPipelineArtifact@1
        displayName: Publish Cypress coverage
        condition: always()
        inputs:
          targetPath: '${{variables.TEST_SPEC_DIR}}/coverage/lcov-report'
          artifactName: cypress-coverage-$(INTEGRATION_TEST_RUN_ID)
      - task: PublishCodeCoverageResults@2
        condition: always()
        inputs:
          summaryFileLocation: >-
            $(System.DefaultWorkingDirectory)/choreo-control-plane/e2e-tests-cypress/coverage/clover.xml

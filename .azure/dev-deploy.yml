trigger:
  batch: true
  branches:
    include:
    - master
  paths:
    include:
    - kustomize/base/*
    - kustomize/dev/*
    - .azure/dev-deploy.yml

pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: |
    echo "Installing kustomize in the environment"
    mkdir $HOME/bin
    pushd $HOME/bin
    curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh"  | bash
    echo "##vso[task.setvariable variable=KUSTOMIZE]$(HOME)/bin/kustomize"
    popd
  displayName: 'Setup kustomize'
- script: |
    cd kustomize
    mkdir build
    $KUSTOMIZE build dev | tee build/kustomize-all.yml
  displayName: 'Generate k8s artifacts'
- script: |
    export K14SIO_INSTALL_BIN_DIR=$HOME/bin
    curl -L https://k14s.io/install.sh | bash
    echo "##vso[task.setvariable variable=KAPP]$(HOME)/bin/kapp"
  displayName: "Setup kapp"
- task: AzureCLI@1
  displayName: 'Generate kube config'
  inputs:
    azureSubscription: 'choreo-non-prod-rg'
    scriptLocation: inlineScript
    inlineScript: 'az aks get-credentials --resource-group choreo-non-prod --name choreo-non-prod-control-plane --admin'
- script: |
    $KAPP version
    $KAPP -y deploy -a choreo-prod  --diff-changes -f kustomize/build/kustomize-all.yml -f kustomize/base/kapp-config.yaml
  displayName: "Deploy to cluster"

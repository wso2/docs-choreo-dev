# Build custom Azure VM image

parameters:
  # Job selection options
  - name: VM_IMAGE_PACKER_BUILD_DEF_FILE_NAME
    type: string
    displayName: 'Name of the VM image Packer build definition file'

trigger: none
pr: none

pool: choreo-dev-custom-cp-vmss-agents

variables:
  - name: packer_template_repository
    value: "choreo-deployment"
  - name: packer_template_sub_directory
    value: "custom-image-cfgs"
  - name: subscription_id
    value: "0a7b14d7-05f7-4c32-8929-619eb4fb7aeb"
  - name: resource_group
    value: "choreo-shared-custom-images-rg"
  - name: arm_service_connection
    value: "choreo-sre-custom-image-builder"
  - group: sre-vm-image-builder-secrets

resources:
  repositories:
    - repository: choreo-common-templates
      type: github
      name: wso2-enterprise/choreo-common-pipeline-templates
      ref: refs/heads/main
      endpoint: wso2-enterprise
    - repository: sre-common-templates
      type: github
      name: wso2-enterprise/azure-pipeline-templates
      ref: refs/tags/v1.4.8
      endpoint: wso2-enterprise
    - repository: vm-image-build-definition
      type: github
      name: wso2-enterprise/choreo-deployment
      ref: refs/heads/shared
      endpoint: wso2-enterprise

stages:
  - stage: deploy
    displayName: "Build custom VM image"
    jobs:
      - job: build_bastion_custom_vm_image
        displayName: "Build custom VM image"
        workspace:
          clean: all
        steps:
          - checkout: vm-image-build-definition
            path: $(packer_template_repository)
          - script: |
              # Fail script when a subsequent command or pipe redirection fails
              set -e
              set -o pipefail

              # Get the image template name
              templateName=$( jq -r '.tags.imageTemplate' $(Agent.BuildDirectory)/$(packer_template_repository)/$(packer_template_sub_directory)/${{ parameters.VM_IMAGE_PACKER_BUILD_DEF_FILE_NAME }} )
              echo "##vso[task.setvariable variable=TEMPLATE_NAME;isOutput=true]${templateName}"
            name: get_template_name
            displayName: Get template name
          - template: ci-pipelines/templates/vm-image-build/build-custom-vm-image.yaml@sre-common-templates
            parameters:
              SUBSCRIPTION_ID: $(subscription_id)
              RESOURCE_GROUP: $(resource_group)
              SERVICE_CONNECTION: $(arm_service_connection)
              IMAGE_TEMPLATE_PATH: $(Agent.BuildDirectory)/$(packer_template_repository)/$(packer_template_sub_directory)/${{ parameters.VM_IMAGE_PACKER_BUILD_DEF_FILE_NAME }}
              IMAGE_TEMPLATE_NAME: $(get_template_name.TEMPLATE_NAME)

      - job: approval
        displayName: "Approval to remove image template"
        pool: server
        timeoutInMinutes: 120
        dependsOn: build_bastion_custom_vm_image
        condition: eq(dependencies.build_bastion_custom_vm_image.result, 'Failed')
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 120
            inputs:
              instructions: "Note: Please download the Packer logs from the Azure Portal before removing the image template"

      - job: remove_failed_image_template
        displayName: "Remove failed image template"
        dependsOn:
          - build_bastion_custom_vm_image
          - approval
        workspace:
          clean: all
        condition: and(eq(dependencies.build_bastion_custom_vm_image.result, 'Failed'),eq(dependencies.approval.result, 'Succeeded'))
        variables:
          TEMPLATE_NAME: $[ dependencies.build_bastion_custom_vm_image.outputs['get_template_name.TEMPLATE_NAME'] ]
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(arm_service_connection)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                # Fail script when a subsequent command or pipe redirection fails
                set -e
                set -o pipefail

                # Remove added image template since build failed
                az account set -s $(subscription_id)
                az image builder delete --name $(TEMPLATE_NAME) --resource-group $(resource_group)
                echo "Template removed..."

      - job: build_bastion_custom_vm_image_succeeded_alert
        displayName: "Custom VM image build success alert"
        dependsOn:
          - build_bastion_custom_vm_image
        workspace:
          clean: all
        condition: eq(dependencies.build_bastion_custom_vm_image.result, 'Succeeded')
        variables:
          TEMPLATE_NAME: $[ dependencies.build_bastion_custom_vm_image.outputs['get_template_name.TEMPLATE_NAME'] ]
        steps:
          - template: notify-vm-image-build-status.yaml@choreo-common-templates
            parameters:
              PIPELINE_NAME: $(TEMPLATE_NAME)
              ENVIRONMENT: "shared"
              PIPELINE_STATUS: "Succeeded"
              GOOGLE_CHAT_SPACE: $(GOOGLE_CHAT_SPACE_ID)
              GOOGLE_CHAT_KEY: $(GOOGLE_CHAT_KEY)
              GOOGLE_CHAT_TOKEN: $(GOOGLE_CHAT_TOKEN)

      - job: build_bastion_custom_vm_image_failed_alert
        displayName: "Custom VM image build failure alert"
        dependsOn:
          - build_bastion_custom_vm_image
        condition: eq(dependencies.build_bastion_custom_vm_image.result, 'Failed')
        variables:
          TEMPLATE_NAME: $[ dependencies.build_bastion_custom_vm_image.outputs['get_template_name.TEMPLATE_NAME'] ]
        workspace:
          clean: all
        steps:
          - template: notify-vm-image-build-status.yaml@choreo-common-templates
            parameters:
              PIPELINE_NAME: $(TEMPLATE_NAME)
              ENVIRONMENT: "shared"
              PIPELINE_STATUS: "Failed"
              GOOGLE_CHAT_SPACE: $(GOOGLE_CHAT_SPACE_ID)
              GOOGLE_CHAT_KEY: $(GOOGLE_CHAT_KEY)
              GOOGLE_CHAT_TOKEN: $(GOOGLE_CHAT_TOKEN)

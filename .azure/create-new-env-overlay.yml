parameters:
  - name: BASE_BRANCH
    displayName: BASE_BRANCH_NAME
    type: string
  - name: NEW_BRANCH
    displayName: NEW_BRANCH_NAME
    type: string
  - name: SRC_NS_IDENTIFIER
    displayName: SOURCE_NAMESPACE_IDENTIFIER
    type: string
  - name: TRGT_NS_IDENTIFIER
    displayName: TARGET_NAMESPACE_IDENTIFIER
    type: string
  - name: SRC_DNS_IDENTIFIER
    displayName: SOURCE_DNS_IDENTIFIER
    type: string
  - name: TRGT_DNS_IDENTIFIER
    displayName: TARGET_DNS_IDENTIFIER
    type: string
  - name: SRC_SQL_HOST
    displayName: SOURCE_SQL_HOST
    type: string
  - name: TRGT_SQL_HOST
    displayName: TARGET_SQL_HOST
    type: string
  - name: SRC_GA_REDIS_HOST
    displayName: SOURCE_GA_REDIS_HOST
    type: string
  - name: TRGT_GA_REDIS_HOST
    displayName: TARGET_GA_REDIS_HOST
    type: string
  - name: SRC_RUNTIME_REDIS_HOST
    displayName: SOURCE_RUNTIME_REDIS_HOST
    type: string
  - name: TRGT_RUNTIME_REDIS_HOST
    displayName: TARGET_RUNTIME_REDIS_HOST
    type: string
  - name: SRC_BCENTRAL_HOST
    displayName: SOURCE_BCENTRAL_HOST
    type: string
  - name: TRGT_BCENTRAL_HOST
    displayName: TARGET_BCENTRAL_HOST

resources:
  repositories:
    - repository: OVERLAY_REPOSITORY
      type: github
      name: wso2-enterprise/choreo-cp-env-overlay
      endpoint: wso2-enterprise

trigger: none

pr: none

pool: choreo-shared-azuredevops-vmss

variables:
  - name: REPO_NAME
    value: 'choreo-cp-env-overlay'
  - name: REPO_OWNER
    value: 'wso2-enterprise'
  - name: BASE_FOLDER_NAME_CP
    value: 'kustomize/${{ parameters.BASE_BRANCH }}-control-plane'
  - name: NEW_FOLDER_NAME_CP
    value: 'kustomize/${{ parameters.NEW_BRANCH }}-control-plane'
  - name: BASE_FOLDER_NAME_DP
    value: 'kustomize/${{ parameters.BASE_BRANCH }}-dataplane-eastus2'
  - name: NEW_FOLDER_NAME_DP
    value: 'kustomize/${{ parameters.NEW_BRANCH }}-dataplane-eastus2'

steps:
  - script: |
      echo "Setting up Git"
      git config --global user.name "choreo-cicd@wso2.com"
      git config --global user.email "Choreo CI Agent"
    displayName: 'Setup Git'

  - checkout: self
  - checkout: OVERLAY_REPOSITORY
    persistCredentials: true

  - script: |
      echo "Checking out the ${{ parameters.BASE_BRANCH }} branch"
      git checkout ${{ parameters.BASE_BRANCH }}

      echo "Creating new branch ${{ parameters.NEW_BRANCH }} from ${{ parameters.BASE_BRANCH }}"
      git checkout -b ${{ parameters.NEW_BRANCH }}
    displayName: 'Checkout base branch and create new branch'
    workingDirectory: choreo-cp-env-overlay

  - script: |
      # Move the folder
      git mv $(BASE_FOLDER_NAME_CP) $(NEW_FOLDER_NAME_CP)
      # Move the folder
      git mv $(BASE_FOLDER_NAME_DP) $(NEW_FOLDER_NAME_DP)
    displayName: 'Rename overlay folders'
    workingDirectory: choreo-cp-env-overlay

  - script: choreo-control-plane/.azure/templates/replace-env-identifiers.sh
    displayName: 'Update config env replacer file - CP'
    env:
      SRC_NS_IDENTIFIER: ${{ parameters.SRC_NS_IDENTIFIER }}
      SRC_DNS_IDENTIFIER: ${{ parameters.SRC_DNS_IDENTIFIER }}
      SRC_SQL_HOST: ${{ parameters.SRC_SQL_HOST }}
      SRC_GA_REDIS_HOST: ${{ parameters.SRC_GA_REDIS_HOST }}
      SRC_RUNTIME_REDIS_HOST: ${{ parameters.SRC_RUNTIME_REDIS_HOST }}
      SRC_BCENTRAL_HOST: ${{ parameters.SRC_BCENTRAL_HOST }}
      TRGT_NS_IDENTIFIER: ${{ parameters.TRGT_NS_IDENTIFIER }}
      TRGT_DNS_IDENTIFIER: ${{ parameters.TRGT_DNS_IDENTIFIER }}
      TRGT_SQL_HOST: ${{ parameters.TRGT_SQL_HOST }}
      TRGT_GA_REDIS_HOST: ${{ parameters.TRGT_GA_REDIS_HOST }}
      TRGT_RUNTIME_REDIS_HOST: ${{ parameters.TRGT_RUNTIME_REDIS_HOST }}
      TRGT_BCENTRAL_HOST: ${{ parameters.TRGT_BCENTRAL_HOST }}
      FILE_PATH: choreo-cp-env-overlay/kustomize/${{ parameters.NEW_BRANCH }}-control-plane/env-bound-config-replacer.yaml

  - script: choreo-control-plane/.azure/templates/replace-env-identifiers.sh
    displayName: 'Update config env replacer file - DP'
    env:
      SRC_NS_IDENTIFIER: ${{ parameters.SRC_NS_IDENTIFIER }}
      SRC_DNS_IDENTIFIER: ${{ parameters.SRC_DNS_IDENTIFIER }}
      SRC_SQL_HOST: ${{ parameters.SRC_SQL_HOST }}
      SRC_GA_REDIS_HOST: ${{ parameters.SRC_GA_REDIS_HOST }}
      SRC_RUNTIME_REDIS_HOST: ${{ parameters.SRC_RUNTIME_REDIS_HOST }}
      SRC_BCENTRAL_HOST: ${{ parameters.SRC_BCENTRAL_HOST }}
      TRGT_NS_IDENTIFIER: ${{ parameters.TRGT_NS_IDENTIFIER }}
      TRGT_DNS_IDENTIFIER: ${{ parameters.TRGT_DNS_IDENTIFIER }}
      TRGT_SQL_HOST: ${{ parameters.TRGT_SQL_HOST }}
      TRGT_GA_REDIS_HOST: ${{ parameters.TRGT_GA_REDIS_HOST }}
      TRGT_RUNTIME_REDIS_HOST: ${{ parameters.TRGT_RUNTIME_REDIS_HOST }}
      TRGT_BCENTRAL_HOST: ${{ parameters.TRGT_BCENTRAL_HOST }}
      FILE_PATH: choreo-cp-env-overlay/kustomize/${{ parameters.NEW_BRANCH }}-dataplane-eastus2/env-bound-config-replacer.yaml

  - script: |
      git mv .azure/${{ parameters.BASE_BRANCH }}-build-secret-version-replacer-file.yaml .azure/${{ parameters.NEW_BRANCH }}-build-secret-version-replacer-file.yaml
      sed -i "s/${{ parameters.BASE_BRANCH }}/${{ parameters.NEW_BRANCH }}/g" ".azure/${{ parameters.NEW_BRANCH }}-build-secret-version-replacer-file.yaml"

      git mv .azure/${{ parameters.BASE_BRANCH }}-deploy-v2.yml .azure/${{ parameters.NEW_BRANCH }}-deploy-v2.yml
      sed -i "s/${{ parameters.BASE_BRANCH }}/${{ parameters.NEW_BRANCH }}/g" ".azure/${{ parameters.NEW_BRANCH }}-deploy-v2.yml"

      git mv .azure/sync-${{ parameters.BASE_BRANCH }}-ci.yml .azure/sync-${{ parameters.NEW_BRANCH }}-ci.yml
      sed -i "s/${{ parameters.BASE_BRANCH }}/${{ parameters.NEW_BRANCH }}/g" ".azure/sync-${{ parameters.NEW_BRANCH }}-ci.yml"
    displayName: "Update pipeline yamls"
    workingDirectory: choreo-cp-env-overlay

  - script: |
      echo "Committing the changes"
      git add .
      git commit -m "Create new env branch"

      echo "Pushing the new branch to the upstream repository"
      git push origin ${{ parameters.NEW_BRANCH }}
    displayName: 'Commit changes and push new branch'
    workingDirectory: choreo-cp-env-overlay

  - script: |
      echo "Checking out the ${{ parameters.BASE_BRANCH }}-ci branch"
      git checkout ${{ parameters.BASE_BRANCH }}-ci

      echo "Creating new branch ${{ parameters.NEW_BRANCH }}-ci from ${{ parameters.BASE_BRANCH }}-ci"
      git checkout -b ${{ parameters.NEW_BRANCH }}-ci
    displayName: 'Checkout base ci branch and create new ci branch'
    workingDirectory: choreo-cp-env-overlay

  - script: |
      # Move the folder
      git mv $(BASE_FOLDER_NAME_CP) $(NEW_FOLDER_NAME_CP)
      # Move the folder
      git mv $(BASE_FOLDER_NAME_DP) $(NEW_FOLDER_NAME_DP)
    displayName: 'Rename overlay folders'
    workingDirectory: choreo-cp-env-overlay

  - script: |
      echo "Committing the changes"
      git add .
      git commit -m "Create new env ci branch"
      echo "Pushing the new branch ci to the upstream repository"
      git push origin ${{ parameters.NEW_BRANCH }}-ci
    displayName: 'Commit changes and push new ci branch'
    workingDirectory: choreo-cp-env-overlay

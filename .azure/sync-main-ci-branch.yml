resources:
  repositories:
    - repository: BASE_REPOSITORY
      type: github
      name: wso2-enterprise/choreo-control-plane
      ref: refs/heads/main
      endpoint: choreo-cicd-committer

trigger:
  batch: true
  branches:
    include:
    - main

pr: none

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: sync
  displayName: Sync
  steps:
  - checkout: BASE_REPOSITORY
    persistCredentials: true
  - script: |
      git config --global user.email "choreo-cicd@wso2.com"
      git config --global user.name "Choreo CI Agent"
      git checkout origin/main-ci
      echo "git status"
      git status
      echo "git merge --no-edit --strategy recursive --strategy-option theirs origin/main"
      git merge --no-edit --strategy recursive --strategy-option theirs origin/main
      git push origin HEAD:main-ci
    displayName: 'Sync main-ci branch with main'

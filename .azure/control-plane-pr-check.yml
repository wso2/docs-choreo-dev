resources:
  repositories:
    - repository: TEMPLATE_REPOSITORY
      type: github
      name: wso2-enterprise/choreo-common-pipeline-templates
      ref: refs/heads/main
      endpoint: choreo-cicd

trigger: none

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self
  - checkout: TEMPLATE_REPOSITORY
  - template: install/install-kustomize.yml@TEMPLATE_REPOSITORY
  - template: install/install-kapp.yml@TEMPLATE_REPOSITORY
  - template: templates/run-kustomize-build.yml
    parameters:
      BRANCH_NAME: 'dev'
      AZURE_SUBSCRIPTION: 'choreo-dev-aks-rg'
      AKS_RESOURCE_GROUP: 'choreo-dev-aks-rg'
      AKS_CLUSTER_NAME: 'choreo-dev-ctrl-plane-aks-cluster'
      APP_NAME: 'choreo-dev-replica'
      BASE_KUSTOMIZATION_FILE: 'dev/component-overlay/base/kustomization.yaml'
  - template: templates/run-kustomize-build.yml
    parameters:
      BRANCH_NAME: 'stage'
      AZURE_SUBSCRIPTION: 'choreo-stg-aks-rg'
      AKS_RESOURCE_GROUP: 'choreo-stg-aks-rg'
      AKS_CLUSTER_NAME: 'choreo-stg-ctrl-plane-aks-cluster'
      APP_NAME: 'choreo-stage-replica'
      BASE_KUSTOMIZATION_FILE: 'stage/base/kustomization.yaml'
  - template: templates/run-kustomize-build.yml
    parameters:
      BRANCH_NAME: 'prod'
      AZURE_SUBSCRIPTION: 'choreo-prod-aks-rg'
      AKS_RESOURCE_GROUP: 'choreo-prod-aks-rg'
      AKS_CLUSTER_NAME: 'choreo-prod-ctrl-plane-aks-cluster'
      APP_NAME: 'choreo-prod-replica'
      BASE_KUSTOMIZATION_FILE: 'prod/base/kustomization.yml'

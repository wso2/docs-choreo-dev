schedules:
- cron: "0 1 * * 1"
  displayName: Every Monday at 1 AM
  branches:
    include:
    - main
  always: true

trigger: none

pr: none

stages:
  - stage: emailGeneration
    displayName: 'Email the debug log count details'
    jobs:
    - job: EmailLogCounts
      displayName: 'Emailing Log Counts'
      steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec:  '3.9'
        displayName: 'Use Python 3.9'
      - script: python3 -m pip install --upgrade pip setuptools wheel
        displayName: 'Install tools'
      - script: |
          pip install -r requirements_email.txt
          pip install azure-kusto-data
        displayName: 'Install requirements'
      - script: |
          echo "Generating Image files and Emailing"
          python3 scripts/lawQueryExecutor.py
          python3 scripts/emailGenerator.py
        env:
          EMAIL_USER: $(EMAIL_USR)
          EMAIL_PASSWORD: $(EMAIL_PS)
          LOG_WORKSPACE_ID_PROD: $(LAW_ID_PROD)
          LOG_WORKSPACE_ID_STG: $(LAW_ID_STG)
          AZURE_CLIENT_ID: $(CLIENT_ID)
          AZURE_CLIENT_SECRET: $(CLIENT_SECRET)
          AZURE_TENANT_ID: $(TENANT_ID)
        displayName: 'Generate Diagrams and Emailing'

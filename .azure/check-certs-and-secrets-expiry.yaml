schedules:
  - cron: "0 2 * * 1"
    displayName: Every Monday at 730AM (IST)
    branches:
      include:
        - main
    always: true

trigger: none
pr: none

pool: choreo-shared-azuredevops-vmss

variables:
  - group: pe-automation-certs-and-secrets-expiry-alert

jobs:
  - job: CheckCertsAndSecretsExpiry
    timeoutInMinutes: 0
    steps:
      - script: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az --version
        displayName: 'Install Azure CLI'
      - script: ./get_expiring_certs_and_secrets.sh
        displayName: Get expiring certs and secrets
        workingDirectory: .azure/src/certs-and-secrets
        env:
          CLIENT_ID: $(KV-ACCESS-AD-APP-CLIENT-ID)
          CLIENT_SECRET: $(KV-ACCESS-AD-APP-CLIENT-SECRET)
          TENANT_ID: da76d684-740f-4d94-8717-9d5fb21dd1f9
          OUTPUT_PATH: $(Build.ArtifactStagingDirectory)
          BUILD_URL: "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=artifacts&pathAsName=false&type=publishedArtifacts"
          WEBHOOK_URL: $(CERT-EXPIRY-ALERT-WEBHOOK-URL)
      - task: PublishPipelineArtifact@1
        condition: succeeded()
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)
          artifact: output
          publishLocation: 'pipeline'

# Suppressed Checks
# CKV_K8S_14 - Image Tag Should be Fixed - Not Latest or Blank
# CKV_K8S_15 - Image Pull Policy should be Always
# CKV_K8S_35 - Prefer using secrets as files over secrets as environment variables
# CKV_K8S_43 - Image should use digest

resources:
  repositories:
    - repository: TEMPLATE_REPOSITORY
      type: github
      name: wso2-enterprise/choreo-common-pipeline-templates
      ref: refs/heads/main
      endpoint: wso2-enterprise
    - repository: OVERLAY_REPOSITORY
      type: github
      name: wso2-enterprise/choreo-cp-env-overlay
      ref: refs/heads/dev-ci
      endpoint: wso2-enterprise
    - repository: CLOUD_SRE
      type: github
      name: wso2-enterprise/cloud-sre-common
      ref: refs/heads/main
      endpoint: choreo-cicd-committer

trigger: none
variables:
  - group: dev-deployment

pr:
  branches:
    include:
      - 'main'
  paths:
    include:
      - helm
      - kustomize
      - .azure/choreo-cp-checkov-k8s.yml

pool:
  vmImage: ubuntu-latest

stages:
  - stage: kustomize
    displayName: 'Run Kustomize checks'
    jobs:
      - job: Initialize
        steps:
          - checkout: self
          - checkout: OVERLAY_REPOSITORY
          - template: templates/calculate-changes.yaml
            parameters:
              PIPELINE_DEFINITION: '.azure/choreo-cp-checkov-k8s.yml'
          - template: templates/generate-artifacts.yaml
            parameters:
              overlays:
                - dev-control-plane
                - dev-dataplane-eu
                - dev-dataplane-us
                - growth-hacking
      - job: CheckovBase
        dependsOn: Initialize
        condition: succeeded()
        steps:
          - template: install/install-checkov.yaml@TEMPLATE_REPOSITORY
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: k8s-artifacts
              targetPath: $(Build.ArtifactStagingDirectory)
          - script: |
              set -eo pipefail
              mkdir -p dev-control-plane && mv dev-control-plane.yaml dev-control-plane/
              mkdir -p growth-hacking && mv growth-hacking.yaml growth-hacking/
              mkdir -p dev-dataplane-eu && mv dev-dataplane-eu.yaml dev-dataplane-eu/
              mkdir -p dev-dataplane-us && mv dev-dataplane-us.yaml dev-dataplane-us/

              mapfile -t dirs < <(ls)
              for dir in "${dirs[@]}"; do
                echo "[INFO] Processing $dir"
                cd "$dir"
                yq -s '"file_" + $index' "$dir".yaml
                rm "$dir".yaml
                checkov -d . --framework kubernetes --quiet
                cd -
              done
            displayName: Split the files and run checkov
            workingDirectory: $(Build.ArtifactStagingDirectory)

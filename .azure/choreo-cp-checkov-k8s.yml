resources:
  repositories:
  - repository: TEMPLATE_REPOSITORY
    type: github
    name: wso2-enterprise/choreo-common-pipeline-templates
    ref: refs/heads/main
    endpoint: choreo-cicd

trigger: none

pr:
  branches:
    include:
    - 'main'

pool:
  vmImage: ubuntu-latest

steps:
- template: install/install-kustomize.yml@TEMPLATE_REPOSITORY
- script: |
    set -eo pipefail
    cd kustomize
    mkdir build
    $KUSTOMIZE build base | tee build/kustomize-all.yml
  displayName: 'Generate k8s artifacts'
- script: |
    echo "Running Checkov Scan!"
    sudo apt-get install python3.7
    pip3 install --upgrade pip && pip3 install --upgrade setuptools
    pip3 install dataclasses
    pip3 install checkov
    /home/vsts/.local/bin/checkov -f kustomize/build/kustomize-all.yml --framework kubernetes --skip-check CKV_K8S_14,CKV_K8S_15,CKV_K8S_22,CKV_K8S_35
    echo "--------------- Checkov Scan Completed ---------------"
    echo "Note: The scan results are suppressed until the issues are fixed."
  displayName: 'Kustomize code scan using Checkov'

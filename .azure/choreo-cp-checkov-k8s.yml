# Suppressed Checks
# CKV_K8S_14 - Image Tag Should be Fixed - Not Latest or Blank
# CKV_K8S_15 - Image Pull Policy should be Always
# CKV_K8S_35 - Prefer using secrets as files over secrets as environment variables
# CKV_K8S_43 - Image should use digest

resources:
  repositories:
  - repository: TEMPLATE_REPOSITORY
    type: github
    name: wso2-enterprise/choreo-common-pipeline-templates
    ref: refs/heads/main
    endpoint: wso2-enterprise
  - repository: templates
    type: github
    name: wso2-enterprise/azure-pipeline-templates
    ref: refs/heads/dev
    endpoint: wso2-enterprise

trigger: none

pr:
  branches:
    include:
    - 'main'

pool:
  vmImage: ubuntu-latest

stages:
- stage: kustomize
  displayName: 'Run Kustomize checks'
  jobs:
  - job: kustomize
    pool: 
      vmImage: ubuntu-latest
    steps:
      - template: install/install-kustomize.yml@TEMPLATE_REPOSITORY
      - script: |
          set -eo pipefail
          cd kustomize/base
          mkdir build
          $KUSTOMIZE build . | tee build/kustomize-all.yml
        displayName: 'Generate k8s artifacts'
      - script: |
          echo "Running Checkov Scan!"
          sudo apt-get install python3.7
          pip3 install --upgrade pip && pip3 install --upgrade setuptools
          pip3 install dataclasses
          pip3 install checkov
          /home/vsts/.local/bin/checkov -f kustomize/base/build/kustomize-all.yml --framework kubernetes \
          --skip-check CKV_K8S_14,CKV_K8S_15,CKV_K8S_35,CKV_K8S_43
        displayName: 'Kustomize code scan using Checkov'
- stage: helmforlinkerd
  dependsOn: []
  displayName: 'Run Helm checks for LinkerD'
  jobs:
  - template: cd-pipelines/templates/static-scan-helm.yaml@templates
    parameters:
      HELM_CHART_NAME: 'setup/azure/custom-helm-charts/linkerd-dashboard-ingress'
      HELM_INPUT_VALUES: 'azure.database.server=azure_database_server'
      CHECKOV_SUPPRESSIONS: 'CKV_K8S_14,CKV_K8S_15,CKV_K8S_35,CKV_K8S_43'
- stage: helmforlinkerdviz
  dependsOn: []
  displayName: 'Run Helm checks for LinkerD viz'
  jobs:
  - template: cd-pipelines/templates/static-scan-helm.yaml@templates
    parameters:
      HELM_CHART_NAME: 'setup/azure/custom-helm-charts/linkerd-viz-persistent-prometheus'
      HELM_INPUT_VALUES: 'azure.database.server=azure_database_server'
      CHECKOV_SUPPRESSIONS: 'CKV_K8S_14,CKV_K8S_15,CKV_K8S_35,CKV_K8S_43'
- stage: helmfordatabases
  dependsOn: []
  displayName: 'Run Helm checks for databases'
  jobs:
  - template: cd-pipelines/templates/static-scan-helm.yaml@templates
    parameters:
      HELM_CHART_NAME: 'databases'
      HELM_INPUT_VALUES: 'azure.database.server=azure_database_server'
      CHECKOV_SUPPRESSIONS: 'CKV_K8S_14,CKV_K8S_15,CKV_K8S_35,CKV_K8S_43'

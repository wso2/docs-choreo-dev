# Suppressed Checks
# CKV_K8S_14 - Image Tag Should be Fixed - Not Latest or Blank
# CKV_K8S_15 - Image Pull Policy should be Always
# CKV_K8S_35 - Prefer using secrets as files over secrets as environment variables
# CKV_K8S_43 - Image should use digest

resources:
  repositories:
  - repository: TEMPLATE_REPOSITORY
    type: github
    name: wso2-enterprise/choreo-common-pipeline-templates
    ref: refs/heads/main
    endpoint: wso2-enterprise
  - repository: templates
    type: github
    name: wso2-enterprise/azure-pipeline-templates
    ref: refs/tags/v1.1.1
    endpoint: choreo-cicd-committer

trigger: none

pr:
  branches:
    include:
    - 'main'

pool:
  vmImage: ubuntu-latest

stages:
- stage: kustomize
  displayName: 'Run Kustomize checks'
  jobs:
  - job: CalculateChanges
    steps:
      - script: |
          changedFiles=$(git diff --name-only HEAD origin/main)
          printf "Changed files:\n%s\n" "${changedFiles}"
          echo "##vso[task.setvariable variable=runAllChecks;isOutput=true]false"
          echo "##vso[task.setvariable variable=runBillingConsoleChecks;isOutput=true]false"
          echo "##vso[task.setvariable variable=runBaseChecks;isOutput=true]false"
          echo "##vso[task.setvariable variable=runDPChecks;isOutput=true]false"
          echo "##vso[task.setvariable variable=runRoutingChecks;isOutput=true]false"
          echo "##vso[task.setvariable variable=runWorkspaceChecks;isOutput=true]false"
          
          for file in ${changedFiles}; do
            if [[ "${file}" = ".azure/choreo-cp-checkov-k8s.yml" ]]; then
              echo "##vso[task.setvariable variable=runAllChecks;isOutput=true]true"
              break
            fi
            if [[ "${file}" = "kustomize/base/"* ]]; then
              echo "##vso[task.setvariable variable=runBaseChecks;isOutput=true]true"
            fi
            if [[ "${file}" = "kustomize/dataplane/"* ]]; then
              echo "##vso[task.setvariable variable=runDPChecks;isOutput=true]true"
            fi
            if [[ "${file}" = "kustomize/routing/"* ]]; then
              echo "##vso[task.setvariable variable=runRoutingChecks;isOutput=true]true"
            fi
            if [[ "${file}" = "kustomize/workspace/"* ]]; then
              echo "##vso[task.setvariable variable=runWorkspaceChecks;isOutput=true]true"
            fi
          done
        name: DetermineRun
  - job: CheckovBase
    dependsOn: CalculateChanges
    condition: >-
      or(eq(dependencies.CalculateChanges.outputs['DetermineRun.runBaseChecks'], 'true'),
      eq(dependencies.CalculateChanges.outputs['DetermineRun.runAllChecks'], 'true'))
    steps:
      - template: install/install-kustomize.yml@TEMPLATE_REPOSITORY
      - template: install/install-checkov.yaml@TEMPLATE_REPOSITORY
      - template: run-checkov-k8s.yaml@TEMPLATE_REPOSITORY
        parameters:
          KUSTOMIZE_DIRECTORY: 'base'
          WORKING_DIR: $(Build.SourcesDirectory)/kustomize
  - job: CheckovDataplane
    dependsOn: CalculateChanges
    condition: >-
      or(eq(dependencies.CalculateChanges.outputs['DetermineRun.runDPChecks'], 'true'),
      eq(dependencies.CalculateChanges.outputs['DetermineRun.runAllChecks'], 'true'))
    steps:
      - template: install/install-kustomize.yml@TEMPLATE_REPOSITORY
      - template: install/install-checkov.yaml@TEMPLATE_REPOSITORY
      - template: run-checkov-k8s.yaml@TEMPLATE_REPOSITORY
        parameters:
          KUSTOMIZE_DIRECTORY: 'dataplane'
          WORKING_DIR: $(Build.SourcesDirectory)/kustomize
  - job: CheckovRouting
    dependsOn: CalculateChanges
    condition: >-
      or(eq(dependencies.CalculateChanges.outputs['DetermineRun.runRoutingChecks'], 'true'),
      eq(dependencies.CalculateChanges.outputs['DetermineRun.runAllChecks'], 'true'))
    steps:
      - template: install/install-kustomize.yml@TEMPLATE_REPOSITORY
      - template: install/install-checkov.yaml@TEMPLATE_REPOSITORY
      - template: run-checkov-k8s.yaml@TEMPLATE_REPOSITORY
        parameters:
          KUSTOMIZE_DIRECTORY: 'routing'
          WORKING_DIR: $(Build.SourcesDirectory)/kustomize
  - job: CheckovWorkspace
    dependsOn: CalculateChanges
    condition: >-
      or(eq(dependencies.CalculateChanges.outputs['DetermineRun.runWorkspaceChecks'], 'true'),
      eq(dependencies.CalculateChanges.outputs['DetermineRun.runAllChecks'], 'true'))
    steps:
      - template: install/install-kustomize.yml@TEMPLATE_REPOSITORY
      - template: install/install-checkov.yaml@TEMPLATE_REPOSITORY
      - template: run-checkov-k8s.yaml@TEMPLATE_REPOSITORY
        parameters:
          KUSTOMIZE_DIRECTORY: 'workspace'
          WORKING_DIR: $(Build.SourcesDirectory)/kustomize
- stage: helmforlinkerd
  dependsOn: []
  displayName: 'Run Helm checks for LinkerD'
  jobs:
  - template: cd-pipelines/templates/static-scan-helm.yaml@templates
    parameters:
      HELM_CHART_NAME: 'setup/azure/custom-helm-charts/linkerd-dashboard-ingress'
      HELM_INPUT_VALUES: 'azure.database.server=azure_database_server'
      CHECKOV_SUPPRESSIONS: 'CKV_K8S_14,CKV_K8S_15,CKV_K8S_35,CKV_K8S_43'
- stage: helmforlinkerdviz
  dependsOn: []
  displayName: 'Run Helm checks for LinkerD viz'
  jobs:
  - template: cd-pipelines/templates/static-scan-helm.yaml@templates
    parameters:
      HELM_CHART_NAME: 'setup/azure/custom-helm-charts/linkerd-viz-persistent-prometheus'
      HELM_INPUT_VALUES: 'azure.database.server=azure_database_server'
      CHECKOV_SUPPRESSIONS: 'CKV_K8S_14,CKV_K8S_15,CKV_K8S_35,CKV_K8S_43'
- stage: helmfordatabases
  dependsOn: []
  displayName: 'Run Helm checks for databases'
  jobs:
  - template: cd-pipelines/templates/static-scan-helm.yaml@templates
    parameters:
      HELM_CHART_NAME: 'databases'
      HELM_INPUT_VALUES: 'azure.database.server=azure_database_server'
      CHECKOV_SUPPRESSIONS: 'CKV_K8S_14,CKV_K8S_15,CKV_K8S_35,CKV_K8S_43'

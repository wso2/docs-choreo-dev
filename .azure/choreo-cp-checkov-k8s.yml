# Suppressed Checks
# CKV_K8S_14 - Image Tag Should be Fixed - Not Latest or Blank
# CKV_K8S_15 - Image Pull Policy should be Always
# CKV_K8S_35 - Prefer using secrets as files over secrets as environment variables
# CKV_K8S_43 - Image should use digest

resources:
  repositories:
  - repository: TEMPLATE_REPOSITORY
    type: github
    name: wso2-enterprise/choreo-common-pipeline-templates
    ref: refs/heads/main
    endpoint: wso2-enterprise
  - repository: OVERLAY_REPOSITORY
    type: github
    name: wso2-enterprise/choreo-cp-env-overlay
    ref: refs/heads/dev-ci
    endpoint: wso2-enterprise
  - repository: CLOUD_SRE
    type: github
    name: wso2-enterprise/cloud-sre-common
    ref: refs/heads/main
    endpoint: choreo-cicd-committer

trigger: none
variables:
  - group: dev-deployment

pr:
  branches:
    include:
    - 'main'

pool:
  vmImage: ubuntu-latest

stages:
- stage: kustomize
  displayName: 'Run Kustomize checks'
  jobs:
  - job: CalculateChanges
    steps:
      - template: templates/calculate-changes.yaml
        parameters:
          PIPELINE_DEFINITION: '.azure/choreo-cp-checkov-k8s.yml'
      - template: templates/generate-artifacts.yaml
        parameters:
          overlays:
            - dev-control-plane
            - dev-dataplane-eu-cilium
            - dev-dataplane-eu
            - dev-dataplane-us-cilium
            - dev-dataplane
            - dev-routing-eu
            - dev-routing
  - job: CheckovBase
    dependsOn: CalculateChanges
    condition: >-
      or(eq(dependencies.CalculateChanges.outputs['DetermineRun.runCPPRCheck'], 'true'),
      eq(dependencies.CalculateChanges.outputs['DetermineRun.runAllChecks'], 'true'))
    steps:
      - task: DownloadPipelineArtifact@2
        inputs:
          artifact: k8s-artifacts
          targetPath: $(Build.ArtifactStagingDirectory)
      - template: pr/run-checkov.yaml@TEMPLATE_REPOSITORY
        parameters:
          file_path: $(Build.ArtifactStagingDirectory)/dev-control-plane.yaml
  - job: CheckovDataplane
    dependsOn: CalculateChanges
    condition: >-
      or(eq(dependencies.CalculateChanges.outputs['DetermineRun.runDataplanePRCheck'], 'true'),
      eq(dependencies.CalculateChanges.outputs['DetermineRun.runAllChecks'], 'true'))
    steps:
      - task: DownloadPipelineArtifact@2
        inputs:
          artifact: k8s-artifacts
          targetPath: $(Build.ArtifactStagingDirectory)
      - template: pr/run-checkov.yaml@TEMPLATE_REPOSITORY
        parameters:
          file_path: $(Build.ArtifactStagingDirectory)/dev-dataplane-eu-cilium.yaml
          optional_display_name_suffix: "(EU-Cilium)"
      - template: pr/run-checkov.yaml@TEMPLATE_REPOSITORY
        parameters:
          file_path: $(Build.ArtifactStagingDirectory)/dev-dataplane-eu.yaml
          optional_display_name_suffix: "(EU)"
      - template: pr/run-checkov.yaml@TEMPLATE_REPOSITORY
        parameters:
          file_path: $(Build.ArtifactStagingDirectory)/dev-dataplane-us-cilium.yaml
          optional_display_name_suffix: "(US-Cilium)"
      - template: pr/run-checkov.yaml@TEMPLATE_REPOSITORY
        parameters:
          file_path: $(Build.ArtifactStagingDirectory)/dev-dataplane.yaml
          optional_display_name_suffix: "(US)"
  - job: CheckovRouting
    dependsOn: CalculateChanges
    condition: >-
      or(eq(dependencies.CalculateChanges.outputs['DetermineRun.runRoutingClusterPRCheck'], 'true'),
      eq(dependencies.CalculateChanges.outputs['DetermineRun.runAllChecks'], 'true'))
    steps:
      - task: DownloadPipelineArtifact@2
        inputs:
          artifact: k8s-artifacts
          targetPath: $(Build.ArtifactStagingDirectory)
      - template: pr/run-checkov.yaml@TEMPLATE_REPOSITORY
        parameters:
          file_path: $(Build.ArtifactStagingDirectory)/dev-routing-eu.yaml
          optional_display_name_suffix: "(EU)"
      - template: pr/run-checkov.yaml@TEMPLATE_REPOSITORY
        parameters:
          file_path: $(Build.ArtifactStagingDirectory)/dev-routing.yaml
          optional_display_name_suffix: "(US)"
  - job: CheckovforHelm
    dependsOn: CalculateChanges
    condition: eq(dependencies.CalculateChanges.outputs['DetermineRun.runHelmChecks'], 'true')
    steps:
      - template: install/install-helm.yaml@TEMPLATE_REPOSITORY
      - template: install/install-checkov.yaml@TEMPLATE_REPOSITORY
      - script: |
          helm template setup/azure/custom-helm-charts/linkerd-dashboard-ingress \
            --set azure.database.server=azure_database_server >> linkerd-dashboard-ingress.yaml
          helm template setup/azure/custom-helm-charts/linkerd-viz-persistent-prometheus \
            --set azure.database.server=azure_database_server >> linkerd-viz-persistent-prometheus.yaml
          helm template databases \
            --set azure.database.server=azure_database_server >> databases.yaml
        displayName: Generate Helm templates
      - template: pr/run-checkov.yaml@TEMPLATE_REPOSITORY
        parameters:
          file_path: linkerd-dashboard-ingress.yaml
          optional_display_name_suffix: "(linkerd-dashboard-ingress)"
      - template: pr/run-checkov.yaml@TEMPLATE_REPOSITORY
        parameters:
          file_path: linkerd-viz-persistent-prometheus.yaml
          optional_display_name_suffix: "(linkerd-viz-persistent-prometheus)"
          checkov_suppressions: "CKV_K8S_14,CKV_K8S_15,CKV_K8S_31,CKV_K8S_35,CKV_K8S_43,CKV2_K8S_6"
      - template: pr/run-checkov.yaml@TEMPLATE_REPOSITORY
        parameters:
          file_path: databases.yaml
          optional_display_name_suffix: "(databases)"

resources:
  webhooks:
    - webhook: ImageUpdateTrigger
      connection: system-image-update-trigger-connection
  repositories:
    - repository: TEMPLATE_REPOSITORY
      type: github
      name: wso2-enterprise/choreo-common-pipeline-templates
      ref: refs/heads/main
      endpoint: wso2-enterprise
    - repository: BASE_REPOSITORY
      type: github
      name: wso2-enterprise/choreo-control-plane
      ref: refs/heads/main-ci
      endpoint: choreo-cicd-committer

trigger: none

pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: BASE_REPOSITORY
    persistCredentials: true
  - template: install/install-kustomize.yml@TEMPLATE_REPOSITORY
  - script: |
      update_images () {
        echo "Updating image tags"
        for imageName in $@; do
          echo "Updating image tag for $imageName"
          $KUSTOMIZE edit set image "$imageName"
        done

        if [ -n "${{ parameters.ImageUpdateTrigger.updatedConfigs }}" ]
        then
          update_configs
        else
          echo "No configs to update"
        fi
      }

      update_cdn_versions () {
        echo "Updating cdn-based component versions"
        for component in "$@"; do
          IFS=':' read -ra arr <<<"$component" && unset IFS
          # Prepending a '.' to the component name
          arr[0]=${arr[0]/#/.}

          # Update the version file
          name=${arr[0]} version=${arr[1]} yq -i 'eval(env(name)) = env(version)' versions.yaml
        done
      }

      update_configs () {
        updatedConfigs="${{ parameters.ImageUpdateTrigger.updatedConfigs }}"
        echo "$updatedConfigs"
        envFileName='common-env-variables.yaml'

        trimmedUpdatedConfigs=${updatedConfigs//$'\n'/}
        echo "Configs : $trimmedUpdatedConfigs"
        echo "$trimmedUpdatedConfigs" | tr ',' '\n' | while read updatingConfig; do
          IFS='=' read -ra config <<< "$updatingConfig"
          echo "Updating ${config[0]} config to ${config[1]}"
          count=$(grep -c "^${config[0]}=" "$envFileName" || true)
          if [[ "$count" -gt 0 ]]
          then
            sed -i "s#^${config[0]}.*#${config[0]}=${config[1]}#" "$envFileName"
          else
            echo "Failing the build because config ${config[0]} is not found in $envFileName"
            exit 1
          fi
        done
      }

      update_multi_cluster_images () {
        clusters=$(echo "$1" | jq -r 'keys[]')
        echo "$clusters"
        BASEPATH=${PWD}
        for cluster in $clusters; do
          change_dir "$cluster"
          UpdatedImages=$(echo "$1" | jq -r .$cluster[])
          echo "$UpdatedImages"

          if [ "$cluster" != "cdn" ]; then
            update_images "$UpdatedImages"
          else
            update_cdn_versions "$UpdatedImages"
          fi
        done
      }

      # Change directory based on the cluster
      change_dir () {
        if [ "$1" = "controlplane" ]; then
          echo "Updating image for controlplane"
          cd "${BASEPATH}"/kustomize/base-ci

        elif [ "$1" = "dataplane" ]; then
          echo "Updating image for dataplane"
          cd "${BASEPATH}"/kustomize/dataplane-ci

        elif [ "$1" = "runners" ]; then
          echo "Updating image for runners"
          cd "${BASEPATH}"/kustomize/runners-ci

        elif [ "$1" = "privatedataplane" ]; then
          echo "Updating image for private dataplane"
          cd "${BASEPATH}"/kustomize/private-dataplane-ci

        elif [ "$1" = "routing" ]; then
          echo "Updating image for routing"
          cd "${BASEPATH}"/kustomize/routing-ci

        elif [ "$1" = "combineddp" ]; then
          echo "Updating image for controlplane(common namespaces)"
          cd "${BASEPATH}"/kustomize/combined-dataplane-ci

        elif [ "$1" = "commonnamespacescombineddp" ]; then
          echo "Updating image for controlplane(common namespaces)"
          cd "${BASEPATH}"/kustomize/common-namespaces-combined-dataplane-ci

        elif [ "$1" = "commonnamespacescp" ]; then
          echo "Updating image for controlplane(common namespaces)"
          cd "${BASEPATH}"/kustomize/common-namespaces-controlplane-ci

        elif [ "$1" = "commonnamespacesdp" ]; then
          echo "Updating image for dataplane(common namespaces)"
          cd "${BASEPATH}"/kustomize/common-namespaces-dataplane-ci

        elif [ "$1" = "commonnamespacesrouting" ]; then
          echo "Updating image for routing(common namespaces)"
          cd "${BASEPATH}"/kustomize/common-namespaces-routing-ci

        elif [ "$1" = "sharedcc" ]; then
          echo "Updating images in choreo connect"
          cd "${BASEPATH}"/kustomize/shared-components-ci/choreo-connect-partitions

        elif [ "$1" = "privatega" ]; then
            echo "Updating images in private global adapter"
            cd "${BASEPATH}"/kustomize/shared-components-ci/private-global-adapter

        elif [ "$1" = "cdn" ]; then
          echo "Updating versions in CDN components"
          cd "${BASEPATH}"/cdn

        elif [ "$1" = "growthhacking" ]; then
          echo "Updating image for growth hacking"
          cd "${BASEPATH}"/kustomize/growth-hacking-ci

        else
          echo "Invalid cluster name"
          exit 1
        fi
      }

      push_git_changers () {
        git config --global user.email "choreo-cicd@wso2.com"
        git config --global user.name "Choreo CI Agent"
        git diff
        git commit -am "Update image tags in $(Build.BuildNumber)"
        git remote -v
        git branch -al
        if git push origin HEAD:$(Build.SourceBranchName) ; then
          echo "Changes pushed successfully"
        else
          git fetch origin
          git merge --no-edit --strategy recursive --strategy-option theirs origin/$(Build.SourceBranchName)
          git push origin HEAD:$(Build.SourceBranchName)
        fi
      }

      echo "Pipeline triggered from a webhook"
      # Checks if the `updatedImageMap` array is empty
      # The first condition checks if the `updatedImageMap` is assigned
      # The second confition checks if the `updatedImageMap` array is empty
      # $(echo "W10K" | base64 -d) = []
      if [ -n "${{ parameters.ImageUpdateTrigger.updatedImageMap }}" ] && [ "${{ parameters.ImageUpdateTrigger.updatedImageMap }}" != "W10K" ]; then
        encodedImagePayload="${{ parameters.ImageUpdateTrigger.updatedImageMap }}"
        trimmedEncodedImagePayload=${encodedImagePayload//$'\n'/}
        decodedImagePayload=$(echo "$trimmedEncodedImagePayload" | base64 --decode)
        update_multi_cluster_images "$decodedImagePayload"
      elif [ -n "${{ parameters.ImageUpdateTrigger.updatedImages }}" ]; then
        encodedImagePayload="${{ parameters.ImageUpdateTrigger.updatedImages }}"
        trimmedEncodedImagePayload=${encodedImagePayload//$'\n'/}
        decodedImagePayload=$(echo "$trimmedEncodedImagePayload" | base64 --decode)
        cluster="${{ parameters.ImageUpdateTrigger.clusterName }}"
        BASEPATH=${PWD}
        change_dir "$cluster"
        UpdatedImages=$(echo "$decodedImagePayload" | jq -r .[])

        if [ "$cluster" != "cdn" ]; then
          update_images "$UpdatedImages"
        else
          update_cdn_versions "$UpdatedImages"
        fi
      elif [ -n "${{ parameters.ImageUpdateTrigger.updatedConfigs }}" ]; then
        cluster="${{ parameters.ImageUpdateTrigger.clusterName }}"
        BASEPATH=${PWD}
        change_dir "$cluster"
        update_configs
      else
        echo "No changes to update"
      fi

      push_git_changers
    displayName: 'Update image latest tags'

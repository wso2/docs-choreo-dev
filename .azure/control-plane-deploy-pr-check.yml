resources:
  repositories:
    - repository: TEMPLATE_REPOSITORY
      type: github
      name: wso2-enterprise/choreo-common-pipeline-templates
      ref: refs/heads/main
      endpoint: wso2-enterprise
    - repository: OVERLAY_REPOSITORY
      type: github
      name: wso2-enterprise/choreo-cp-env-overlay
      endpoint: wso2-enterprise

trigger: none

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self
  - checkout: TEMPLATE_REPOSITORY
  - template: install/install-kustomize.yml@TEMPLATE_REPOSITORY
  - template: install/install-kapp.yml@TEMPLATE_REPOSITORY
  - template: templates/run-build.yml
    parameters:
      BRANCH_NAME: 'dev'
      AZURE_SUBSCRIPTION: 'choreo-dev-aks-rg'
      AKS_RESOURCE_GROUP: 'choreo-dev-aks-rg'
      AKS_CLUSTER_NAME: 'choreo-dev-ctrl-plane-aks-cluster'
      APP_NAME: 'choreo-dev-replica'
      BASE_KUSTOMIZATION_FILE: 'kustomize/dev/component-overlay/base/kustomization.yaml'

resources:
  repositories:
    - repository: TEMPLATE_REPOSITORY
      type: github
      name: wso2-enterprise/choreo-common-pipeline-templates
      ref: refs/heads/main
      endpoint: wso2-enterprise
    - repository: OVERLAY_REPOSITORY
      type: github
      name: wso2-enterprise/choreo-cp-env-overlay
      ref: refs/heads/dev-ci
      endpoint: wso2-enterprise

trigger: none

pr:
  branches:
    include:
      - main

variables:
  - name: runOldCpPRCheck
    value: false
  - name: runDataplanePRCheck
    value: false
  - name: runDataplaneE2PRCheck
    value: false
  - name: runRoutingClusterPRCheck
    value: false
  - name: runWorkspaceClusterPRCheck
    value: false

stages:
  - stage: DecideChecks
    displayName: 'Calculating Changes'
    jobs:
      - job: DecideCheckJob
        steps:
          - checkout: self
          - script: |
              currentVersion=$(git show | grep commit | cut -c 7-46 | awk '{$1=$1};1')
              git checkout main
              originVersion=$(git show | grep commit | cut -c 7-46 | awk '{$1=$1};1')
              changedFiles=$(git diff --name-only "${currentVersion}" "${originVersion}")
              printf "Changed files\n%s\n" "${changedFiles}"

              echo "##vso[task.setvariable variable=runAllChecks;isOutput=true]false"
              echo "##vso[task.setvariable variable=runOldCpPRCheck;isOutput=true]false"
              echo "##vso[task.setvariable variable=runDataplanePRCheck;isOutput=true]false"
              echo "##vso[task.setvariable variable=runRoutingClusterPRCheck;isOutput=true]false"
              echo "##vso[task.setvariable variable=runWorkspaceClusterPRCheck;isOutput=true]false"

              for file in ${changedFiles}; do
                if [[ "${file}" = ".azure/control-plane-deploy-pr-check.yml" || "${file}" = ".azure/templates/run-build.yml" ]]; then
                  echo "##vso[task.setvariable variable=runAllChecks;isOutput=true]false"
                fi
                if [[ "${file}" = "kustomize/base"* ]]; then
                  echo "##vso[task.setvariable variable=runOldCpPRCheck;isOutput=true]true"
                fi
                if [[ "${file}" = "kustomize/dataplane"* ]]; then
                  echo "##vso[task.setvariable variable=runDataplanePRCheck;isOutput=true]true"
                fi
                if [[ "${file}" = "kustomize/routing"* ]]; then
                  echo "##vso[task.setvariable variable=runRoutingClusterPRCheck;isOutput=true]true"
                fi
                if [[ "${file}" = "kustomize/workspace"* ]]; then
                  echo "##vso[task.setvariable variable=runWorkspaceClusterPRCheck;isOutput=true]true"
                fi
              done
            name: DetermineRun
      - job: OldCPPRCheck
        pool:
          vmImage: 'ubuntu-latest'
        dependsOn: DecideCheckJob
        condition: or(eq(dependencies.DecideCheckJob.outputs['DetermineRun.runAllChecks'], 'true'), eq(dependencies.DecideCheckJob.outputs['DetermineRun.runOldCpPRCheck'], 'true'))
        steps:
          - checkout: self
          - checkout: TEMPLATE_REPOSITORY
          - template: install/install-kustomize.yml@TEMPLATE_REPOSITORY
          - template: install/install-kapp.yml@TEMPLATE_REPOSITORY
          - template: templates/run-build.yml
            parameters:
              OVERLAY_SUB_DIR: 'dev'
              AZURE_SUBSCRIPTION: 'choreo-dev-aks-rg'
              AKS_RESOURCE_GROUP: 'choreo-dev-aks-rg'
              AKS_CLUSTER_NAME: 'choreo-dev-ctrl-plane-aks-cluster'
              APP_NAME: 'choreo-dev-replica'
              BASE_KUSTOMIZATION_FILE: 'kustomize/dev/component-overlay/base/kustomization.yaml'
      - job: DataplanePRCheck
        pool: choreo-dev-scale-set-agents
        dependsOn: DecideCheckJob
        condition: or(eq(dependencies.DecideCheckJob.outputs['DetermineRun.runAllChecks'], 'true'), eq(dependencies.DecideCheckJob.outputs['DetermineRun.runDataplanePRCheck'], 'true'))
        steps:
          - checkout: self
          - checkout: TEMPLATE_REPOSITORY
          - template: install/install-kustomize.yml@TEMPLATE_REPOSITORY
          - template: install/install-kapp.yml@TEMPLATE_REPOSITORY
          - template: install/install-az-cli.yaml@TEMPLATE_REPOSITORY
          - template: templates/run-build.yml
            parameters:
              OVERLAY_SUB_DIR: 'dev-dataplane'
              AZURE_SUBSCRIPTION: 'choreo-dev-aks-rg'
              AKS_RESOURCE_GROUP: 'choreo-dev-aks-rg'
              AKS_CLUSTER_NAME: 'choreo-dev-dataplane-aks-cluster'
              APP_NAME: 'choreo-dev-replica'
              BASE_KUSTOMIZATION_FILE: 'kustomize/dev-dataplane/base/kustomization.yaml'
              UPDATE_KUSTOMIZE_CI_PATH: 's/- ..\/..\/..\/..\/choreo-control-plane\/kustomize\/dataplane-ci/- ..\/..\/..\/..\/choreo-control-plane\/kustomize\/dataplane/'
      - job: DataplaneE2PRCheck
        pool: choreo-dev-scale-set-agents
        dependsOn: DecideCheckJob
        condition: or(eq(dependencies.DecideCheckJob.outputs['DetermineRun.runAllChecks'], 'true'), eq(dependencies.DecideCheckJob.outputs['DetermineRun.runDataplanePRCheck'], 'true'))
        steps:
          - checkout: self
          - checkout: TEMPLATE_REPOSITORY
          - template: install/install-kustomize.yml@TEMPLATE_REPOSITORY
          - template: install/install-kapp.yml@TEMPLATE_REPOSITORY
          - template: install/install-az-cli.yaml@TEMPLATE_REPOSITORY
          - template: templates/run-build.yml
            parameters:
              OVERLAY_SUB_DIR: 'dev-dataplane-e2'
              AZURE_SUBSCRIPTION: 'choreo-dev-aks-rg'
              AKS_RESOURCE_GROUP: 'choreo-dev-aks-rg'
              AKS_CLUSTER_NAME: 'choreo-dev-dataplane-e2-aks-cluster'
              APP_NAME: 'choreo-dev-replica'
              BASE_KUSTOMIZATION_FILE: 'kustomize/dev-dataplane-e2/base/kustomization.yaml'
              UPDATE_KUSTOMIZE_CI_PATH: 's/- ..\/..\/..\/..\/choreo-control-plane\/kustomize\/dataplane-ci/- ..\/..\/..\/..\/choreo-control-plane\/kustomize\/dataplane/'
      - job: RoutingClusterPRCheck
        pool: choreo-dev-scale-set-agents
        dependsOn: DecideCheckJob
        condition: or(eq(dependencies.DecideCheckJob.outputs['DetermineRun.runAllChecks'], 'true'), eq(dependencies.DecideCheckJob.outputs['DetermineRun.runRoutingClusterPRCheck'], 'true'))
        steps:
          - checkout: self
          - checkout: TEMPLATE_REPOSITORY
          - template: install/install-kustomize.yml@TEMPLATE_REPOSITORY
          - template: install/install-kapp.yml@TEMPLATE_REPOSITORY
          - template: install/install-az-cli.yaml@TEMPLATE_REPOSITORY
          - template: templates/run-build.yml
            parameters:
              OVERLAY_SUB_DIR: 'dev-routing'
              AZURE_SUBSCRIPTION: 'choreo-dev-aks-rg'
              AKS_RESOURCE_GROUP: 'choreo-dev-aks-rg'
              AKS_CLUSTER_NAME: 'choreo-dev-routing-aks-cluster'
              APP_NAME: 'choreo-dev-replica'
              BASE_KUSTOMIZATION_FILE: 'kustomize/dev-routing/base/kustomization.yaml'
              UPDATE_KUSTOMIZE_CI_PATH: 's/- ..\/..\/..\/..\/choreo-control-plane\/kustomize\/routing-ci/- ..\/..\/..\/..\/choreo-control-plane\/kustomize\/routing/'
      - job: WorkspaceClusterPRCheck
        pool: choreo-dev-scale-set-agents
        dependsOn: DecideCheckJob
        condition: or(eq(dependencies.DecideCheckJob.outputs['DetermineRun.runAllChecks'], 'true'), eq(dependencies.DecideCheckJob.outputs['DetermineRun.runWorkspaceClusterPRCheck'], 'true'))
        steps:
          - checkout: self
          - checkout: TEMPLATE_REPOSITORY
          - template: install/install-kustomize.yml@TEMPLATE_REPOSITORY
          - template: install/install-kapp.yml@TEMPLATE_REPOSITORY
          - template: install/install-az-cli.yaml@TEMPLATE_REPOSITORY
          - template: templates/run-build.yml
            parameters:
              OVERLAY_SUB_DIR: 'dev-workspace'
              AZURE_SUBSCRIPTION: 'choreo-dev-aks-rg'
              AKS_RESOURCE_GROUP: 'choreo-dev-aks-rg'
              AKS_CLUSTER_NAME: 'choreo-dev-workspace-aks-cluster'
              APP_NAME: 'choreo-dev-replica'
              BASE_KUSTOMIZATION_FILE: 'kustomize/dev-workspace/base/kustomization.yaml'
              UPDATE_KUSTOMIZE_CI_PATH: 's/- ..\/..\/..\/..\/choreo-control-plane\/kustomize\/workspace-ci/- ..\/..\/..\/..\/choreo-control-plane\/kustomize\/workspace/'

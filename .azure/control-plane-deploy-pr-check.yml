resources:
  repositories:
    - repository: TEMPLATE_REPOSITORY
      type: github
      name: wso2-enterprise/choreo-common-pipeline-templates
      ref: refs/heads/main
      endpoint: wso2-enterprise
    - repository: OVERLAY_REPOSITORY
      type: github
      name: wso2-enterprise/choreo-cp-env-overlay
      ref: refs/heads/dev-ci
      endpoint: wso2-enterprise

trigger: none

pr:
  branches:
    include:
      - 'main'
      - 'deprecated'

pool:
  vmImage: ubuntu-latest

variables:
  - group: dev-deployment

jobs:
  - job: Initialize
    steps:
      - checkout: self
      - checkout: OVERLAY_REPOSITORY
      - template: templates/calculate-changes.yaml
        parameters:
          PIPELINE_DEFINITION: '.azure/control-plane-deploy-pr-check.yml'
      - template: templates/generate-artifacts.yaml
        parameters:
          overlays:
            - dev-control-plane
            - dev-dataplane-eu-cilium
            - dev-dataplane-eu
            - dev-dataplane-us-cilium
            - dev-dataplane
            - dev-routing-eu
            - dev-routing
            - growth-hacking
  - job: CPPRCheck
    pool: choreo-dev-custom-cp-vmss-agents
    dependsOn: Initialize
    condition: >-
      or(eq(dependencies.Initialize.outputs['DetermineRun.runAllChecks'], 'true'),
      eq(dependencies.Initialize.outputs['DetermineRun.runCPPRCheck'], 'true'))
    steps:
      - task: DownloadPipelineArtifact@2
        inputs:
          artifact: k8s-artifacts
          targetPath: $(Build.ArtifactStagingDirectory)
      - template: install/install-kapp.yml@TEMPLATE_REPOSITORY
      - template: pr/kapp-deploy-pr.yaml@TEMPLATE_REPOSITORY
        parameters:
          RESOURCE_GROUP: choreo-dev-aks-rg
          CLUSTER_NAME: choreo-dev-controlplane-aks-cluster
          APP_NAME: choreo-dev-replica
          KAPP_CONFIG_PATH: $(Build.SourcesDirectory)/kustomize/kapp-config.yaml
          INPUT_FILE: dev-control-plane.yaml
          NAME: dev-control-plane
          WORKING_DIR: $(Build.ArtifactStagingDirectory)
  - job: GrowthHackingPRCheck
    pool: choreo-dev-custom-cp-vmss-agents
    dependsOn: Initialize
    condition: >-
      or(eq(dependencies.Initialize.outputs['DetermineRun.runAllChecks'], 'true'),
      eq(dependencies.Initialize.outputs['DetermineRun.runGrowthHackingChecks'], 'true'))
    steps:
      - task: DownloadPipelineArtifact@2
        inputs:
          artifact: k8s-artifacts
          targetPath: $(Build.ArtifactStagingDirectory)
      - template: install/install-kapp.yml@TEMPLATE_REPOSITORY
      - template: pr/kapp-deploy-pr.yaml@TEMPLATE_REPOSITORY
        parameters:
          RESOURCE_GROUP: choreo-dev-aks-rg
          CLUSTER_NAME: choreo-dev-controlplane-aks-cluster
          APP_NAME: choreo-dev-growth-hacking
          KAPP_CONFIG_PATH: $(Build.SourcesDirectory)/kustomize/kapp-config.yaml
          INPUT_FILE: dev-control-plane.yaml
          NAME: growth-hacking
          WORKING_DIR: $(Build.ArtifactStagingDirectory)
  - job: DataplanePRCheck
    pool: choreo-dev-custom-dp-vmss-agents
    dependsOn: Initialize
    condition: >-
      or(eq(dependencies.Initialize.outputs['DetermineRun.runAllChecks'], 'true'),
      eq(dependencies.Initialize.outputs['DetermineRun.runDataplanePRCheck'], 'true'))
    steps:
      - task: DownloadPipelineArtifact@2
        inputs:
          artifact: k8s-artifacts
          targetPath: $(Build.ArtifactStagingDirectory)
      - template: install/install-kapp.yml@TEMPLATE_REPOSITORY
      - template: pr/kapp-deploy-pr.yaml@TEMPLATE_REPOSITORY
        parameters:
          RESOURCE_GROUP: choreo-dev-dataplane-e1-aks-rg
          CLUSTER_NAME: choreo-dev-dataplane-aks-cluster
          APP_NAME: choreo-dev-replica
          KAPP_CONFIG_PATH: $(Build.SourcesDirectory)/kustomize/kapp-config.yaml
          INPUT_FILE: dev-dataplane.yaml
          NAME: dev-us-dataplane
          WORKING_DIR: $(Build.ArtifactStagingDirectory)
      - template: pr/kapp-deploy-pr.yaml@TEMPLATE_REPOSITORY
        parameters:
          RESOURCE_GROUP: choreo-dev-dataplane-002-aks-rg
          CLUSTER_NAME: choreo-dev-dataplane-aks-cluster-002
          APP_NAME: choreo-dev-replica
          KAPP_CONFIG_PATH: $(Build.SourcesDirectory)/kustomize/kapp-config.yaml
          INPUT_FILE: dev-dataplane-us-cilium.yaml
          NAME: dev-us-cilium-dataplane
          WORKING_DIR: $(Build.ArtifactStagingDirectory)
      - template: pr/kapp-deploy-pr.yaml@TEMPLATE_REPOSITORY
        parameters:
          RESOURCE_GROUP: choreo-dev-ne-dataplane-e1-aks-rg
          CLUSTER_NAME: choreo-dev-ne-dataplane-e1-aks-cluster
          APP_NAME: choreo-dev-replica
          KAPP_CONFIG_PATH: $(Build.SourcesDirectory)/kustomize/kapp-config.yaml
          INPUT_FILE: dev-dataplane-eu.yaml
          NAME: dev-eu-dataplane
          WORKING_DIR: $(Build.ArtifactStagingDirectory)
      - template: pr/kapp-deploy-pr.yaml@TEMPLATE_REPOSITORY
        parameters:
          RESOURCE_GROUP: choreo-dev-ne-dataplane-002-aks-rg
          CLUSTER_NAME: choreo-dev-ne-dataplane-aks-cluster-002
          APP_NAME: choreo-dev-replica
          KAPP_CONFIG_PATH: $(Build.SourcesDirectory)/kustomize/kapp-config.yaml
          INPUT_FILE: dev-dataplane-eu-cilium.yaml
          NAME: dev-eu-cilium-dataplane
          WORKING_DIR: $(Build.ArtifactStagingDirectory)
  - job: RoutingClusterPRCheck
    pool: choreo-dev-custom-dp-vmss-agents
    dependsOn: Initialize
    condition: >-
      or(eq(dependencies.Initialize.outputs['DetermineRun.runAllChecks'], 'true'),
      eq(dependencies.Initialize.outputs['DetermineRun.runRoutingClusterPRCheck'], 'true'))
    steps:
      - task: DownloadPipelineArtifact@2
        inputs:
          artifact: k8s-artifacts
          targetPath: $(Build.ArtifactStagingDirectory)
      - template: install/install-kapp.yml@TEMPLATE_REPOSITORY
      - template: pr/kapp-deploy-pr.yaml@TEMPLATE_REPOSITORY
        parameters:
          RESOURCE_GROUP: choreo-dev-routing-aks-rg
          CLUSTER_NAME: choreo-dev-routing-aks-cluster
          APP_NAME: choreo-dev-replica
          KAPP_CONFIG_PATH: $(Build.SourcesDirectory)/kustomize/kapp-config.yaml
          INPUT_FILE: dev-routing.yaml
          NAME: dev-us-routing
          WORKING_DIR: $(Build.ArtifactStagingDirectory)
      - template: pr/kapp-deploy-pr.yaml@TEMPLATE_REPOSITORY
        parameters:
          RESOURCE_GROUP: choreo-dev-ne-routing-aks-rg
          CLUSTER_NAME: choreo-dev-ne-routing-aks-cluster
          APP_NAME: choreo-dev-replica
          KAPP_CONFIG_PATH: $(Build.SourcesDirectory)/kustomize/kapp-config.yaml
          INPUT_FILE: dev-routing-eu.yaml
          NAME: dev-eu-routing
          WORKING_DIR: $(Build.ArtifactStagingDirectory)

# Checkov pipeline
# Scan the kustomize code against a checklist.
# https://docs.google.com/spreadsheets/d/1blq9yE_h2UB9UmanJ_UyoMwE4RzkImftXc-ck1eKTN0/edit#gid=0
# Skipped Checks
# CKV_K8S_22 - Use read-only filesystem for containers where possible
# CKV_K8S_35 - Prefer using secrets as files over secrets as environment variables

trigger: none

pr:
  branches:
    include:
    - '*'

pool:
  vmImage: ubuntu-latest

steps:
- template: templates/install-kustomize.yml
- script: |
    set -eo pipefail
    cd kustomize
    mkdir build
    $KUSTOMIZE build base | tee build/kustomize-all.yml
  displayName: 'Generate k8s artifacts'

- script: |
    echo Running Checkov Scan!
    sudo apt-get install python3.7
    pip3 install --upgrade pip && pip3 install --upgrade setuptools
    pip3 install dataclasses
    pip3 install checkov
    /home/vsts/.local/bin/checkov -f kustomize/build/kustomize-all.yml --framework kubernetes --skip-check CKV_K8S_22,CKV_K8S_35
    echo "--------------- Checkov Scan Completed ---------------"
    echo "Note: The scan results are suppressed until the issues are fixed."
  displayName: 'Kustomize code scan using Checkov'


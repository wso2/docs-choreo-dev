trigger: none

pr:
  branches:
    include:
    - '*'

pool:
  vmImage: ubuntu-latest

steps:
- template: templates/install-kustomize.yml
- template: templates/run-kustomize-checkov.yml
  parameters:
    ${{ if eq(variables['System.PullRequest.TargetBranch'], 'master') }}:
      BUILD_FOLDER: base
    ${{ if ne(variables['System.PullRequest.TargetBranch'], 'master') }}:
      BUILD_FOLDER: $(System.PullRequest.TargetBranch)

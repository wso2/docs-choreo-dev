trigger: none

steps:
  - script: |
      date_str="2026-07-09T12:00:27.517Z"
      given_timestamp=$(date -d "$date_str" +%s)
      current_timestamp=$(date +%s)
      one_month_later=$(date -d "+1 month" +%s)
      
      echo "[INFO] Given timestamp: $given_timestamp"
      echo "[INFO] Current timestamp: $current_timestamp"
      echo "[INFO] One month later: $one_month_later"
    displayName: check dates

trigger: none

variables:
  - group: ad-app-expiry-alert

steps:
  - script: |
      set -eo pipefail
      az login --allow-no-subscriptions \
        --service-principal -u $(client_id) -p $(client_secret) --tenant da76d684-740f-4d94-8717-9d5fb21dd1f9
    displayName: login to azure
  - script: |
      az ad app credential list --id 2accb56e-7ffb-4de1-83ad-0d89906c561 --query "[].endDateTime" | yq '.[]')
      date_str="2026-07-09T12:00:27.517Z"
      given_timestamp=$(date -d "$date_str" +%s)
      current_timestamp=$(date +%s)
      one_month_later=$(date -d "+1 month" +%s)
      
      echo "[INFO] Given timestamp: $given_timestamp"
      echo "[INFO] Current timestamp: $current_timestamp"
      echo "[INFO] One month later: $one_month_later"
    displayName: check dates

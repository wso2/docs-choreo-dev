trigger: none

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: perf-test-tokens

resources:
  repositories:
    - repository: choreo-common-pipeline-templates
      type: github
      name: wso2-enterprise/choreo-common-pipeline-templates
      ref: refs/heads/main
      endpoint: wso2-enterprise

parameters:
  - name: emails
    displayName: 'List of email addresses to send the report'
    type: string
    default: "amilad@wso2.com"
  - name: generateChartsOnly
    displayName: 'Only execute the step to generate charts'
    type: boolean
    default: false

steps:
  - template: install/install-jmeter.yaml@choreo-common-pipeline-templates

  - script: |
      /opt/jmeter/bin/jmeter -n -t api-invocations.jmx -l "./jmeter_run_result.jtl" -JrampUpPeriod=10 -Jusers="${{ parameters.users }}" -Jduration="${{ parameters.duration }}" -Jprotocol=https -Jhost="ec67c777-2a89-4370-9c9b-0faac708612b-dev.e1-us-east-azure.st.choreoapis.dev" -Jport="443" -Jpath="/perfproject/netty/v1/" -Jpayload="50B.json" -Jresult-tree="./result-tree.jtl" -Jtoken="$(token)"
    workingDirectory: performance-tests/jmeter-scripts
    displayName: 'Run API Invocation Test'

  - template: templates/generate-n-publish-results.yaml
    parameters:
      scriptName: api-invocations.jmx
      containerName: api-invocations

  - template: templates/write-to-gdrive.yaml
    parameters:
      gsheetToken: $(gsheet-token)
      uploadDir: api-invocation
      sheetName: "API Invocations"

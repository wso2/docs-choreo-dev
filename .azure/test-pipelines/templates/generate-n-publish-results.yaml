parameters:
  - name: scriptName
    displayName: 'Name of the Jmeter script to copy'
    type: string
    default: signin.jmx
  - name: containerName
    displayName: 'Name of the folder to publish test-results'
    type: string
    default: signin

steps:
  - script: |
      /opt/jmeter//lib/ext/JMeterPluginsCMD.sh --generate-csv AggregateReport.csv --input-jtl jmeter_run_result.jtl --plugin-type AggregateReport
    workingDirectory: performance-tests/jmeter-scripts
    displayName: 'Generate Aggregate Report'

  - script: |
      mkdir -p results
      cp *.log ./results/
      cp *.txt ./results/
      cp *.jtl ./results/
      cp *.csv ./results/
      cp ${{ parameters.scriptName }} ./results/
    workingDirectory: performance-tests/jmeter-scripts
    displayName: 'Copy Specific Files for Artifacts'

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: 'performance-tests/jmeter-scripts/results/'
      ArtifactName: ${{ parameters.containerName }}
      publishLocation: 'Container'
    displayName: 'Publish JMeter Results as Build Artifact'

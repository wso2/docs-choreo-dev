parameters:
  - name: gsheetToken
    type: string
    default: ""
    displayName: "Google Sheets Token"

  - name: uploadDir
    type: string
    default: "api-invocation"
    displayName: "Directory to Upload results"

  - name: sheetName
    type: string
    default: "Login"
    displayName: "Name of the sheet to update"

  - name: reportFilter
    type: string
    default: ""
    displayName: "List of rows to include in the report"

steps:
  # Install Python Dependencies
  - script: |
      python3 -m pip install --upgrade pip
      python3 -m pip install gspread google-auth google-auth-oauthlib google-auth-httplib2
      python3 -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
    displayName: 'Install Python Dependencies'

  - script: |
      python3 processing-scripts/upload_results.py ${{ parameters.uploadDir }}
    env:
      GOOGLE_TOKEN: ${{ parameters.gsheetToken }}
    displayName: 'Upload results to Gdrive'
    workingDirectory: performance-tests/jmeter-scripts

  # Run the Second Python Script
  - script:
      |
      if [ -z "${{ parameters.reportFilter }}" ]; then
        echo "Sheet name not provided, skipping Google Sheets update."
        python3 processing-scripts/publish_run_results.py "${{ parameters.uploadDir }}.txt" "${{ parameters.sheetName }}"
      else
        python3 processing-scripts/publish_run_results.py "${{ parameters.uploadDir }}.txt" "${{ parameters.sheetName }}" "${{ parameters.reportFilter }}"
      fi
    env:
      GSHEET_TOKEN: ${{ parameters.gsheetToken }}
    displayName: 'Update Google Sheets'
    workingDirectory: performance-tests/jmeter-scripts

steps:
  - script: |
      sudo apt-get update
      sudo apt-get install -y openjdk-11-jdk unzip
      echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" | sudo tee -a /etc/environment
      echo "PATH=\$PATH:\$JAVA_HOME/bin" | sudo tee -a /etc/environment
      source /etc/environment
      echo $JAVA_HOME
      echo $PATH
    displayName: 'Install Java and Set Environment Variables'

  - script: |
      wget https://downloads.apache.org//jmeter/binaries/apache-jmeter-5.6.3.tgz
      tar -xzf apache-jmeter-5.6.3.tgz
      wget https://jmeter-plugins.org/files/JMeterPlugins-Standard-1.4.0.zip
      unzip -o JMeterPlugins-Standard-1.4.0.zip -d apache-jmeter-5.6.3
      wget https://jmeter-plugins.org/files/packages/jpgc-cmd-2.2.zip
      unzip -o jpgc-cmd-2.2.zip -d apache-jmeter-5.6.3
      java -cp apache-jmeter-5.6.3/lib/ext/jmeter-plugins-manager-1.3.jar org.jmeterplugins.repository.PluginManagerCMDInstaller
      ./apache-jmeter-5.6.3/bin/PluginsManagerCMD.sh install jpgc-synthesis=2.2
      ./apache-jmeter-5.6.3/bin/PluginsManagerCMD.sh install jpgc-filterresults=2.2
      sudo mv apache-jmeter-5.6.3 /opt/jmeter
    displayName: 'Install JMeter and Plugins'

  - script: |
      /opt/jmeter/bin/jmeter --version
    displayName: 'Check JMeter Version'

trigger: none

pr: none

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: users
    displayName: 'Number of Users'
    type: number
    default: 100
  - name: userCountStart
    displayName: 'Counter start value'
    type: number
    default: 4000
  - name: userCountEnd
    displayName: 'End counter value'
    type: number
    default: 4020
  - name: iterations
    displayName: 'No of loops per user'
    type: number
    default: 4

steps:
  - template: templates/install-jmeter.yaml

  - script: |
      /opt/jmeter/bin/jmeter -n -t signin.jmx -l "jmeter_run_result.jtl" -Jrampup=10 -Jusers="${{ parameters.users }}" -JuserCountStart="${{ parameters.userCountStart }}" -JuserCountEnd="${{ parameters.userCountEnd }}" -Jloops="${{ parameters.iterations }}"
    workingDirectory: performance-tests/jmeter-scripts
    displayName: 'Run JMeter Test'

  - script: |
      /opt/jmeter/bin/JMeterPluginsCMD.sh --generate-csv AggregateReport.csv --input-jtl jmeter_run_result.jtl --plugin-type AggregateReport
    workingDirectory: performance-tests/jmeter-scripts
    displayName: 'Generate Aggregate Report'

  - script: |
      mkdir -p results
      cp *.log ./results/
      cp *.txt ./results/
      cp *.jtl ./results/
      cp *.csv ./results/
      cp signin.jmx ./results/
    workingDirectory: performance-tests/jmeter-scripts
    displayName: 'Copy Specific Files for Artifacts'

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: 'performance-tests/jmeter-scripts/results/'
      ArtifactName: 'signin'
      publishLocation: 'Container'
    displayName: 'Publish JMeter Results as Build Artifact'

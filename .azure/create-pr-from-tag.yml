variables:
  GITHUB_PAT: $(github-pat)
  GIT_USER_SEARCH_API: https://api.github.com/search/users?q=
  REGEX_SEARCH_LOGIN: login\":[[:space:]]*\"[^\"]*\"
  REGEX_EXTRACT_LOGIN: s/^login\":[[:space:]]\"([^\"]*)\"/\1/
  REGEX_ISSUE_URL: s/^https:\/\/github.com\/wso2-enterprise\/choreo-control-plane\/issues\/(.*)/\1/

resources:
    webhooks:
      - webhook: ComponentImageTagPushTrigger
        connection: component-image-tag-push-trigger-connection
  
trigger: none

pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
  persistCredentials: true
- template: templates/install-github-cli.yml
- template: templates/install-kustomize.yml
- script: |
    echo "$(GITHUB_PAT)" | gh auth login --with-token 
  displayName: 'Login to Github Cli'
- script: |
    set -eo
    echo "Pipeline triggered from a webhook"
    tagger="${{ parameters.ComponentImageTagPushTrigger.tagger }}"

    issueTitle="Upgrade ${{ parameters.ComponentImageTagPushTrigger.repository }} to ${{ parameters.ComponentImageTagPushTrigger.newTag }}"
    issueBody=$(cat .azure/templates/component_release_template.md)

    echo "Createing the issue : $issueTitle"
    issueId=$(gh issue create -t "$issueTitle" -b "$issueBody" -a "${{ parameters.ComponentImageTagPushTrigger.taggerEmail }}" | sed -r  '$(REGEX_ISSUE_URL)')

    echo "##vso[task.setvariable variable=issueId;]$issueId"
    echo "##vso[task.setvariable variable=updatedImage;]$updatedImage"
    echo "##vso[task.setvariable variable=updatedImages;]$updatedImages"
    echo "##vso[task.setvariable variable=issueTitle;]$issueTitle"
  displayName: 'Create the git issue'
- template: templates/update-tag-and-send-pr.yml
  parameters:
    ISSUE_ID: $(issueId)
    UPDATED_IMAGE: ${{ parameters.ComponentImageTagPushTrigger.newDockerImage }}
    UPDATED_IMAGES: ${{ parameters.ComponentImageTagPushTrigger.updatedImages }}
    TARGET_BRANCH: 'stage'
    COMMIT_MESSAGE: $(issueTitle)
- template: templates/update-tag-and-send-pr.yml
  parameters:
    ISSUE_ID: $(issueId)
    UPDATED_IMAGE: ${{ parameters.ComponentImageTagPushTrigger.newDockerImage }}
    UPDATED_IMAGES: ${{ parameters.ComponentImageTagPushTrigger.updatedImages }}
    TARGET_BRANCH: 'prod'
    COMMIT_MESSAGE: $(issueTitle)

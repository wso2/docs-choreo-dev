variables:
  GITHUB_PAT: $(github-pat)
  GIT_USER_SEARCH_API: https://api.github.com/search/users?q=
  REGEX_SEARCH_LOGIN: login\":[[:space:]]*\"[^\"]*\"
  REGEX_EXTRACT_LOGIN: s/^login\":[[:space:]]\"([^\"]*)\"/\1/
  REGEX_ISSUE_URL: s/^https:\/\/github.com\/wso2-enterprise\/choreo-control-plane\/issues\/(.*)/\1/

resources:
    webhooks:
      - webhook: ComponentImageTagPushTrigger
        connection: component-image-tag-push-trigger-connection
  
trigger: none

pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
  persistCredentials: true
- template: templates/install-github-cli.yml
- template: templates/install-kustomize.yml
- script: |
    set -eo
    echo "Pipeline triggered from a webhook"
    updatedImage="${{ parameters.ComponentImageTagPushTrigger.newDockerImage }}"
    taggerEmail="${{ parameters.ComponentImageTagPushTrigger.taggerEmail }}"
    taggerName="${{ parameters.ComponentImageTagPushTrigger.taggerName }}"
    
    taggerId=""
    taggerId=$(curl "$(GIT_USER_SEARCH_API)$taggerEmail" |  grep -oh "$(REGEX_SEARCH_LOGIN)" | head -1 | sed -r '$(REGEX_EXTRACT_LOGIN)')
    if [ -z "$taggerId" ]
    then
      taggerId=$(curl "$(GIT_USER_SEARCH_API)$taggerName" |  grep -oh "$(REGEX_SEARCH_LOGIN)" | head -1 | sed -r '$(REGEX_EXTRACT_LOGIN)')
    fi

    # Generating issue title from the image and the new version
    version=$(echo $updatedImage | sed -r  's/^.*:(.*)/\1/')
    image=$(echo $updatedImage | sed -r  's/^.*\/(.*):.*/\1/')
    if [ ${#image} -gt 20 ]
    then
        image=${image: -20}
    fi
    issueTitle="Upgrade $image to $version"

    issueBody=$(cat .azure/templates/component_release_template.md)

    echo "$(GITHUB_PAT)" | gh auth login --with-token
    if [ -z "$taggerId" ]
    then
      issueId=$(gh issue create -t "$issueTitle" -b "$issueBody" | sed -r  '$(REGEX_ISSUE_URL)')
    else
      issueId=$(gh issue create -t "$issueTitle" -b "$issueBody" -a "$taggerId" | sed -r  '$(REGEX_ISSUE_URL)')
    fi

    echo "##vso[task.setvariable variable=issueId;]$issueId"
    echo "##vso[task.setvariable variable=updatedImage;]$updatedImage"
    echo "##vso[task.setvariable variable=issueTitle;]$issueTitle"
  displayName: 'Create the git issue'
- template: templates/update-tag-and-send-pr.yml
  parameters:
    ISSUE_ID: $(issueId)
    UPDATED_IMAGE: $(updatedImage)
    TARGET_BRANCH: 'stage'
    COMMIT_MESSAGE: $(issueTitle)

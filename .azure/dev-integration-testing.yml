trigger:
  batch: true
  branches:
    include:
    - integration-tests
  paths:
    include:
    - kustomize/base/*
    - kustomize/dev/*
    - .azure/*

pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    # Replace '10.14' with the latest Node.js LTS version
    versionSpec: '10.14'
  displayName: 'Install Node.js'
- script: |
    cd integration-tests/ui
    npm install
  displayName: 'Install TestCafe'
- task: DownloadSecureFile@1
  name: testConfig
  displayName: 'Download test configs'
  inputs:
    secureFile: 'testcafe-user-config.json'
- script: |
    cp $(testConfig.secureFilePath) integration-tests/ui/testcafe-user-config.json
    cd integration-tests/ui
    pwd
    ls
    npm run 2e2test:headless
  displayName: 'Run TestCafe Tests'
- task: PublishTestResults@2
  inputs:
    testResultsFiles: '**/integration-tests/ui/report.xml'
    testResultsFormat: 'JUnit'

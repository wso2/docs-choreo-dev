trigger:
  batch: true
  branches:
    include:
    - master
  paths:
    include:
    - kustomize/base/*
    - kustomize/prod/*
    - .azure/prod-deploy.yml

pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: |
    echo "Installing kustomize in the environment"
    mkdir $HOME/bin
    pushd $HOME/bin
    curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh"  | bash
    echo "##vso[task.setvariable variable=KUSTOMIZE]$(HOME)/bin/kustomize"
    popd
  displayName: 'Setup kustomize'
- script: |
    cd kustomize
    mkdir build
    $KUSTOMIZE build prod | tee build/kustomize-all.yml
  displayName: 'Generate k8s artifacts'
- script: |
    export K14SIO_INSTALL_BIN_DIR=$HOME/bin
    curl -L https://k14s.io/install.sh | bash
    echo "##vso[task.setvariable variable=KAPP]$(HOME)/bin/kapp"
  displayName: "Setup kapp"
- script: |
    echo $KAPP
    $KAPP -h
    $KAPP version
  displayName: "Deploy to cluster"

trigger:
  batch: true
  branches:
    include:
      - main-ci
  paths:
    include:
      - databases/*
      - .azure/build-choreo-db.yml

pr: none

jobs:
  - job: DockerBuildAndPush

    pool:
      vmImage: 'ubuntu-latest'

    variables:
      CONTAINER_REGISTRY: choreocontrolplane.azurecr.io
      REPOSITORY: choreoipaas/choreo-db

    steps:
      - task: Docker@2
        displayName: 'Build and push Docker image'
        inputs:
          command: buildAndPush
          containerRegistry: 'wso2choreo-control-plane-acr'
          repository: $(REPOSITORY)
          Dockerfile: 'databases/Dockerfile'
          buildContext: 'databases'
          tags: |
            latest
            master-$(Build.SourceVersion) 

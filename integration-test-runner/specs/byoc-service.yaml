---
kind: BYOC-Service-US
actions:
- action: CreateProject
  params:
    region: US
    description: BYOC service project
    placeholder: testproject
- action: CreateByocComponent
  params:
    srcGitRepoURL: https://github.com/wso2/choreo-samples
    repositoryBranch: main
    repositorySubPath: greeting-service-go
    componentType: byocService
    buildPack: Ballerina
    accessibility: external
    isPublicRepo: 'true'
    project: testproject
    placeholder: servicecomp
    dockerFilePath: greeting-service-go/Dockerfile
    dockerContext: greeting-service-go
- action: WaitForBuild
  params:
    component: servicecomp
- action: GetEnvironments
  params:
    project: testproject
- action: DeployComponent
  params:
    component: servicecomp
- action: PromoteComponent
  params:
    component: servicecomp
- action: InvokeDeployment
  params:
    component: servicecomp
    method: GET
    contentType: text/plain
    resource: "/greeter/greet"
    queryParams: name=Choreo
    statusCode: '200'
    response: Hello, Choreo!
- action: InvokePromotion
  params:
    component: servicecomp
    method: GET
    contentType: text/plain
    resource: "/greeter/greet"
    queryParams: name=Choreo
    statusCode: '200'
    response: Hello, Choreo!

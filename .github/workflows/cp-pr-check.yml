name: cp-pr-check
on: 
  pull_request:
    branches:
    - prod
    types:
    - opened
    - edited

jobs:
  pr_check_job:
    runs-on: ubuntu-latest
    name: PR Check Job
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: CP PR checker action step
      id: pr-check-step
      uses: ./.github/actions/cp-pr-checker

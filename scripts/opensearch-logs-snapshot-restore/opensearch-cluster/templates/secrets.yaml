#==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-admin-credentials-secret
  namespace: observability
type: Opaque
stringData:
  username: "admin"
  password: "admin"
  # password should be in plain text
---

#==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-security-config
  namespace: observability
type: Opaque
# hash of the plaintext password "admin" is included in the internal_users.yml
stringData:
  internal_users.yml: |-
    _meta:
      type: "internalusers"
      config_version: 2
    admin:
      hash: "$2y$12$/q8lBDhwLJJ.iT2Pah7NWeIHciFDeMiKhwLD/TFahdrgXYRWYrHQK"
      reserved: true
      backend_roles:
      - "admin"
      description: "Internal admin user"
  config.yml: |-
    _meta:
      type: "config"
      config_version: 2
    config:
      dynamic:
        http:
          anonymous_auth_enabled: false
        authc:
          basic_internal_auth_domain:
            description: "Authenticate via HTTP Basic against internal users database"
            http_enabled: true
            transport_enabled: true
            order: 0
            http_authenticator:
              type: basic
              challenge: true
            authentication_backend:
              type: internal
        authz: {}
---

#==============================================================================
# Only if using S3 snapshot repository
apiVersion: v1
kind: Secret
metadata:
  name: snapshot-repository
  namespace: observability
type: Opaque
stringData:
  "s3.client.default.access_key": {{ .Values.snapshotRepository.accessKey }}
  "s3.client.default.secret_key": {{ .Values.snapshotRepository.secretKey }}

nodePools:
  master:
    diskSize: "3Gi"
    resources:
      requests:
        memory: "1000Mi"
        cpu: "100m"
      limits:
        memory: "1200Mi"
        cpu: "300m"
  data:
    diskSize: "10Gi" # Set this according to the data size to be restored
    resources:
      requests:
        memory: "1000Mi" # Adjust this requests and limits according to the dataplane values
        cpu: "500m"
      limits:
        memory: "1200Mi" # Adjust this requests and limits according to the dataplane values
        cpu: "800m"
snapshotRepository:
  basePath: "container-logs-automatic-snapshots"
  bucket: "" # Find these values from the dataplane repository
  region: ""
  accessKey: ""
  secretKey: ""

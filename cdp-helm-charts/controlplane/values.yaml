global:
  choreosystem:
    orgHandle: choreosystem
  asgardeo:
    consoleUrl: https://console.asgardeo.io
  vault:
    url: http://vault.vault:8200
  redis:
    host: redis-cluster.redis.svc.cluster.local
    port: "6379"
  image:
    registry: choreocontrolplane.azurecr.io
    pullSecrets:
      - name: choreo-image-pull-secret
  namespaces:
    apim: choreo-apim
    system: choreo-system
    observability: choreo-observability
    ai: choreo-ai
choreo-apim:
  enabled: true
  serviceAccount:
    annotations: {}
  apim-devportal:
    replicas: 1
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 3
    image:
      repository: choreoipaas/choreo-apim-devportal
      tag: latest
    config:
      clientId: ''
      signInRedirectUrl: ''
      signOutRedirectUrl: ''
      clientHost: ''
      apimHost: ''
      tokenExchangeUrl: ''
      apimApi: ''
      apimGatewayHostSuffix: ''
      idpHost: ''
      apiServiceHost: ''
      graphqlServiceHost: ''
      graphqlResource: ''
      azureCDNOrigin: ''
      devToolEnable: true
      tokenEndpoint: ''
      revokeEndpoint: ''
      enableInV2: true
      enableEmailLogin: true
      enableMicrosoftLogin: true
      overrideEndpoints:
        authorizationEndpoint: ''
        tokenEndpoint: ''
        endSessionEndpoint: ''
      tokenExchangeConfig:
        clientId: ''
        scope: 'apim:admin apim:subscribe environments:view_prod environments:view_dev apim:prod_key_manage apim:sand_key_manage urn:choreosystem:customdomainapi:custom_domain_view urn:choreosystem:usermanagement:user_view'
      azureInsightsKey: ''
      choreoSystemHostSuffix: ''
      devportalHost: ''
      customDomain:
        enabled: false
        apiServiceHost: ""
        graphqlServiceHost: ""
        tokenEndpoint: ""
        wellKnownEndpoint: ""
        devportalHost: ""
        permissionAdminPortalUrl: ""
        customSubscriptionPolicyHandlingOrg: ""
        apiTryoutTestKeyEnabled: false
        apiKeyFeatureEnabled: false
        devPortalIdPConfigurationFeatureEnabled: false
      selfSignupEnabledOrgs: ''
      pdpDomainCustomizedOrgs: '[]'
      permissionAdminPortalEnabled: true
      sandboxKeyGenerationEnabled: true
      intelligentRoutingFeatureEnabled: true
      choreoInbuiltKeyManagerFeatureEnabled: true
      customSubscriptionPolicyHandlingOrg: ""
      apiTryoutTestKeyEnabled: false
      apiKeyFeatureEnabled: false
      devPortalIdPConfigurationFeatureEnabled: false
      apiKeyScopeSupportEnabled: false
  app-gateway-oauth-agent:
    replicas: 1
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 3
    image:
      repository: choreoipaas/app-gateway-oauth-agent
      tag: latest
    config:
      patClientId: ""
      patClientTokenEp: http://choreo-am-service:9763/oauth2/token
      patTokenTtlBuffer: "10"
    secrets:
      encKey:
        path: choreo-cp/data/choreo-apim/app-gateway-oauth-agent
        key: encryptionKey
      patClientSecret:
        path: choreo-cp/data/choreo-apim/app-gateway-oauth-agent
        key: patClientSecret
      redisPassword:
        path: choreo-cp/data/choreo-apim/app-gateway-oauth-agent
        key: redisPassword
    vault:
      roleName: app-gateway-oauth-agent

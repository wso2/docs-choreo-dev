[server]
hostname = {{ .Values.config.hostName | quote }}
node_ip = "$env{NODE_IP}"
#offset=0
mode = "single" #single or ha
base_path = "${carbon.protocol}://${carbon.host}:${carbon.management.port}"
#discard_empty_caches = false
server_role = "control-plane"
enable_traffic_management = false

[super_admin]
username = "choreo_apim_admin"
password = "$env{SUPER_ADMIN_PSWD}"
create_admin_account = true

[user_store]
type = "database_unique_id"

[user_store.properties]
UsernameJavaScriptRegEx="^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$|^[\\S]{3,40}$"
UsernameJavaRegEx="^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$|^[\\S]{3,40}$"
PasswordJavaRegEx = "^[\\S]{5,30}$"
PasswordJavaScriptRegEx = "^[\\S]{5,30}$"
RolenameJavaScriptRegEx = "^[\\S]{3,50}$"
RolenameJavaRegEx = "^[\\S]{3,50}$"
CaseInsensitiveUsername = false

[realm_manager]
data_source = "WSO2USER_DB"

[database.apim_db]
type = "mssql"
url = {{ .Values.config.apimDBURL | quote }}
username = "choreo_apim_db_user"
password = "$env{CHOREO_APIM_DB_PASSWORD}"
driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
validationQuery = "SELECT 1"

[database.apim_db.pool_options]
maxActive = "100"
maxWait = "60000"
# (maxAge): do not keep the same connection live over 12 hours (43200000ms)
maxAge = "43200000"
minIdle = "10"
testOnBorrow = "true"
testWhileIdle = "true"
validationQueryTimeout = "2"
validationInterval = "30000"
defaultAutoCommit = "true"
removeAbandoned = "true"
removeAbandonedTimeout = "180"
logAbandoned = "true"
jdbcInterceptors="SlowQueryReport(threshold=200); org.wso2.am.choreo.extensions.core.jdbcpool.ConnectionLoggingInterceptor"

[database.shared_db]
type = "mssql"
url = {{ .Values.config.sharedDBURL | quote }}
username = "choreo_apim_shared_db_user"
password = "$env{CHOREO_APIM_SHARED_DB_PASSWORD}"
driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
validationQuery = "SELECT 1"

[database.shared_db.pool_options]
maxActive = "100"
maxWait = "60000"
# (maxAge): do not keep the same connection live over 12 hours (43200000ms)
maxAge = "43200000"
minIdle = "10"
testOnBorrow = "true"
testWhileIdle = "true"
validationQueryTimeout = "2"
validationInterval = "30000"
defaultAutoCommit = "true"
removeAbandoned = "true"
removeAbandonedTimeout = "180"
logAbandoned = "true"
jdbcInterceptors={{ .Values.config.sharedDBJDBCInterceptors | quote }}

[database.user]
url = {{ .Values.config.dbURL | quote }}
username = "choreo_apim_user_db_user"
password = "$env{CHOREO_APIM_USER_DB_PASSWORD}"
driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
validationQuery = "SELECT 1"

[database.user.pool_options]
maxActive= "100"
maxWait = "60000"
# (maxAge): do not keep the same connection live over 12 hours (43200000ms)
maxAge = "43200000"
minIdle = "10"
testOnBorrow = "true"
testWhileIdle = "true"
validationQueryTimeout = "2"
validationInterval = "30000"
defaultAutoCommit = "true"
removeAbandoned = "true"
removeAbandonedTimeout = "180"
logAbandoned = "true"
jdbcInterceptors="SlowQueryReport(threshold=200)"

[apim.registry]
type = "mongodb"

[apim.persistence.properties]
connection_string = {{ .Values.config.mongoDBConnectionString | quote }}
api_uri = "https://cloud.mongodb.com/api/atlas/v1.0"
group_id = {{ .Values.config.persistenceGroupId | quote }}
cluster_name = "choreo-apim"
public_key = "$env{MONGO_DB_ATLAS_PUBLIC_KEY}"
private_key = "$env{MONGO_DB_ATLAS_PRIVATE_KEY}"
thread_count = 5
retry_count = 3
create_atlas_search_indexes = false

[http_access_log]
useLogger = true
pattern = "%h %A %l %u %t %r %s %b %{Referer}i %{User-Agent}i %{X-Forwarded-For}i %T"

[keystore.primary]
file_name =  "primary-keystore.pfx"
type =  "PKCS12"
password =  "$env{PRIMARY_KEYSTORE_PSWD}"
alias =  "wso2carbon"
key_password =  "$env{PRIMARY_KEYSTORE_KEY_PSWD}"

[keystore.tls]
file_name =  "tls-keystore.pfx"
type =  "PKCS12"
password =  "$env{TLS_KEYSTORE_PSWD}"
alias =  "wso2carbon"
key_password =  "$env{TLS_KEYSTORE_KEY_PSWD}"

[keystore.internal]
file_name =  "internal-keystore.pfx"
type =  "PKCS12"
password =  "$env{INTERNAL_KEYSTORE_PSWD}"
alias =  "wso2carbon"
key_password =  "$env{INTERNAL_KEYSTORE_KEY_PSWD}"

[truststore]
file_name = "client-truststore.jks"
type = "JKS"
password = "$env{TRUSTSTORE_PSWD}"

{{- range .Values.config.gatewayEnvironments }}
[[apim.gateway.environment]]
name = "{{ .name }}"
type = "{{ .type }}"
display_in_api_console = true
description = "{{ .description }}"
show_as_token_endpoint_url = true
service_url = "https://choreo-am-gateway-service:${mgt.transport.https.port}/services/"
username = "${admin.username}"
password = "${admin.password}"
ws_endpoint = "ws://localhost:9099"
wss_endpoint = "wss://localhost:8099"
http_endpoint = "{{ .httpEndpoint }}"
https_endpoint = "{{ .httpsEndpoint }}"
display_name = "{{ .displayName }}"
data_plane_id = "{{ .dataPlaneId }}"
gateway_accessibility_type = "{{ .accessibilityType }}"
{{- end }}

[apim.analytics]
enable = false

[apim.choreo_audit_events]
enable = true
websub_hub_url = {{ .Values.config.websubhubURL | quote }}
websub_hub_topic = {{ .Values.config.websubhubTopic | quote }}
queue_size = 20000
worker_thread_count = 2

[apim.api_quota_limit]
enable = false

[apim.key_manager]
service_url = "https://choreo-am-service:9443/services/"

[apim.oauth_config]
enable_token_encryption = true

[apim.publisher]
key_issuer = {{ .Values.config.publisherKeyIssuer | quote }}

[apim.devportal]
url = {{ .Values.config.devportalURL | quote }}
display_multiple_versions = true
create_default_application = false
key_issuer = {{ .Values.config.devportalKeyIssuer | quote }}

[[apim.devportal.application_attributes]]
required=false
hidden=false
default=""
name="scopes"
description="scopes of the application"

[[apim.devportal.application_attributes]]
required=false
hidden=true
default=""
name="asgardeo_app_id"
description="asgardeo app id"

[[apim.devportal.application_attributes]]
required=false
hidden=true
default=""
name="asgardeo_app_id_sandbox"
description="asgardeo sandbox app id"

[[apim.devportal.application_attributes]]
required=false
hidden=false
default=""
name="isDpSystemApp"
description="dataplane system application"

[[apim.devportal.application_attributes]]
required=false
hidden=false
default=""
name="isManagementApp"
description="management application for system apis"

[[apim.devportal.application_attributes]]
required=false
hidden=false
default=""
name="isChoreoManaged"
description="choreo managed management application"

[apim.devportal.v2]
access_url = {{ .Values.config.devportalV2URL | quote }}
access_header = "api-key"
access_key = "$env{DEVPORTAL_V2_ACCESS_KEY}"

[apim.cors]
allow_origins = "*"
allow_methods = ["GET","PUT","POST","DELETE","PATCH","OPTIONS"]
allow_headers = ["authorization","Access-Control-Allow-Origin","Content-Type","SOAPAction","apikey","API-Key","testKey"]
allow_credentials = false

[[event_handler]]
name="userPostSelfRegistration"
subscriptions=["POST_ADD_USER"]

[service_provider]
sp_name_regex = ".*"

[[event_listener]]
id = "token_revocation"
type = "org.wso2.carbon.identity.core.handler.AbstractIdentityHandler"
name = "org.wso2.is.notification.ApimOauthEventInterceptor"
order = 1

[event_listener.properties]
notification_endpoint = "https://choreo-am-service:9443/internal/data/v1/notify"
username = "${admin.username}"
password = "${admin.password}"
'header.X-WSO2-KEY-MANAGER' = "default"

[[event_listener]]
id = "token_exchange_audit_logger"
type = "org.wso2.carbon.identity.core.handler.AbstractIdentityHandler"
name = "org.wso2.is.notification.APIMTokenExchangeAuditLogger"
order = 2

[event.default_listener]
user_management_audit_logger.enable=false

[transport.https.properties]
proxyPort = 443
maxHttpHeaderSize="65536"

[apim.event_hub.publish.properties]
event_publishing_endpoint = "$env{ASB_CONNECTION_STRING}"
reconnect_interval = 1
reconnect_retry_count = 10

[database.local]
url = "jdbc:h2:./repository/database/WSO2CARBON_DB;DB_CLOSE_ON_EXIT=FALSE"

[indexing]
enable = false

{{- range .Values.config.serviceProviders }}
[[choreo.serviceProvider]]
clientId = "{{ .clientId }}"
scopes = "{{ .scopes }}"
isInternal = "{{ .isInternal | default "false" }}"
{{- end }}

[choreo.ChoreoTokenHandler]
appServiceUrl="app-service.choreo-system:8080"
authzServiceUrl={{ .Values.config.authzServiceURL | quote }}
authzServiceEnabled={{ .Values.config.authzServiceEnabled }}
choreoControlPlaneOrgUuid={{ .Values.global.choreosystem.orgUUID | quote }}
choreoControlPlaneOrgHandle={{ .Values.global.choreosystem.orgHandle | quote }}
allowed_claims="aut, given_name, authenticated_idp, name, family_name, middle_name, nickname, updated_at, email, email_verified, groups, username, is_eidp"
instanceBasedAuthzServiceEnabled={{ .Values.config.instanceBasedAuthzServiceEnabled }}
instanceBasedAuthzServiceDisabledOrgs={{ .Values.config.instanceBasedAuthzServiceDisabledOrgs | quote }}

[choreo.azure_service_bus]
connection_string = "$env{ASB_CONNECTION_STRING}"

{{- range .Values.config.azureServiceBusPool }}
[[choreo.azure_service_bus_pool]]
id = {{ .id }}
name = "{{ .name }}"
connection_string = "{{ .connectionString }}"
capacity = {{ .capacity }}
{{- end }}

[choreo.azure_service_bus.org_cleanup]
enabled = true
worker_threads = 10
executor = "choreo-apim"
subscription = "choreo-apim"
topic = "org-remover-request"
result_topic = "org-remover-result"

[choreo.choreo_api_quota_limiter]
quota_limit_service_hostname = "quota-limiter.choreo-system"
quotaLimit_service_port = "9090"

[[apim.jwt.issuer]]
name = {{ .Values.config.jwtIssuerName | quote }}
jwks.url = {{ .Values.config.jwtJWKSUrl | quote }}

{{- range .Values.config.jwtAudiences }}
[[apim.rest_api.jwt.audience]]
basepath = "{{ .basepath }}"
audience = "{{ .audience }}"
{{- end }}

[[oauth.custom_grant_type]]
name="urn:ietf:params:oauth:grant-type:token-exchange"
grant_handler="org.wso2.am.choreo.extensions.token.handler.ChoreoTokenExchangeGrantHandler"
grant_validator="org.wso2.carbon.identity.oauth2.grant.token.exchange.TokenExchangeGrantValidator"
[oauth.custom_grant_type.properties]
IdTokenAllowed=true

[oauth.extensions.token_types.token_type]
name="JWT"
issuer="org.wso2.am.choreo.extensions.token.handler.ChoreoJWTTokenIssuer"

[oauth.grant_type.jwt_bearer]
enable = true
grant_handler = "org.wso2.carbon.identity.oauth2.grant.jwt.JWTBearerGrantHandler"
grant_validator = "org.wso2.carbon.identity.oauth2.grant.jwt.JWTGrantValidator"

[oauth.grant_type.jwt]
enable_iat_validation="true"
iat_validity_period=300

[oauth.token_cleanup]
retain_access_tokens_for_auditing=false

[[resource.access_control]]
context="(.*)/fileupload/resource(.*)"
secure=false
http_method = "all"

[[resource.access_control]]
context="(.*)/fileupload/(.*)"
secure=true
http_method = "all"
permissions = ["/permission/protected/"]

[[resource.access_control]]
context="/services/(.*)"
secure=true
http_method="all"
permissions=["/permission/protected/"]

[[resource.access_control]]
context = "(.*)/((\\.+)|(.*;+.*)|%2e)/(.*)"
http_method = "all"
permissions = ["/"]
secure = true

[apim.operation_policy]
provider = "bcentral"
url = {{ .Values.config.operationPolicyURL | quote }}

[choreo.asgardeo_system_app]
token_endpoint={{ .Values.config.asgardeoSystemAppTokenEndpoint | quote }}
client_id="CHOREO_SYSTEM_APP_MANAGER"
client_secret="$env{ASGARDEO_SYSTEM_APP_CLIENT_SECRET}"
authz_endpoint={{ .Values.config.asgardeoSystemAppAuthzEndpoint | quote }}

{{- range .Values.config.perOrgSettings }}
[[choreo.asgardeo.per_org_settings]]
org_id = "{{ .orgId }}"
app_owner = "app_creator"
app_jwt_token_sub_claim = "email"
{{- end }}

[identity.auth_framework.endpoint] 
app_password="$env{APIM_DASHBOARD_USER_PWD}"

[account_recovery.endpoint.auth] 
hash="$env{APIM_DASHBOARD_USER_PWD_SHA256}"

[transport.http.properties]
maxHttpHeaderSize="65536"

[cache.jwks_cache]
timeout = 1800

[oauth.jwks_endpoint]
connection_timeout = 10000
read_timeout = 30000

[choreo.api_backend_url_validation]
enable_organization_validation = true

[choreo.rudder]
endpoint_url = "http://dp-rudder.choreo-system:80"
enable_domain_cache = false

[choreo.project_manager]
endpoint_url = "http://dp-project-manager.choreo-system:80"
enabled = true

[choreo.cloud_manager]
endpoint_url = "http://dp-cloud-manager.choreo-system:80"

[choreo.mizzen]
endpoint_url = "http://dp-mizzen.choreo-system"

[choreo.URLManager]
endpoint_url = "http://choreo-url-management.choreo-system:9090/url-mgt"

[authentication.authenticator.choreo_in_built_idp_authenticator]
name="choreo_in_built_idp_authenticator"
enable=true
parameters.userMgtServiceUrl="http://app-dev-user-mgt-service.choreo-system:8080"

[authentication.endpoints]
login_url="/auth/signin"
retry_url="/auth/error"

[oauth.endpoints]
oauth2_error_page="$ref{server.base_path}/auth/error"

[choreo.builtin.authorization]
service_url="http://app-dev-authorization-service.choreo-system:9090/authorize"

[choreo.app_service]
url="app-service.choreo-system:8080/"

[choreo.subscription_service]
url="subscriptions.choreo-system:9090/"

[cache.app_info_cache]
enable = true
timeout = "60"
capacity = "5000"

[[default.subscription.policy]]
display_name = "Unlimited"
request_count = "-1"
time_unit = "min"
description = "Allows unlimited requests"
api_type = "REST"

[[default.subscription.policy]]
display_name = "Gold"
request_count = "5000"
time_unit = "min"
description = "Allows 5000 requests per minute"
api_type = "REST"

[[default.subscription.policy]]
display_name = "Silver"
request_count = "2000"
time_unit = "min"
description = "Allows 2000 requests per minute"
api_type = "REST"

[[default.subscription.policy]]
display_name = "Bronze"
request_count = "1000"
time_unit = "min"
description = "Allows 1000 requests per minute"
api_type = "REST"

[[default.subscription.policy]]
display_name = "AsyncUnlimited"
request_count = "-1"
time_unit = "min"
description = "Allows unlimited events"
api_type = "WS"

[choreo.governanceService]
endpoint_url = "http://choreo-governance-service:8080"
worker_count = "5"
max_reties = "3"
retry_delay = "2000"

[[oauth.custom_grant_type]]
grant_handler = "org.wso2.am.choreo.extensions.token.handler.pat.ChoreoPATGrantHandler"
grant_validator = "org.wso2.am.choreo.extensions.token.handler.pat.ChoreoPATGrantValidator"
name = "pat"

[choreo.pat_handler]
client_id={{ .Values.config.patHandlerClientId | quote }}
pat_service_url="http://api-key-service.choreo-system:8080"

[choreo.workflowMgtService]
endpoint_url = "http://workflow-mgt.choreo-system:9082/workflow-mgt/v1"
max_retries = "3"
retry_delay = "1000"

[choreo.appdev.sts]
management_service_url="http://sts-mgt-service.choreo-system:3000/api/v1"

[choreo.api_key_service]
endpoint_url="http://api-key-service.choreo-system:8080"

[apim.ai]
enable = {{ .Values.config.apimAIEnable }}
client_id = {{ .Values.config.apimAIClientId | quote }}
client_secret = "$env{APIM_AI_CLIENT_SECRET}"
token_endpoint = {{ .Values.config.apimAITokenEndpoint | quote }}
devportal_theming.endpoint = {{ .Values.config.apimAIDevportalThemingEndpoint | quote }}
api_design.endpoint =  {{ .Values.config.apimAIAPIDesignEndpoint | quote }}

[choreo.system_metrics]
enable="true"
log_interval="3s"

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: product-apim
  namespace: {{ .Values.global.namespaces.apim }}
  labels:
    {{- include "product-apim.labels" . | nindent 4 }}
spec:
  provider: vault
  secretObjects:
    - secretName: product-apim
      type: Opaque
      data:
        - objectName: PRIMARY_KEYSTORE_PSWD
          key: PRIMARY_KEYSTORE_PSWD
        - objectName: PRIMARY_KEYSTORE_KEY_PSWD
          key: PRIMARY_KEYSTORE_KEY_PSWD
        - objectName: TLS_KEYSTORE_PSWD
          key: TLS_KEYSTORE_PSWD
        - objectName: TLS_KEYSTORE_KEY_PSWD
          key: TLS_KEYSTORE_KEY_PSWD
        - objectName: INTERNAL_KEYSTORE_PSWD
          key: INTERNAL_KEYSTORE_PSWD
        - objectName: INTERNAL_KEYSTORE_KEY_PSWD
          key: INTERNAL_KEYSTORE_KEY_PSWD
        - objectName: TRUSTSTORE_PSWD
          key: TRUSTSTORE_PSWD
        - objectName: CHOREO_APIM_DB_PASSWORD
          key: CHOREO_APIM_DB_PASSWORD
        - objectName: CHOREO_APIM_SHARED_DB_PASSWORD
          key: CHOREO_APIM_SHARED_DB_PASSWORD
        - objectName: CHOREO_APIM_USER_DB_PASSWORD
          key: CHOREO_APIM_USER_DB_PASSWORD
        - objectName: MONGO_DB_ATLAS_PRIVATE_KEY
          key: MONGO_DB_ATLAS_PRIVATE_KEY
        - objectName: MONGO_DB_ATLAS_PUBLIC_KEY
          key: MONGO_DB_ATLAS_PUBLIC_KEY
        - objectName: SUPER_ADMIN_PSWD
          key: SUPER_ADMIN_PSWD
        - objectName: ASGARDEO_SYSTEM_APP_CLIENT_SECRET
          key: ASGARDEO_SYSTEM_APP_CLIENT_SECRET
        - objectName: APIM_DASHBOARD_USER_PWD
          key: APIM_DASHBOARD_USER_PWD
        - objectName: APIM_DASHBOARD_USER_PWD_SHA256
          key: APIM_DASHBOARD_USER_PWD_SHA256
        - objectName: DEVPORTAL_V2_ACCESS_KEY
          key: DEVPORTAL_V2_ACCESS_KEY
        - objectName: APIM_AI_CLIENT_SECRET
          key: APIM_AI_CLIENT_SECRET
        - objectName: ASB_CONNECTION_STRING
          key: ASB_CONNECTION_STRING
  parameters:
    vaultAddress: {{ .Values.global.vault.url }}
    roleName: {{ .Values.vault.roleName }}
    objects: |
      - objectName: PRIMARY_KEYSTORE_PSWD
        secretKey: {{ .Values.secrets.primaryKeystorePassword.key | quote }}
        secretPath: {{ .Values.secrets.primaryKeystorePassword.path | quote }}
      - objectName: PRIMARY_KEYSTORE_KEY_PSWD
        secretKey: {{ .Values.secrets.primaryKeystoreKeyPassword.key | quote }}
        secretPath: {{ .Values.secrets.primaryKeystoreKeyPassword.path | quote }}
      - objectName: TLS_KEYSTORE_PSWD
        secretKey: {{ .Values.secrets.tlsKeystorePassword.key | quote }}
        secretPath: {{ .Values.secrets.tlsKeystorePassword.path | quote }}
      - objectName: TLS_KEYSTORE_KEY_PSWD
        secretKey: {{ .Values.secrets.tlsKeystoreKeyPassword.key | quote }}
        secretPath: {{ .Values.secrets.tlsKeystoreKeyPassword.path | quote }}
      - objectName: INTERNAL_KEYSTORE_PSWD
        secretKey: {{ .Values.secrets.internalKeystorePassword.key | quote }}
        secretPath: {{ .Values.secrets.internalKeystorePassword.path | quote }}
      - objectName: INTERNAL_KEYSTORE_KEY_PSWD
        secretKey: {{ .Values.secrets.internalKeystoreKeyPassword.key | quote }}
        secretPath: {{ .Values.secrets.internalKeystoreKeyPassword.path | quote }}
      - objectName: TRUSTSTORE_PSWD
        secretKey: {{ .Values.secrets.truststorePassword.key | quote }}
        secretPath: {{ .Values.secrets.truststorePassword.path | quote }}
      - objectName: CHOREO_APIM_DB_PASSWORD
        secretKey: {{ .Values.secrets.choreoAPIMDBPassword.key | quote }}
        secretPath: {{ .Values.secrets.choreoAPIMDBPassword.path | quote }}
      - objectName: CHOREO_APIM_SHARED_DB_PASSWORD
        secretKey: {{ .Values.secrets.choreoAPIMSharedDBPassword.key | quote }}
        secretPath: {{ .Values.secrets.choreoAPIMSharedDBPassword.path | quote }}
      - objectName: CHOREO_APIM_USER_DB_PASSWORD
        secretKey: {{ .Values.secrets.choreoAPIMUserDBPassword.key | quote }}
        secretPath: {{ .Values.secrets.choreoAPIMUserDBPassword.path | quote }}
      - objectName: MONGO_DB_ATLAS_PRIVATE_KEY
        secretKey: {{ .Values.secrets.mongoDBAtlasPrivateKey.key | quote }}
        secretPath: {{ .Values.secrets.mongoDBAtlasPrivateKey.path | quote }}
      - objectName: MONGO_DB_ATLAS_PUBLIC_KEY
        secretKey: {{ .Values.secrets.mongoDBAtlasPublicKey.key | quote }}
        secretPath: {{ .Values.secrets.mongoDBAtlasPublicKey.path | quote }}
      - objectName: SUPER_ADMIN_PSWD
        secretKey: {{ .Values.secrets.superAdminPassword.key | quote }}
        secretPath: {{ .Values.secrets.superAdminPassword.path | quote }}
      - objectName: ASGARDEO_SYSTEM_APP_CLIENT_SECRET
        secretKey: {{ .Values.secrets.asgardeoSystemAppClientSecret.key | quote }}
        secretPath: {{ .Values.secrets.asgardeoSystemAppClientSecret.path | quote }}
      - objectName: APIM_DASHBOARD_USER_PWD
        secretKey: {{ .Values.secrets.apimDashboardUserPassword.key | quote }}
        secretPath: {{ .Values.secrets.apimDashboardUserPassword.path | quote }}
      - objectName: APIM_DASHBOARD_USER_PWD_SHA256
        secretKey: {{ .Values.secrets.apimDashboardUserPasswordSHA256.key | quote }}
        secretPath: {{ .Values.secrets.apimDashboardUserPasswordSHA256.path | quote }}
      - objectName: DEVPORTAL_V2_ACCESS_KEY
        secretKey: {{ .Values.secrets.devportalV2AccessKey.key | quote }}
        secretPath: {{ .Values.secrets.devportalV2AccessKey.path | quote }}
      - objectName: APIM_AI_CLIENT_SECRET
        secretKey: {{ .Values.secrets.apimAIClientSecret.key | quote }}
        secretPath: {{ .Values.secrets.apimAIClientSecret.path | quote }}
      - objectName: ASB_CONNECTION_STRING
        secretKey: {{ .Values.secrets.asbConnectionString.key | quote }}
        secretPath: {{ .Values.secrets.asbConnectionString.path | quote }}
      - objectName: primary-keystore.pfx
        secretKey: {{ .Values.secrets.primaryKeystore.key | quote }}
        secretPath: {{ .Values.secrets.primaryKeystore.path | quote }}
        encoding: base64
      - objectName: tls-keystore.pfx
        secretKey: {{ .Values.secrets.tlsKeystore.key | quote }}
        secretPath: {{ .Values.secrets.tlsKeystore.path | quote }}
        encoding: base64
      - objectName: internal-keystore.pfx
        secretKey: {{ .Values.secrets.internalKeystore.key | quote }}
        secretPath: {{ .Values.secrets.internalKeystore.path | quote }}
        encoding: base64
      - objectName: client-truststore.jks
        secretKey: {{ .Values.secrets.clientTruststore.key | quote }}
        secretPath: {{ .Values.secrets.clientTruststore.path | quote }}
        encoding: base64

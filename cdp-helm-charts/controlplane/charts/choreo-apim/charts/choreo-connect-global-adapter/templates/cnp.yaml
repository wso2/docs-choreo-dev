apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: choreo-connect-global-adapter
  labels:
    {{- include "choreo-connect-global-adapter.labels" . | nindent 4 }}
  namespace: {{ .Values.global.namespaces.apim }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "choreo-connect-global-adapter.labels" . | nindent 6 }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            choreo.component: apim-am
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "9843"
              protocol: TCP
            - port: "18000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            cc.component: choreo-connect-adapter
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            choreo.component: apim-proxy-deployer
            k8s:io.kubernetes.pod.namespace: choreo-system
        - matchLabels:
            choreo.component: cp-consolidated-service
            k8s:io.kubernetes.pod.namespace: choreo-system
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP

apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "choreo-connect-global-adapter.labels" . | nindent 4 }}
  name: choreo-connect-global-adapter
spec:
  selector:
    {{- include "choreo-connect-global-adapter.labels" . | nindent 4 }}
  ports:
    - name: "http-gamanagementserver"
      port: 18000
      targetPort: 18000
      protocol: TCP
    - name: "https-global-adapter"
      port: 9843
      targetPort: 9843
      protocol: TCP
    - name: "http-global-adapter-api-server"
      port: 9090
      targetPort: 9090
      protocol: TCP

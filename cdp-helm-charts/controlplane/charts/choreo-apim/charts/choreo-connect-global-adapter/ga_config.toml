# The configuration file for mgw

[keystore]
  certPath = "/home/wso2/security/keystore/global-adapter.pem"
  keyPath = "/home/wso2/security/keystore/global-adapter.key"

[truststore]
  location = "/home/wso2/security/truststore"

[mizzen]
host = {{ .Values.config.mizzenHost | quote }}

[partitionExceedAlertSettings]
namespace = "$env{PARTITION_CHECK_NAMESPACE}"
pollingInterval = "900s"
retryInterval = "5s"
retryCount = 20

# Control plane's connection details
[controlPlane]
  serviceUrl = "https://choreo-am-service:9443/"
  username = {{ .Values.config.apimAdminUsername | quote }}
  password = "$env{apim_admin_pwd}"
  [controlPlane.brokerConnectionParameters]
    eventListeningEndpoints = ["$env{asb_connection_string}"]
    reconnectInterval = 5000
    reconnectRetryCount = 60

[environmentConfig]
{{- range .Values.config.dataplanes }}
[[environmentConfig.dataplanes]]
  id = "{{ .id }}"
  partitionSize = {{ .partitionSize | default 1000 }}
  [environmentConfig.dataplanes.redisServer]
    host = '{{ .redisHost }}'
    port = 6380
    password = '{{ .redisPassword | default "$env{redis_password}" }}'
    clientName = 'global-adapter'
    databaseIndex = 0
    testDatabaseIndex = 6
    connectionPoolSize = 3
    maxRetryCount = 10
{{- end }}

[server]
  host = '0.0.0.0'
  port = '9843'
  partitionSize = 1000
  [[server.users]]
    username = {{ .Values.config.gaAdminUsername | quote }}
    password = '$env{ga_admin_pwd}'

[database]
  name = 'choreo_global_adapter_db'
  username = 'choreo_global_adapter_db_user'
  password = '$env{ga_db_pwd}'
  host = {{ .Values.config.dbHost | quote }}
  port = 1433
  validationQuery = 'select 1'
  [database.pooloptions]
  maxActive = 500
  maxIdle = 30

[redisServer]
  host = {{ .Values.global.redis.host | quote }}
  port = {{ .Values.global.redis.port | quote }}
  password = '$env{redis_password}'
  clientName = 'global-adapter'
  databaseIndex = 0
  connectionPoolSize = 3
  maxRetryCount = 10

[orgBlocking]
  enabled = true

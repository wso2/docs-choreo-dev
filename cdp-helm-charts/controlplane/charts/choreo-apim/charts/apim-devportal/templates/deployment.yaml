apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip4: CKV_K8S_25=Temporarily suppressing as there is no defined fix for this by the Bridgecrew
    checkov.io/skip6: CKV_K8S_38=Service account token is required when using Linkerd
  labels:
    {{- include "apim-devportal.labels" . | nindent 4 }}
  name: apim-devportal-deployment
  namespace: {{ .Values.global.namespaces.apim }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "apim-devportal.labels" . | nindent 6 }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "apim-devportal.labels" . | nindent 8 }}
    spec:
      {{- if .Values.autoscaling.enabled }}
      {{- $minReplicas := .Values.autoscaling.minReplicas | int64 }}
      {{- if ge $minReplicas 2 }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: choreo.component
                    operator: In
                    values:
                      - apim-devportal
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: true
      containers:
        - image: {{ .Values.global.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10500
            runAsGroup: 10500
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
              add:
                - NET_RAW
            readOnlyRootFilesystem: true
          name: apim-devportal
          envFrom:
            - configMapRef:
                name: cm-feature-flags
          readinessProbe:
            initialDelaySeconds: 15
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: 8080
              path: /health
          livenessProbe:
            initialDelaySeconds: 20
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: 8080
              path: /health
          ports:
            - containerPort: 8080
              name: devportal-port
              protocol: TCP
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 50m
              memory: 50Mi
          volumeMounts:
            - name: devportal-var-cache-dir
              mountPath: /var/cache/nginx
            - name: devportal-var-run-dir
              mountPath: /var/run
            - name: devportal-conf
              mountPath: /app/devportal.config.js
              subPath: devportal.config.js
      restartPolicy: Always
      volumes:
        - name: devportal-conf
          configMap:
            name: devportal-config
        - name: devportal-var-cache-dir
          emptyDir: {}
        - name: devportal-var-run-dir
          emptyDir: {}

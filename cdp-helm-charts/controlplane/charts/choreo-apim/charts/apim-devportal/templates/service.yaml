apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "apim-devportal.labels" . | nindent 4 }}
  name: apim-devportal-svc
  namespace: {{ .Values.global.namespaces.apim }}
spec:
  type: ClusterIP
  ports:
    - name: devportal-port
      port: 8080
      targetPort: devportal-port
  selector:
    {{- include "apim-devportal.labels" . | nindent 4 }}

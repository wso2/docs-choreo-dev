apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: apim-devportal
  namespace: {{ .Values.global.namespaces.apim }}
  labels:
    {{- include "apim-devportal.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "apim-devportal.labels" . | nindent 6 }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: choreo-system
            k8s:io.kubernetes.pod.namespace: choreo-system-nginx-ingress
        - matchLabels:
            app.kubernetes.io/instance: controlplane-internal-nginx-ingress
            k8s:io.kubernetes.pod.namespace: controlplane-internal-nginx-ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

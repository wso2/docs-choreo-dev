Configuration:
  Appenders:
    Console:
      name: Console
      target: SYSTEM_OUT
      PatternLayout:
        pattern: >-
          %style{%d{ISO8601}}{white} [%X{x-correlation-id}] governance-svc:
          %highlight{%-5level }[%style{%t}{bright,blue}]
          %style{%C}{bright,yellow}: %msg%n%throwable
  Loggers:
    Root:
      level: info
      AppenderRef:
        - ref: Console

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: choreo-governance-service
  namespace: {{ .Values.global.namespaces.apim }}
  labels:
    {{- include "choreo-governance-service.labels" . | nindent 4 }}
spec:
  provider: vault
  parameters:
    vaultAddress: {{ .Values.global.vault.url }}
    roleName: {{ .Values.vault.roleName }}
    objects: |
      - objectName: CHOREO_GOVERNANCE_DB_MSSQL_PASSWORD
        secretKey: {{ .Values.secrets.governanceDBPassword.key | quote }}
        secretPath: {{ .Values.secrets.governanceDBPassword.path | quote }}
      - objectName: APIM_SUPER_ADMIN_PASSWORD
        secretKey: {{ .Values.secrets.apimAdminPassword.key | quote }}
        secretPath: {{ .Values.secrets.apimAdminPassword.path | quote }}
      - objectName: APIM_AI_CLIENT_SECRET
        secretKey: {{ .Values.secrets.apimAIClientSecret.key | quote }}
        secretPath: {{ .Values.secrets.apimAIClientSecret.path | quote }}

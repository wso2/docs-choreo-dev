apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_AZURE_WSO2_2=LinkerD is not enabled
  name: app-gateway-oauth-agent
  labels:
    {{- include "app-gateway-oauth-agent.labels" . | nindent 4 }}
  namespace: {{ .Values.global.namespaces.apim }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app-gateway-oauth-agent.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app-gateway-oauth-agent.labels" . | nindent 8 }}
        userapp-ingress-allowed: "true"
    spec:
      {{- if .Values.autoscaling.enabled }}
      {{- $minReplicas := .Values.autoscaling.minReplicas | int64 }}
      {{- if ge $minReplicas 2 }}
      {{- include "app-gateway-oauth-agent.affinity" . | nindent 6 }}
      {{- end }}
      {{- end }}
      serviceAccountName: app-gateway-oauth-agent
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: {{ .Values.global.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: Always
          name: app-gateway-oauth-agent
          ports:
            - containerPort: 8080
              name: agoa-port
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: agoa-port
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: agoa-port
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - mountPath: /etc/agent-secrets
              name: app-gateway-oauth-agent
              readOnly: true
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 512Mi
              cpu: 500m
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          envFrom:
            - configMapRef:
                name: app-gateway-oauth-agent
      restartPolicy: Always
      volumes:
        - name: app-gateway-oauth-agent
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: app-gateway-oauth-agent

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: app-gateway-oauth-agent
  namespace: {{ .Values.global.namespaces.apim }}
  labels:
    {{- include "app-gateway-oauth-agent.labels" . | nindent 4 }}
spec:
  provider: vault
  parameters:
    vaultAddress: {{ .Values.global.vault.url }}
    roleName: {{ .Values.vault.roleName }}
    objects: |
      - objectName: OAUTH_AGENT_ENC_KEY
        secretKey: {{ .Values.secrets.encKey.key | quote }}
        secretPath: {{ .Values.secrets.encKey.path | quote }}
      - objectName: PAT_CLIENT_SECRET
        secretKey: {{ .Values.secrets.patClientSecret.key | quote }}
        secretPath: {{ .Values.secrets.patClientSecret.path | quote }}
      - objectName: REDIS_PASSWORD
        secretKey: {{ .Values.secrets.redisPassword.key | quote }}
        secretPath: {{ .Values.secrets.redisPassword.path | quote }}

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip2: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    {{ include "config-deployer-service.labels" . | indent 4 }}
  name: config-deployer-service
  namespace: {{ .Values.global.namespaces.apim }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{ include "config-deployer-service.labels" . | indent 6 }}
  template:
    metadata:
      labels:
        {{ include "config-deployer-service.labels" . | indent 8 }}
    spec:
      {{- if .Values.autoscaling.enabled }}
      {{- $minReplicas := .Values.autoscaling.minReplicas | int64 }}
      {{- if ge $minReplicas 2 }}
      {{- include "config-deployer-service.affinity" . | nindent 6 }}
      {{- end }}
      {{- end }}
      serviceAccountName: config-deployer-service
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: config-deployer-service
          imagePullPolicy: Always
          image: {{ .Values.global.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          resources:
            limits:
              cpu: 400m
              memory: 1024Mi
            requests:
              cpu: 200m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          ports:
            - containerPort: 9443
              name: http-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 20
            timeoutSeconds: 1
            periodSeconds: 20
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              scheme: HTTPS
              path: /health
              port: 9443
          livenessProbe:
            initialDelaySeconds: 20
            timeoutSeconds: 1
            periodSeconds: 20
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /health
              scheme: HTTPS
              port: 9443
          volumeMounts:
            - name: config-toml-volume
              mountPath: /home/wso2apk/config-deployer/conf/Config.toml
              subPath: config.toml
              readOnly: true
            - name: secret-apk-config-ds-certificate
              mountPath: /home/wso2apk/config-deployer/security
              readOnly: true
            - mountPath: /tmp
              name: tmp
            - mountPath: /home/wso2apk/config-deployer/tmp
              name: config-deployer-temp
      volumes:
        - configMap:
            defaultMode: 420
            name: config-deployer-service
          name: config-toml-volume
        - name: secret-apk-config-ds-certificate
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: config-deployer-service
            nodePublishSecretRef:
              name: csi-secret-store-azure
        - emptyDir: {}
          name: tmp
        - emptyDir: {}
          name: config-deployer-temp
      restartPolicy: Always

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: audit-logging
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "audit-logging.labels" . | nindent 4 }}
spec:
  provider: vault
  secretObjects:
    - secretName: audit-logging
      type: Opaque
      data:
        - objectName: STS_CLIENT_SECRET
          key: STS_CLIENT_SECRET
        - objectName: AZURE_LA_CLIENT_SECRET
          key: AZURE_LA_CLIENT_SECRET
  parameters:
    vaultAddress: {{ .Values.global.vault.url }}
    roleName: {{ .Values.vault.roleName }}
    objects: |
      - objectName: STS_CLIENT_SECRET
        secretKey: {{ .Values.secrets.stsClientSecret.key | quote }}
        secretPath: {{ .Values.secrets.stsClientSecret.path | quote }}
      - objectName: AZURE_LA_CLIENT_SECRET
        secretKey: {{ .Values.secrets.azureLAClientSecret.key | quote }}
        secretPath: {{ .Values.secrets.azureLAClientSecret.path | quote }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: dp-cloud-manager
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{ include "dp-cloud-manager.labels" . | indent 4 }}
data:
  SECRET_MANAGER_URL: http://dp-secret-manager/api/v1
  RUDDER_URL: http://dp-rudder/api/v1/
  PROJECT_MANAGER_URL: http://dp-project-manager:80
  CICD_URL: http://dp-cicd:80
  SERVER_PORT: "3200"
  DB_USERNAME: choreo_cloud_manager_admin_db_user
  DB_NAME: choreo_cloud_manager_db
  DB_PORT: "1443"
  DB_TYPE: mssql
  ACR_URL_TEMPLATE: "https://%s/acr/v1/%s"
  DB_HOST: {{ .Values.config.dbHost }}
  DATA_PLANE_SUPPORTED_REGIONS: {{ .Values.config.dataPlaneSupportedRegions | quote}}
  COMMON_CREDENTIAL_LIMIT: {{ .Values.config.commonCredentialLimit }}

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: dp-cloud-manager
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "dp-cloud-manager.labels" . | nindent 4 }}
spec:
  provider: vault
  secretObjects:
    - secretName: dp-cloud-manager
      type: Opaque
      data:
        - objectName: DB_PASSWORD
          key: DB_PASSWORD
        - objectName: TOKEN_SIGNING_KEY
          key: TOKEN_SIGNING_KEY
  parameters:
    vaultAddress: {{ .Values.global.vault.url }}
    roleName: {{ .Values.vault.roleName }}
    objects: |
      - objectName: DB_PASSWORD
        secretKey: {{ .Values.secrets.dbPassword.key | quote }}
        secretPath: {{ .Values.secrets.dbPassword.path | quote }}
      - objectName: TOKEN_SIGNING_KEY
        secretKey: {{ .Values.secrets.tokenSigningKey.key | quote }}
        secretPath: {{ .Values.secrets.tokenSigningKey.path | quote }}

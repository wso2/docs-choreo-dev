replicaCount: 1
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
image:
  repository: choreoipaas/dp-cloud-manager
  tag: latest
serviceAccount:
  annotations: {}
secrets:
  dbPassword:
    path: choreo-cp/data/choreo-system/dp-cloud-manager
    key: dbPassword
  tokenSigningKey:
    path: choreo-cp/data/choreo-system/dp-cloud-manager
    key: tokenSigningKey
vault:
  roleName: dp-cloud-manager
config:
  dbHost: sqlfg-choreo-choreo-cloud-manager-db-prod.database.windows.net
  dataPlaneSupportedRegions: US,EU,US-CDP-2
  commonCredentialLimit: 10

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip2: CKV_K8S_38=Temporarily suppressing till fixing
    checkov.io/skip3: CKV_K8S_28=Temporarily suppressing till fixing
    checkov.io/skip4: CKV_K8S_37=Temporarily suppressing till fixing
  labels:
    {{- include "subscriptions-service.labels" . | nindent 4 }}
  name: subscriptions-service
  namespace: {{ .Values.global.namespaces.system }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "subscriptions-service.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "subscriptions-service.labels" . | nindent 8 }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: subscriptions
          image: {{ .Values.global.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          envFrom:
            - secretRef:
                name: subscriptions-service
            - configMapRef:
                name: subscriptions-service
          ports:
            - containerPort: 9090
              name: grpc-port
            - containerPort: 9091      # To be used for readiness/liveness probes (internal)
              name: health
            - containerPort: 9092      # To be used for public health check (external)
              name: healthz
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health
              path: /liveness
          resources:
            limits:
              cpu: 500m
              memory: 768Mi
            requests:
              cpu: 300m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10500
            runAsGroup: 10500
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          volumeMounts:
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
            - name: secret-subscriptions
              mountPath: /mnt/csi/secret-subscriptions
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: subscriptions-service
        - name: secret-subscriptions
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: subscriptions-service
      serviceAccountName: subscriptions-service
      {{- if .Values.autoscaling.enabled }}
      {{- $minReplicas := .Values.autoscaling.minReplicas | int64 }}
      {{- if ge $minReplicas 2 }}
      {{- include "subscriptions-service.affinity" . | nindent 6 }}
      {{- end }}
      {{- end }}

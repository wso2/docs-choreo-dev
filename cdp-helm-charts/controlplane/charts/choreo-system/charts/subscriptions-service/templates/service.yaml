apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "subscriptions-service.labels" . | nindent 4 }}
  name: subscriptions
  namespace: {{ .Values.global.namespaces.system }}
spec:
  ports:
    - name: grpc-port
      port: 9090
      targetPort: grpc-port
    - name: healthz
      port: 9092
      targetPort: healthz
  selector:
    {{- include "subscriptions-service.labels" . | nindent 4 }}

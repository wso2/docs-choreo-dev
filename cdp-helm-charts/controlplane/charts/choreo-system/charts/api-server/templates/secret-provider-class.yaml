apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-server
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "api-server.labels" . | nindent 4 }}
spec:
  provider: vault
  secretObjects:
    - secretName: api-server
      type: Opaque
      data:
        - objectName: IDP_CLIENT_SECRET
          key: IDP_CLIENT_SECRET
  parameters:
    vaultAddress: {{ .Values.global.vault.url }}
    roleName: {{ .Values.vault.roleName }}
    objects: |
      - objectName: IDP_CLIENT_SECRET
        secretKey: {{ .Values.secrets.idpClientSecret.key | quote }}
        secretPath: {{ .Values.secrets.idpClientSecret.path | quote }}

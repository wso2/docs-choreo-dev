apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    {{- include "api-server.labels" . | nindent 4 }}
  name: api-server
  namespace: {{ .Values.global.namespaces.system }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "api-server.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api-server.labels" . | nindent 8 }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: {{ .Values.global.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          name: api-server
          envFrom:
            - secretRef:
                name: api-server
          ports:
            - containerPort: 8080
              name: http-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            httpGet:
              path: /readyz
              port: http-port
          livenessProbe:
            initialDelaySeconds: 20
            periodSeconds: 30
            httpGet:
              path: /livez
              port: http-port
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 12000
            runAsGroup: 12000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          volumeMounts:
            - mountPath: /api-server.yaml
              name: config
              subPath: api-server.yaml
            - name: secret-volume
              mountPath: /mnt/csi/secret-volume
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: api-server
        - name: secret-volume
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: api-server
      serviceAccountName: api-server
      {{- if .Values.autoscaling.enabled }}
      {{- $minReplicas := .Values.autoscaling.minReplicas | int64 }}
      {{- if ge $minReplicas 2 }}
      {{- include "api-server.affinity" . | nindent 6 }}
      {{- end }}
      {{- end }}

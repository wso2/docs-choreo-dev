  tag: latest
vault:
  roleName: delete-manager
serviceAccount:
  annotations: {}
config:
  env: prod
  mssqlHost: sqlfg-choreo-choreo-delete-manager-db-prod.database.windows.net
  connectorBuilderUrl: https://app.choreo.dev
  apimClientId: ymy2brRWj2CKqtB6X6inBrcTUZIa
  gchatSpaceId: AAAAG_THA0Q
  ballerinaCentralURL: https://api.central.ballerina.io
secrets:
  mssqlPassword:
    path: choreo-cp/data/choreo-system/cp-graphql

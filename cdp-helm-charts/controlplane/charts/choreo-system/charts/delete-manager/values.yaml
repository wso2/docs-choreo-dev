  asbConectionString:
    path: choreo-cp/data/choreo-system/cp-graphql
    key: asbConectionString
  apimRestAPIConsumerSecret:
    path: choreo-cp/data/choreo-system/cp-graphql
    key: apimRestAPIConsumerSecret
  apimAdminPassword:
    path: choreo-cp/data/choreo-system/cp-graphql
    key: apimAdminPassword
  gchatKey:
    path: choreo-cp/data/choreo-system/cp-graphql
    key: gchatKey
  gchatToken:
    path: choreo-cp/data/choreo-system/cp-graphql
    key: gchatToken

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: delete-manager
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "delete-manager.labels" . | nindent 4 }}
spec:
  provider: vault
  secretObjects:
    - secretName: delete-manager
      type: Opaque
      data:
        - objectName: MSSQL_PASSWORD
          key: MSSQL_PASSWORD
        - objectName: ASB_CONNECTION_STRING
          key: ASB_CONNECTION_STRING
        - objectName: APIM_REST_API_CONSUMER_SECRET
          key: APIM_REST_API_CONSUMER_SECRET
        - objectName: APIM_ADMIN_PASSWORD
          key: APIM_ADMIN_PASSWORD
        - objectName: GCHAT_KEY
          key: GCHAT_KEY
        - objectName: GCHAT_TOKEN
          key: GCHAT_TOKEN
  parameters:
    vaultAddress: {{ .Values.global.vault.url }}
    roleName: {{ .Values.vault.roleName }}
    objects: |
      - objectName: MSSQL_PASSWORD
        secretKey: {{ .Values.secrets.mssqlPassword.key | quote }}
        secretPath: {{ .Values.secrets.mssqlPassword.path | quote }}
      - objectName: ASB_CONNECTION_STRING
        secretKey: {{ .Values.secrets.asbConectionString.key | quote }}
        secretPath: {{ .Values.secrets.asbConectionString.path | quote }}
      - objectName: APIM_REST_API_CONSUMER_SECRET
        secretKey: {{ .Values.secrets.apimRestAPIConsumerSecret.key | quote }}
        secretPath: {{ .Values.secrets.apimRestAPIConsumerSecret.path | quote }}
      - objectName: APIM_ADMIN_PASSWORD
        secretKey: {{ .Values.secrets.apimAdminPassword.key | quote }}
        secretPath: {{ .Values.secrets.apimAdminPassword.path | quote }}
      - objectName: GCHAT_KEY
        secretKey: {{ .Values.secrets.gchatKey.key | quote }}
        secretPath: {{ .Values.secrets.gchatKey.path | quote }}
      - objectName: GCHAT_TOKEN
        secretKey: {{ .Values.secrets.gchatToken.key | quote }}
        secretPath: {{ .Values.secrets.gchatToken.path | quote }}

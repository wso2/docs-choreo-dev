apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: email-service
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "email-service.labels" . | nindent 4 }}
spec:
  provider: vault
  secretObjects:
    - secretName: email-service
      type: Opaque
      data:
        - objectName: MAIL_SMTP_AUTH_PASSWORD
          key: MAIL_SMTP_AUTH_PASSWORD
        - objectName: MAIL_SMTP_AUTH_USERNAME
          key: MAIL_SMTP_AUTH_USERNAME
        - objectName: MAIL_SMTP_HOST
          key: MAIL_SMTP_HOST
        - objectName: MAIL_SMTP_PORT
          key: MAIL_SMTP_PORT
        - objectName: SENDER_MAIL
          key: SENDER_MAIL
  parameters:
    vaultAddress: {{ .Values.global.vault.url }}
    roleName: {{ .Values.vault.roleName }}
    objects: |
      - objectName: MAIL_SMTP_AUTH_PASSWORD
        secretKey: {{ .Values.secrets.mailSmtpAuthPassword.key | quote }}
        secretPath: {{ .Values.secrets.mailSmtpAuthPassword.path | quote }}
      - objectName: MAIL_SMTP_AUTH_USERNAME
        secretKey: {{ .Values.secrets.mailSmtpAuthUsername.key | quote }}
        secretPath: {{ .Values.secrets.mailSmtpAuthUsername.path | quote }}
      - objectName: MAIL_SMTP_HOST
        secretKey: {{ .Values.secrets.mailSmtpHost.key | quote }}
        secretPath: {{ .Values.secrets.mailSmtpHost.path | quote }}
      - objectName: MAIL_SMTP_PORT
        secretKey: {{ .Values.secrets.mailSmtpPort.key | quote }}
        secretPath: {{ .Values.secrets.mailSmtpPort.path | quote }}
      - objectName: SENDER_MAIL
        secretKey: {{ .Values.secrets.senderMail.key | quote }}
        secretPath: {{ .Values.secrets.senderMail.path | quote }}

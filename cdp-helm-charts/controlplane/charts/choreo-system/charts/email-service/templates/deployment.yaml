apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=Required by LinkerD
  labels:
    {{- include "email-service.labels" . | nindent 4 }}
  name: email-service
  namespace: {{ .Values.global.namespaces.system }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "email-service.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "email-service.labels" . | nindent 8 }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: email-service
          imagePullPolicy: Always
          image: {{ .Values.global.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          resources:
            limits:
              cpu: 500m
              memory: 400Mi
            requests:
              cpu: 250m
              memory: 300Mi
          envFrom:
            - configMapRef:
                name: email-service
            - secretKeyRef:
                name: email-service
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 10500
            runAsGroup: 10500
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8082
              name: email-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /service/healthz
              port: email-port
              scheme: HTTPS
          livenessProbe:
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /service/healthz
              port: email-port
              scheme: HTTPS
          volumeMounts:
            - name: secret-email-service
              mountPath: "/mnt/csi/secret-email-service"
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secret-email-service
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: email-service
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
      serviceAccountName: email-service
      {{- if .Values.autoscaling.enabled }}
      {{- $minReplicas := .Values.autoscaling.minReplicas | int64 }}
      {{- if ge $minReplicas 2 }}
      {{- include "email-service.affinity" . | nindent 6 }}
      {{- end }}
      {{- end }}

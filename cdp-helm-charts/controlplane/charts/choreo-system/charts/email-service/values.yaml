replicaCount: 1
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
image:
  repository: choreoipaas/email-service
  tag: latest
serviceAccount:
  annotations: {}
secrets:
  mailSmtpAuthPassword:
    path: choreo-cp/data/choreo-system/email-service
    key: mailSmtpAuthPassword
  mailSmtpAuthUsername:
    path: choreo-cp/data/choreo-system/email-service
    key: mailSmtpAuthUsername
  mailSmtpHost:
    path: choreo-cp/data/choreo-system/email-service
    key: mailSmtpHost
  mailSmtpPort:
    path: choreo-cp/data/choreo-system/email-service
    key: mailSmtpPort
  senderMail:
    path: choreo-cp/data/choreo-system/email-service
    key: senderMail
vault:
  roleName: email-service
config:
  senderEmailsChoreo: "Choreo<noreply@choreo.dev>"

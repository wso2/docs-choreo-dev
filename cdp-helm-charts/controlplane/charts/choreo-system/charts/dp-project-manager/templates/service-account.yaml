apiVersion: v1
kind: ServiceAccount
metadata:
  name: dp-project-manager
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "dp-project-manager.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.global.image.pullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
automountServiceAccountToken: true

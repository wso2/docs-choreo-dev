apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "dp-project-manager.labels" . | nindent 4 }}
  name: dp-project-manager
  namespace: {{ .Values.global.namespaces.system }}
spec:
  selector:
    {{- include "dp-project-manager.labels" . | nindent 4 }}
  ports:
    - name: dp-project-manager-port-http
      port: 80
      protocol: TCP
      targetPort: http-port

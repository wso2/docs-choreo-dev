replicaCount: 1
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
image:
  repository: choreoipaas/dp-project-manager
  tag: latest
serviceAccount:
  annotations: {}
secrets:
  mongodbPassword:
    path: choreo-cp/data/choreo-system/dp-project-manager
    key: mongodbPassword
  apimClientSecret:
    path: choreo-cp/data/choreo-system/dp-project-manager
    key: apimClientSecret
vault:
  roleName: dp-project-manager
config:
  mongodbUser: prod_choreo_dp_project_manager
  mongodbHost: choreo-apim-pl-0.lbxa7.mongodb.net
  mongodbDatabase: PROD_DP_PROJECT_MANAGER
  defaultRegion: US
  availableRegions: US,EU,US-CDP-2
  projectEnvInitEnabled: true
  repoVisibilityEnabled: true
  componentRestrictionFeatureEnabled: true
  apimUrl: https://choreo-am-service.prod-choreo-apim:9443
  apimClientId: dsfo7mn62P42qfbfCt2lOYMG5aka
  marketplaceApimAppCreationEnabled: true
  newProjectHandlerFlowEnabled: true
  newComponentHandlerFlowEnabled: true
  authzServiceGrpcEndpoint: "choreo-resource-authorization-service.prod-choreo-authorization.svc.cluster.local:9090"
  authzServiceProjectAuthorizationEnabled: true
  enableStsManagementService: true

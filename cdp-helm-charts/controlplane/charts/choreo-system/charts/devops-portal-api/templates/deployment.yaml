apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip2: CKV_K8S_38=This is required by LinkerD
  labels:
    {{- include "devops-portal-api.labels" . | nindent 4 }}
  name: devops-portal-api
  namespace: {{ .Values.global.namespaces.system }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "devops-portal-api.labels" . | nindent 6 }}
  strategy: {}
  template:
    metadata:
      labels:
        {{- include "devops-portal-api.labels" . | nindent 8 }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: devops-portal-api
          image: {{ .Values.global.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          envFrom:
            - secretRef:
                name: devops-portal-api
          ports:
            - containerPort: 8089
              name: devopsapi-port
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: devopsapi-port
              path: /healthz
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: devopsapi-port
              path: /healthz
          resources:
            limits:
              cpu: 250m
              memory: 500Mi
            requests:
              cpu: 100m
              memory: 250Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10000
            runAsGroup: 10000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          volumeMounts:
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
            - name: tmp
              mountPath: /tmp
            - name: secret-devops-portal-api
              mountPath: "/mnt/csi/secret-devops-portal-api"
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: devops-portal-api
        - name: tmp
          emptyDir: {}
        - name: secret-devops-portal-api
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: devops-portal-api
      serviceAccountName: devops-portal-api
      {{- if .Values.autoscaling.enabled }}
      {{- $minReplicas := .Values.autoscaling.minReplicas | int64 }}
      {{- if ge $minReplicas 2 }}
      {{- include "devops-portal-api.affinity" . | nindent 6 }}
      {{- end }}
      {{- end }}

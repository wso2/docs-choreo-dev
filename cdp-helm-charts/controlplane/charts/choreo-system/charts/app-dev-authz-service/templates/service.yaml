apiVersion: v1
kind: Service
metadata:
  labels:
    {{ include "app-dev-authz-service.labels" . | indent 4 }}
  name: app-dev-authorization-service
  namespace: {{ .Values.global.namespaces.system }}
spec:
  ports:
    - name: service-port
      port: 9090
      protocol: TCP
      targetPort: service-port
    - name: health-port
      port: 9091
      protocol: TCP
      targetPort: health-port
  selector:
    {{ include "app-dev-authz-service.labels" . | indent 4 }}

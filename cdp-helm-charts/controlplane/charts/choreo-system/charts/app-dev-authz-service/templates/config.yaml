apiVersion: v1
kind: ConfigMap
metadata:
  name: app-dev-authz-service
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{ include "app-dev-authz-service.labels" . | indent 4 }}
data:
  Config.toml: |
    {{ tpl (.Files.Get "Config.toml") . | nindent 4 }}
  DB_URL: {{ .Values.config.dbURL | quote }}
  MANAGE_ROLES_GROUP_SCOPE: "choreo:project_manage"
  DB_USERNAME: "choreo_app_dev_authz_svc_db_user"

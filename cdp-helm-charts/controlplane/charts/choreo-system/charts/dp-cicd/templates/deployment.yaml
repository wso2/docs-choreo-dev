apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_25=Temporarily suppressing till fixing
    checkov.io/skip2: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    {{- include "dp-cicd.labels" . | nindent 4 }}
  name: dp-cicd
  namespace: {{ .Values.global.namespaces.system }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dp-cicd.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dp-cicd.labels" . | nindent 8 }}
    spec:
      {{- if .Values.autoscaling.enabled }}
      {{- $minReplicas := .Values.autoscaling.minReplicas | int64 }}
      {{- if ge $minReplicas 2 }}
      {{- include "dp-cicd.affinity" . | nindent 6 }}
      {{- end }}
      {{- end }}
      automountServiceAccountToken: true
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dp-cicd
          imagePullPolicy: Always
          image: {{ .Values.global.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          resources:
            limits:
              cpu: 1
              memory: 1.5G
            requests:
              cpu: 500m
              memory: 500M
          envFrom:
            - configMapRef:
                name: dp-cicd
            - secretRef:
                name: dp-cicd
          env:
            - name: BUILDPACKS_BUILDER_IMAGE
              valueFrom:
                configMapKeyRef:
                  key: BUILDPACKS_BUILDER_IMAGE
                  name: common-env-variables
            - name: UNIT_TEST_RUNNER_IMAGE
              valueFrom:
                configMapKeyRef:
                  key: UNIT_TEST_RUNNER_IMAGE
                  name: common-env-variables
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          ports:
            - containerPort: 8080
              name: http-port
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 40
            timeoutSeconds: 120
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
          livenessProbe:
            initialDelaySeconds: 40
            timeoutSeconds: 120
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /healthz
              port: http-port
          volumeMounts:
            - name: secret-dp-cicd
              mountPath: "/mnt/csi/secret-dp-cicd"
              readOnly: true
      volumes:
        - name: secret-dp-cicd
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: dp-cicd
      restartPolicy: Always
      serviceAccountName: dp-cicd

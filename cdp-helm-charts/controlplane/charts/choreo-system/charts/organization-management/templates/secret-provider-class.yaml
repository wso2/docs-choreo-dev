apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: organization-management
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "organization-management.labels" . | nindent 4 }}
spec:
  provider: vault
  secretObjects:
    - secretName: organization-management
      type: Opaque
      data:
        - objectName: APP_DB_PASSWORD
          key: CHOREO_APP_DB_PASSWORD
        - objectName: SUBSCRIPTIONS_DB_PASSWORD
          key: CHOREO_SUBSCRIPTION_DB_PASSWORD
        - objectName: AZURE_ACCESS_KEY
          key: AZURE_ACCESS_KEY
        - objectName: KEYSTORE_PASSWORD
          key: KEYSTORE_PASSWORD
  parameters:
    vaultAddress: {{ .Values.global.vault.url }}
    roleName: {{ .Values.vault.roleName }}
    objects: |
      - objectName: APP_DB_PASSWORD
        secretKey: {{ .Values.secrets.appDBPassword.key | quote }}
        secretPath: {{ .Values.secrets.appDBPassword.path | quote }}
      - objectName: SUBSCRIPTIONS_DB_PASSWORD
        secretKey: {{ .Values.secrets.subscriptionsDBPassword.key | quote }}
        secretPath: {{ .Values.secrets.subscriptionsDBPassword.path | quote }}
      - objectName: AZURE_ACCESS_KEY
        secretKey: {{ .Values.secrets.azureAccessKey.key | quote }}
        secretPath: {{ .Values.secrets.azureAccessKey.path | quote }}
      - objectName: KEYSTORE_PASSWORD
        secretKey: {{ .Values.secrets.keystorePassword.key | quote }}
        secretPath: {{ .Values.secrets.keystorePassword.path | quote }}
      - objectName: choreo-organization-management-keystore.pfx
        secretKey: {{ .Values.secrets.choreoOrganizationManagementKeystore.key | quote }}
        secretPath: {{ .Values.secrets.choreoOrganizationManagementKeystore.path | quote }}
        encoding: base64

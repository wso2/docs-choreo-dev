apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "organization-management.labels" . | nindent 4 }}
  name: organization-management
  namespace: {{ .Values.global.namespaces.system }}
spec:
  selector:
    {{- include "organization-management.labels" . | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
    - name: health-public
      port: 9092
      targetPort: health-public
    - name: grpc
      port: 8080
      targetPort: grpc

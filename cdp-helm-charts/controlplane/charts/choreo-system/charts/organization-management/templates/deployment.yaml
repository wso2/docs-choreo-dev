apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_38=The SA token is required for the linkerd to define service identity
  labels:
    {{- include "organization-management.labels" . | nindent 4 }}
  name: organization-management
  namespace: {{ .Values.global.namespaces.system }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "organization-management.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "organization-management.labels" . | nindent 8 }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: organization-management
          image: {{ .Values.global.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          command: ["/home/ballerina/docker-entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: organization-management
            - secretRef:
                name: organization-management
          ports:
            - containerPort: 9090
              name: http
            - containerPort: 9091      # To be used for readiness/liveness probes (internal)
              name: health-internal
            - containerPort: 9092      # To be used for public health check (external)
              name: health-public
            - containerPort: 8080
              name: grpc
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health-internal
              path: /readiness
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              port: health-internal
              path: /liveness
          resources:
            limits:
              cpu: 300m
              memory: 550Mi
            requests:
              cpu: 200m
              memory: 450Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10500
            runAsGroup: 10500
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          volumeMounts:
            - name: config
              mountPath: /home/ballerina/Config.toml
              subPath: Config.toml
            - name: secret-organization-management
              mountPath: "/mnt/csi/secret-organization-management"
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: secret-organization-management
              mountPath: /home/ballerina/security/choreo-organization-management-keystore.pfx
              subPath: choreo-organization-management-keystore.pfx
              readOnly: true
            - name: keystore
              mountPath: /home/ballerina/keystore
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: organization-management
        - name: secret-organization-management
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: organization-management
        - name: tmp
          emptyDir: {}
        - name: keystore
          emptyDir: {}
      serviceAccountName: organization-management
      {{- if .Values.autoscaling.enabled }}
      {{- $minReplicas := .Values.autoscaling.minReplicas | int64 }}
      {{- if ge $minReplicas 2 }}
      {{- include "organization-management.affinity" . | nindent 6 }}
      {{- end }}
      {{- end }}

apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "configuration-service.labels" . | nindent 4 }}
  name: configuration-service
  namespace: {{ .Values.global.namespaces.system }}
spec:
  ports:
    - name: configsvc-port
      port: 8080
      targetPort: configsvc-port
    - name: healthz
      port: 8082
      targetPort: healthz
    - name: configmap-port
      port: 8084
      targetPort: configmap-port
  selector:
    {{- include "configuration-service.labels" . | nindent 4 }}

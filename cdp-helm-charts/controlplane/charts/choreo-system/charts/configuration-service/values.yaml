replicas: 1
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
image:
  repository: choreoipaas/choreo-cp-configuration-service
  tag: latest
vault:
  roleName: configuration-service
serviceAccount:
  annotations: {}
config:
  dbHost: choreo-prod-mssql-server.database.windows.net
  mappingDbHost: choreo-prod-mssql-server.database.windows.net
  isInstanceBasedAuthzEnabled: true
secrets:
  configurationSvcDBPassword:
    path: choreo-cp/data/choreo-system/configuration-service
    key: configurationSvcDBPassword
  configurationMappingSvcDBPassword:
    path: choreo-cp/data/choreo-system/configuration-service
    key: configurationMappingSvcDBPassword

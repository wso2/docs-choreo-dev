replicas: 1
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
image:
  repository: choreoipaas/api-key-service
  tag: latest
vault:
  roleName: api-key-service
serviceAccount:
  annotations: {}
secrets:
  choreoApiKeySvcDbPassword:
    path: choreo-cp/data/choreo-system/api-key-service
    key: choreoApiKeySvcDbPassword
  apimRestApiConsumerSecret:
    path: choreo-cp/data/choreo-system/api-key-service
    key: apimRestApiConsumerSecret
config:
  serverRequestBufferSize: 65536
  dbHost: postgresql-choreo-prod-eastus2-api-001.postgres.database.azure.com 
  keyLength: 52
  websubHubPublisherEnabled: true
  websubHubBaseUrl: https://publish.websubhub.choreo.dev/hub
  signatureValidationEnabled: true
  apimClientKey: dsfo7mn62P42qfbfCt2lOYMG5aka
  choreoIdpBaseUrl: https://sts.choreo.dev
  choreoIdpId: 6da03db5-5039-4eeb-ba3d-7e117108dff1

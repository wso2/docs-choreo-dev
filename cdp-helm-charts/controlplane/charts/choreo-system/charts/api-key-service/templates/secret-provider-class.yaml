apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-key-service
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "api-key-service.labels" . | nindent 4 }}
spec:
  provider: vault
  parameters:
    vaultAddress: {{ .Values.global.vault.url }}
    roleName: {{ .Values.vault.roleName }}
    objects: |
      - objectName: CHOREO_API_KEY_SVC_DB_PASSWORD
        secretKey: {{ .Values.secrets.choreoApiKeySvcDbPassword.key | quote }}
        secretPath: {{ .Values.secrets.choreoApiKeySvcDbPassword.path | quote }}
      - objectName: APIM_REST_API_CONSUMER_SECRET
        secretKey: {{ .Values.secrets.apimRestApiConsumerSecret.key | quote }}
        secretPath: {{ .Values.secrets.apimRestApiConsumerSecret.path | quote }}

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: dp-rudder
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "dp-rudder.labels" . | nindent 4 }}
spec:
  provider: vault
  secretObjects:
    - secretName: dp-rudder
      type: Opaque
      data:
        - objectName: MSSQL_PASSWORD
          key: MSSQL_PASSWORD
        - objectName: APIM_REST_API_CONSUMER_SECRET
          key: APIM_REST_API_CONSUMER_SECRET
        - objectName: ALERT_REST_API_CONSUMER_SECRET
          key: ALERT_REST_API_CONSUMER_SECRET
        - objectName: REDIS_PASSWORD
          key: REDIS_PASSWORD
        - objectName: REDIS_US_CDP_2_PASSWORD
          key: REDIS_US_CDP_2_PASSWORD
  parameters:
    vaultAddress: {{ .Values.global.vault.url }}
    roleName: {{ .Values.vault.roleName }}
    objects: |
      - objectName: MSSQL_PASSWORD
        secretKey: {{ .Values.secrets.mssqlPassword.key | quote }}
        secretPath: {{ .Values.secrets.mssqlPassword.path | quote }}
      - objectName: APIM_REST_API_CONSUMER_SECRET
        secretKey: {{ .Values.secrets.apimRestApiConsumerSecret.key | quote }}
        secretPath: {{ .Values.secrets.apimRestApiConsumerSecret.path | quote }}
      - objectName: ALERT_REST_API_CONSUMER_SECRET
        secretKey: {{ .Values.secrets.alertRestApiConsumerSecret.key | quote }}
        secretPath: {{ .Values.secrets.apimRestApiConsumerSecret.path | quote }}
      - objectName: REDIS_PASSWORD
        secretKey: {{ .Values.secrets.redisPassword.key | quote }}
        secretPath: {{ .Values.secrets.redisPassword.path | quote }}
      - objectName: REDIS_US_CDP_2_PASSWORD
        secretKey: {{ .Values.secrets.redisUsCdp2Password.key | quote }}
        secretPath: {{ .Values.secrets.redisUsCdp2Password.path | quote }}

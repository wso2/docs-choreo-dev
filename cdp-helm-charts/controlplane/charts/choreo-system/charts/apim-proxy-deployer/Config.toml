[cp.proxyDeployer.config]
maxRevisions = 20
resourceRegistryBasePath="http://resource-registry:9090/resource-registry"
workflowBasePath = "http://workflow-mgt:9082/workflow-mgt/v1"
enableWorkflowValidation = true

dbUser = "choreo_proxy_deployer_db_user"

proxyDeployerPort = 9095
healthCheckPort = 9091
listenerTimeout = {{ .Values.config.listenerTimeout }}

jwksEnabled = true
jwtTokenScopes = ["apim:api_manage", "apim:publisher_settings"]

mizzenServerBasePath = "http://dp-mizzen:80"

enableMarketplaceIntelligentRouting=true

[ballerina.http.accessLogConfig]
console = true

[ballerina.log]
level = {{ .Values.config.logLevel | quote }}

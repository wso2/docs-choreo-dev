apiVersion: v1
kind: Service
metadata:
  labels:
    {{ include "apim-proxy-deployer.labels" . | indent 4 }}
  name: choreo-apim-proxy-deployer
  namespace: {{ .Values.global.namespaces.system }}
spec:
  ports:
    - name: health
      port: 9091
      targetPort: health
    - name: healthz
      port: 9092
      targetPort: healthz
    - name: http-port
      port: 9095
      targetPort: http-port
  selector:
    {{ include "apim-proxy-deployer.labels" . | indent 4 }}

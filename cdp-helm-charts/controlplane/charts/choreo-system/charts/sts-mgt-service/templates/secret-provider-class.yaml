apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sts-mgt-service
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "sts-mgt-service.labels" . | nindent 4 }}
spec:
  provider: vault
  parameters:
    vaultAddress: {{ .Values.global.vault.url }}
    roleName: {{ .Values.vault.roleName }}
    objects: |
      - objectName: APIM_REST_API_CONSUMER_SECRET
        secretKey: {{ .Values.secrets.apimRestApiConsumerSecret.key | quote }}
        secretPath: {{ .Values.secrets.apimRestApiConsumerSecret.path | quote }}
      - objectName: CHOREO_STS_MGT_DB_PASSWORD
        secretKey: {{ .Values.secrets.choreostsMgtDbPassword.key | quote }}
        secretPath: {{ .Values.secrets.choreostsMgtDbPassword.path | quote }}
      - objectName: APIM_CLIENT_SECRET
        secretKey: {{ .Values.secrets.apimClientSecret.key | quote }}
        secretPath: {{ .Values.secrets.apimClientSecret.path | quote }}

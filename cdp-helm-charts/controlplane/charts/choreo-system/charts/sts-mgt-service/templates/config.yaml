apiVersion: v1
kind: ConfigMap
metadata:
  name: sts-mgt-service
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{ include "sts-mgt-service.labels" . | indent 4 }}
data:
  PORT: "3000"
  DB_HOST: {{ .Values.config.dbHost}}
  DB_PORT: "5432"
  DB_USERNAME: choreo_sts_mgt_svc_db_user
  DB_PASSWORD_FILE: /mnt/csi/secret-sts-mgt-svc/CHOREO_STS_MGT_DB_PASSWORD
  DB_NAME: choreo_sts_mgt_svc_db
  DB_SSL_MODE: require
  APIM_CLIENT_KEY: {{ .Values.config.apimClientKey }}
  APIM_CLIENT_SECRET_FILE: //mnt/csi/secret-sts-mgt-svc/APIM_REST_API_CONSUMER_SECRET
  APIM_SERVICE_URL: http://choreo-am-service.choreo-apim:9763
  MIZZEN_SERVICE_URL: http://dp-mizzen:80
  CHOREO_STS_SERVICE_URL: http://choreo-appdev-sts:9000
  CLOUD_MANAGER_SERVICE_URL: http://dp-cloud-manager
  CHOREO_IDP_ID: {{ .Values.config.choreoIdpId }}
  WEBSUB_HUB_PUBLISHER_ENABLED: {{ .Values.config.websubHubPublisherEnabled | quote }}
  WEBSUB_HUB_BASE_URL: {{ .Values.config.websubHubBaseUrl }}
  WEBSUB_HUB_TOPIC: {{ printf "%s-choreo_cp_events_topic" .Values.global.choreosystem.orgHandle | quote }}
  TOKEN_REVOCATION_CLIENT_ID: {{ .Values.config.tokenRevocationClientId }}
  APIM_SUPER_ADMIN_CLIENT_KEY: choreo_apim_admin
  APIM_SUPER_ADMIN_CLIENT_SECRET_FILE: /mnt/csi/secret-sts-mgt-svc/APIM_CLIENT_SECRET

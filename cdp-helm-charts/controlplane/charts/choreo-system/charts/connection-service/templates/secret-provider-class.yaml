apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: connection-service
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "connection-service.labels" . | nindent 4 }}
spec:
  provider: vault
  secretObjects:
    - secretName: connection-service
      type: Opaque
      data:
        - objectName: APIM_CLIENT_SECRET
          key: APIM_CLIENT_SECRET
        - objectName: CONNECTION_DB_PASSWORD
          key: CONNECTION_DB_PASSWORD
  parameters:
    vaultAddress: {{ .Values.global.vault.url }}
    roleName: {{ .Values.vault.roleName }}
    objects: |
      - objectName: APIM_CLIENT_SECRET
        secretKey: {{ .Values.secrets.apimClientSecret.key | quote }}
        secretPath: {{ .Values.secrets.apimClientSecret.path | quote }}
      - objectName: CONNECTION_DB_PASSWORD
        secretKey: {{ .Values.secrets.connectionDBPassword.key | quote }}
        secretPath: {{ .Values.secrets.connectionDBPassword.path | quote }}

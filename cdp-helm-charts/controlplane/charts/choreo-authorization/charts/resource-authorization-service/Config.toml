[choreo.resource_authz_service]
# Service configs
grpcApiPortConf = 9090
enableServiceReflectionConf = true
maxHeaderSizeConf = 65536

[choreo.resource_authz_service.authzSpiceDb]
# Service configs
jwtKeyUserGroupsConf = "groups"
authHeaderKeyConf = "x-jwt-assertion"
getProjectUuidRegexConf = '^.*/|\+.+'
getGroupUuidRegexConf =  '^.*\+'
objectUuidRegexConf = '^([a-zA-Z0-9_\-=]{20,36})$'
permissionRegexConf = '^(([a-zA-Z0-9_\-]+:)*[a-zA-Z0-9_\-]+|([a-zA-Z0-9_\-]+\.)*[a-zA-Z0-9_\-]+)$'
isActionAuthorizationEnabled = true

# SpiceDB configs
enableCheckPermissionConsistencyConf = true

# Permissions
projectViewPermissionConf = "choreo:project_view"
projectUpdatePermissionConf = "choreo:project_manage"
projectDeletePermissionConf = {{ printf "urn:%s:organizationapi:org_manage" .Values.global.choreosystem.orgHandle }}
userManagementPermissionConf = {{ printf "urn:%s:usermanagement:user_manage" .Values.global.choreosystem.orgHandle }}
roleViewPermissionConf = {{ printf "urn:%s:usermanagement:role_view" .Values.global.choreosystem.orgHandle }}
roleCreatePermissionConf = {{ printf "urn:%s:usermanagement:role_create" .Values.global.choreosystem.orgHandle }}
roleUpdatePermissionConf = {{ printf "urn:%s:usermanagement:role_update" .Values.global.choreosystem.orgHandle }}
roleDeletePermissionConf = {{ printf "urn:%s:usermanagement:role_delete" .Values.global.choreosystem.orgHandle }}

# Asgardeo token validation
asgardeoTokenIssuerConf = {{ .Values.config.asgardeoTokenIssuerConf | quote }}

orgLevelPermissionsList = '[{{- range $index, $scope := .Values.config.orgLevelPermissionsList }}{{ if $index }}, {{ end }}"{{ $scope }}"{{- end }}]'
envSpecificPermissionsList = "[]"

[choreo.resource_authz_service.spicedbGrpcClient]
# SpiceDB configs
spiceDbGrpcPortConf = 50051
spiceDbHttpSchemeConf = "http://"
spiceDbHostConf = "spicedb-cluster.spicedb-operator.svc.cluster.local"
spiceDbAuthTokenFilePath = "/mnt/csi/secret-authz-management/SPICEDB-PRESHARED-KEY"


[ballerina.log]
level = {{ .Values.config.logLevel | quote }}

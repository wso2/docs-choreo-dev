apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "resource-authorization-service.labels" . | nindent 4 }}
  name: choreo-resource-authorization-service
  namespace: {{ .Values.global.namespaces.authz }}
spec:
  ports:
    - name: service-port
      port: 9090
      targetPort: service-port
    - name: health-port
      port: 9091
      targetPort: health-port
  selector:
    {{- include "resource-authorization-service.labels" . | nindent 4 }}

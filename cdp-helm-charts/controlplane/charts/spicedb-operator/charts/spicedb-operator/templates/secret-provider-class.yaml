apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secret-spicedb
  namespace: {{ .Values.global.namespaces.spicedbOperator }}
  labels:
    {{- include "spicedb-operator.labels" . | nindent 4 }}
spec:
  provider: vault
  secretObjects:
    - secretName: secret-spicedb-preshared-key
      type: Opaque
      data:
        - objectName: SPICEDB_PRESHARED_KEY
          key: preshared_key
        - objectName: SPICEDB_DATASTORE_URI
          key: datastore_uri
  parameters:
    vaultAddress: {{ .Values.global.vault.url }}
    roleName: {{ .Values.vault.roleName }}
    objects: |
      - objectName: SPICEDB_PRESHARED_KEY
        secretKey: {{ .Values.secrets.presharedKey.key | quote }}
        secretPath: {{ .Values.secrets.presharedKey.path | quote }}
      - objectName: SPICEDB_DATASTORE_URI
        secretKey: {{ .Values.secrets.datastoreURI.key | quote }}
        secretPath: {{ .Values.secrets.datastoreURI.path | quote }}

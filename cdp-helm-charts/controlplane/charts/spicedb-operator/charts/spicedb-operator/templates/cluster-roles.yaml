    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
  name: spicedb-operator-edit
rules:
  - apiGroups:
      - authzed.com
    resources:
      - spicedbclusters
    verbs:
      - create
      - delete
      - deletecollection
      - patch
      - update
  - apiGroups:
      - authzed.com
    resources:
      - spicedbclusters/status
    verbs:
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-view: "true"
  name: spicedb-operator-view
rules:
  - apiGroups:
      - authzed.com
    resources:
      - spicedbclusters

apiVersion: authzed.com/v1alpha1
kind: SpiceDBCluster
metadata:
  name: spicedb-cluster
  namespace: {{ .Values.global.namespaces.spicedbOperator }}
spec:
  config:
    datastoreEngine: postgres
    replicas: 1
    image: ghcr.io/authzed/spicedb:v1.25.0
    skipMigrations: true
    logLevel: warn
  secretName: secret-spicedb-preshared-key
